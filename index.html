ama tempat","Tidak ada perubahan","Salah cetak","Pembangunan tol"],"Bukti perubahan nama."],["Nama jalan dari tokoh pahlawan termasuk aspek…",["Budaya dan sejarah","Fisik","Cuaca","Tumbuhan"],"Mengenang tokoh."],["Kamu ingin tahu mengapa kotamu bernama begitu. Pendekatan tepat?",["Menelusuri toponimi","Menghitung zona waktu","Mengukur curah hujan","Menimbang harga"],"Itulah toponimi."]]},"B.0.3":{"k":8,"g":"Menjelaskan pelaku ekonomi, jenis dan fungsi pasar, serta cara promosi.","core":"<p><b>Pelaku ekonomi</b> adalah pihak yang melakukan kegiatan ekonomi.</p><ul><li><b>Rumah tangga keluarga</b>: konsumen barang dan jasa sekaligus penyedia faktor produksi (tenaga kerja).</li><li><b>Rumah tangga perusahaan</b>: produsen yang menghasilkan barang dan jasa.</li><li><b>Rumah tangga pemerintah</b>: membuat aturan, menyediakan layanan publik (misalnya kantor kelurahan), memungut pajak.</li><li><b>Masyarakat luar negeri</b>: pelaku ekspor dan impor.</li></ul><p><b>Pasar</b> adalah tempat atau proses bertemunya penjual dan pembeli. Jenisnya: <b>pasar tradisional</b> (ada tawar-menawar) dan <b>pasar modern</b> (harga pas, tersedia label harga); juga <b>pasar nyata</b> (ada tempatnya) dan <b>pasar abstrak</b> (transaksi daring tanpa bertemu).</p><p><b>Fungsi pasar</b>: sarana distribusi, pembentuk harga (dari tawar-menawar penjual dan pembeli), dan sarana promosi. <b>Promosi</b> adalah cara memperkenalkan barang agar laku, misalnya memajang barang di etalase (<i>window display</i>), diskon, dan iklan.</p>","ex":"<ul><li>Keluarga Budi bekerja dan berbelanja (rumah tangga keluarga). Pabrik roti memproduksi roti (rumah tangga perusahaan). Kelurahan melayani surat-menyurat (pemerintah).</li><li>Toko daring menjual tanpa lapak fisik: pasar abstrak.</li><li>Toko baju memajang pakaian di etalase untuk menarik pembeli: promosi.</li></ul>","cmp":"<ul><li><b>Pasar tradisional</b>: tawar-menawar, <b>pasar modern</b>: harga pas.</li><li><b>Pasar nyata</b>: ada tempat, <b>pasar abstrak</b>: transaksi tanpa bertemu.</li></ul>","mis":"<ul><li>Mengira pemerintah bukan pelaku ekonomi.</li><li>Mengira pasar harus selalu berupa bangunan.</li><li>Mengira promosi hanya lewat iklan televisi.</li></ul>","p":[["Pihak yang menghasilkan barang dan jasa?",["Rumah tangga perusahaan","Rumah tangga keluarga","Pemerintah saja","Konsumen"],"Perusahaan = produsen."],["Pasar yang ada tawar-menawar?",["Pasar tradisional","Pasar modern","Pasar abstrak","Pasar saham"],"Tradisional."],["Penyedia layanan publik dan pemungut pajak?",["Rumah tangga pemerintah","Rumah tangga keluarga","Perusahaan swasta","Masyarakat luar negeri"],"Pemerintah."],["Memajang barang di etalase termasuk…",["Promosi","Distribusi","Produksi","Impor"],"Promosi."]],"e":[["Rumah tangga keluarga berperan sebagai…",["Konsumen dan penyedia tenaga kerja","Produsen utama","Regulator","Pengekspor"],"Konsumen dan penyedia tenaga kerja."],["Pelaku ekspor dan impor?",["Masyarakat luar negeri","Rumah tangga keluarga","Kelurahan","Pasar tradisional"],"Hubungan dengan luar negeri."],["Pasar yang transaksinya lewat aplikasi?",["Pasar abstrak","Pasar nyata","Pasar tradisional","Pasar pagi"],"Tidak bertemu langsung."],["Pasar membentuk harga melalui…",["Pertemuan penjual dan pembeli","Penetapan satu pihak","Pajak","Cuaca"],"Fungsi pembentuk harga."],["Harga pas dan label harga ciri pasar…",["Modern","Tradisional","Abstrak","Konkret"],"Pasar modern."],["Diskon bertujuan…",["Menarik pembeli","Menghilangkan barang","Menaikkan pajak","Mengurangi produksi"],"Promosi."],["Mengapa pemerintah disebut pelaku ekonomi?",["Membuat aturan dan melayani publik, serta memungut pajak","Hanya berdagang","Tidak melakukan apa-apa","Hanya membeli"],"Peran pemerintah."],["Pabrik sepatu termasuk…",["Rumah tangga perusahaan","Rumah tangga keluarga","Pemerintah","Luar negeri"],"Produsen."],["Pasar berfungsi sebagai sarana…",["Distribusi","Mengurangi kebutuhan","Menutup produksi","Menahan harga"],"Menyalurkan barang."],["Warung memasang spanduk \"Beli 2 gratis 1\". Ini…",["Promosi","Produksi","Konsumsi","Investasi"],"Cara menarik pembeli."]]},"B.0.4":{"k":8,"g":"Menjelaskan permintaan, penawaran, hukumnya, dan terbentuknya harga keseimbangan.","core":"<p><b>Permintaan</b> adalah jumlah barang yang ingin dan mampu dibeli pada berbagai tingkat harga. <b>Hukum permintaan</b>: bila harga naik, jumlah barang yang diminta <b>turun</b>; bila harga turun, jumlah diminta <b>naik</b> (faktor lain dianggap tetap).</p><p><b>Penawaran</b> adalah jumlah barang yang ingin dijual pada berbagai tingkat harga. <b>Hukum penawaran</b>: bila harga naik, jumlah barang yang ditawarkan <b>naik</b>; bila harga turun, jumlah ditawarkan <b>turun</b>.</p><p>Permintaan juga dipengaruhi pendapatan, selera, jumlah penduduk, dan harga barang lain. Penawaran dipengaruhi biaya produksi dan teknologi.</p><p><b>Harga keseimbangan</b> terbentuk di titik temu kurva permintaan dan penawaran, yaitu saat jumlah yang diminta sama dengan jumlah yang ditawarkan. Jika harga <b>di atas</b> keseimbangan, barang berlebih (surplus) sehingga harga cenderung turun. Jika harga <b>di bawah</b> keseimbangan, barang kurang (kelangkaan) sehingga harga cenderung naik.</p>","ex":"<ul><li>Harga mangga turun saat panen raya: penawaran melimpah.</li><li>Harga es krim naik, pembeli berkurang: hukum permintaan.</li><li>Harga beras naik, petani menanam lebih banyak padi: hukum penawaran.</li></ul>","cmp":"<ul><li><b>Permintaan</b>: harga naik, jumlah diminta turun. <b>Penawaran</b>: harga naik, jumlah ditawarkan naik.</li><li><b>Surplus</b> (barang berlebih) menekan harga turun; <b>kekurangan</b> mendorong harga naik.</li></ul>","mis":"<ul><li>Menukar arah hukum permintaan dan penawaran.</li><li>Mengira harga keseimbangan tetap selamanya.</li><li>Mengira keinginan tanpa kemampuan membeli adalah permintaan.</li></ul>","p":[["Hukum permintaan: harga naik, jumlah diminta…",["Turun","Naik","Tetap","Nol"],"Berlawanan arah."],["Hukum penawaran: harga naik, jumlah ditawarkan…",["Naik","Turun","Tetap","Nol"],"Searah."],["Harga keseimbangan terjadi saat…",["Jumlah diminta sama dengan jumlah ditawarkan","Barang habis","Barang menumpuk","Harga nol"],"Titik temu."],["Harga di atas keseimbangan menimbulkan…",["Surplus barang","Kekurangan barang","Pajak","Devisa"],"Barang berlebih."]],"e":[["Panen raya membuat harga cabai turun karena…",["Penawaran meningkat","Permintaan naik","Barang langka","Pajak naik"],"Barang melimpah."],["Saat harga HP naik tajam, jumlah pembeli cenderung…",["Berkurang","Bertambah","Tetap","Hilang"],"Hukum permintaan."],["Harga kopi naik, petani menambah tanaman kopi. Ini…",["Hukum penawaran","Hukum permintaan","Keseimbangan","Kontravensi"],"Penawaran naik saat harga naik."],["Titik temu kurva permintaan dan penawaran disebut…",["Harga keseimbangan","Biaya peluang","Pajak","Inflasi"],"Equilibrium."],["Harga di bawah keseimbangan menyebabkan…",["Kekurangan barang dan harga cenderung naik","Barang menumpuk","Harga turun terus","Produksi berhenti"],"Permintaan lebih besar."],["Faktor yang memengaruhi permintaan?",["Pendapatan dan selera","Biaya produksi saja","Teknologi pabrik","Cuaca di bulan"],"Pendapatan dan selera."],["Faktor yang memengaruhi penawaran?",["Biaya produksi dan teknologi","Selera konsumen","Pendapatan konsumen","Jumlah penduduk"],"Sisi penjual."],["Mengapa harga bisa berubah-ubah?",["Permintaan dan penawaran berubah","Matahari berubah","Peta berubah","Kalender berubah"],"Keseimbangan bergeser."],["Orang ingin membeli mobil tetapi tak punya uang. Ini bukan permintaan karena…",["Tidak mampu membeli","Tidak ada mobil","Harga murah","Selera rendah"],"Permintaan perlu kemampuan membeli."],["Pedagang memberi diskon saat barang menumpuk. Tujuannya…",["Mengurangi surplus","Menaikkan harga","Menghentikan produksi","Menambah pajak"],"Menurunkan harga untuk menarik pembeli."]]},"B.0.5":{"k":8,"g":"Menjelaskan status sosial, peran sosial, diferensiasi, dan stratifikasi sosial.","core":"<p><b>Status sosial</b> adalah kedudukan seseorang dalam masyarakat. Ada tiga macam: <b>ascribed status</b> (didapat sejak lahir, misalnya putra bangsawan atau sultan), <b>achieved status</b> (diraih lewat usaha, misalnya pianis berprestasi atau dokter), dan <b>assigned status</b> (diberikan masyarakat atau negara karena jasa, misalnya gelar pahlawan).</p><p><b>Peran sosial</b> adalah perilaku yang diharapkan dari seseorang sesuai statusnya. Contoh: kepala sekolah berperan memimpin sekolah, guru mengajar, siswa belajar. Bila peran tidak dijalankan, harapan masyarakat tidak terpenuhi.</p><p><b>Diferensiasi sosial</b> adalah pembedaan masyarakat secara <b>horizontal</b> (sejajar, tanpa tingkatan) berdasarkan suku, agama, profesi, atau jenis kelamin. <b>Stratifikasi sosial</b> adalah pembedaan masyarakat secara <b>vertikal</b> (bertingkat) menjadi lapisan, misalnya kelas atas, menengah, dan bawah menurut kekayaan, pendidikan, atau kekuasaan. Stratifikasi <b>terbuka</b> memungkinkan orang naik atau turun lapisan; <b>tertutup</b> tidak memungkinkan.</p>","ex":"<ul><li>Sultan Hamengkubuwono IX: status sosial sebagai sultan (ascribed). Joey Alexander, pianis muda berprestasi: achieved. Gelar Proklamator bagi Sukarno-Hatta: diberikan karena jasa (assigned).</li><li>Kepala sekolah memimpin rapat: menjalankan peran sosial.</li><li>Perbedaan suku dan agama di kelas: diferensiasi.</li></ul>","cmp":"<ul><li><b>Diferensiasi</b> horizontal (sejajar), <b>stratifikasi</b> vertikal (bertingkat).</li><li><b>Status</b> adalah kedudukan, <b>peran</b> adalah tindakan yang menyertainya.</li></ul>","mis":"<ul><li>Menyamakan status dan peran.</li><li>Mengira perbedaan suku sebagai tingkatan.</li><li>Mengira status selalu diwariskan.</li></ul>","p":[["Status yang didapat sejak lahir?",["Ascribed status","Achieved status","Assigned status","Peran sosial"],"Didapat tanpa usaha."],["Perilaku sesuai status disebut…",["Peran sosial","Status","Stratifikasi","Mobilitas"],"Peran."],["Pembedaan masyarakat tanpa tingkatan?",["Diferensiasi sosial","Stratifikasi sosial","Mobilitas","Segregasi"],"Horizontal."],["Pembedaan masyarakat berlapis-lapis?",["Stratifikasi sosial","Diferensiasi sosial","Akulturasi","Difusi"],"Vertikal."]],"e":[["Pianis berprestasi mendapat status melalui…",["Usaha (achieved)","Kelahiran (ascribed)","Keberuntungan semata","Warisan"],"Diraih lewat prestasi."],["Gelar pahlawan dari negara termasuk…",["Assigned status","Ascribed status","Achieved status","Peran sosial"],"Diberikan karena jasa."],["Putra sultan yang menjadi sultan termasuk…",["Ascribed status","Achieved status","Assigned status","Difusi"],"Karena kelahiran."],["Kepala sekolah memimpin sekolah. Ini…",["Peran sosial","Status saja","Diferensiasi","Stratifikasi"],"Tindakan sesuai status."],["Perbedaan suku dan agama termasuk…",["Diferensiasi","Stratifikasi","Asimilasi","Mobilitas"],"Horizontal."],["Kelas atas, menengah, bawah termasuk…",["Stratifikasi","Diferensiasi","Difusi","Akulturasi"],"Bertingkat."],["Stratifikasi terbuka berarti…",["Orang bisa naik atau turun lapisan","Tak bisa pindah lapisan","Tidak ada lapisan","Hanya lahir"],"Terbuka memungkinkan perpindahan."],["Mengapa peran sosial penting dijalankan?",["Agar harapan masyarakat terpenuhi","Agar harga naik","Agar suhu turun","Agar hujan reda"],"Menjaga keteraturan sosial."],["Seorang dokter yang bekerja keras kuliah memperoleh status…",["Achieved","Ascribed","Assigned","Tak ada"],"Diraih lewat usaha."],["Siswa mengikuti upacara dan belajar dengan tertib. Ini…",["Menjalankan peran sebagai siswa","Mengubah status","Stratifikasi","Konflik"],"Peran sesuai status."]]},"B.0.6":{"k":8,"g":"Menjelaskan sosialisasi dan agen sosialisasi, serta nilai dan norma beserta jenis dan sanksinya.","core":"<p><b>Sosialisasi</b> adalah proses seumur hidup untuk mempelajari pola budaya, perilaku, dan harapan masyarakat agar dapat diterima kelompoknya. <b>Agen sosialisasi</b>: <b>keluarga</b> (agen pertama dan terpenting; keluarga inti: ayah, ibu, saudara sekandung; kerabat: kakek, nenek, paman, bibi), <b>sekolah</b>, <b>teman sebaya</b>, dan <b>media massa</b> (termasuk media sosial).</p><p><b>Nilai</b> adalah sesuatu yang dianggap baik dan berharga, misalnya nilai kebenaran, keindahan (estetika), kebaikan (moral), dan religius. <b>Norma</b> adalah aturan yang mengatur perilaku agar sesuai dengan nilai.</p><ul><li><b>Norma agama</b>: berasal dari ajaran agama.</li><li><b>Norma kesusilaan</b>: berasal dari hati nurani (baik-buruk).</li><li><b>Norma kesopanan</b>: tata krama pergaulan.</li><li><b>Norma hukum</b>: tertulis, dibuat pemerintah, bersifat <b>memaksa</b> dengan sanksi tegas.</li></ul><p>Pelanggaran norma dapat dikenai <b>sanksi</b>: teguran atau penolakan sosial, sampai hukuman resmi pada norma hukum. Norma menjaga ketertiban dan mencegah konflik.</p>","ex":"<ul><li>Anak belajar bersalaman dari orang tua: sosialisasi lewat keluarga.</li><li>Remaja meniru gaya berbelanja dari media sosial: pengaruh media massa.</li><li>Menyeberangkan lansia di jalan padat: nilai moral (kebaikan). Mencuri: melanggar norma hukum, bersanksi.</li></ul>","cmp":"<ul><li><b>Nilai</b> adalah ukuran baik dan berharga, <b>norma</b> adalah aturan berperilaku.</li><li>Hanya <b>norma hukum</b> yang bersifat memaksa dengan sanksi resmi.</li></ul>","mis":"<ul><li>Mengira sosialisasi hanya terjadi saat kecil.</li><li>Menyamakan nilai dan norma.</li><li>Mengira semua norma bersanksi hukuman penjara.</li></ul>","p":[["Agen sosialisasi pertama dan terpenting?",["Keluarga","Sekolah","Teman sebaya","Media"],"Keluarga."],["Aturan yang bersifat memaksa?",["Norma hukum","Norma kesopanan","Norma agama","Norma kesusilaan"],"Hukum."],["Sesuatu yang dianggap baik dan berharga disebut…",["Nilai","Norma","Sanksi","Status"],"Nilai."],["Sosialisasi berlangsung…",["Seumur hidup","Hanya saat kecil","Hanya di sekolah","Hanya saat dewasa"],"Seumur hidup."]],"e":[["Termasuk keluarga inti?",["Ayah, ibu, saudara sekandung","Kakek, nenek, paman","Teman, guru","Tetangga"],"Keluarga inti."],["Kakek, nenek, paman, bibi termasuk…",["Kerabat (extended family)","Keluarga inti","Teman sebaya","Media massa"],"Kekerabatan."],["Media sosial termasuk agen sosialisasi…",["Media massa","Keluarga","Sekolah","Teman sebaya"],"Media."],["Norma tata krama pergaulan?",["Kesopanan","Hukum","Agama","Kesusilaan"],"Kesopanan."],["Nilai estetika berkaitan dengan…",["Keindahan","Kebenaran saja","Hukuman","Pajak"],"Keindahan."],["Menyeberangkan lansia adalah contoh nilai…",["Moral (kebaikan)","Estetika","Material","Politik"],"Perbuatan baik."],["Sanksi norma hukum bersifat…",["Tegas dan resmi","Hanya teguran","Tidak ada","Hanya bisik-bisik"],"Memaksa."],["Fungsi norma?",["Menjaga ketertiban dan mencegah konflik","Menaikkan harga","Menambah libur","Mengurangi sekolah"],"Ketertiban."],["Teman sebaya memengaruhi gaya bicaramu. Ini…",["Sosialisasi lewat teman sebaya","Hanya keluarga","Hukum","Stratifikasi"],"Teman sebaya adalah agen."],["Remaja ikut membeli barang karena iklan dan teman. Agen sosialisasinya?",["Media massa dan teman sebaya","Hanya kerabat","Hanya sekolah","Tidak ada"],"Dua agen sekaligus."]]},"B.1.0":{"k":8,"g":"Menjelaskan faktor penyebab keragaman sosial budaya Indonesia, jenisnya, dan tujuh unsur kebudayaan universal.","core":"<p>Indonesia sangat beragam: ratusan suku, bahasa daerah, agama, adat, pakaian, dan rumah adat. Semboyan <b>Bhinneka Tunggal Ika</b> mengingatkan bahwa berbeda-beda tetapi tetap satu. Nenek moyang bangsa Indonesia datang bergelombang dari <b>Yunan</b> (Tiongkok bagian selatan).</p><p><b>Penyebab keragaman</b></p><ul><li><b>Faktor geografis</b>: Indonesia negara kepulauan. Laut menjadi <b>isolasi alami</b> (orang butuh kapal untuk berpindah pulau), sehingga budaya tiap pulau berkembang sendiri. Iklim dan lingkungan juga memengaruhi budaya, misalnya rumah adat Baduy menghadap utara-selatan agar cahaya matahari masuk dan udara mengalir lancar.</li><li><b>Kontak antarbudaya (akulturasi)</b>: Gedung Sate Bandung memadukan arsitektur Belanda, Masjid Cheng Ho Surabaya memadukan arsitektur Tionghoa.</li></ul><p><b>Tujuh unsur kebudayaan universal</b>: bahasa, sistem pengetahuan, organisasi sosial, sistem peralatan hidup dan teknologi, sistem mata pencaharian, sistem religi, dan kesenian.</p><p>Contoh keragaman: baju adat Papua Barat dan Batak berbeda, upacara Melasti di Bali. Sikap yang tepat: toleransi, saling menghargai, dan menjaga persatuan.</p>","ex":"<ul><li>Pulau-pulau yang dipisahkan laut memiliki bahasa dan adat berbeda.</li><li>Upacara Melasti dilakukan umat Hindu di Bali: contoh keragaman agama dan adat.</li><li>Masjid Cheng Ho: akulturasi budaya Islam dan Tionghoa.</li></ul>","cmp":"<ul><li><b>Isolasi geografis</b> membuat budaya berbeda; <b>kontak budaya</b> membuat budaya berpadu.</li><li><b>Keragaman</b> adalah perbedaan; <b>persatuan</b> adalah sikap menyatukannya.</li></ul>","mis":"<ul><li>Mengira keragaman adalah sumber perpecahan.</li><li>Mengira semua budaya Indonesia sama.</li><li>Mengira rumah adat dibuat tanpa mempertimbangkan lingkungan.</li></ul>","p":[["Nenek moyang bangsa Indonesia datang dari…",["Yunan","Arab","Eropa","Australia"],"Dari Yunan."],["Laut sebagai pemisah pulau disebut…",["Isolasi alami","Akulturasi","Asimilasi","Difusi"],"Isolasi geografis."],["Gedung Sate memadukan arsitektur…",["Belanda","Tionghoa","Arab","Jepang"],"Akulturasi Belanda."],["Semboyan Indonesia?",["Bhinneka Tunggal Ika","Tut Wuri Handayani","Merdeka atau Mati","Gotong Royong"],"Berbeda-beda tetap satu."]],"e":[["Mengapa budaya antarpulau bisa berbeda?",["Laut menjadi isolasi alami","Semua pulau sama","Tidak ada laut","Penduduk sedikit"],"Isolasi geografis."],["Tujuh unsur kebudayaan universal salah satunya?",["Sistem religi","Pajak","Harga","Cuaca"],"Religi termasuk."],["Unsur kebudayaan universal berikut kecuali…",["Zona waktu","Bahasa","Kesenian","Mata pencaharian"],"Zona waktu bukan unsur."],["Rumah adat Baduy menghadap utara-selatan agar…",["Cahaya masuk dan udara lancar","Tampak megah","Dekat sungai","Lebih tinggi"],"Menyesuaikan lingkungan."],["Masjid Cheng Ho contoh…",["Akulturasi","Konflik","Persaingan","Isolasi"],"Budaya berpadu."],["Melasti dilakukan di…",["Bali","Papua","Aceh","Jawa Barat"],"Upacara umat Hindu Bali."],["Sikap menghadapi keragaman?",["Toleransi","Menghina","Menjauhi","Memaksa"],"Saling menghargai."],["Baju adat Batak dan Papua Barat berbeda karena…",["Budaya dan lingkungan berbeda","Keduanya sama","Tidak ada alasan","Cuaca sama"],"Keragaman budaya."],["Contoh unsur sistem pengetahuan?",["Pengetahuan tentang alam dan pertanian","Pajak","Peta","Mata uang"],"Pengetahuan lokal."],["Bila dua budaya bertemu dan berpadu, hasilnya…",["Akulturasi","Isolasi","Boikot","Perang"],"Kontak budaya."]]},"B.1.1":{"k":8,"g":"Mengenal sejarah lokal dan meneladani tokoh Sultan Nuku, Ratu Kalinyamat, dan Laksamana Malahayati.","core":"<p><b>Sejarah lokal</b> adalah sejarah suatu daerah, yang berperan menumbuhkan kebanggaan dan jati diri. Tiga tokoh lokal yang perlu diteladani:</p><ul><li><b>Sultan Nuku</b> dari Tidore (Maluku Utara) memimpin perlawanan terhadap penjajah Belanda (VOC) dan menjadi Sultan Tidore pada 1797. Keteladanan: berani, pemersatu, cerdas menyusun strategi.</li><li><b>Ratu Kalinyamat</b> penguasa Jepara pada abad ke-16. Di bawah pemerintahannya Pelabuhan Jepara menjadi pelabuhan penting di pesisir utara Jawa dan armadanya menyerang Portugis di Malaka. Keteladanan: berani, tegas, pemimpin maritim.</li><li><b>Laksamana Malahayati</b> dari Aceh memimpin <b>Armada Inong Balee</b> (pasukan para janda) melawan Belanda. Keteladanan: berani, tangguh, bela tanah air.</li></ul><p>Nilai yang dapat kita teladani: keberanian, persatuan, kepemimpinan, dan cinta tanah air.</p>","ex":"<ul><li>Pelabuhan Jepara ramai karena armada dagang dan perang Ratu Kalinyamat.</li><li>Reruntuhan pangkalan Armada Inong Balee di Desa Lamreh, Aceh: sumber sejarah benda.</li><li>Lukisan Masjid di Waru, Seram, markas Sultan Nuku saat melawan Belanda.</li></ul>","cmp":"<ul><li>Sultan Nuku (Maluku Utara, melawan Belanda), Ratu Kalinyamat (Jawa, melawan Portugis), Malahayati (Aceh, melawan Belanda).</li><li><b>Sejarah nasional</b> mencakup bangsa, <b>sejarah lokal</b> mencakup daerah.</li></ul>","mis":"<ul><li>Mengira tokoh lokal tidak penting karena bukan tingkat nasional.</li><li>Menukar daerah asal tokoh.</li><li>Menghafal tanpa meneladani nilai.</li></ul>","p":[["Sultan Nuku berasal dari…",["Tidore","Aceh","Jepara","Makassar"],"Tidore, Maluku Utara."],["Ratu Kalinyamat memerintah di…",["Jepara","Tidore","Aceh","Banten"],"Jepara."],["Armada Inong Balee dipimpin oleh…",["Laksamana Malahayati","Ratu Kalinyamat","Sultan Nuku","Cut Nyak Dien"],"Malahayati."],["Nilai keteladanan tokoh lokal?",["Berani dan cinta tanah air","Egois","Malas","Curang"],"Keberanian dan cinta tanah air."]],"e":[["Sultan Nuku melawan…",["Belanda (VOC)","Portugis","Jepang","Inggris"],"Melawan Belanda."],["Pada tahun berapa Sultan Nuku menjadi Sultan Tidore?",["1797","1602","1945","1511"],"1797."],["Ratu Kalinyamat menyerang Portugis di…",["Malaka","Batavia","Banda","Ambon"],"Malaka."],["Pelabuhan Jepara terletak di pesisir…",["Utara Jawa","Selatan Jawa","Barat Sumatra","Timur Papua"],"Pesisir utara Jawa."],["Armada Inong Balee beranggotakan…",["Para janda","Anak-anak","Pedagang asing","Pelaut Belanda"],"Pasukan janda."],["Malahayati berasal dari…",["Aceh","Jepara","Tidore","Banten"],"Aceh."],["Nilai keteladanan Sultan Nuku?",["Pemersatu dan strategis","Mudah menyerah","Egois","Penakut"],"Mempersatukan rakyat."],["Mengapa kita mempelajari sejarah lokal?",["Menumbuhkan jati diri dan kebanggaan daerah","Menghitung pajak","Mengukur curah hujan","Menentukan zona waktu"],"Identitas."],["Reruntuhan pangkalan Inong Balee termasuk sumber…",["Benda","Tertulis","Lisan","Digital"],"Sumber benda."],["Meneladani tokoh berarti…",["Menerapkan nilai juangnya sehari-hari","Hanya menghafal nama","Membandingkan harga","Menggambar peta"],"Menerapkan nilai."]]},"B.1.2":{"k":8,"g":"Menjelaskan permasalahan lingkungan akibat pertambahan penduduk dan kerusakan hutan, serta masalah pelestarian cagar budaya.","core":"<p><b>Pertambahan penduduk</b> membuat kebutuhan pangan, tempat tinggal, dan energi meningkat, sehingga tekanan terhadap lingkungan naik. Akibatnya <b>tutupan hutan alam</b> Indonesia terus berkurang karena penebangan, pembukaan lahan, dan kebakaran. <b>Hutan hujan tropis</b> menyimpan keanekaragaman hayati, menjaga tata air, dan menyerap karbon. Bila rusak: banjir, tanah longsor, satwa kehilangan habitat, dan perubahan iklim memburuk. Upaya: reboisasi (menanam kembali), penegakan hukum, pengelolaan hutan lestari, dan mengurangi pemborosan.</p><p><b>Permasalahan budaya</b>: <b>vandalisme</b> (mencoret atau merusak) pada situs <b>cagar budaya</b> menghilangkan nilai sejarahnya. Cagar budaya adalah warisan budaya yang dilindungi negara. Upaya pelestarian: tidak merusak dan tidak mencoret, merawat, melaporkan kerusakan, serta mengedukasi teman. Pengaruh budaya asing juga dapat membuat budaya lokal (misalnya cerita rakyat) ditinggalkan bila tidak dilestarikan.</p>","ex":"<ul><li>Hutan ditebang untuk lahan, saat hujan deras terjadi banjir bandang.</li><li>Pengunjung mencoret dinding candi: vandalisme di cagar budaya.</li><li>Sekolah menanam pohon bersama: reboisasi.</li></ul>","cmp":"<ul><li><b>Reboisasi</b> menanam kembali hutan gundul, <b>konservasi</b> menjaga hutan yang masih ada.</li><li><b>Pelestarian budaya</b> menjaga warisan, <b>vandalisme</b> merusaknya.</li></ul>","mis":"<ul><li>Mengira hutan hanya sumber kayu.</li><li>Mengira mencoret situs hanya masalah kecil.</li><li>Mengira pelestarian hanya tugas pemerintah.</li></ul>","p":[["Penanaman kembali hutan gundul disebut…",["Reboisasi","Urbanisasi","Erosi","Hilirisasi"],"Reboisasi."],["Mencoret candi termasuk…",["Vandalisme","Akulturasi","Konservasi","Hilirisasi"],"Vandalisme."],["Hutan hujan tropis berfungsi…",["Menjaga tata air dan keanekaragaman hayati","Menambah pajak","Membuat gurun","Mengurangi hujan"],"Fungsi ekologis."],["Cagar budaya adalah…",["Warisan budaya yang dilindungi","Tempat wisata baru","Pasar modern","Gedung kantor"],"Dilindungi negara."]],"e":[["Pertambahan penduduk dapat menyebabkan…",["Tekanan pada lingkungan naik","Hutan bertambah","Sampah hilang","Kebutuhan turun"],"Kebutuhan naik."],["Penyebab berkurangnya tutupan hutan?",["Penebangan dan pembukaan lahan","Hujan","Gempa kecil","Pasang laut"],"Alih fungsi lahan."],["Dampak hutan rusak?",["Banjir dan longsor","Udara lebih sejuk selalu","Panen melimpah","Air bersih bertambah"],"Tata air terganggu."],["Satwa kehilangan habitat karena…",["Hutan rusak","Hutan lestari","Hujan","Musim kemarau"],"Habitat rusak."],["Contoh upaya pelestarian hutan?",["Reboisasi","Pembakaran lahan","Penebangan liar","Membuang limbah"],"Menanam kembali."],["Mencoret dinding candi berdampak…",["Merusak nilai sejarah","Menambah nilai","Tidak berdampak","Memperindah"],"Situs rusak."],["Sikap tepat di situs cagar budaya?",["Tidak mencoret dan merawat","Mengambil batu","Memanjat arca","Membuang sampah"],"Menjaga."],["Mengapa hutan disebut penyerap karbon?",["Pohon menyerap CO₂","Pohon memproduksi CO₂","Tanah memanas","Air menguap"],"Pohon menyerap CO₂."],["Budaya lokal bisa tergerus bila…",["Tidak dilestarikan","Selalu dirayakan","Dipelajari","Dicatat"],"Perlu dilestarikan."],["Kamu melihat temanmu mencoret batu situs sejarah. Tindakan terbaik?",["Menegur dan mengingatkan","Ikut mencoret","Membiarkan","Memotret"],"Mengedukasi."]]},"B.1.3":{"k":8,"g":"Menjelaskan fungsi uang, hukum Engel, perbedaan kebutuhan dan keinginan, serta menyusun anggaran dan pencatatan keuangan sederhana.","core":"<p><b>Uang</b> adalah alat tukar yang diterima secara umum (uang kertas dan uang logam). Sebelum ada uang orang melakukan <b>barter</b> (tukar barang dengan barang) yang menyulitkan karena harus bertemu orang yang saling membutuhkan. <b>Fungsi uang</b>: alat tukar, satuan hitung (menyatakan nilai barang), dan penyimpan nilai (emas batangan juga dipakai menyimpan nilai).</p><p><b>Hukum Engel</b> (Ernst Engel): semakin tinggi pendapatan, semakin <b>kecil persentase</b> (menurun) pengeluaran untuk makanan, karena kebutuhan pokok sudah tercukupi dan sisanya dipakai untuk kebutuhan lain.</p><p><b>Kebutuhan</b> harus didahulukan daripada <b>keinginan</b>. Agar uang tidak habis tanpa rencana, buat <b>anggaran</b> (rencana pemasukan dan pengeluaran). Contohnya <b>metode amplop</b>: uang dibagi ke amplop sesuai pos kebutuhan. Lakukan <b>pencatatan keuangan sederhana</b> berisi tanggal, uraian, pemasukan, pengeluaran, dan saldo. <b>Literasi keuangan</b> adalah pengetahuan dan keterampilan mengelola uang secara bijak.</p>","ex":"<ul><li>Uang saku Rp50.000 seminggu: Rp30.000 kebutuhan sekolah, Rp10.000 jajan, Rp10.000 ditabung.</li><li>Catatan: Senin masuk Rp50.000, Selasa beli buku keluar Rp15.000, saldo Rp35.000.</li></ul>","cmp":"<ul><li><b>Barter</b> butuh kecocokan kebutuhan, <b>uang</b> memudahkan transaksi.</li><li><b>Anggaran</b> adalah rencana, <b>pencatatan</b> adalah bukti pelaksanaan.</li></ul>","mis":"<ul><li>Mengira persentase makanan naik saat pendapatan naik (justru turun).</li><li>Membeli karena ikut-ikutan, bukan karena butuh.</li><li>Tidak mencatat pengeluaran.</li></ul>","p":[["Tukar barang dengan barang?",["Barter","Jual beli","Sewa","Gadai"],"Barter."],["Fungsi uang sebagai alat tukar berarti…",["Dipakai membeli barang dan jasa","Dipakai menghitung pajak","Dipakai menyimpan hewan","Dipakai membuat peta"],"Alat tukar."],["Hukum Engel: pendapatan naik, persentase pengeluaran makanan…",["Menurun","Naik","Tetap","Nol"],"Persentasenya turun."],["Rencana pemasukan dan pengeluaran disebut…",["Anggaran","Barter","Subsidi","Pajak"],"Anggaran."]],"e":[["Kelemahan barter?",["Sulit menemukan pihak yang saling membutuhkan","Terlalu murah","Terlalu cepat","Tak ada barang"],"Kebutuhan harus cocok."],["Satuan hitung berarti uang dipakai untuk…",["Menyatakan nilai barang","Membeli saja","Menyimpan es","Membayar listrik saja"],"Ukuran nilai."],["Emas batangan berfungsi sebagai…",["Penyimpan nilai","Alat barter","Pajak","Subsidi"],"Menyimpan kekayaan."],["Ernst Engel terkenal dengan…",["Hukum Engel","Hukum permintaan","Hukum adat","Hukum rimba"],"Hukum Engel."],["Keluarga berpenghasilan tinggi cenderung punya porsi belanja makanan…",["Lebih kecil","Lebih besar","Sama","Nol"],"Hukum Engel."],["Metode amplop berarti…",["Membagi uang sesuai pos kebutuhan","Menyimpan semua uang","Membeli amplop","Menukar uang"],"Alokasi anggaran."],["Isi pencatatan keuangan sederhana?",["Tanggal, uraian, pemasukan, pengeluaran, saldo","Hanya nama","Hanya tanggal","Hanya saldo"],"Lima unsur."],["Prioritas utama saat uang terbatas?",["Kebutuhan","Keinginan","Hadiah","Mainan"],"Kebutuhan dulu."],["Seorang siswa menerima Rp50.000, membelanjakan Rp15.000. Saldonya?",["Rp35.000","Rp15.000","Rp65.000","Rp50.000"],"Rp50.000 − Rp15.000."],["Literasi keuangan membantu kita…",["Mengelola uang secara bijak","Menambah uang tanpa kerja","Menghindari pajak","Menghabiskan tabungan"],"Pengelolaan bijak."]]},"B.1.4":{"k":8,"g":"Menjelaskan manfaat menabung, jenis lembaga keuangan bank dan nonbank, serta peluang dan risiko ekonomi digital.","core":"<p><b>Menabung</b> adalah menyisihkan sebagian pendapatan untuk keperluan masa depan. Manfaatnya: punya dana darurat, mencapai tujuan, dan terhindar dari utang.</p><p><b>Lembaga keuangan bank</b> menghimpun dana dari masyarakat (tabungan) dan menyalurkannya (kredit): bank umum, BPR, dengan Bank Indonesia sebagai bank sentral. Simpanan di bank dijamin oleh <b>LPS</b> (Lembaga Penjamin Simpanan). Bank memberi <b>bunga</b> sebagai imbalan.</p><p><b>Lembaga keuangan nonbank</b>, contohnya <b>pegadaian</b> (memberi pinjaman dengan jaminan barang/gadai), asuransi, dan koperasi simpan pinjam.</p><p><b>Ekonomi digital</b> memakai platform daring: belanja daring, transportasi daring, dan dompet digital. Peluang: mudah, cepat, jangkauan luas. Risiko: boros atau konsumtif karena promo, serta penipuan. Waspada <b>investasi bodong</b> dan <b>pinjaman daring ilegal</b>; pastikan layanan keuangan terdaftar dan diawasi <b>OJK</b>.</p>","ex":"<ul><li>Dina menyisihkan Rp5.000 tiap hari untuk membeli sepatu baru di akhir bulan.</li><li>Ibu menggadaikan perhiasan di pegadaian untuk modal usaha.</li><li>Ayah membayar listrik lewat dompet digital.</li></ul>","cmp":"<ul><li><b>Bank</b> menghimpun dan menyalurkan dana; <b>pegadaian</b> memberi pinjaman dengan gadai.</li><li><b>Investasi legal</b> terdaftar OJK; <b>investasi bodong</b> menjanjikan untung tidak wajar.</li></ul>","mis":"<ul><li>Mengira menabung hanya untuk orang kaya.</li><li>Tergiur untung besar tanpa cek legalitas.</li><li>Mengira belanja daring selalu hemat.</li></ul>","p":[["Menyisihkan sebagian pendapatan untuk masa depan?",["Menabung","Berbelanja","Meminjam","Menyewa"],"Menabung."],["Pegadaian termasuk lembaga keuangan…",["Nonbank","Bank sentral","Bank umum","BPR"],"Nonbank."],["Lembaga yang menjamin simpanan di bank?",["LPS","OJK saja","BPS","BMKG"],"LPS."],["Layanan keuangan yang aman biasanya…",["Terdaftar dan diawasi OJK","Menjanjikan untung besar tanpa risiko","Anonim","Tanpa izin"],"Terdaftar OJK."]],"e":[["Manfaat menabung?",["Punya dana darurat","Menambah utang","Menghilangkan bunga","Menaikkan pajak"],"Dana darurat."],["Bank menyalurkan dana dalam bentuk…",["Kredit","Pajak","Subsidi","Barter"],"Menyalurkan kredit."],["Imbalan dari bank atas tabungan?",["Bunga","Pajak","Denda","Subsidi"],"Bunga."],["Bank sentral Indonesia?",["Bank Indonesia","Pegadaian","BPR","Koperasi"],"Bank Indonesia."],["Pegadaian memberi pinjaman dengan…",["Jaminan barang","Tanpa jaminan","Jaminan pajak","Jaminan cuaca"],"Gadai."],["Risiko ekonomi digital?",["Konsumtif dan penipuan","Barang gratis","Harga nol","Tanpa risiko"],"Boros dan penipuan."],["Tawaran untung 50% seminggu tanpa risiko kemungkinan…",["Investasi bodong","Investasi aman","Tabungan","Asuransi"],"Tidak wajar."],["Pinjaman daring yang aman harus…",["Terdaftar OJK","Tidak dikenal","Menagih kasar","Menyimpan data bebas"],"Legalitas OJK."],["Dompet digital termasuk…",["Ekonomi digital","Barter","Perkebunan","Produksi tani"],"Platform daring."],["Kamu ingin membeli HP baru tapi uang kurang. Pilihan bijak?",["Menabung dulu","Berutang ke pinjol ilegal","Mencuri","Menunda bayar sekolah"],"Menabung."]]},"B.1.5":{"k":8,"g":"Menjelaskan pengertian komunitas, pemberdayaan masyarakat, contohnya (desa wisata dan bank sampah), serta langkah-langkahnya.","core":"<p><b>Komunitas</b> adalah sekelompok orang yang berinteraksi secara tetap karena kesamaan tempat tinggal, minat, atau tujuan (misalnya komunitas pecinta lingkungan, karang taruna, kelompok tani). <b>Pemberdayaan masyarakat</b> adalah upaya meningkatkan kemampuan dan kemandirian masyarakat agar dapat memperbaiki kehidupannya sendiri.</p><p><b>Contoh</b></p><ul><li><b>Desa wisata</b>: warga memanfaatkan potensi desa, misalnya pekarangan rumah untuk budidaya anggrek di Desa Wisata Anggrek Tulungrejo, Kota Batu, sehingga ekonomi desa tumbuh.</li><li><b>Bank sampah</b>: warga memilah sampah lalu menyetorkannya dan ditukar uang/tabungan, sehingga sampah berkurang dan warga mendapat penghasilan.</li></ul><p><b>Langkah pemberdayaan</b>: kenali potensi dan masalah, libatkan warga (partisipasi dan gotong royong), beri pelatihan, bantu pemasaran, lalu evaluasi agar berkelanjutan. Komunitas berperan di bidang ekonomi, lingkungan, sosial, dan budaya.</p>","ex":"<ul><li>Karang taruna menggerakkan kerja bakti dan lomba kampung.</li><li>Ibu-ibu menukar sampah plastik terpilah menjadi saldo tabungan di bank sampah.</li><li>Wisatawan datang melihat kebun anggrek warga: desa wisata.</li></ul>","cmp":"<ul><li><b>Komunitas</b> adalah kelompoknya, <b>pemberdayaan</b> adalah upayanya.</li><li><b>Bank sampah</b> menangani lingkungan dan ekonomi sekaligus; <b>desa wisata</b> memanfaatkan potensi alam dan budaya desa.</li></ul>","mis":"<ul><li>Mengira pemberdayaan berarti hanya memberi bantuan uang.</li><li>Mengira komunitas harus resmi dari pemerintah.</li><li>Mengira bank sampah hanya menumpuk sampah.</li></ul>","p":[["Kelompok orang yang berinteraksi karena kesamaan tempat atau minat?",["Komunitas","Individu","Perusahaan","Pasar"],"Komunitas."],["Upaya meningkatkan kemandirian warga?",["Pemberdayaan masyarakat","Konsumsi","Impor","Urbanisasi"],"Pemberdayaan."],["Warga menukar sampah terpilah menjadi uang?",["Bank sampah","Pegadaian","Bank sentral","Pasar saham"],"Bank sampah."],["Desa Wisata Anggrek Tulungrejo ada di…",["Kota Batu","Kota Bandung","Kota Medan","Kota Padang"],"Kota Batu."]],"e":[["Contoh komunitas?",["Karang taruna","Satu orang","Kapal tunggal","Pasar saham"],"Kelompok berminat sama."],["Ciri pemberdayaan yang baik?",["Melibatkan warga","Tanpa warga","Tanpa pelatihan","Tanpa evaluasi"],"Partisipasi."],["Manfaat bank sampah?",["Mengurangi sampah dan menambah penghasilan","Menambah sampah","Mencemari sungai","Menghilangkan warga"],"Dua manfaat."],["Desa wisata memanfaatkan…",["Potensi alam dan budaya desa","Bahan impor","Gedung tinggi","Pabrik besar"],"Potensi lokal."],["Langkah awal pemberdayaan?",["Mengenali potensi dan masalah","Menutup desa","Menjual lahan","Menunggu bantuan"],"Kenali potensi."],["Peran komunitas di bidang lingkungan?",["Menggerakkan penghijauan","Menebang hutan","Membakar sampah","Mengabaikan sungai"],"Menjaga alam."],["Mengapa gotong royong penting?",["Mempercepat dan meringankan pekerjaan bersama","Menambah biaya","Menghambat","Tidak berguna"],"Kerja sama."],["Pemberdayaan agar berkelanjutan memerlukan…",["Evaluasi dan pendampingan","Sekali bantuan","Larangan","Penutupan"],"Evaluasi."],["Pekarangan dipakai menanam anggrek yang dijual. Ini contoh…",["Pemberdayaan ekonomi desa","Pencemaran","Konflik","Urbanisasi"],"Pemanfaatan potensi."],["Kamu ingin membantu lingkungan RT. Langkah tepat?",["Bergabung dengan komunitas peduli lingkungan","Menunggu orang lain","Membuang sampah ke got","Menebang pohon"],"Berpartisipasi."]]},"B.1.6":{"k":8,"g":"Menjelaskan komunitas adat dan hukum adat menurut Van Vollenhoven serta peran pahlawan nasional.","core":"<p><b>Komunitas adat</b> (masyarakat hukum adat) adalah kelompok yang terikat oleh <b>hukum adat</b> dan wilayah tertentu, misalnya masyarakat Baduy. <b>Hukum adat</b> adalah aturan tidak tertulis yang hidup, dipatuhi turun-temurun, dan memiliki sanksi adat. Fungsinya menjaga keharmonisan dan kelestarian lingkungan (misalnya aturan menjaga hutan).</p><p><b>Cornelis van Vollenhoven</b> adalah ahli hukum Belanda yang meneliti hukum adat dan membagi wilayah Indonesia menjadi <b>19 lingkungan hukum adat</b>. Penelitiannya menunjukkan bahwa masyarakat Indonesia sudah memiliki hukum sendiri sebelum penjajahan.</p><p><b>Pahlawan nasional</b> adalah tokoh yang berjasa besar dan diberi gelar oleh negara. Banyak pahlawan berasal dari komunitas dan organisasi daerah. Meneladani mereka berarti mewarisi semangat berjuang, persatuan, dan pengorbanan dalam kehidupan sehari-hari, termasuk menjaga adat dan lingkungan.</p>","ex":"<ul><li>Masyarakat Baduy menaati aturan adat menjaga hutan dan tidak sembarang menebang.</li><li>Gelar Pahlawan Nasional diberikan kepada tokoh yang berjasa bagi bangsa (status yang diberikan, assigned status).</li></ul>","cmp":"<ul><li><b>Hukum adat</b> tidak tertulis dan berlaku di komunitas tertentu; <b>hukum negara</b> tertulis dan berlaku nasional.</li><li><b>Komunitas</b> adalah kelompoknya; <b>komunitas adat</b> terikat hukum adat.</li></ul>","mis":"<ul><li>Mengira hukum adat tidak punya sanksi.</li><li>Mengira hukum adat sama dengan hukum negara.</li><li>Mengira pahlawan hanya yang berperang.</li></ul>","p":[["Aturan tidak tertulis yang diwariskan turun-temurun?",["Hukum adat","Hukum pidana","Peraturan pemerintah","Undang-undang"],"Hukum adat."],["Van Vollenhoven membagi Indonesia menjadi berapa lingkungan hukum adat?",["19","7","50","5"],"19."],["Contoh komunitas adat?",["Masyarakat Baduy","Pasar modern","Perusahaan","Bank"],"Baduy."],["Gelar pahlawan nasional diberikan oleh…",["Negara","Teman","Sekolah","Pasar"],"Negara."]],"e":[["Cornelis van Vollenhoven adalah…",["Ahli hukum adat Belanda","Raja Jawa","Pahlawan Aceh","Gubernur Batavia"],"Peneliti hukum adat."],["Hukum adat berfungsi…",["Menjaga keharmonisan dan lingkungan","Menambah pajak","Mengganti hukum negara","Menutup sekolah"],"Menjaga keteraturan."],["Ciri hukum adat?",["Tidak tertulis dan ditaati turun-temurun","Selalu tertulis","Dibuat tiap hari","Hanya untuk kota"],"Tidak tertulis."],["Sanksi dalam hukum adat berupa…",["Sanksi adat","Tidak ada","Hanya penjara","Hanya denda uang"],"Ada sanksi adat."],["Penelitian Van Vollenhoven menunjukkan masyarakat Indonesia…",["Sudah punya hukum sendiri","Tidak punya aturan","Menolak aturan","Hanya mengikuti hukum asing"],"Hukum adat ada."],["Baduy menjaga hutan karena…",["Aturan adat melarang merusaknya","Tidak ada pohon","Takut hujan","Ada pajak"],"Hukum adat."],["Meneladani pahlawan berarti…",["Mewarisi semangat juang dan persatuan","Mengabaikan sejarah","Mencari keuntungan sendiri","Menghindari tanggung jawab"],"Mewarisi semangat."],["Pahlawan nasional contoh status…",["Assigned (diberikan)","Ascribed (lahir)","Achieved murni","Tak berstatus"],"Diberikan negara."],["Komunitas adat terikat oleh…",["Hukum adat dan wilayah","Seragam kerja","Kartu kredit","Harga pasar"],"Adat dan wilayah."],["Cara menghormati komunitas adat?",["Menaati aturan setempat saat berkunjung","Melanggar aturan","Merusak hutan adat","Mengabaikan penduduk"],"Menghargai adat."]]},"C.0.1":{"k":8,"g":"Menjelaskan pengaruh faktor geografis terhadap keragaman sosial budaya dan tujuh unsur kebudayaan.","core":"<p><b>Budaya</b> mencakup cara hidup, cara berpakaian, adat istiadat, mata pencaharian, tata upacara keagamaan, dan benda hasil budaya (senjata, alat bajak sawah, tempat tinggal). Budaya diperoleh lewat pembelajaran, bukan naluri. Perbedaan budaya dipengaruhi sejarah, keturunan, keyakinan, dan <b>faktor geografis</b>.</p><ul><li><b>Isolasi geografis</b>: Indonesia negara kepulauan; laut memisahkan kelompok, terlebih ketika teknologi pelayaran terbatas, sehingga budaya berkembang sendiri.</li><li><b>Iklim</b>: mikro iklim beragam; perbedaan ketinggian membuat suhu berbeda. Warga pesisir utara Jawa umumnya nelayan, warga pegunungan umumnya petani.</li><li><b>Letak geografis strategis</b>: di persilangan dua benua dan dua samudra, di jalur Selat Malaka, sehingga banyak dilalui bangsa asing dan terjadi pertukaran budaya.</li></ul><p><b>Tujuh unsur kebudayaan</b>: bahasa, sistem pengetahuan, organisasi sosial, peralatan hidup dan teknologi, mata pencaharian, religi, kesenian. Contoh: <b>kapal pinisi</b> (suku Bugis dan Luwu, Sulawesi Selatan, sudah ada sebelum abad ke-16) menjadi simbol Indonesia sebagai negara maritim. Nenek moyang bangsa Indonesia datang dari Yunan, Tiongkok.</p>","ex":"<ul><li>Pinisi lahir dari kedekatan masyarakat Bugis dengan laut.</li><li>Nelayan pesisir utara Jawa dan petani pegunungan hidup berbeda karena kondisi alamnya berbeda.</li></ul>","cmp":"<ul><li><b>Isolasi</b> membuat budaya berbeda, <b>letak strategis</b> mempertemukan budaya.</li></ul>","mis":"<ul><li>Mengira budaya hanya tarian dan pakaian.</li><li>Mengira budaya terbawa sejak lahir (naluri).</li><li>Mengira geografi tidak memengaruhi budaya.</li></ul>","p":[["Laut yang memisahkan kelompok disebut…",["Isolasi geografis","Akulturasi","Difusi","Asimilasi"],"Isolasi geografis."],["Kapal pinisi berasal dari suku…",["Bugis dan Luwu","Jawa","Batak","Dayak"],"Sulawesi Selatan."],["Warga pesisir utara Jawa umumnya…",["Nelayan","Petani teh","Penambang","Peternak sapi perah"],"Dekat laut."],["Berapa unsur kebudayaan?",["Tujuh","Tiga","Lima","Sepuluh"],"Tujuh unsur."]],"e":[["Budaya diperoleh melalui…",["Pembelajaran","Naluri","Keturunan semata","Cuaca"],"Bukan naluri."],["Perbedaan budaya dipengaruhi…",["Sejarah, keturunan, keyakinan, geografis","Hanya gempa","Hanya harga","Hanya angin"],"Beberapa faktor."],["Mikro iklim beragam artinya…",["Perbedaan ketinggian menghasilkan suhu berbeda","Semua daerah sama","Tak ada hujan","Selalu dingin"],"Ketinggian memengaruhi suhu."],["Letak strategis di jalur Selat Malaka menyebabkan…",["Banyak dilalui bangsa asing dan pertukaran budaya","Terisolasi","Tak ada pelaut","Tak ada pedagang"],"Persilangan jalur."],["Salah satu unsur budaya?",["Sistem religi","Pajak","Zona waktu","Cuaca"],"Religi termasuk."],["Kapal pinisi menjadi simbol…",["Negara maritim","Negara agraris","Negara industri","Negara kutub"],"Tradisi kelautan."],["Nenek moyang Indonesia berasal dari…",["Yunan, Tiongkok","Arab","Eropa","Australia"],"Dari Yunan."],["Mengapa budaya antarpulau bisa berbeda?",["Laut memisahkan dan lingkungan berbeda","Penduduknya sama","Tak ada laut","Tak ada budaya"],"Isolasi dan lingkungan."],["Contoh benda hasil budaya?",["Alat bajak sawah","Hujan","Gunung","Matahari"],"Buatan manusia."],["Teknologi pelayaran yang terbatas dulu membuat…",["Kelompok sulit berpindah antarpulau","Semua pulau bersatu","Tidak ada perahu","Budaya seragam"],"Isolasi."]]},"C.0.2":{"k":8,"g":"Menjelaskan potensi dan pemanfaatan sumber daya alam, tahapan pertambangan, dan dampak eksploitasi berlebihan.","core":"<p><b>Sumber daya alam</b> adalah segala sesuatu di udara, daratan, dan perairan yang dapat dimanfaatkan untuk memenuhi kebutuhan manusia. Menurut kelestariannya: <b>dapat diperbarui</b> (air, tanah, hutan) dan <b>tidak dapat diperbarui</b> (minyak bumi, batu bara). Potensi Indonesia mencakup <b>hutan</b>, <b>tambang</b>, dan <b>kemaritiman</b>.</p><p>Contoh tambang: tambang Freeport di Papua memiliki cadangan <b>tembaga, emas, dan perak</b>. Tahapan pertambangan secara umum: <b>prospeksi</b> (mencari endapan bahan galian), <b>eksplorasi</b> (mengetahui ukuran, bentuk, posisi, kadar, dan besar cadangan), <b>eksploitasi</b> (penambangan), lalu pengolahan dan pemasaran.</p><p><b>Dampak pemanfaatan berlebihan</b>: penduduk bertambah, konsumsi naik, eksploitasi SDA berlebih, lalu terjadi pencemaran dan kerusakan lingkungan, sehingga potensi SDA menurun. Pemakaian SDA, termasuk yang dapat diperbarui, harus dihemat. Pemanfaatan harus memperhatikan kelestarian. Pembangunan berkelanjutan berarti memanfaatkan sambil melestarikan SDA agar tetap tersedia bagi generasi mendatang.</p>","ex":"<ul><li>Hutan menghasilkan kayu bahan bangunan; laut menghasilkan ikan; tambang menghasilkan pasir, emas, nikel.</li><li>Penambangan terus-menerus tanpa pemulihan membuat lahan rusak dan cadangan menipis.</li></ul>","cmp":"<ul><li><b>Prospeksi</b> mencari, <b>eksplorasi</b> memperinci cadangan, <b>eksploitasi</b> menambang.</li><li><b>Terbarukan</b> dapat pulih, <b>tidak terbarukan</b> habis.</li></ul>","mis":"<ul><li>Mengira SDA terbarukan boleh dipakai tanpa batas.</li><li>Mengira tambang tidak berdampak pada lingkungan.</li><li>Menukar urutan tahapan tambang.</li></ul>","p":[["Minyak bumi termasuk SDA…",["Tidak dapat diperbarui","Dapat diperbarui","Hayati","Surya"],"Tidak terbarukan."],["Tambang Freeport menghasilkan…",["Tembaga, emas, perak","Batu bara","Garam","Pasir kaca"],"Mineral berharga."],["Tahap pertama pertambangan?",["Prospeksi","Eksploitasi","Pemasaran","Pengolahan"],"Prospeksi."],["Tiga potensi SDA Indonesia di buku?",["Hutan, tambang, kemaritiman","Hutan, pabrik, jalan","Sungai, bandara, pasar","Tambang, mal, sekolah"],"Sesuai buku."]],"e":[["Air, tanah, hutan termasuk SDA…",["Dapat diperbarui","Tidak dapat diperbarui","Mineral","Energi fosil"],"Terbarukan."],["Tahap mengetahui ukuran dan cadangan?",["Eksplorasi","Eksploitasi","Pemasaran","Prospeksi saja"],"Eksplorasi."],["Alur dampak: penduduk naik lalu…",["Konsumsi naik, eksploitasi naik","Konsumsi turun","SDA bertambah","Lingkungan membaik"],"Rantai dampak."],["Eksploitasi berlebih menyebabkan…",["Pencemaran dan penurunan potensi SDA","Peningkatan potensi SDA","Hutan makin lebat","Laut makin jernih"],"Kerusakan."],["SDA terbarukan tetap harus…",["Dihemat","Dihabiskan","Dibuang","Diabaikan"],"Tetap dihemat."],["Contoh SDA kemaritiman?",["Ikan dan hasil laut","Batu bara","Hutan jati","Gunung api"],"Laut."],["Pembangunan berkelanjutan berarti…",["Memanfaatkan sambil melestarikan","Memanfaatkan sebanyak mungkin","Berhenti memanfaatkan","Menjual semua"],"Kelestarian."],["Batu bara habis karena…",["Tidak terbarukan","Terbarukan","Hujan","Pasang laut"],"Tidak dapat diperbarui."],["Mengapa pemanfaatan SDA harus bijak?",["Agar generasi mendatang masih memakainya","Agar harga turun","Agar cepat habis","Agar hutan hilang"],"Kelestarian."],["Penambang menemukan endapan emas baru. Itu tahap…",["Prospeksi","Pemasaran","Pengolahan","Reklamasi"],"Menemukan endapan."]]},"C.0.3":{"k":8,"g":"Menjelaskan kualitas SDM, Indeks Pembangunan Manusia, bonus demografi, dan upaya meningkatkan kualitas SDM.","core":"<p>Penduduk Indonesia lebih dari 270 juta jiwa, modal penting pembangunan, tetapi jumlah besar tidak selalu menguntungkan bila <b>kualitas dan produktivitas</b> rendah. <b>Pendidikan</b> adalah kunci kemajuan: makin tinggi pendidikan penduduk, makin tinggi kemampuannya mengolah SDA dan makin sejahtera. Data BPS 2016 menunjukkan angkatan kerja Indonesia masih didominasi tamatan SD.</p><p>Kualitas SDM diukur dengan <b>Indeks Pembangunan Manusia (IPM / HDI)</b> dari UNDP. Komponennya: <b>usia harapan hidup, rata-rata lama sekolah, harapan lama sekolah, dan pendapatan nasional kasar</b>. Negara dikelompokkan sangat tinggi, tinggi, sedang, dan rendah. Indonesia berada pada kelompok <b>sedang</b> (peringkat 108 pada laporan yang dikutip buku).</p><p><b>Bonus demografi</b>: penduduk usia produktif lebih banyak daripada nonproduktif. Agar bermanfaat, SDM harus berkualitas.</p><p><b>Prioritas meningkatkan kualitas SDM</b>: (1) sistem pendidikan yang baik dan bermutu, (2) penguatan peran agama untuk membangun karakter, (3) peningkatan kapasitas lewat pelatihan dan kompetensi, (4) pembinaan generasi muda agar kreatif, inovatif, dan berdaya saing.</p>","ex":"<ul><li>Petani yang dilatih teknologi pertanian menghasilkan panen lebih baik.</li><li>Pemuda yang mengikuti pelatihan keterampilan lebih mudah bersaing di dunia kerja.</li></ul>","cmp":"<ul><li><b>Kuantitas</b> (jumlah penduduk) berbeda dari <b>kualitas</b> (pendidikan, kesehatan, keterampilan).</li></ul>","mis":"<ul><li>Mengira penduduk banyak pasti menguntungkan.</li><li>Mengira IPM hanya soal pendapatan.</li><li>Mengira pelatihan tidak perlu.</li></ul>","p":[["Lembaga yang menyusun IPM?",["UNDP","BMKG","WHO","ASEAN"],"UNDP."],["IPM Indonesia berada pada kelompok…",["Sedang","Sangat tinggi","Rendah","Tak masuk"],"Medium."],["Kunci utama kemajuan bangsa?",["Pendidikan","Gedung","Jalan tol","Pajak"],"Pendidikan."],["Bonus demografi artinya usia…",["Produktif lebih banyak","Lansia lebih banyak","Anak lebih banyak","Seimbang"],"Produktif lebih banyak."]],"e":[["Komponen IPM?",["Usia harapan hidup, lama sekolah, pendapatan","Luas daratan, gunung, laut","Jumlah mal, pabrik, bandara","Harga, pajak, bunga"],"Komponen IPM."],["Penduduk banyak tidak selalu untung bila…",["Kualitas dan produktivitas rendah","Banyak sekolah","Banyak lapangan kerja","Banyak pelatihan"],"Kualitas rendah."],["Prioritas SDM nomor satu?",["Sistem pendidikan bermutu","Mal baru","Jalan tol","Impor"],"Pendidikan."],["Peran agama dalam SDM adalah…",["Membangun karakter","Menghitung pajak","Menanam padi","Mengukur curah hujan"],"Karakter."],["Pelatihan dan kompetensi bertujuan…",["Meningkatkan kapasitas SDM","Menambah pengangguran","Mengurangi sekolah","Menaikkan harga"],"Kapasitas SDM."],["Pembinaan generasi muda diharapkan menghasilkan…",["Kreatif, inovatif, berdaya saing","Pasif","Konsumtif","Tertinggal"],"Berdaya saing."],["Angkatan kerja didominasi tamatan SD menunjukkan…",["Taraf pendidikan rendah","Taraf pendidikan tinggi","Tak ada masalah","Kelebihan sarjana"],"Perlu peningkatan."],["Bonus demografi bermanfaat bila…",["SDM berkualitas","Menganggur","Tak sekolah","Tak bekerja"],"SDM berkualitas."],["Seorang petani ikut pelatihan teknologi dan panennya naik. Ini menunjukkan…",["Pelatihan meningkatkan kualitas SDM","Pelatihan sia-sia","Panen tak ada kaitan","Teknologi merugikan"],"Kapasitas SDM."],["Pendidikan tinggi membuat penduduk lebih mampu…",["Mengolah SDA","Merusak SDA","Menjual lahan","Menutup pabrik"],"Mengelola SDA."]]},"C.0.4":{"k":8,"g":"Menjelaskan pengertian lembaga sosial, norma, empat tingkatan norma, dan fungsi lembaga sosial.","core":"<p><b>Lembaga sosial</b> adalah keseluruhan sistem norma yang terbentuk berdasarkan tujuan dan fungsi tertentu dalam masyarakat. Ia muncul karena manusia membutuhkan <b>keteraturan hidup bersama</b>. Ibarat sepeda motor yang butuh rem dan roda, masyarakat butuh lembaga agar tidak kacau. Contohnya lembaga keluarga, agama, ekonomi, pendidikan, dan politik.</p><p><b>Norma</b> adalah aturan atau pedoman tingkah laku yang menunjukkan perilaku benar atau salah. Kekuatan mengikat norma berbeda-beda, dalam <b>empat tingkatan</b>:</p><ul><li><b>Cara (usage)</b>: penyimpangan hanya dicela. Contoh: cara berpakaian.</li><li><b>Kebiasaan (folkways)</b>: perbuatan berulang dalam bentuk sama. Contoh: memberi hormat kepada yang lebih tua.</li><li><b>Tata kelakuan (mores)</b>: kebiasaan yang diterima sebagai patokan, ada pengawasan dan sanksi. Contoh: tata tertib sekolah.</li><li><b>Adat istiadat (customs)</b>: pelanggar mendapat sanksi adat yang berat.</li></ul><p><b>Fungsi lembaga sosial</b>: memenuhi kebutuhan pokok anggota, menjaga keutuhan masyarakat, dan menjadi pedoman <b>pengendalian sosial</b> (kontrol sosial) atas perilaku anggota.</p>","ex":"<ul><li>Siswa terlambat dicatat dan diberi sanksi: tata kelakuan.</li><li>Berbicara membentak kepada orang tua dicela masyarakat: cara.</li><li>Kebutuhan mata pencaharian melahirkan lembaga industri, perdagangan, koperasi, pertanian.</li></ul>","cmp":"<ul><li>Dari yang paling ringan: <b>cara</b>, <b>kebiasaan</b>, <b>tata kelakuan</b>, <b>adat istiadat</b> (paling mengikat).</li></ul>","mis":"<ul><li>Mengira lembaga sosial hanya berupa gedung.</li><li>Mengira semua norma sanksinya sama.</li><li>Menukar cara dan tata kelakuan.</li></ul>","p":[["Sistem norma berdasarkan tujuan dan fungsi tertentu?",["Lembaga sosial","Individu","Pasar","Kelompok bermain"],"Lembaga sosial."],["Norma yang paling ringan sanksinya?",["Cara","Adat istiadat","Tata kelakuan","Hukum pidana"],"Hanya dicela."],["Tata tertib sekolah termasuk…",["Tata kelakuan","Cara","Kebiasaan","Adat"],"Ada sanksi."],["Fungsi lembaga sosial sebagai kontrol sosial berarti…",["Mengawasi tingkah laku anggota","Menghitung pajak","Menanam padi","Mengukur cuaca"],"Pengendalian sosial."]],"e":[["Lembaga sosial muncul karena kebutuhan akan…",["Keteraturan hidup bersama","Persaingan","Kekacauan","Isolasi"],"Keteraturan."],["Tingkatan norma yang paling mengikat?",["Adat istiadat","Cara","Kebiasaan","Folkways"],"Adat."],["Memberi hormat kepada yang tua termasuk…",["Kebiasaan","Cara","Adat","Hukum"],"Berulang."],["Norma berfungsi sebagai…",["Pedoman benar atau salah","Alat tukar","Alat ukur","Alat produksi"],"Pedoman."],["Contoh lembaga sosial?",["Keluarga","Gunung","Pantai","Awan"],"Keluarga."],["Tanpa lembaga sosial, masyarakat akan…",["Kacau","Tertib","Makmur","Seragam"],"Kekacauan."],["Kebutuhan mata pencaharian melahirkan lembaga…",["Ekonomi","Politik","Agama","Keluarga"],"Industri, koperasi, dll."],["Pelanggar adat istiadat mendapat sanksi…",["Sesuai adat","Tidak ada","Hanya senyum","Hadiah"],"Sanksi adat."],["Mengapa norma perlu ada?",["Agar hubungan manusia terlaksana sebagaimana diharapkan","Agar hidup bebas aturan","Agar bersaing","Agar tak berinteraksi"],"Tertib."],["Siswa melanggar tata tertib dan ditegur guru. Ini bentuk…",["Sanksi tata kelakuan","Hadiah","Sosialisasi","Difusi"],"Ada sanksi."]]},"C.0.5":{"k":8,"g":"Menjelaskan peran lembaga keluarga, agama, ekonomi, pendidikan, dan politik dalam pemanfaatan SDA dan SDM.","core":"<p><b>Peran dalam pemanfaatan SDA</b></p><ul><li><b>Keluarga</b>: membentuk kepribadian agar memakai SDA secara arif.</li><li><b>Agama</b>: menuntun manusia berperilaku baik kepada sesama, makhluk lain, dan alam.</li><li><b>Ekonomi</b>: membuat aturan agar produsen memakai SDA efektif dan efisien (contoh: BUMN).</li><li><b>Pendidikan</b>: menumbuhkan kesadaran melestarikan alam.</li><li><b>Politik</b>: membuat undang-undang yang melindungi SDA dari eksploitasi berlebihan agar generasi mendatang tetap menikmatinya.</li></ul><p>Contoh nyata: masyarakat <b>Baduy</b> menaati aturan adat, tidak memakai pupuk dan obat kimia, sehingga lahan tidak tercemar dan hutan tidak lekas habis.</p><p><b>Peran dalam pemanfaatan SDM</b></p><ul><li><b>Keluarga</b>: tempat sosialisasi pertama; anak diperkenalkan aturan dan nilai.</li><li><b>Agama</b>: sistem keyakinan, pelopor tertib sosial, mengatur kehidupan rohani.</li><li><b>Ekonomi</b>: mengatur hubungan manusia dalam memenuhi kebutuhan pokok demi kesejahteraan.</li><li><b>Pendidikan</b>: mengubah tingkah laku menjadi lebih baik. Menurut Ki Hajar Dewantara, pendidikan berlangsung di <b>keluarga, sekolah, dan masyarakat</b>.</li><li><b>Politik</b>: badan yang mengatur kekuasaan dan wewenang demi ketertiban masyarakat.</li></ul>","ex":"<ul><li>Undang-undang kehutanan melarang penebangan liar: peran politik.</li><li>Sekolah menggalakkan Adiwiyata dan bank sampah: peran pendidikan.</li></ul>","cmp":"<ul><li>Pada SDA lembaga <b>menjaga kelestarian alam</b>; pada SDM lembaga <b>membentuk dan mengelola manusia</b>.</li></ul>","mis":"<ul><li>Mengira hanya pemerintah yang berperan.</li><li>Mengira pendidikan hanya di sekolah.</li><li>Mengira tradisi adat menghambat pelestarian.</li></ul>","p":[["Siapa pelopor ucapan tiga lingkungan pendidikan?",["Ki Hajar Dewantara","Soekarno","Hatta","Kartini"],"Ki Hajar Dewantara."],["Tempat sosialisasi pertama anak?",["Keluarga","Sekolah","Pasar","Kantor"],"Keluarga."],["Pembuat undang-undang perlindungan SDA?",["Lembaga politik","Lembaga keluarga","Lembaga agama","Pasar"],"Politik."],["Masyarakat yang menjaga lahan dengan aturan adat tanpa pupuk kimia?",["Baduy","Betawi","Jawa kota","Batak kota"],"Baduy."]],"e":[["Tiga lingkungan pendidikan menurut Ki Hajar Dewantara?",["Keluarga, sekolah, masyarakat","Rumah, kantor, pasar","Desa, kota, negara","Kelas, lab, kantin"],"Tripusat pendidikan."],["Peran lembaga ekonomi dalam SDA?",["Aturan agar SDA dipakai efektif dan efisien","Menghentikan produksi","Menebang hutan","Menutup pasar"],"Efektif dan efisien."],["Lembaga agama berperan menuntun perilaku baik pada…",["Sesama, makhluk lain, dan alam","Mesin","Uang","Peta"],"Termasuk alam."],["Aturan adat Baduy menguntungkan karena…",["Lahan tidak tercemar dan hutan tidak lekas habis","Lahan rusak","Hutan habis","Air kotor"],"Pelestarian."],["Lembaga politik berperan dalam SDM sebagai…",["Mengatur kekuasaan dan wewenang demi ketertiban","Menanam padi","Mencetak uang","Membuat peta"],"Tertib."],["Peran lembaga pendidikan dalam SDM?",["Mengubah tingkah laku menjadi lebih baik","Menghambat belajar","Menaikkan harga","Menahan perubahan"],"Mengubah perilaku."],["BUMN contoh lembaga…",["Ekonomi","Agama","Keluarga","Pendidikan"],"Contoh buku."],["Orang tua mengajarkan menghemat air. Itu peran…",["Keluarga","Politik","Ekonomi","Agama"],"Pembiasaan di keluarga."],["Undang-undang yang melindungi hutan berperan agar…",["Generasi mendatang tetap menikmati SDA","SDA habis","Hutan gundul","Harga turun"],"Berkelanjutan."],["Mengapa sosialisasi pertama di keluarga penting?",["Anak mengenal aturan dan nilai sebelum hidup di masyarakat","Anak tak perlu aturan","Anak belajar berdagang","Anak berburu"],"Dasar karakter."]]},"C.0.6":{"k":8,"g":"Menjelaskan jalur perdagangan awal Masehi dan peran letak geografis Nusantara dalam hubungan dengan bangsa asing.","core":"<p>Hubungan dagang India–Cina semula lewat <b>Jalur Sutra</b> darat yang membentang dari Cina melewati Asia Tengah sampai Eropa. Komoditas utamanya <b>kain sutra</b>, ditambah wewangian dan rempah-rempah. Sejak awal abad Masehi jalur darat <b>tidak aman</b>, sehingga dialihkan lewat <b>laut</b>. Rute laut terdekat dari India ke Cina melewati <b>Selat Malaka</b>.</p><p>Akibatnya Kepulauan Indonesia menjadi daerah <b>transit</b> bagi pedagang Cina dan India. Masyarakat Nusantara ikut aktif berdagang, sehingga terjadi kontak Indonesia–India dan Indonesia–Cina.</p><p>Menurut Wolters, <b>Ko-ying</b> adalah kerajaan di pantai timur Sumatra (antara Jambi dan Palembang), lokasi strategis karena kapal menunggu <b>angin muson</b> untuk berlayar ke timur. Dari Palembang kapal bisa tiba di Kanton dalam sekitar lima hari tanpa transit. Hubungan ini bukan hanya dagang, melainkan juga sosial budaya. Agama Hindu berkembang di India sejak ±2000 SM dan Buddha pada abad ke-6 SM. Kondisi geografis sudah memengaruhi kehidupan masyarakat Indonesia sejak masa praaksara.</p>","ex":"<ul><li>Pedagang India berhenti di Sumatra menunggu angin muson sebelum melanjutkan ke Cina.</li><li>Pelabuhan di pesisir Sumatra ramai karena berada di jalur Selat Malaka.</li></ul>","cmp":"<ul><li><b>Jalur Sutra darat</b> melewati Asia Tengah, <b>jalur laut</b> melewati Selat Malaka.</li></ul>","mis":"<ul><li>Mengira Nusantara hanya dilewati tanpa ikut berdagang.</li><li>Mengira hubungan hanya dagang tanpa budaya.</li><li>Menyebut jalur utama lewat Samudra Atlantik.</li></ul>","p":[["Komoditas utama Jalur Sutra?",["Kain sutra","Batu bara","Minyak bumi","Karet"],"Sutra."],["Jalur dialihkan ke laut karena jalur darat…",["Tidak aman","Terlalu pendek","Terlalu murah","Terlalu sepi"],"Tidak aman."],["Selat yang dilewati rute laut India–Cina?",["Selat Malaka","Selat Sunda","Selat Bali","Selat Makassar"],"Selat Malaka."],["Angin yang ditunggu kapal untuk berlayar?",["Muson","Siklon","Tornado","Badai salju"],"Angin muson."]],"e":[["Nusantara menjadi…",["Daerah transit pedagang","Daerah terisolasi","Daerah terlarang","Daerah gurun"],"Transit."],["Ko-ying terletak di…",["Pantai timur Sumatra","Pantai barat Papua","Selatan Jawa","Utara Kalimantan"],"Antara Jambi dan Palembang."],["Palembang ke Kanton dalam waktu sekitar…",["Lima hari","Lima bulan","Satu tahun","Sehari"],"Lima hari tanpa transit."],["Keuntungan peralihan jalur bagi Nusantara?",["Masyarakat ikut aktif berdagang","Tak ada pengaruh","Pelayaran berhenti","Perdagangan menurun"],"Keuntungan ekonomi."],["Hubungan dengan bangsa asing bersifat…",["Dagang dan sosial budaya","Hanya militer","Hanya politik","Tidak ada"],"Dagang dan budaya."],["Komoditas selain sutra?",["Wewangian dan rempah","Plastik","Elektronik","Baja"],"Wewangian dan rempah."],["Mengapa Sumatra pesisir strategis?",["Kapal menunggu angin muson di sana","Dekat gunung es","Tak ada ombak","Jauh dari laut"],"Menunggu muson."],["Kondisi geografis memengaruhi masyarakat sejak…",["Masa praaksara","Masa modern","Masa kolonial saja","Masa digital"],"Sejak praaksara."],["Jalur laut India–Cina yang terdekat?",["Melalui Selat Malaka","Melalui Kutub","Melalui Atlantik","Melalui gurun"],"Selat Malaka."],["Pedagang kapal menunggu angin muson. Ini menunjukkan…",["Pengaruh iklim pada pelayaran","Tak ada pengaruh","Pengaruh gempa","Pengaruh kutub"],"Cuaca memengaruhi pelayaran."]]},"C.0.7":{"k":8,"g":"Menjelaskan teori masuknya Hindu-Buddha dan pengaruhnya pada candi, seni, dan sastra.","core":"<p>Hindu-Buddha masuk lewat hubungan dagang dan sosial budaya. Cara persisnya masih diperdebatkan, sehingga ada beberapa teori: <b>teori waisya</b> (dibawa pedagang India lewat jalur damai), <b>teori brahmana</b> (kaum brahmana diundang raja), <b>teori ksatria</b> (bangsawan atau prajurit India), dan <b>teori arus balik</b> (orang Nusantara belajar ke India lalu menyebarkannya pulang).</p><p><b>Pengaruh Hindu-Buddha</b> bagi bangsa Indonesia: awal peradaban masa sejarah, mencakup agama, pemerintahan, sosial, ekonomi, dan seni budaya.</p><ul><li><b>Candi</b>: berasal dari nama Dewi Durga, <i>Candika</i>. Dibangun untuk memuliakan orang yang wafat, khususnya raja dan tokoh. Terdiri atas <b>kaki, tubuh, atap</b>. Contoh: Borobudur, Prambanan, Mendut, Kalasan, Dieng, Muara Takus (Jambi).</li><li><b>Seni pahat dan ukir</b>: arca dewa dan relief yang menceritakan kitab seperti Ramayana dan Karmawibhangga. Arca Buddha sederhana, berjubah, rambut keriting.</li><li><b>Barang logam</b>: arca logam kecil dan perhiasan emas.</li><li><b>Kesusastraan</b>: ditulis di daun lontar, misalnya Ramayana, Mahabharata, Arjunawiwaha, Bharatayuddha, Nagarakrtagama.</li></ul>","ex":"<ul><li>Relief candi menceritakan epos Ramayana.</li><li>Jumlah candi terbanyak di Pulau Jawa.</li></ul>","cmp":"<ul><li><b>Teori waisya</b>: pedagang; <b>brahmana</b>: pendeta; <b>ksatria</b>: bangsawan; <b>arus balik</b>: orang Nusantara belajar ke India.</li></ul>","mis":"<ul><li>Mengira Hindu-Buddha masuk lewat penaklukan perang saja.</li><li>Mengira candi dibangun sebagai tempat tinggal raja.</li><li>Menukar bagian candi.</li></ul>","p":[["Teori yang menyebut pedagang India sebagai pembawa?",["Teori waisya","Teori brahmana","Teori ksatria","Teori arus balik"],"Waisya."],["Bagian candi?",["Kaki, tubuh, atap","Pintu, jendela, lantai","Kepala, tangan, kaki","Dasar, pagar, taman"],"Tiga bagian."],["Fungsi candi pada masa Hindu-Buddha?",["Memuliakan orang yang wafat","Pasar","Pelabuhan","Benteng"],"Memuliakan raja dan tokoh."],["Naskah kuno ditulis di…",["Daun lontar","Plastik","Kain nilon","Logam besi"],"Daun lontar."]],"e":[["Teori arus balik menyatakan…",["Orang Nusantara belajar ke India lalu pulang menyebarkan","Pedagang India menetap","Raja India menaklukkan Nusantara","Hindu tak masuk"],"Arus balik."],["Teori brahmana menyatakan…",["Kaum brahmana diundang penguasa","Pedagang membawa","Prajurit menyerbu","Tidak ada"],"Brahmana."],["Candi berasal dari nama…",["Candika (Dewi Durga)","Dewa Siwa","Dewa Wisnu","Buddha"],"Candika."],["Ciri arca Buddha?",["Rambut keriting dan jubah sederhana","Bersenjata banyak","Berhias emas berat","Bertangan banyak"],"Sederhana."],["Relief candi sering menceritakan…",["Ramayana","Resep makanan","Peta dunia","Hukum pajak"],"Epos keagamaan."],["Mengapa banyak kesusastraan Hindu-Buddha hilang?",["Daun lontar mudah rusak","Terlalu banyak","Tak ada penulis","Dibuang raja"],"Mudah rusak."],["Contoh candi Buddha?",["Borobudur","Candi Prambanan sebagai candi Buddha","Tugu Monas","Masjid Demak"],"Borobudur."],["Pengaruh Hindu-Buddha mencakup…",["Agama, pemerintahan, sosial, ekonomi, seni","Hanya agama","Hanya seni","Tak ada"],"Banyak bidang."],["Muara Takus terletak di…",["Jambi","Bali","Papua","Maluku"],"Jambi."],["Pedagang India lewat jalur laut membawa budayanya secara damai. Teori?",["Waisya","Ksatria","Brahmana","Arus balik"],"Damai lewat dagang."]]},"C.1.0":{"k":8,"g":"Menjelaskan pengaruh cuaca dan iklim, termasuk La Nina, terhadap pertanian, perhubungan, industri, kesehatan, dan lingkungan.","core":"<p>Cuaca dan iklim memengaruhi hampir semua bidang kehidupan.</p><ul><li><b>Pertanian</b>: menentukan waktu tanam dan jenis tanaman.</li><li><b>Perhubungan</b>: cuaca, suhu, arah dan kecepatan angin, awan, dan kabut memengaruhi penerbangan; pelayaran dipengaruhi arah angin, tinggi gelombang, dan badai.</li><li><b>Industri</b>: industri tradisional bergantung panas matahari, misalnya garam, genteng, batu bata, dan kerupuk.</li><li><b>Kesehatan</b>: penyakit muncul pada cuaca tertentu, misalnya demam berdarah dan malaria yang disebarkan nyamuk.</li><li><b>Lingkungan hidup</b>: kemarau panjang mengganggu siklus hidrologi sehingga ekosistem terganggu.</li></ul><p><b>La Nina</b> adalah anomali iklim saat suhu permukaan laut Pasifik tengah dan timur lebih dingin dari biasanya (ambang di bawah −0,5°C pada indeks ENSO). Akibatnya curah hujan bulanan di Indonesia bisa meningkat (naik) hingga <b>40% di atas normal</b>, dengan dampak berbeda antardaerah. Hujan ekstrem berpotensi memicu bencana hidrometeorologis seperti <b>banjir dan tanah longsor</b>.</p>","ex":"<ul><li>Pengrajin garam gagal produksi saat hujan terus-menerus.</li><li>Pesawat ditunda karena kabut tebal.</li><li>Kasus demam berdarah naik pada musim hujan.</li></ul>","cmp":"<ul><li><b>La Nina</b> membuat hujan bertambah, sedangkan kemarau panjang menyebabkan kekeringan.</li></ul>","mis":"<ul><li>Mengira dampak La Nina sama di seluruh Indonesia.</li><li>Mengira cuaca tidak memengaruhi industri.</li><li>Mengira banjir hanya soal sungai.</li></ul>","p":[["Industri yang bergantung panas matahari?",["Garam dan batu bata","Pabrik mobil","Perbankan","Penerbitan"],"Industri tradisional."],["Penyakit yang disebarkan nyamuk?",["Demam berdarah dan malaria","Asma","Patah tulang","Rabun"],"Dibawa nyamuk."],["La Nina menyebabkan hujan…",["Meningkat","Berkurang","Berhenti","Salju"],"Naik hingga 40%."],["Dampak hujan ekstrem?",["Banjir dan longsor","Kekeringan","Gempa","Tsunami"],"Hidrometeorologis."]],"e":[["Cuaca memengaruhi pertanian dalam hal…",["Waktu tanam dan jenis tanaman","Harga emas","Jumlah penduduk","Zona waktu"],"Sesuai buku."],["Faktor yang memengaruhi penerbangan?",["Angin, awan, kabut","Harga tiket","Jumlah bandara","Warna pesawat"],"Cuaca."],["Pelayaran dipengaruhi…",["Tinggi gelombang dan badai","Jumlah penumpang","Warna kapal","Harga BBM saja"],"Cuaca laut."],["Kemarau panjang menyebabkan…",["Gangguan siklus hidrologi","Air berlimpah","Hujan tiap hari","Banjir"],"Kekeringan."],["La Nina ditandai dengan…",["Suhu laut Pasifik dingin","Suhu laut panas","Tak ada angin","Es mencair"],"Laut dingin."],["Kasus demam berdarah naik saat…",["Musim hujan","Selalu sama","Musim gugur","Tidak berubah"],"Nyamuk berkembang."],["Genteng dan kerupuk dijemur. Industri ini…",["Bergantung cuaca","Tak bergantung cuaca","Hanya malam","Hanya dalam ruangan"],"Bergantung matahari."],["La Nina berpotensi menyebabkan…",["Banjir dan tanah longsor","Kekeringan ekstrem","Gempa","Letusan"],"Curah hujan tinggi."],["Dampak La Nina bagi Sumatra pada Oktober–November berbeda karena…",["Dampak tiap daerah tidak sama","Sumatra bukan Indonesia","Tak ada hujan","Semua sama"],"Dampak bervariasi."],["Pemerintah mengingatkan warga waspada banjir saat La Nina. Alasannya…",["Curah hujan bisa jauh di atas normal","Cuaca cerah","Tak ada risiko","Suhu naik"],"Hujan ekstrem."]]},"C.1.1":{"k":8,"g":"Menjelaskan tenaga endogen dan eksogen serta bentuk-bentuk muka bumi di Indonesia.","core":"<p>Bentuk muka bumi terus berubah karena dua tenaga.</p><ul><li><b>Tenaga endogen</b>: berasal dari dalam bumi dan menggerakkan kulit bumi. Meliputi <b>vulkanisme</b> (aktivitas gunung api), <b>tektonisme</b> (pergerakan lapisan bumi), dan <b>seisme</b> (gempa).</li><li><b>Tenaga eksogen</b>: berasal dari luar/permukaan bumi, yaitu <b>air, angin, organisme, sinar matahari, es</b>, dan kegiatan manusia.</li></ul><p><b>Bentuk muka bumi</b></p><ul><li><b>Gunung</b>: berbentuk kerucut atau kubah dengan satu puncak, tinggi di atas 600 mdpl.</li><li><b>Pegunungan</b>: gunung-gunung berbaris membentuk gugusan, tinggi lebih dari 1000 mdpl.</li><li><b>Bukit</b>: lebih tinggi dari sekitarnya, kurang dari 600 mdpl, tidak curam.</li><li><b>Dataran tinggi</b>: daerah datar dengan ketinggian lebih dari 400 mdpl.</li><li><b>Dataran rendah</b>: ketinggian 0–200 mdpl, subur karena tanah endapan (aluvial).</li><li><b>Depresi kontinental</b>: dataran di bawah permukaan laut, sangat jarang.</li></ul>","ex":"<ul><li>Letusan gunung api membentuk tanah vulkanik (endogen). Sungai mengikis tebing (eksogen).</li><li>Dataran rendah aluvial di sekitar sungai cocok untuk persawahan.</li></ul>","cmp":"<ul><li><b>Endogen</b> dari dalam bumi, <b>eksogen</b> dari permukaan bumi.</li><li><b>Gunung</b> satu puncak, <b>pegunungan</b> banyak gunung berbaris.</li></ul>","mis":"<ul><li>Menyamakan bukit dan gunung (bukit &lt; 600 m).</li><li>Mengira manusia bukan penyebab perubahan muka bumi.</li><li>Menukar endogen dan eksogen.</li></ul>","p":[["Tenaga dari dalam bumi?",["Endogen","Eksogen","Meteorologi","Hidrologi"],"Endogen."],["Gempa termasuk…",["Seisme","Vulkanisme","Eksogen","Abrasi"],"Seisme."],["Ketinggian gunung menurut buku?",["Di atas 600 mdpl","Di bawah 600 mdpl","200 mdpl","0 mdpl"],"Di atas 600."],["Dataran rendah subur karena tanah…",["Aluvial (endapan)","Berpasir kering","Batu keras","Es"],"Endapan."]],"e":[["Tiga jenis tenaga endogen?",["Vulkanisme, tektonisme, seisme","Air, angin, es","Hujan, salju, kabut","Panas, dingin, lembap"],"Endogen."],["Contoh tenaga eksogen?",["Angin dan air","Gempa","Letusan","Patahan"],"Dari luar."],["Bukit berketinggian…",["Kurang dari 600 mdpl","Lebih dari 1000 mdpl","Lebih dari 2000","Nol"],"Kurang dari 600."],["Pegunungan memiliki ketinggian…",["Lebih dari 1000 mdpl","Kurang dari 200","Kurang dari 100","Nol"],"Lebih dari 1000."],["Dataran tinggi lebih dari…",["400 mdpl","200 mdpl","100 mdpl","0 mdpl"],"400 mdpl."],["Depresi kontinental berada…",["Di bawah permukaan laut","Di puncak gunung","Di langit","Di bukit"],"Rendah dari laut."],["Gunung api berbentuk…",["Kerucut atau kubah","Datar","Bulat penuh","Segitiga rata"],"Kerucut."],["Kikisan sungai pada tebing termasuk tenaga…",["Eksogen","Endogen","Tektonik","Vulkanik"],"Air = eksogen."],["Mengapa dataran rendah cocok untuk sawah?",["Tanahnya subur karena endapan","Tak ada air","Terlalu tinggi","Berbatu"],"Aluvial subur."],["Pergerakan lempeng membentuk pegunungan. Tenaga yang berperan?",["Tektonisme","Hujan","Angin","Es"],"Endogen."]]},"C.1.2":{"k":8,"g":"Menjelaskan aktivitas ekonomi menurut bentuk muka bumi, pemanfaatan lingkungan, dan kearifan lokal.","core":"<p>Kegiatan ekonomi (produksi, distribusi, konsumsi) bergantung pada tempat tinggal.</p><ul><li><b>Dataran rendah</b>: perdagangan, perkantoran, perindustrian, pariwisata, perikanan, peternakan.</li><li><b>Dataran tinggi</b>: perkebunan (misalnya teh), pertanian, pariwisata, karena iklim sejuk cocok untuk tanaman tertentu seperti teh dan kopi.</li><li><b>Pantai</b>: perikanan, pariwisata, perhotelan.</li></ul><p><b>Pemanfaatan lingkungan</b> berupa <b>barang mentah</b> (hasil tani), <b>setengah jadi</b>, dan <b>barang jadi</b>; mengolahnya menambah nilai jual. Lingkungan juga dimanfaatkan untuk jasa wisata (edukasi, religi, rekreasi).</p><p><b>Prinsip pemanfaatan</b>: pembangunan berkelanjutan dengan prinsip regenerasi, memperhatikan analisis dampak lingkungan, dan memprioritaskan kebutuhan saat ini dengan bijak.</p><p><b>Kearifan lokal Dayak Iban Sungai Utik</b> (Kalimantan Barat): hutan adat ±9.453 hektar dibagi zona permukiman, hutan lindung, hutan produksi, dan hutan cadangan. Setiap kepala keluarga dilarang menebang lebih dari 30 pohon per tahun, ada denda bagi pelanggar, ladang digilir, dan lahan yang sudah dipakai baru dipakai lagi setelah 3 tahun. Mereka memiliki lebih dari 40 jenis padi lokal.</p><p><b>Waspada berjualan/berbelanja daring</b>: periksa produk, ulasan toko, pilih barang dengan teliti, dan teliti saat mentransfer uang.</p>","ex":"<ul><li>Daerah pegunungan memproduksi kopi lalu diolah menjadi kopi bubuk.</li><li>Daerah pantai memproduksi garam dan hasil laut.</li></ul>","cmp":"<ul><li>Barang <b>mentah</b> (sayur, beras) diolah jadi <b>barang jadi</b> yang bernilai lebih tinggi.</li></ul>","mis":"<ul><li>Mengira semua daerah punya aktivitas ekonomi sama.</li><li>Mengambil sumber daya tanpa memikirkan generasi mendatang.</li><li>Percaya semua toko daring tanpa cek.</li></ul>","p":[["Aktivitas khas dataran tinggi?",["Perkebunan teh","Penangkapan ikan laut","Perhotelan pantai","Garam laut"],"Perkebunan."],["Aktivitas khas pantai?",["Perikanan","Perkebunan teh","Pertambangan batu","Peternakan sapi perah"],"Perikanan."],["Kopi menjadi kopi bubuk berarti barang…",["Setengah jadi/jadi","Mentah","Limbah","Gratis"],"Diolah."],["Batas tebang per KK di Sungai Utik per tahun?",["30 pohon","3 pohon","300 pohon","Tidak dibatasi"],"30 pohon."]],"e":[["Aktivitas dataran rendah yang relatif beragam termasuk…",["Perdagangan dan perindustrian","Hanya berburu","Hanya tambang","Hanya wisata es"],"Beragam."],["Mengolah barang mentah bertujuan…",["Menambah nilai jual","Mengurangi nilai","Menghabiskan SDA","Menaikkan pajak"],"Nilai tambah."],["Wisata edukasi dan religi termasuk…",["Jasa wisata","Barang mentah","Pertambangan","Pertanian"],"Jasa."],["Ladang berpindah digilir dengan jeda…",["3 tahun","3 hari","30 tahun","Tidak ada"],"Tiga tahun."],["Jumlah jenis padi lokal Dayak Iban?",["Lebih dari 40","Dua","Lima","Tidak ada"],"Lebih dari 40."],["Hutan adat dibagi menjadi…",["Permukiman, lindung, produksi, cadangan","Sawah dan pasar","Kota dan desa","Laut dan darat"],"Empat zona."],["Prinsip pemanfaatan lingkungan?",["Berkelanjutan dengan regenerasi","Habiskan sekarang","Tanpa analisis dampak","Abaikan lingkungan"],"Berkelanjutan."],["Saat belanja daring pastikan…",["Cek ulasan dan keaslian toko","Transfer cepat tanpa cek","Percaya semua","Tidak membaca"],"Waspada penipuan."],["Mengapa daerah pegunungan banyak berkebun?",["Iklim sejuk cocok tanaman tertentu","Dekat laut","Tak ada tanah","Tak ada hujan"],"Karakteristik wilayah."],["Desa menjaga hutan lewat denda adat. Ini contoh…",["Kearifan lokal","Eksploitasi","Pembalakan liar","Alih fungsi lahan"],"Adat menjaga hutan."]]},"C.1.3":{"k":8,"g":"Menjelaskan pengertian, tujuan, faktor pendorong, dan manfaat perdagangan antarpulau.","core":"<p><b>Perdagangan</b> adalah tukar-menukar barang atau jasa berdasarkan kesepakatan tanpa paksaan. <b>Perdagangan antarpulau (antardaerah)</b> dilakukan penduduk atau lembaga satu pulau dengan pulau lain dalam satu negara. Sejak awal abad ke-16 telah berkembang pusat-pusat perdagangan di Jawa dan di Indonesia tengah-timur dengan kapal sederhana; jadi perdagangan antarpulau sudah ada sejak zaman nenek moyang.</p><p><b>Tujuan</b></p><ul><li><b>Memperoleh keuntungan</b>: selisih harga jual dan harga beli (atau biaya produksi).</li><li><b>Memperluas jangkauan pasar</b>: konsumen makin banyak dan tersebar.</li></ul><p><b>Faktor pendorong</b>: <b>perbedaan faktor produksi</b> (misalnya Kalimantan penghasil kayu, Jakarta butuh bahan baku mebel) dan <b>perbedaan tingkat harga antardaerah</b> (durian murah di daerah penghasil).</p><p><b>Manfaat</b>: menyediakan <b>alternatif alat pemuas kebutuhan</b>, <b>meningkatkan produktivitas</b> produsen, dan <b>memperluas kesempatan kerja</b> (termasuk usaha jasa kirim dan transportasi).</p>","ex":"<ul><li>Maros (Sulawesi Selatan) memasarkan bandeng dan ternak ke daerah lain.</li><li>Kayu dari Kalimantan dikirim ke Jawa untuk industri mebel.</li></ul>","cmp":"<ul><li><b>Perbedaan faktor produksi</b> mendorong tukar-menukar hasil; <b>perbedaan harga</b> mendorong pembelian dari daerah yang lebih murah.</li></ul>","mis":"<ul><li>Mengira perdagangan antarpulau baru ada di zaman modern.</li><li>Mengira keuntungan hanya untuk penjual.</li><li>Menyamakan dengan ekspor-impor.</li></ul>","p":[["Tujuan utama perdagangan?",["Memperoleh keuntungan","Menambah pajak","Mengurangi barang","Menutup pasar"],"Keuntungan."],["Perdagangan antarpulau terjadi dalam…",["Satu negara","Antarbenua","Antargalaksi","Satu rumah"],"Dalam satu negara."],["Daerah penghasil kayu yang disebut buku?",["Kalimantan","Bali","Madura","Gili"],"Kalimantan."],["Memperluas pasar berarti konsumen…",["Makin banyak dan tersebar","Makin sedikit","Hilang","Tetap"],"Pasar luas."]],"e":[["Keuntungan perdagangan dihitung dari…",["Selisih harga jual dan beli/biaya produksi","Jumlah penduduk","Curah hujan","Zona waktu"],"Selisih harga."],["Faktor pendorong perdagangan antarpulau?",["Perbedaan faktor produksi dan harga","Kesamaan hasil","Tak ada transportasi","Larangan dagang"],"Dua faktor."],["Mengapa Jakarta membeli kayu dari Kalimantan?",["Jakarta minim hasil kayu","Kayu terlalu murah di Jakarta","Tak ada industri","Kalimantan tak punya hutan"],"Perbedaan faktor produksi."],["Manfaat bagi konsumen?",["Alternatif pemuas kebutuhan","Barang menghilang","Harga selalu naik","Pilihan berkurang"],"Konsumen punya pilihan."],["Meningkatnya pesanan mendorong produsen…",["Meningkatkan produksi","Menutup pabrik","Mengurangi pekerja","Berhenti"],"Produktivitas naik."],["Usaha jasa kirim muncul karena…",["Perdagangan lintas daerah","Hujan","Gempa","Libur"],"Kesempatan kerja."],["Alat transportasi dagang abad ke-16?",["Kapal sederhana","Pesawat jet","Kereta cepat","Truk besar"],"Kapal sederhana."],["Durian lebih murah di daerah penghasil. Ini mendorong…",["Pembelian dari daerah itu","Larangan jual","Kenaikan harga","Berhenti dagang"],"Perbedaan harga."],["Perluasan pasar membuat produk tradisional…",["Makin dikenal","Makin hilang","Dilarang","Berkurang"],"Pengguna bertambah."],["Mengapa perdagangan antarpulau penting bagi Indonesia?",["Wilayahnya kepulauan dengan potensi berbeda","Semua pulau sama","Tak ada laut","Tak ada kapal"],"Saling melengkapi."]]},"C.1.4":{"k":8,"g":"Menjelaskan dinamika penduduk, rumus pertambahan penduduk, kategori angka kelahiran dan kematian, piramida, dan komposisi penduduk.","core":"<p><b>Dinamika penduduk</b> adalah perubahan jumlah penduduk suatu wilayah akibat <b>kelahiran (natalitas)</b>, <b>kematian (mortalitas)</b>, dan <b>perpindahan (migrasi)</b>. Pertambahan penduduk dihitung: <b>P = (L − M) + (I − E)</b>, dengan L lahir, M mati, I penduduk masuk, E penduduk keluar. Indonesia berpenduduk terbesar keempat di dunia.</p><ul><li><b>Natalitas</b> (per 1000 penduduk per tahun): tinggi &gt; 30, sedang 20–30, rendah &lt; 20.</li><li><b>Mortalitas</b>: tinggi &gt; 18, sedang 14–18, rendah 9–13.</li></ul><p><b>Piramida penduduk</b>: <b>muda (ekspansif)</b> kelahiran tinggi, kematian rendah, pertumbuhan cepat (Indonesia, Malaysia, Filipina, India); <b>dewasa (stasioner)</b> seimbang (Amerika Serikat, Inggris); <b>tua (konstruktif)</b> kelahiran turun, kematian rendah (Jerman).</p><p><b>Komposisi penduduk</b>: pengelompokan menurut umur, jenis kelamin, pekerjaan, agama, pendidikan, dan lain-lain. Berdasarkan umur, penduduk <b>usia produktif</b> 15–64 tahun (sebagian buku 15–65). Bila usia di bawah 15 dan di atas 6
