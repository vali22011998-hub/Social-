ah, bauksit","Kopi","Sawit","Tuna"],"Tambang."],["Biodiesel berasal dari…",["Kelapa sawit","Nikel","Bauksit","Gandum"],"Sawit."],["Manfaat bonus demografi?",["Produktivitas naik, konsumsi naik, inovasi, investasi","Pengangguran","Beban negara","Konflik"],"Empat manfaat."],["Mengapa bonus demografi menaikkan konsumsi?",["Lebih banyak penduduk berdaya beli","Penduduk berkurang","Harga turun","Tak ada pasar"],"Pasar domestik besar."],["Syarat bonus demografi bermanfaat?",["SDM berkualitas","Banyak pengangguran","Tanpa sekolah","Tanpa infrastruktur"],"SDM berkualitas."],["Langkah strategis menuju Indonesia Maju?",["Meningkatkan kualitas SDM dan infrastruktur","Menutup ekspor","Menghentikan sekolah","Mengurangi pekerja"],"Langkah strategis."],["Kereta api cepat dibangun untuk…",["Merespons potensi bonus demografi","Mengurangi penduduk","Menutup jalan","Menaikkan pajak"],"Infrastruktur."],["Pengelolaan SDA harus…",["Berkelanjutan","Dihabiskan","Dijual semua","Diabaikan"],"Berkelanjutan."],["Pihak yang bersinergi mewujudkan Indonesia Maju?",["Pemerintah, dunia usaha, pendidikan, masyarakat","Pemerintah saja","Asing saja","Siswa saja"],"Sinergi."]]},"B.0.3":{"k":8,"g":"Menjelaskan toponimi, fungsinya, kaitannya dengan sejarah dan folklor, serta cara menelusurinya.","core":"<p><b>Toponimi</b>: studi tentang nama-nama tempat (kota, sungai, gunung, teluk, pulau, kampung, jalan) yang diberikan pada penampakan fisik dan kultural. Nama tempat adalah hasil budaya dari segi <b>sejarah</b> (tradisi turun-temurun) dan <b>simbolis</b> (makna yang disepakati bersama), sehingga perlu kajian budaya historis dan simbolis. Toponimi sering berkaitan dengan <b>folklor</b> (cerita rakyat dan legenda), contohnya Kabupaten <b>Pinrang</b> dari kata <i>pinra</i> (perubahan) pada Addatuang Sawitto, atau dari aspek geografis (rawa, <i>pinra-pinra onroang</i>).</p><p><b>Fungsi</b>: penanda lokasi, identitas, dan promosi pariwisata. Toponimi dan sejarah berhubungan timbal balik.</p><p><b>Cara menelusuri</b>: (1) sumber tertulis (buku, artikel, jurnal, dokumen; sumber primer = ditulis saksi/pelaku sezaman), (2) peta kuno (perubahan nama), (3) wawancara narasumber (orang tua, tokoh adat), (4) mengamati penanda geografis yang mencolok, (5) internet (cek kredibilitas, verifikasi peta digital).</p><p><b>Contoh perubahan nama</b>: Sunda Kelapa → Jayakarta → Batavia → Jakarta; Polonia → Medan; Puncak Soekarno → Puncak Jayawijaya. Desa Cigumentong (Sumedang) dari kata <i>gentong</i> (wadah air) karena mata airnya melimpah.</p>","ex":"<ul><li>Peta lama Jakarta bertuliskan Batavia: bukti perubahan nama.</li></ul>","cmp":"<ul><li>Sumber primer ditulis saksi atau pelaku sezaman.</li></ul>","mis":"<ul><li>Mengira nama tempat tak bermakna atau tak pernah berubah.</li></ul>","p":[["Toponimi adalah studi tentang…",["Nama-nama tempat","Cuaca","Jenis tanah","Harga"],"Nama tempat."],["Batavia kini bernama…",["Jakarta","Bandung","Medan","Surabaya"],"Jakarta."],["Pinrang berasal dari kata pinra yang berarti…",["Perubahan","Air","Rawa","Pasar"],"Perubahan."],["Fungsi toponimi?",["Penanda lokasi, identitas, promosi pariwisata","Menghitung pajak","Mengukur hujan","Menentukan harga"],"Tiga fungsi."]],"e":[["Toponimi merupakan hasil budaya dari segi…",["Sejarah dan simbolis","Geologi dan iklim","Ekonomi dan hukum","Politik"],"Historis dan simbolis."],["Toponimi sering berkaitan dengan…",["Folklor","Statistik","Peta cuaca","Mata uang"],"Cerita rakyat."],["Polonia berubah menjadi…",["Medan","Bandung","Padang","Manado"],"Polonia → Medan."],["Puncak Soekarno berubah menjadi…",["Puncak Jayawijaya","Puncak Jaya","Gunung Rinjani","Gunung Semeru"],"Jayawijaya."],["Cigumentong dari kata gentong yang berarti…",["Wadah air","Tanah","Pasar","Hutan"],"Wadah air."],["Sumber primer sejarah adalah…",["Ditulis saksi atau pelaku sezaman","Ditulis jauh kemudian","Kabar burung","Cerita rakyat"],"Sezaman."],["Peta kuno berguna karena…",["Merekam perubahan nama tempat","Menghitung hujan","Menunjukkan harga","Menentukan zona"],"Perekam toponimi."],["Wawancara tokoh adat termasuk cara…",["Menelusuri toponimi dari narasumber","Mengukur curah hujan","Menghitung pajak","Menanam padi"],"Narasumber."],["Saat menelusuri lewat internet perlu…",["Memperhatikan kredibilitas sumber","Percaya semua","Menyalin tanpa cek","Mengabaikan peta"],"Kredibilitas."],["Pinrang juga dijelaskan dari aspek geografis karena daerahnya dulu…",["Rawa","Gunung","Gurun","Pantai karang"],"Rawa."],["Nama jalan di Yogyakarta menunjukkan toponimi sebagai…",["Penanda lokasi dan jejak sejarah","Hanya hiasan","Pajak","Aturan lalu lintas"],"Identitas dan sejarah."],["Sunda Kelapa lebih dulu daripada…",["Jayakarta","Medan","Batavia saja","Polonia"],"Urutannya Sunda Kelapa, Jayakarta, Batavia, Jakarta."]]},"B.0.4":{"k":8,"g":"Menjelaskan empat kelompok pelaku ekonomi dan perannya.","core":"<p><b>Pelaku ekonomi</b>: seseorang, kelompok, atau organisasi yang melakukan konsumsi, produksi, atau distribusi. Empat kelompok:</p><ul><li><b>Rumah tangga konsumen (RTK)</b>: individu atau kelompok yang mengonsumsi barang dan jasa; pelaku terbanyak. Juga <b>penyedia faktor produksi</b> (menyewakan tanah, berinvestasi untuk bunga/dividen/laba). Contoh Pak Bawang menyewakan bangunan sekaligus berbelanja.</li><li><b>Rumah tangga produsen (RTP)</b>: menghasilkan barang atau jasa; berdasarkan kepemilikan: milik negara dan milik swasta (PT penghasil donat).</li><li><b>Rumah tangga pemerintahan</b>: konsumen sekaligus produsen. Konsumsi: belanja rutin dan belanja pembangunan (kertas, jalan, gaji ASN). Produksi: lewat BUMN dan BUMD (contoh PT Pertamina). Juga membuat kebijakan: perpajakan, suku bunga, undang-undang.</li><li><b>Masyarakat luar negeri</b>: ekspor-impor, tenaga kerja ahli, investor. Contoh: ekspor udang ke Jepang, AS, Inggris (sebagai konsumen); impor besi dan baja dari Cina (sebagai produsen).</li></ul>","ex":"<ul><li>Jajan di kantin: RTK. Pedagang gorengan: RTP. Kantor kelurahan: rumah tangga pemerintahan.</li></ul>","cmp":"<ul><li>RTK konsumen dan penyedia faktor produksi; RTP produsen; pemerintah konsumen, produsen, dan pembuat kebijakan.</li></ul>","mis":"<ul><li>Mengira pemerintah bukan pelaku ekonomi.</li></ul>","p":[["Pelaku ekonomi terbanyak?",["Rumah tangga konsumen","Rumah tangga produsen","Pemerintah","Luar negeri"],"RTK."],["Menghasilkan barang atau jasa?",["Rumah tangga produsen","Rumah tangga konsumen","Pemerintah saja","Luar negeri saja"],"RTP."],["BUMN termasuk…",["Rumah tangga pemerintahan","RTK","Luar negeri","RTP swasta"],"Pemerintah memproduksi lewat BUMN."],["Ekspor udang ke Jepang melibatkan…",["Masyarakat luar negeri","RTK","Kelurahan","Koperasi"],"Luar negeri."]],"e":[["Peran RTK selain konsumen?",["Penyedia faktor produksi","Pembuat undang-undang","Pengimpor","Pencetak uang"],"Menyewakan tanah dan berinvestasi."],["Pak Bawang menyewakan bangunan dan membeli kebutuhan pokok. Ia berperan sebagai…",["RTK dan produsen","Hanya pemerintah","Luar negeri","Importir"],"Dua peran."],["Pembagian RTP menurut kepemilikan?",["Milik negara dan milik swasta","Besar dan kecil","Desa dan kota","Ekspor dan impor"],"Negara dan swasta."],["Belanja gaji ASN termasuk…",["Konsumsi pemerintah (belanja rutin)","Produksi swasta","Impor","Ekspor"],"Belanja rutin."],["Contoh perusahaan milik negara?",["PT Pertamina","Warung gorengan","Toko bangunan","PT donat swasta"],"BUMN."],["Kebijakan pemerintah di bidang ekonomi?",["Pajak, suku bunga, undang-undang","Zona waktu","Cuaca","Peta"],"Kebijakan."],["Masyarakat luar negeri berperan sebagai…",["Konsumen, produsen, dan investor","Hanya konsumen","Hanya produsen","Tidak berperan"],"Tiga peran."],["Impor besi baja dari Cina karena…",["Produksi dalam negeri belum cukup","Terlalu murah","Terlalu banyak","Dilarang"],"Kurang."],["BUMD dimiliki…",["Pemerintah daerah","Swasta","Asing","Perorangan"],"Daerah."],["Pelaku ekonomi harus melakukan…",["Konsumsi, produksi, atau distribusi","Hanya menabung","Hanya bekerja","Hanya impor"],"Definisi."]]},"B.0.5":{"k":8,"g":"Menjelaskan pengertian, fungsi, dan jenis pasar.","core":"<p><b>Pasar</b>: sarana bertemunya penjual dan pembeli, langsung atau tidak langsung, untuk transaksi jual beli. Bisa di lokasi tertentu (warung, toko, mal, pasar tradisional) atau lewat internet; pasar tak lagi dibatasi wilayah. Pasar adalah sarana distribusi barang dan jasa.</p><p><b>Fungsi</b>: <b>distribusi</b> (saluran penyaluran), <b>pembentuk harga</b> (tawar-menawar membentuk harga keseimbangan/harga pasar), <b>promosi</b> (misalnya <i>window display</i>).</p><p><b>Jenis</b></p><ul><li><b>Jenis barang</b>: pasar barang konsumsi dan pasar faktor produksi (alam, tenaga kerja, modal).</li><li><b>Waktu</b>: pasar kaget (car free day), harian, mingguan (Pasar Kliwon, Wage, Legi), bulanan, tahunan (Pekan Raya Jakarta, Sekaten).</li><li><b>Luas distribusi</b>: lokal (Pasar Muntilan), daerah (Beringharjo, Klewer, Johar), nasional (pasar uang dan modal), internasional (Alibaba, Amazon, Shopee).</li><li><b>Fisik</b>: <b>konkret</b> (bertemu langsung pada waktu dan tempat yang sama) dan <b>abstrak</b> (tidak langsung lewat internet atau telepon, misalnya Shopee, Tokopedia, Zalora).</li></ul>","ex":"<ul><li>Harga bahan pokok naik saat lebaran karena kebutuhan meningkat, lalu normal kembali.</li></ul>","cmp":"<ul><li>Pasar konkret bertemu langsung; pasar abstrak tidak langsung.</li></ul>","mis":"<ul><li>Mengira pasar harus berupa bangunan.</li></ul>","p":[["Fungsi pasar?",["Distribusi, pembentuk harga, promosi","Produksi, konsumsi, impor","Pajak, bunga, laba","Cuaca, iklim, musim"],"Tiga fungsi."],["Pasar transaksi lewat internet?",["Abstrak","Konkret","Kaget","Lokal"],"Abstrak."],["Pasar yang ada saat car free day?",["Pasar kaget","Pasar harian","Pasar bulanan","Pasar tahunan"],"Kaget."],["Pasar Kliwon, Wage, Legi?",["Pasar mingguan","Pasar harian","Pasar tahunan","Pasar kaget"],"Mingguan."]],"e":[["Pasar dapat dilakukan…",["Langsung atau tidak langsung","Hanya langsung","Hanya internet","Hanya mal"],"Keduanya."],["Harga keseimbangan terbentuk dari…",["Tawar-menawar penjual dan pembeli","Penetapan pemerintah saja","Cuaca","Pajak"],"Tawar-menawar."],["Window display merupakan…",["Promosi","Distribusi","Produksi","Impor"],"Promosi."],["Pasar faktor produksi memperjualbelikan…",["Alam, tenaga kerja, modal","Baju","Buah","Sembako"],"Faktor produksi."],["Pasar buah dan baju termasuk…",["Pasar barang konsumsi","Faktor produksi","Pasar uang","Pasar modal"],"Konsumsi."],["Pekan Raya Jakarta termasuk…",["Pasar tahunan","Pasar mingguan","Pasar harian","Pasar bulanan"],"Tahunan."],["Pasar Beringharjo termasuk…",["Pasar daerah","Pasar lokal","Pasar nasional","Pasar internasional"],"Daerah."],["Pasar uang dan modal termasuk…",["Pasar nasional","Pasar lokal","Pasar daerah","Pasar kaget"],"Nasional."],["Shopee memungkinkan jual beli lintas negara: pasar…",["Internasional","Lokal","Daerah","Kaget"],"Internasional."],["Pasar konkret ialah…",["Bertemu langsung di waktu dan tempat sama","Lewat telepon","Lewat internet","Tidak bertemu"],"Konkret."],["Mengapa harga bahan pokok naik menjelang lebaran?",["Kebutuhan meningkat","Barang berlebih","Pajak turun","Hujan"],"Kebutuhan naik."],["Pasar sebagai sarana…",["Distribusi barang dan jasa","Produksi barang","Konsumsi","Impor"],"Distribusi."]]},"B.0.6":{"k":8,"g":"Menjelaskan pengertian harga, harga keseimbangan, faktor yang memengaruhi, dan fungsinya.","core":"<p><b>Harga</b>: jumlah uang yang dibayar untuk memperoleh barang atau jasa; nilai tukar yang dinyatakan dalam uang. Harga yang disepakati penjual dan pembeli disebut <b>harga keseimbangan</b> atau <b>harga pasar</b>. Harga bervariasi menurut jenis, kualitas, merek, atau tempat membeli (tas Rp100.000 di pasar, Rp400.000 di mal).</p><p><b>Faktor yang memengaruhi harga</b>: <b>ketersediaan</b>, <b>permintaan</b>, dan <b>biaya produksi</b>. Contoh: cabai Rp25.000/kg saat panen dan Rp150.000/kg saat gagal panen.</p><p><b>Fungsi harga</b>: (1) dasar menentukan nilai barang atau jasa yang dijual, (2) memudahkan transaksi, (3) dasar menilai kualitas, (4) dasar produsen menentukan harga jual dan laba, (5) acuan konsumen memutuskan membeli. Memahami harga membantu mengelola anggaran dan membuat keputusan belanja yang bijak.</p>","ex":"<ul><li>Gagal panen: barang sedikit, harga naik.</li></ul>","cmp":"<ul><li>Harga dasar produsen menentukan laba; harga acuan konsumen memutuskan membeli.</li></ul>","mis":"<ul><li>Mengira harga hanya ditentukan penjual.</li></ul>","p":[["Harga yang disepakati penjual dan pembeli?",["Harga keseimbangan","Harga subsidi","Harga pajak","Harga produksi"],"Keseimbangan."],["Faktor yang memengaruhi harga?",["Ketersediaan, permintaan, biaya produksi","Zona waktu","Letak lintang","Warna kemasan"],"Tiga faktor."],["Cabai mahal saat gagal panen karena…",["Ketersediaan turun","Ketersediaan naik","Pajak turun","Hujan"],"Barang sedikit."],["Harga adalah nilai tukar dalam bentuk…",["Uang","Barang","Jasa","Waktu"],"Uang."]],"e":[["Tas di mal lebih mahal daripada di pasar karena…",["Tempat membeli memengaruhi harga","Tas berbeda warna","Pajak nol","Selalu begitu"],"Tempat, merek, kualitas."],["Harga sebagai acuan konsumen berarti…",["Konsumen memutuskan membeli atau tidak","Produsen berhenti","Pasar tutup","Pemerintah membeli"],"Fungsi harga."],["Harga memudahkan penjual dan pembeli dalam…",["Transaksi","Produksi","Pelayaran","Pajak"],"Transaksi."],["Harga dasar produsen menentukan…",["Harga jual dan laba","Zona waktu","Hujan","Suhu"],"Laba."],["Biaya produksi naik mendorong harga…",["Naik","Turun","Tetap","Nol"],"Naik."],["Cabai panen Rp25.000/kg, gagal panen Rp150.000/kg menunjukkan pengaruh…",["Ketersediaan","Selera","Warna","Merek"],"Ketersediaan."],["Harga dapat menjadi dasar menilai…",["Kualitas barang","Letak astronomis","Jenis tanah","Zona waktu"],"Kualitas."],["Harga keseimbangan disebut juga…",["Harga pasar","Harga produksi","Harga subsidi","Harga impor"],"Harga pasar."],["Mengapa penting memahami harga?",["Mengelola anggaran dan membuat keputusan belanja bijak","Menaikkan pajak","Menghentikan belanja","Mengurangi produksi"],"Anggaran."],["Konsumen enggan membeli barang mahal berkualitas rendah. Ini…",["Harga menjadi acuan keputusan","Harga tak berpengaruh","Harga ditetapkan pemerintah","Barang langka"],"Acuan."]]},"B.0.7":{"k":8,"g":"Menjelaskan status sosial, peran sosial, konflik peran, serta diferensiasi dan stratifikasi.","core":"<p><b>Status sosial</b>: posisi sosial seseorang yang definitif (tidak sama dengan prestise). Tiga macam:</p><ul><li><b>Assigned status</b>: diberikan masyarakat atau karena mandat yang dijalankan dengan baik hingga dianggap berjasa. Contoh: Sukarno dan Hatta, Bapak Proklamator dan pahlawan nasional.</li><li><b>Achieved status</b>: dicapai lewat usaha (guru, dokter, pengacara, pianis seperti Joey Alexander).</li><li><b>Ascribed status</b>: diperoleh lewat kelahiran, tidak disengaja (anak bangsawan, Sultan Hamengkubuwono IX, menjadi perempuan atau laki-laki, kakak, suku Batak, warga negara Indonesia).</li></ul><p>Seseorang memiliki beberapa status sekaligus (kepala sekolah juga anak, ayah/ibu, ketua PKK, anggota masyarakat) dan statusnya dapat berubah (siswa Akpol menjadi polisi). Status dapat disalahgunakan (influencer meminta tiket gratis).</p><p><b>Peran sosial</b>: perilaku yang diharapkan dari seseorang dalam status tertentu (kepala sekolah memberi arahan, memimpin rapat, menandatangani dokumen). <b>Konflik peran</b>: peran dari status berbeda saling bertentangan (kepala sekolah yang juga ibu, tak bisa hadir di wisuda anak karena harus memimpin upacara sekolah). <b>Ketegangan peran</b>: dua peran atau lebih dari satu status berkonflik.</p><p><b>Catatan</b>: <b>diferensiasi</b> adalah variasi masyarakat tanpa tingkatan (warna kulit, pekerjaan, agama); <b>stratifikasi</b> adalah lapisan bertingkat, dan stratifikasi tertutup (sistem kasta) tidak memungkinkan pindah kelas.</p>","ex":"<ul><li>Dokter, perawat, pasien di rumah sakit: status berbeda.</li></ul>","cmp":"<ul><li>Status adalah kedudukan; peran adalah perilaku yang diharapkan.</li></ul>","mis":"<ul><li>Menyamakan status dengan prestise.</li><li>Menyamakan status dan peran.</li></ul>","p":[["Status yang diperoleh lewat kelahiran?",["Ascribed status","Achieved status","Assigned status","Peran"],"Ascribed."],["Status karena usaha, misalnya dokter?",["Achieved status","Ascribed status","Assigned status","Konflik"],"Achieved."],["Status karena mandat dan jasa, misalnya pahlawan nasional?",["Assigned status","Ascribed status","Achieved status","Peran"],"Assigned."],["Perilaku yang diharapkan sesuai status?",["Peran sosial","Status","Stratifikasi","Mobilitas"],"Peran."]],"e":[["Sukarno dan Hatta sebagai Bapak Proklamator termasuk…",["Assigned status","Ascribed status","Achieved status","Konflik peran"],"Diberikan karena jasa."],["Joey Alexander, pianis muda berprestasi: …",["Achieved status","Ascribed status","Assigned status","Peran"],"Dicapai."],["Sultan Hamengkubuwono IX: …",["Ascribed status","Achieved status","Assigned status","Peran"],"Kelahiran."],["Menjadi warga negara Indonesia termasuk…",["Ascribed status","Achieved status","Assigned status","Peran"],"Tidak disengaja."],["Seseorang memiliki status…",["Beberapa sekaligus","Hanya satu","Tidak ada","Hanya ascribed"],"Beberapa."],["Siswa Akpol menjadi polisi menunjukkan status…",["Dapat berubah","Tetap","Tidak ada","Selalu ascribed"],"Berubah."],["Influencer meminta tiket gratis dengan statusnya: …",["Penyalahgunaan status","Peran wajar","Assigned status","Konflik peran"],"Penyalahgunaan."],["Kepala sekolah yang juga ibu sulit hadir di wisuda anak: …",["Konflik peran","Penyalahgunaan status","Diferensiasi","Stratifikasi"],"Konflik peran."],["Perilaku kepala sekolah memimpin rapat termasuk…",["Peran sosial","Status","Stratifikasi","Mobilitas"],"Peran."],["Warna kulit, pekerjaan, agama termasuk…",["Diferensiasi","Stratifikasi tertutup","Kasta","Mobilitas"],"Diferensiasi."],["Sistem kasta termasuk…",["Stratifikasi tertutup","Diferensiasi","Stratifikasi terbuka","Mobilitas"],"Tertutup."],["Status dan peran…",["Berjalan beriringan","Tidak berhubungan","Sama persis","Saling meniadakan"],"Beriringan."]]},"B.1.0":{"k":8,"g":"Menjelaskan pengaruh isolasi geografis, iklim, dan letak geografis terhadap keragaman budaya.","core":"<p><b>Budaya</b>: cara hidup individu atau kelompok (berpakaian, adat pernikahan, mata pencaharian, tata upacara) beserta hasilnya (busur, alat bajak, rumah adat, kitab hukum adat); diperoleh lewat pembelajaran, bukan naluri. Keragaman dipengaruhi <b>faktor geografis</b>:</p><ul><li><b>Isolasi geografis</b>: Indonesia memiliki 17.504 pulau; nenek moyang berasal dari Yunan (Tiongkok selatan), menyebar dan menetap di berbagai pulau. Laut menjadi isolasi alamiah; keterbatasan teknologi kapal membuat kelompok tak berinteraksi, sehingga tiap kelompok mengembangkan budaya sesuai lingkungannya. Bila tak dikelola dapat memicu konflik antarbudaya karena <b>etnosentrisme</b> (merasa budaya sendiri paling baik).</li><li><b>Iklim</b>: iklim mikro beragam; perbedaan ketinggian menyebabkan beda suhu, sehingga beda pakaian, mata pencaharian, tradisi, dan kuliner. Contoh: pakaian adat Papua Barat (pesisir panas) dan Batak (pegunungan dingin, berlengan panjang); Sumatra dan Kalimantan iklim tropis basah (perkebunan), Nusa Tenggara dan Sulawesi jagung dan palawija; pesisir punya <b>sedekah laut</b>, pegunungan punya upacara menyambut masa tanam; Baduy: rumah menghadap utara-selatan agar sinar matahari masuk dan udara lancar; rumah joglo dan panggung.</li><li><b>Letak geografis</b>: persilangan Asia-Australia dan Hindia-Pasifik di jalur Selat Malaka, banyak dikunjungi bangsa asing sehingga terjadi pertukaran budaya dan <b>akulturasi</b> (Hindu-Buddha, Islam, Eropa) tanpa menghilangkan unsur asli. Teknologi kini jadi faktor utama penyebaran budaya.</li></ul>","ex":"<ul><li>Bangunan hasil akulturasi dengan arsitektur Belanda atau Tionghoa.</li></ul>","cmp":"<ul><li>Isolasi membuat budaya berbeda; letak strategis membuat budaya bertemu.</li></ul>","mis":"<ul><li>Mengira keragaman pasti merusak persatuan.</li></ul>","p":[["Jumlah pulau Indonesia menurut buku?",["17.504","1.300","6.000","1.100"],"17.504."],["Laut sebagai pemisah kelompok?",["Isolasi alamiah","Akulturasi","Difusi","Asimilasi"],"Isolasi."],["Menganggap budaya sendiri paling baik?",["Etnosentrisme","Toleransi","Akulturasi","Asimilasi"],"Etnosentrisme."],["Rumah Baduy menghadap…",["Utara-selatan","Timur-barat","Tenggara","Barat laut"],"Utara-selatan."]],"e":[["Nenek moyang bangsa Indonesia berasal dari…",["Yunan, Tiongkok selatan","Arab","Eropa","Australia"],"Yunan."],["Mengapa kelompok antarpulau tidak berinteraksi dulu?",["Teknologi kapal terbatas","Tak ada laut","Penduduk sedikit","Dilarang"],"Teknologi."],["Perbedaan ketinggian menyebabkan perbedaan…",["Suhu","Zona waktu","Bujur","Lintang"],"Suhu."],["Pakaian adat Batak berlengan panjang karena…",["Suhu pegunungan dingin","Mode","Pesisir panas","Tak ada alasan"],"Dingin."],["Upacara syukur hasil tangkapan ikan?",["Sedekah laut","Upacara tanam","Melasti","Ngaben"],"Sedekah laut."],["Hasil pertanian umum di Nusa Tenggara dan Sulawesi?",["Jagung dan palawija","Kelapa sawit","Karet","Kopi"],"Jagung, palawija."],["Sinar matahari masuk rumah Baduy lewat…",["Jendela karena rumah menghadap utara-selatan","Atap kaca","Pintu belakang","Cerobong"],"Adaptasi iklim."],["Letak persilangan memudahkan…",["Pertukaran budaya","Isolasi","Perang","Kemarau"],"Pertukaran budaya."],["Percampuran budaya asing dan asli tanpa menghilangkan unsur asli?",["Akulturasi","Asimilasi","Konflik","Difusi"],"Akulturasi."],["Pengaruh budaya yang membentuk budaya Indonesia?",["Hindu-Buddha, Islam, Eropa","Hanya Hindu","Hanya Eropa","Tak ada"],"Tiga pengaruh."],["Faktor utama penyebaran budaya masa kini?",["Teknologi","Isolasi","Laut","Gunung"],"Teknologi."],["Budaya diperoleh melalui…",["Pembelajaran","Naluri","Gen","Cuaca"],"Dipelajari."]]},"B.1.1":{"k":8,"g":"Menjelaskan jenis keragaman budaya, tujuh unsur kebudayaan universal, dan pelestarian budaya.","core":"<p>Jenis keragaman budaya dipengaruhi lingkungan fisik (dataran rendah dan tinggi berbeda), jumlah penduduk dan luas wilayah (masyarakat kecil cenderung seragam, besar lebih beragam; bahasa Batak terbagi beberapa rumpun). Kolonialisme, perang, dan globalisasi membawa penduduk asing menetap dan berinteraksi sehingga lahir kebudayaan baru.</p><p><b>Tujuh unsur kebudayaan universal</b> (Kluckhon; Koentjaraningrat): bahasa, sistem pengetahuan, sistem organisasi kemasyarakatan, sistem peralatan hidup dan teknologi, sistem mata pencaharian dan ekonomi, sistem religi, kesenian.</p><p><b>Data</b>: sensus 2010 mencatat sekitar <b>1.300 suku bangsa</b>; Indonesia memiliki <b>1.100 bahasa daerah</b>, 33% di antaranya bahasa Papua, sisanya Austronesia. Upacara Melasti di Bali contoh keragaman agama dan adat.</p><p><b>Pelestarian</b>: keragaman adalah kekayaan bangsa; dilestarikan untuk pariwisata dan agar generasi penerus tidak kehilangan jati diri. Budaya daerah bagian dari budaya nasional, yang menjadi bagian budaya global. Warisan budaya dikelompokkan: pengetahuan, adat istiadat dan ritus, tradisi dan ekspresi lisan, seni, dan keterampilan kerajinan.</p>","ex":"<ul><li>Melasti di Bali: upacara keagamaan khas.</li></ul>","cmp":"<ul><li>Keragaman adalah fakta; pelestarian adalah sikap menjaganya.</li></ul>","mis":"<ul><li>Mengira budaya daerah terpisah dari budaya nasional.</li></ul>","p":[["Jumlah unsur kebudayaan universal?",["Tujuh","Tiga","Lima","Sepuluh"],"Tujuh."],["Jumlah suku bangsa sensus 2010?",["Sekitar 1.300","Sekitar 130","Sekitar 13","Sekitar 6.000"],"1.300."],["Bahasa daerah di Indonesia menurut buku?",["1.100","110","11.000","300"],"1.100."],["Persen bahasa Papua dari bahasa daerah?",["33%","3%","63%","90%"],"33%."]],"e":[["Unsur kebudayaan universal berikut kecuali…",["Zona waktu","Bahasa","Kesenian","Sistem religi"],"Zona waktu bukan unsur."],["Yang mencetuskan tujuh unsur universal menurut buku?",["Kluckhon (dirujuk Koentjaraningrat)","Edward Ullman","Ki Hajar","Soekarno"],"Kluckhon."],["Masyarakat kecil cenderung memiliki budaya…",["Seragam","Sangat beragam","Tidak ada","Berubah-ubah"],"Seragam."],["Globalisasi dan kolonialisme menimbulkan…",["Budaya baru dari interaksi","Budaya hilang","Isolasi","Tak ada perubahan"],"Budaya baru."],["Bahasa daerah Papua mencapai…",["33% dari bahasa daerah","10%","60%","90%"],"33%."],["Mengapa budaya daerah dilestarikan?",["Agar generasi penerus tidak kehilangan jati diri","Agar harga naik","Agar menutup budaya","Agar sepi"],"Jati diri."],["Budaya nasional adalah bagian dari…",["Budaya global","Budaya asing","Budaya kolonial","Tidak ada"],"Global."],["Contoh sistem peralatan hidup dan teknologi?",["Alat bajak sawah","Bahasa","Upacara","Tarian"],"Teknologi."],["Sistem organisasi kemasyarakatan contohnya…",["Sistem kekerabatan","Gelombang laut","Zona waktu","Cuaca"],"Organisasi sosial."],["Upacara Melasti dilakukan di…",["Bali","Papua","Aceh","Jawa Barat"],"Bali."],["Pelestarian budaya penting juga untuk…",["Pariwisata","Menutup pariwisata","Mengganti budaya","Menghilangkan adat"],"Pariwisata."],["Bahasa daerah Papua dan Austronesia sebagian besar tersebar di…",["Ribuan pulau Indonesia","Satu pulau","Eropa","Afrika"],"Tersebar."]]},"B.1.2":{"k":8,"g":"Mengenal sejarah lokal dan keteladanan Sultan Nuku, Ratu Kalinyamat, dan Laksamana Malahayati.","core":"<p><b>Sejarah lokal</b>: sejarah tokoh dan peristiwa di tingkat daerah. Tokoh panutan dapat dijadikan simbol yang memengaruhi perlawanan.</p><ul><li><b>Sultan Nuku</b> (Tidore, Maluku Utara): sejak pergolakan takhta Tidore 1780 (Belanda mengangkat Pata Alam), Nuku dipilih rakyat dan diangkat bangsa Papua sebagai sultan, bersatu dengan raja-raja Papua melawan Belanda (<i>Revolusi Tidore</i>, 1783), dibantu Inggris. Pada 12 April 1797 armadanya (79 kapal) menduduki Tidore dan ia diakui Sultan Tidore hingga wafat 14 November 1805. Teladan: persatuan multikultur Maluku-Papua, gigih.</li><li><b>Ratu Kalinyamat</b> (Jepara, abad ke-16; nama kecil Retna Kencana): menjadi penguasa perempuan setelah suaminya, Sultan Hadlirin, dibunuh Arya Penangsang. Jepara berkembang di pelayaran dan perdagangan (sistem <i>commenda</i>; ekspor beras, gula, kayu, kelapa). Mengirim 40 kapal dan 4.000 tentara merebut Malaka dari Portugis, 1573 mengirim 300 kapal dan 15.000 prajurit membantu Aceh, 1565 membantu Hitu di Maluku (semuanya belum berhasil di Malaka). Dijuluki Portugis <i>Rainha de Japara</i>. Teladan: berani dan pemimpin maritim.</li><li><b>Laksamana Malahayati / Keumalahayati</b> (Aceh): laksamana perempuan pertama dunia modern pada masa Sultan Alauddin Riayat Syah al-Mukammil (1589–1604). Memimpin <b>Inong Balee</b> (pasukan janda pejuang; 2.000–3.500 prajurit; markas Kuta Inong Balee). Pada 1599 menggagalkan kapal Belanda pimpinan Cornelis de Houtman (tewas) dan Frederick de Houtman (ditahan); juga diplomat. Teladan: berani, tangguh, bela tanah air.</li></ul>","ex":"<ul><li>Reruntuhan pangkalan Inong Balee di Desa Lamreh, Aceh: sumber sejarah benda.</li></ul>","cmp":"<ul><li>Nuku di Tidore melawan Belanda; Kalinyamat di Jepara melawan Portugis; Malahayati di Aceh melawan Belanda.</li></ul>","mis":"<ul><li>Menukar tokoh dan daerah asal.</li></ul>","p":[["Sultan Nuku berasal dari…",["Tidore","Aceh","Jepara","Makassar"],"Tidore."],["Ratu Kalinyamat memerintah di…",["Jepara","Tidore","Aceh","Banten"],"Jepara."],["Armada Inong Balee dipimpin…",["Malahayati","Ratu Kalinyamat","Sultan Nuku","Cut Nyak Dien"],"Malahayati."],["Inong Balee adalah pasukan…",["Janda pejuang","Anak-anak","Pedagang","Pelaut asing"],"Janda."]],"e":[["Nuku bersatu dengan raja-raja…",["Papua","Aceh","Jawa","Bali"],"Papua."],["Revolusi Tidore terjadi tahun…",["1783","1797","1805","1599"],"1783."],["Nuku diakui Sultan Tidore pada…",["1797","1780","1783","1805"],"1797."],["Nuku wafat pada…",["14 November 1805","12 April 1797","1780","1599"],"1805."],["Jumlah kapal armada Nuku 1797?",["79","40","300","15"],"79 kapal."],["Ratu Kalinyamat menjadi penguasa setelah…",["Suaminya dibunuh Arya Penangsang","Ia menikah","Ia belajar","Ia pindah"],"Sultan Hadlirin dibunuh."],["Sistem dagang Jepara masa Kalinyamat?",["Commenda","Barter murni","Tanam paksa","Monopoli VOC"],"Commenda."],["Jepara mengekspor…",["Beras, gula, kayu, kelapa","Emas, perak","Minyak bumi","Nikel"],"Komoditas ekspor."],["Portugis menyebut Kalinyamat…",["Rainha de Japara","Reina de Aceh","Lady Banten","Ratu Tidore"],"Ratu Jepara."],["Malahayati dikenal sebagai laksamana perempuan…",["Pertama di dunia modern","Terakhir","Tidak ada","Hanya di Jawa"],"Pertama."],["Pada 1599 Malahayati menggagalkan kapal Belanda pimpinan…",["Cornelis de Houtman","Vasco da Gama","Magellan","J.P. Coen"],"Cornelis de Houtman."],["Reruntuhan pangkalan Inong Balee termasuk sumber…",["Benda","Tertulis","Lisan","Digital"],"Benda."]]},"B.1.3":{"k":8,"g":"Menjelaskan permasalahan sosial budaya: eksploitasi pembangunan berlebihan, kesenjangan, ketimpangan gender, dan kenakalan remaja.","core":"<p><b>Eksploitasi pembangunan berlebihan</b>: penduduk bertambah (dunia di atas 60 juta jiwa per tahun; diperkirakan 9,7 miliar pada 2050), kebutuhan pokok naik, sehingga lahan pertanian dialihfungsikan menjadi perkebunan, industri, dan permukiman. Tutupan hutan alam Indonesia turun dari 55,82% (2000) menjadi 43,45% (2017) akibat <b>deforestasi</b>. Dampak: banjir dan kekeringan silih berganti, kedaulatan pangan terancam (sawah dibeli untuk perumahan). Indonesia menurunkan emisi lewat REDD+.</p><p><b>Kesenjangan sosial dan kemiskinan</b>: kesenjangan muncul karena perbedaan pendapatan dan ada sejak era kolonial. <b>Kemiskinan</b>: ketidakmampuan memenuhi kebutuhan dasar (sandang, pangan, papan). Pancasila mengamanatkan keadilan dan kesejahteraan bagi seluruh bangsa.</p><p><b>Ketimpangan gender</b>: ketidaksetaraan atau diskriminasi antara laki-laki dan perempuan; kesetaraan tercapai bila keduanya mendapat kesempatan sama (peringkat Indonesia ke-85 dari 153 negara menurut WEF 2020). Tokoh: Ratu Kalinyamat, Keumalahayati, Cut Nyak Dien, Dewi Sartika, Kartini.</p><p><b>Kenakalan remaja</b>: <b>vandalisme</b> (merusak karya seni dan barang berharga, misalnya mencoret situs cagar budaya), <b>tawuran antarpelajar</b> (korban, keresahan warga, bisa dipenjara jika menghilangkan nyawa; kompetisi seharusnya lewat ajang resmi), <b>penyalahgunaan narkotika</b> (dalam kedokteran dipakai sebagai penenang saraf dan penghilang rasa sakit; Napza: narkotika, psikotropika, zat adiktif; di luar resep dokter menyebabkan hilang kesadaran, kerusakan jaringan, ketergantungan, dan ilegal).</p>","ex":"<ul><li>Sawah dijual untuk perumahan: alih fungsi lahan yang mengancam pangan.</li></ul>","cmp":"<ul><li>Vandalisme merusak benda; tawuran melukai orang; narkotika merusak diri dan masa depan.</li></ul>","mis":"<ul><li>Mengira coret-coret tembok hal kecil.</li></ul>","p":[["Penurunan tutupan hutan disebut…",["Deforestasi","Reboisasi","Urbanisasi","Hilirisasi"],"Deforestasi."],["Kemiskinan berarti tidak mampu memenuhi…",["Kebutuhan dasar","Keinginan","Gaya hidup","Hobi"],"Kebutuhan dasar."],["Merusak karya seni dan barang berharga?",["Vandalisme","Tawuran","Napza","Urbanisasi"],"Vandalisme."],["Napza singkatan dari…",["Narkotika, psikotropika, zat adiktif","Narkoba, pajak, zat","Nasional, pemuda, zona","Narasi, paham, zaman"],"Napza."]],"e":[["Tutupan hutan alam 2017 sekitar…",["43,45%","55,82%","90%","10%"],"43,45%."],["Alih fungsi lahan resapan air menyebabkan…",["Banjir dan kekeringan silih berganti","Air melimpah selalu","Hutan bertambah","Tanah subur"],"Banjir dan kekeringan."],["Sawah dibeli untuk perumahan mengancam…",["Kedaulatan pangan","Wisata","Industri","Perdagangan"],"Pangan."],["Penyebab kesenjangan sosial?",["Perbedaan pendapatan","Perbedaan cuaca","Perbedaan zona","Perbedaan peta"],"Pendapatan."],["Ketimpangan gender berarti…",["Diskriminasi antara laki-laki dan perempuan","Kerja sama laki-laki dan perempuan","Pendidikan setara","Keluarga"],"Diskriminasi."],["Peringkat gender Indonesia WEF 2020?",["85 dari 153","5 dari 153","150 dari 153","1 dari 153"],"85."],["Tokoh perempuan perjuangan kesetaraan?",["Kartini, Dewi Sartika, Cut Nyak Dien","Hanya Kartini","Hanya Malahayati","Hanya Dewi Sartika"],"Beberapa tokoh."],["Tawuran yang menghilangkan nyawa dapat dikenai…",["Hukuman penjara","Hadiah","Pujian","Tidak apa-apa"],"Penjara."],["Penyalahgunaan narkotika dapat menyebabkan…",["Hilang kesadaran dan ketergantungan","Kesehatan prima","Kecerdasan naik","Tak ada"],"Dampak buruk."],["Cara menyalurkan kompetisi antarsekolah?",["Ajang kejuaraan resmi","Tawuran","Coret-coret","Saling ejek"],"Resmi."],["Mencoret situs cagar budaya termasuk…",["Vandalisme","Konservasi","Reboisasi","Mobilitas"],"Vandalisme."],["Narkotika dalam kedokteran digunakan sebagai…",["Obat penenang saraf dan penghilang rasa sakit","Makanan","Pupuk","Bahan bakar"],"Dengan resep."]]},"B.1.4":{"k":8,"g":"Menjelaskan uang, pendapatan, Hukum Engel, tabungan, dan investasi.","core":"<p><b>Uang</b>: alat pembayaran sah yang berlaku di suatu wilayah dan punya satuan hitung. Sebelum ada uang berlaku <b>barter</b> (pertukaran barang dengan barang), yang sulit karena keinginan tidak bertemu dan nilai tukar sulit ditentukan. Menurut pembuatnya: <b>uang kartal</b> (diterbitkan pemerintah: logam dan kertas) dan <b>uang giral</b> (simpanan di bank yang dapat diambil dengan cek, giro, atau surat perintah pembayaran).</p><p><b>Pendapatan</b>: hasil dalam satuan uang atas pekerjaan atau penyediaan faktor produksi. Besarnya pendapatan tidak menentukan cukup tidaknya; pengelolaan yang baik menentukan. <b>Hukum Engel</b>: semakin kecil pendapatan, semakin besar bagian untuk konsumsi; semakin besar pendapatan, semakin besar bagian untuk tabungan. Pendapatan = konsumsi + tabungan.</p><p><b>Tabungan</b>: simpanan dari pendapatan yang tidak dipakai. Menabung di bank lebih aman daripada di rumah; <b>LPS</b> menjamin simpanan hingga Rp2 miliar. Manfaat: melatih hidup hemat, tersedia uang untuk hal mendesak, meminimalkan utang.</p><p><b>Investasi</b>: bertujuan meningkatkan nilai tambah uang (tabungan hanya menyimpan), dengan imbalan laba, dividen, atau bunga. Instrumen: saham, obligasi, reksa dana. <b>Ciri investasi ilegal</b>: imbalan terlalu tinggi dalam waktu singkat, informasi perusahaan sedikit, diminta mengajak orang lain, usaha tidak jelas, dipromosikan tokoh atau artis. Modal kecil: <b>reksa dana</b> (mulai Rp10.000; wadah dana yang dikelola manajer investasi) dan <b>emas</b> (mulai 1 gram, minigold 0,05–0,5 gram). Contoh Lili: beli emas 1 gram Rp701.000 (2018), jual Rp1.089.000 (2023), untung Rp388.000.</p>","ex":"<ul><li>Gaji besar tapi boros bisa kekurangan; gaji kecil tapi bijak bisa cukup.</li></ul>","cmp":"<ul><li>Tabungan menyimpan uang; investasi menambah nilai uang.</li></ul>","mis":"<ul><li>Menyamakan tabungan dan investasi.</li><li>Tergiur investasi bodong.</li></ul>","p":[["Pertukaran barang dengan barang?",["Barter","Kredit","Gadai","Sewa"],"Barter."],["Uang logam dan kertas terbitan pemerintah?",["Uang kartal","Uang giral","Uang kuasi","Uang digital"],"Kartal."],["LPS menjamin simpanan hingga…",["Rp2 miliar","Rp200 juta","Rp20 juta","Rp20 miliar"],"Rp2 miliar."],["Tujuan investasi?",["Meningkatkan nilai tambah uang","Menyimpan uang","Membayar pajak","Menghindari bank"],"Nilai tambah."]],"e":[["Kelemahan barter?",["Keinginan tidak bertemu dan nilai sulit ditentukan","Terlalu murah","Terlalu cepat","Tak ada barang"],"Kelemahan."],["Uang giral adalah…",["Simpanan di bank yang dapat diambil dengan cek atau giro","Uang logam","Uang kertas","Uang asing"],"Giral."],["Hukum Engel: pendapatan kecil, porsi konsumsi…",["Besar","Kecil","Nol","Tetap"],"Besar."],["Hukum Engel: pendapatan besar, porsi untuk…",["Tabungan lebih besar","Konsumsi lebih besar","Utang","Nol"],"Tabungan."],["Pendapatan sama dengan…",["Konsumsi + tabungan","Konsumsi − tabungan","Tabungan × konsumsi","Utang"],"Y = C + S."],["Manfaat menabung?",["Hemat, dana mendesak, meminimalkan utang","Menambah utang","Menghabiskan uang","Menaikkan pajak"],"Tiga manfaat."],["Menabung di bank lebih aman karena…",["Simpanan dijamin LPS","Tak ada bunga","Tak ada risiko","Tak ada bank"],"LPS."],["Instrumen investasi?",["Saham, obligasi, reksa dana","Gadai, barter, kredit","Pajak, zakat, infak","Sewa, jual, beli"],"Instrumen."],["Ciri investasi ilegal?",["Imbalan terlalu tinggi dalam waktu singkat","Perusahaan jelas","Imbalan wajar","Tak mengajak orang"],"Ciri."],["Reksa dana dikelola oleh…",["Manajer investasi","Petani","Guru","Nelayan"],"Manajer investasi."],["Reksa dana dapat dimulai dari…",["Rp10.000","Rp10 juta","Rp1 miliar","Rp100 juta"],"Rp10.000."],["Lili membeli emas Rp701.000 dan menjual Rp1.089.000. Untungnya…",["Rp388.000","Rp701.000","Rp1.089.000","Rp100.000"],"Selisih."]]},"B.1.5":{"k":8,"g":"Menjelaskan literasi keuangan dan langkah-langkah mengelola keuangan keluarga.","core":"<p><b>Literasi keuangan</b>: pengetahuan keuangan untuk membuat keputusan yang terarah. SNLIK 2022: literasi 49,68%, inklusi 85,10% (2019: 38,03% dan 76,19%); kesenjangan literasi 35,42% artinya banyak orang bisa mengakses produk keuangan tetapi belum mampu mengelolanya. Rendahnya literasi menjerumuskan pada pinjaman online, <i>pay later</i>, judi online, skema ponzi, dan investasi bodong. Remaja cenderung konsumtif karena influencer dan belanja daring, jadi perlu melek literasi keuangan.</p><p><b>Pengelolaan keuangan</b>: merencanakan, mengorganisasikan, dan mengendalikan keuangan untuk konsumsi, tabungan, dan investasi, berdasarkan skala prioritas. Tujuan: meminimalkan pengeluaran tak diinginkan, alokasi dana efisien, mencapai target jangka panjang, melindungi kekayaan, mengatur kas, mengelola utang piutang, mencegah pemborosan. Pengeluaran harus lebih kecil dari pendapatan.</p><p><b>Langkah</b>: (1) <b>tujuan keuangan</b>: jangka pendek (&lt;1 tahun), menengah (1–5 tahun), panjang (&gt;5 tahun); (2) <b>rencana pendapatan</b>: catat pendapatan rutin (gaji, bunga), tidak perlu mencatat yang tak pasti (lembur, hadiah, THR, bonus); (3) <b>rencana pengeluaran</b>: membedakan <b>kebutuhan</b> (harus dipenuhi) dari <b>keinginan</b> (dipengaruhi lingkungan, selera, pendapatan); prioritas: <b>biaya hidup</b> (makan, pakaian, internet, air, listrik), <b>cicilan utang</b>, <b>premi asuransi</b>; <b>penghematan</b> (pengeluaran lebih sedikit untuk tujuan sama); <b>menabung periodik</b> (pisahkan rekening konsumsi dan tabungan, termasuk dana darurat untuk hal mendesak); merencanakan program masa depan; (4) <b>reviu</b> pencapaian target.</p><p><b>Model</b>: <b>sistem amplop</b> (uang dibagi ke amplop sesuai rencana; cocok untuk pendapatan rutin), <b>buku kas harian</b> (catat pemasukan, pengeluaran, saldo tiap hari; cocok pendapatan rutin maupun tidak), <b>kas keluarga</b> (pengeluaran dikelompokkan: tetap, harian, tak terduga).</p>","ex":"<ul><li>Makan bergizi = kebutuhan; makan di restoran mahal 2–3 kali harga biasa = keinginan.</li></ul>","cmp":"<ul><li>Kebutuhan wajib dipenuhi; keinginan dipengaruhi selera dan lingkungan.</li></ul>","mis":"<ul><li>Mencatat pendapatan tak pasti sebagai pendapatan rutin.</li></ul>","p":[["Pengetahuan untuk mengambil keputusan keuangan?",["Literasi keuangan","Inflasi","Subsidi","Barter"],"Literasi."],["Indeks literasi keuangan SNLIK 2022?",["49,68%","85,10%","38,03%","76,19%"],"49,68%."],["Tujuan keuangan jangka pendek berarti…",["Kurang dari 1 tahun","1–5 tahun","Lebih dari 5 tahun","10 tahun"],"<1 tahun."],["Pengeluaran sebaiknya…",["Lebih kecil dari pendapatan","Lebih besar","Sama dengan utang","Tanpa rencana"],"Lebih kecil."]],"e":[["Literasi rendah mendorong terjebak…",["Pinjol, pay later, judi online, investasi bodong","Menabung","Berinvestasi legal","Belajar"],"Dampak."],["Kesenjangan literasi berarti…",["Bisa mengakses produk tetapi belum bisa mengelola","Tak ada akses","Literasi tinggi","Tak ada bank"],"Kesenjangan."],["Penyebab remaja konsumtif?",["Influencer dan belanja daring","Menabung","Sekolah","Pelatihan"],"Pengaruh media."],["Tujuan jangka menengah?",["1–5 tahun","<1 tahun",">5 tahun","Seumur hidup"],"1–5 tahun."],["Yang dicatat dalam rencana pendapatan?",["Pendapatan rutin tiap bulan","Bonus tak pasti","Hadiah","THR"],"Rutin."],["Yang tidak perlu dicatat sebagai pendapatan rutin?",["Lembur, hadiah, THR, bonus","Gaji pokok","Bunga tabungan","Gaji bulanan"],"Tak pasti."],["Kebutuhan berarti…",["Harus dipenuhi","Mengikuti selera","Mengikuti gengsi","Hobi"],"Wajib."],["Keinginan dipengaruhi…",["Lingkungan, selera, pendapatan","Cuaca","Zona waktu","Bujur"],"Faktor luar."],["Tujuan pengelolaan keuangan?",["Mencegah pemborosan dan mencapai target","Menghabiskan uang","Menambah utang","Menutup tabungan"],"Tujuan."],["Dana darurat dipakai saat…",["Terjadi hal mendesak","Belanja hobi","Liburan","Pesta"],"Mendesak."],["Sistem amplop cocok untuk keluarga dengan pendapatan…",["Rutin tiap bulan","Tidak ada","Selalu besar","Hanya dari hadiah"],"Pendapatan rutin."],["Buku kas harian mencatat…",["Pemasukan, pengeluaran, saldo tiap hari","Hanya utang","Hanya tabungan","Hanya pajak"],"Catatan harian."],["Kas keluarga mengelompokkan pengeluaran menjadi…",["Tetap, harian, tak terduga","Besar, kecil","Primer, tersier","Kota, desa"],"Tiga kelompok."],["Prioritas pengeluaran dimulai dari…",["Biaya hidup, cicilan utang, premi asuransi","Hiburan","Liburan","Hadiah"],"Urutan prioritas."],["Menabung periodik: pisahkan…",["Rekening konsumsi dan tabungan","Uang dan emas","Gaji dan hadiah","Kartu dan tunai"],"Dipisah."],["Reviu keuangan dilakukan untuk…",["Mengetahui pencapaian target","Menambah utang","Menutup rekening","Menghapus catatan"],"Reviu."],["Pengelolaan didasarkan pada…",["Skala prioritas","Selera","Iklan","Gengsi"],"Skala prioritas."]]},"B.1.6":{"k":8,"g":"Menjelaskan lembaga keuangan bank dan nonbank serta peran masyarakat dan pemerintah dalam ekonomi digital.","core":"<p><b>Lembaga keuangan</b> memberi kemudahan dan keamanan transaksi keuangan.</p><ul><li><b>Bank</b>: menerima tabungan dan meminjamkan uang. <b>Bank sentral</b> (satu-satunya Bank Indonesia) menjaga kestabilan ekonomi; <b>bank umum</b> (BRI, BNI, Mandiri, BCA, Bank Syariah Indonesia) menyediakan tabungan, simpanan, giro, KPR, dan kredit, konvensional atau syariah; <b>BPR</b> (Lumbung Desa, Bank Desa, Bank Pasar, BKD) beroperasi di daerah terpencil dan perdesaan.</li><li><b>Nonbank</b>: menghimpun dana lewat surat berharga lalu menyalurkannya. Paling banyak: <b>pegadaian</b> (pinjaman dengan jaminan harta, dikenai biaya) dan <b>koperasi simpan pinjam</b> (bunga relatif rendah; syarat menjadi anggota dan membayar iuran). Lainnya: asuransi, pasar modal, reksa dana, dana pensiun.</li></ul><p><b>Ekonomi digital</b>: kegiatan ekonomi dengan teknologi digital: uang elektronik (GoPay, ShopeePay, OVO, QRIS), belanja daring (Tokopedia, Shopee), pesan makanan atau transportasi (Gojek, Grab), konsultasi dokter daring (Halodoc, Alodokter). Manfaat: penjual dan pembeli bertransaksi tak langsung (dalam dan luar negeri), peluang usaha baru, mengurangi pengangguran (pengembang perangkat lunak, analis data, ahli keamanan siber, logistik, layanan pelanggan), menaikkan kesejahteraan.</p><p><b>Peran masyarakat</b>: belajar teknologi digital, meningkatkan literasi digital dan keterampilan teknologi. <b>Peran pemerintah</b>: memperluas akses internet kota dan desa, meningkatkan pemahaman teknologi, memberi modal usaha kecil, bekerja sama dengan swasta untuk pelatihan.</p>","ex":"<ul><li>Menggadaikan motor ke pegadaian untuk memperoleh uang tanpa menjualnya.</li></ul>","cmp":"<ul><li>Bank menghimpun tabungan; pegadaian memberi pinjaman dengan jaminan.</li></ul>","mis":"<ul><li>Menyamakan koperasi dengan bank.</li></ul>","p":[["Bank sentral Indonesia?",["Bank Indonesia","BRI","BNI","Mandiri"],"BI."],["Pegadaian termasuk lembaga…",["Keuangan nonbank","Bank sentral","Bank umum","BPR"],"Nonbank."],["BPR beroperasi terutama di…",["Daerah terpencil dan perdesaan","Pusat kota saja","Luar negeri","Bandara"],"Terpencil."],["Contoh uang elektronik?",["QRIS, GoPay, OVO","Cek","Giro","Gadai"],"Uang elektronik."]],"e":[["Tugas bank sentral?",["Menjaga kestabilan ekonomi","Memberi pinjaman gadai","Menjual asuransi","Mengelola koperasi"],"Kestabilan."],["Contoh bank umum?",["BRI, BNI, Mandiri, BCA","Lumbung Desa","Pegadaian","Koperasi"],"Bank umum."],["Contoh BPR?",["Lumbung Desa, Bank Pasar, BKD","BCA","BI","Pegadaian"],"BPR."],["Syarat pinjam di koperasi simpan pinjam?",["Menjadi anggota dan membayar iuran","Tanpa syarat","Menggadaikan motor","Punya saham"],"Anggota."],["Pegadaian membebankan…",["Biaya atas pinjaman dengan jaminan","Hadiah","Bunga tabungan","Dividen"],"Biaya."],["Nonbank selain pegadaian dan koperasi?",["Asuransi, pasar modal, reksa dana, dana pensiun","BPR","Bank sentral","Bank umum"],"Nonbank."],["Bentuk transaksi ekonomi digital?",["Belanja daring dan uang elektronik","Barter","Pasar tradisional","Gadai"],"Digital."],["Manfaat ekonomi digital?",["Peluang usaha baru dan mengurangi pengangguran","Menambah pengangguran","Menutup usaha","Menaikkan biaya"],"Manfaat."],["Pekerjaan baru ekonomi digital?",["Analis data dan ahli keamanan siber","Penjaga mercusuar","Pemburu","Penebang"],"Pekerjaan baru."],["Peran pemerintah dalam ekonomi digital?",["Memperluas akses internet","Menutup internet","Menghentikan usaha","Mengurangi pelatihan"],"Akses internet."],["Peran masyarakat dalam ekonomi digital?",["Meningkatkan literasi digital","Menolak teknologi","Menghindari internet","Tak berperan"],"Literasi digital."],["Berkonsultasi dokter lewat aplikasi termasuk…",["Ekonomi digital","Barter","Konsumsi tradisional","Distribusi langsung"],"Digital."]]},"B.1.7":{"k":8,"g":"Menjelaskan komunitas, bentuk pemberdayaan masyarakat, dan peran komunitas dalam pembangunan berkelanjutan.","core":"<p><b>Komunitas</b>: kesatuan sosial terorganisasi dalam kelompok yang memiliki kepentingan bersama di wilayah tertentu; secara umum hubungan sosial antarmanusia dalam kelompok untuk mencapai tujuan bersama. Konsepnya berbeda dari komunitas dalam IPA. Komunitas dengan latar budaya beragam diharapkan meningkatkan <b>pemberdayaan masyarakat</b>, yang terbagi dua:</p><ul><li><b>Pemberdayaan dalam komunitas</b>: misalnya pelatihan membuat MP-ASI (puding labu siam) untuk komunitas Ibu-Ibu Posyandu agar kreatif memanfaatkan bahan bergizi; gizi seimbang penting karena anak generasi penerus bangsa.</li><li><b>Pemberdayaan masyarakat desa</b>: misalnya wawasan kewirausahaan dari halaman rumah, budi daya anggrek di Desa Wisata Anggrek Tulungrejo, Kota Batu, yang juga jadi pendapatan tambahan saat pandemi Covid-19. Bentuk lain: LSM, Dana Sehat, Posyandu, Polindes, Pos Obat Desa (POD), Karang Taruna Husada.</li></ul><p><b>Peran komunitas dalam pembangunan berkelanjutan</b>: (1) memengaruhi individu agar berpikir ramah lingkungan dan sadar hubungan timbal balik dengan alam; (2) aktif dalam berbagai dimensi pembangunan sesuai tujuan pembangunan berkelanjutan; (3) menjaga alam dan melakukan kegiatan sosial-ekonomi secara bertanggung jawab. Tujuannya membangun manusia sehat, cerdas, bermental baik, bergotong royong. Contoh: komunitas peduli sampah mendirikan <b>bank sampah</b> agar warga memilah sampah untuk didaur ulang. <b>Tantangan</b>: kesadaran dan konsistensi tiap orang berbeda; perilaku manusia kunci pembangunan berkelanjutan.</p>","ex":"<ul><li>Pelatihan membuat tas daur ulang dari sampah plastik untuk ibu-ibu PKK.</li></ul>","cmp":"<ul><li>Pemberdayaan komunitas melatih kelompok; pemberdayaan desa meningkatkan potensi ekonomi desa.</li></ul>","mis":"<ul><li>Mengira pemberdayaan hanya bantuan uang.</li></ul>","p":[["Kesatuan sosial dengan kepentingan bersama di wilayah tertentu?",["Komunitas","Individu","Pasar","Perusahaan"],"Komunitas."],["Contoh pemberdayaan desa dari halaman rumah?",["Budi daya anggrek","Tambang emas","Pabrik besar","Pelabuhan"],"Anggrek."],["Bank sampah dibuat oleh komunitas…",["Peduli sampah","Peduli bunga","Peduli musik","Peduli film"],"Peduli sampah."],["Desa Wisata Anggrek Tulungrejo berada di…",["Kota Batu","Kota Medan","Kota Padang","Kota Tegal"],"Batu."]],"e":[["Dua bentuk pemberdayaan?",["Dalam komunitas dan masyarakat desa","Kota dan pesisir","Besar dan kecil","Tradisional dan modern"],"Dua bentuk."],["Pelatihan MP-ASI untuk Ibu-Ibu Posyandu bertujuan…",["Memanfaatkan bahan bergizi secara kreatif","Menjual gedung","Menaikkan pajak","Menutup posyandu"],"Gizi seimbang."],["Mengapa gizi seimbang penting?",["Anak adalah generasi penerus bangsa","Hiburan","Pajak","Gengsi"],"Generasi penerus."],["Contoh lembaga pemberdayaan desa?",["Posyandu, Polindes, Karang Taruna Husada","BI","OJK","LPS"],"Lembaga desa."],["Budi daya anggrek juga berfungsi sebagai…",["Cadangan pendapatan saat pandemi","Penghambat","Pajak","Beban"],"Pendapatan tambahan."],["Peran komunitas pertama dalam pembangunan berkelanjutan?",["Memengaruhi mindset ramah lingkungan","Menghentikan pembangunan","Menutup sekolah","Menaikkan harga"],"Peran 1."],["Tujuan komunitas dalam pembangunan berkelanjutan?",["Membangun manusia sehat, cerdas, bermental baik, bergotong royong","Menambah utang","Menghentikan desa","Membatasi sekolah"],"Tujuan."],["Contoh nyata komunitas peduli sampah?",["Bank sampah","Pegadaian","Bursa saham","Pasar kaget"],"Bank sampah."],["Tantangan peran komunitas?",["Kesadaran dan konsistensi tiap orang berbeda","Terlalu mudah","Tak ada tantangan","Tak ada warga"],"Tantangan."],["Kunci terwujudnya pembangunan berkelanjutan?",["Perilaku manusia","Cuaca","Laut","Gunung"],"Perilaku."],["Pelatihan desain grafis untuk komunitas postcrossing termasuk…",["Pemberdayaan komunitas","Pencemaran","Impor","Konflik"],"Pemberdayaan."],["Sosialisasi desa tangguh bencana termasuk…",["Pemberdayaan komunitas","Pencemaran","Konsumsi","Distribusi"],"Pemberdayaan."]]}};

const MINL=[0,20,40,65,95,130],RNK=[['E','Pemula'],['D','Murid'],['C','Penjelajah'],['B','Ahli'],['A','Master'],['S','Cendekia']],RK=()=>RNK[S.rank],RANKOF=[0,1,2,3,4,4];
