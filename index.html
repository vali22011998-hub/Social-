5 lebih banyak, beban penduduk produktif makin berat. <b>Sex ratio</b> membandingkan laki-laki dan perempuan. Pertumbuhan penduduk cepat dapat menimbulkan pengangguran muda dan persebaran penduduk tidak merata.</p>","ex":"<ul><li>Sebuah kota: lahir 5.000, mati 2.000, masuk 3.000, keluar 1.000. P = (5.000 − 2.000) + (3.000 − 1.000) = 5.000.</li></ul>","cmp":"<ul><li><b>Imigrasi</b> penduduk masuk, <b>emigrasi</b> penduduk keluar.</li><li><b>Piramida muda</b> pertumbuhan cepat, <b>tua</b> penduduk menua.</li></ul>","mis":"<ul><li>Lupa menghitung migrasi pada rumus.</li><li>Menukar piramida muda dan tua.</li><li>Mengira penduduk banyak selalu menguntungkan.</li></ul>","p":[["Tiga faktor dinamika penduduk?",["Kelahiran, kematian, migrasi","Hujan, angin, suhu","Gempa, banjir, tsunami","Pajak, harga, upah"],"Tiga faktor."],["Rumus pertambahan penduduk?",["P = (L − M) + (I − E)","P = L + M","P = L × M","P = I + E"],"Sesuai buku."],["Piramida muda disebut juga…",["Ekspansif","Stasioner","Konstruktif","Datar"],"Ekspansif."],["Natalitas tinggi jika di atas…",["30 per 1000","10 per 1000","20 per 1000","5 per 1000"],"> 30."]],"e":[["Penduduk keluar suatu wilayah dilambangkan…",["E","I","L","M"],"Emigrasi."],["Natalitas sedang berkisar…",["20–30","Di atas 30","Di bawah 20","0"],"20–30."],["Mortalitas rendah berkisar…",["9–13","14–18","Di atas 18","0–5"],"9–13."],["Negara dengan piramida stasioner?",["Amerika Serikat","Indonesia","India","Filipina"],"AS dan Inggris."],["Negara dengan piramida tua?",["Jerman","Malaysia","India","Filipina"],"Jerman."],["Usia produktif menurut buku…",["15–65 tahun","0–5 tahun","5–10 tahun","70 tahun ke atas"],"15–65."],["Kota: lahir 4.000, mati 1.000, masuk 2.000, keluar 500. Pertambahan penduduk?",["4.500","3.000","1.500","6.000"],"(4000−1000)+(2000−500)=4.500."],["Pertumbuhan cepat dapat menyebabkan…",["Pengangguran usia muda","Surplus lapangan kerja","Penduduk berkurang","Tak ada masalah"],"Masalah kependudukan."],["Sex ratio membandingkan…",["Laki-laki dan perempuan","Muda dan tua","Kota dan desa","Kaya dan miskin"],"Perbandingan jenis kelamin."],["Piramida muda menggambarkan wilayah dengan…",["Kelahiran tinggi, kematian rendah","Kelahiran rendah","Kematian tinggi","Penduduk menyusut"],"Pertumbuhan cepat."]]},"C.1.5":{"k":8,"g":"Menjelaskan bentuk keragaman masyarakat Indonesia, penyebabnya, serta sikap yang tepat menghadapinya.","core":"<p>Masyarakat Indonesia <b>majemuk</b>: terdiri atas banyak kelompok dengan latar berbeda. Bentuk keragamannya: <b>suku bangsa</b> (lebih dari 1.300 suku menurut sensus BPS 2010), <b>bahasa daerah</b>, <b>agama dan kepercayaan</b> (enam agama yang diakui negara: Islam, Kristen, Katolik, Hindu, Buddha, Konghucu), <b>ras</b>, <b>adat dan budaya</b>, serta <b>golongan sosial ekonomi</b>.</p><p><b>Penyebab keragaman</b>: kondisi geografis (kepulauan, iklim, bentuk muka bumi), sejarah (kerajaan Hindu-Buddha, Islam, kolonial), dan pertemuan dengan bangsa asing.</p><p><b>Manfaat</b>: kekayaan budaya, saling melengkapi, dan daya tarik wisata. <b>Tantangan</b>: kesalahpahaman dan konflik jika tidak ada saling menghargai.</p><p><b>Sikap menghadapi keragaman</b>: toleransi, hak kelompok minoritas dihargai, saling menghormati, gotong royong, tidak membeda-bedakan, dan menjunjung <b>Bhinneka Tunggal Ika</b>.</p>","ex":"<ul><li>Dalam satu kelas ada siswa berbeda suku, bahasa, dan agama yang tetap bekerja sama.</li><li>Rumah ibadah berbeda berdampingan di satu kampung.</li></ul>","cmp":"<ul><li><b>Keragaman</b> adalah fakta perbedaan; <b>toleransi</b> adalah sikap menyikapinya.</li></ul>","mis":"<ul><li>Menganggap kelompok sendiri paling baik.</li><li>Mengira keragaman pasti menimbulkan konflik.</li><li>Mengira hanya suku mayoritas yang penting.</li></ul>","p":[["Masyarakat dengan banyak kelompok berbeda disebut…",["Majemuk","Homogen","Tunggal","Terisolasi"],"Majemuk."],["Semboyan persatuan?",["Bhinneka Tunggal Ika","Tut Wuri Handayani","Merdeka","Gotong Royong"],"Berbeda tetapi satu."],["Sikap menghadapi perbedaan?",["Toleransi","Menghina","Menjauhi","Memaksa"],"Toleransi."],["Penyebab keragaman?",["Geografis dan sejarah","Cuaca harian","Harga barang","Zona waktu"],"Geografis dan sejarah."]],"e":[["Bentuk keragaman masyarakat?",["Suku, agama, ras, adat","Hanya pakaian","Hanya makanan","Hanya zona waktu"],"Beragam bentuk."],["Jumlah agama yang diakui negara?",["Enam","Dua","Tiga","Sepuluh"],"Enam agama."],["Manfaat keragaman?",["Kekayaan budaya","Konflik pasti","Perpecahan","Isolasi"],"Kekayaan budaya."],["Tantangan keragaman?",["Kesalahpahaman dan konflik","Tidak ada","Hanya wisata","Hanya perdagangan"],"Perlu saling menghargai."],["Contoh sikap toleransi?",["Menghormati ibadah teman","Mengejek budaya lain","Menolak berteman","Memaksakan adat"],"Menghormati."],["Faktor sejarah memengaruhi keragaman lewat…",["Pengaruh kerajaan dan bangsa asing","Hujan","Gempa","Pajak"],"Pertemuan budaya."],["Mengapa keragaman Indonesia besar?",["Wilayah kepulauan yang luas","Satu pulau","Tidak ada laut","Tak ada sejarah"],"Faktor geografis."],["Gotong royong membantu keragaman karena…",["Menyatukan perbedaan dalam kerja bersama","Memisahkan","Menimbulkan konflik","Mengabaikan"],"Persatuan."],["Kelompok minoritas sebaiknya…",["Dihargai haknya","Diabaikan","Dilarang","Dipisah"],"Toleransi."],["Dalam satu kelas siswa berbeda suku tetap kompak. Ini mencerminkan…",["Bhinneka Tunggal Ika","Isolasi","Konflik","Diskriminasi"],"Persatuan dalam perbedaan."]]},"C.1.6":{"k":8,"g":"Menjelaskan mobilitas sosial, jenis, saluran, serta faktor pendorong dan penghambatnya.","core":"<p><b>Mobilitas sosial</b> adalah perpindahan seseorang atau kelompok dari satu kedudukan (status) sosial ke kedudukan lain dalam masyarakat.</p><ul><li><b>Vertikal naik</b> (social climbing): naik ke lapisan lebih tinggi, misalnya buruh menjadi pemilik usaha.</li><li><b>Vertikal turun</b> (social sinking): turun ke lapisan lebih rendah, misalnya pengusaha bangkrut.</li><li><b>Horizontal</b>: berpindah pekerjaan atau tempat tanpa mengubah tingkat status, misalnya guru SMP menjadi guru SMA.</li><li><b>Antargenerasi</b>: perbedaan status anak dibanding orang tua.</li></ul><p><b>Saluran mobilitas</b>: pendidikan, pekerjaan, organisasi, perkawinan, dan kegiatan ekonomi. <b>Pendorong</b>: pendidikan, keterampilan, kesempatan, kerja keras. <b>Penghambat</b>: kemiskinan, diskriminasi, kurangnya akses pendidikan. Mobilitas mudah pada masyarakat dengan stratifikasi terbuka dan sulit pada stratifikasi tertutup.</p>","ex":"<ul><li>Anak petani menjadi dokter lewat pendidikan: mobilitas vertikal naik.</li><li>Karyawan pindah kerja ke kantor lain dengan jabatan setara: horizontal.</li></ul>","cmp":"<ul><li><b>Vertikal</b> mengubah tingkat status, <b>horizontal</b> tidak.</li></ul>","mis":"<ul><li>Mengira mobilitas hanya naik.</li><li>Menyamakan pindah kerja setara dengan naik status.</li><li>Mengira status selalu ditentukan lahir.</li></ul>","p":[["Perpindahan status sosial disebut…",["Mobilitas sosial","Interaksi","Akulturasi","Difusi"],"Mobilitas sosial."],["Buruh menjadi pemilik usaha adalah mobilitas…",["Vertikal naik","Vertikal turun","Horizontal","Tidak ada"],"Naik."],["Saluran mobilitas yang utama?",["Pendidikan","Cuaca","Gempa","Zona waktu"],"Pendidikan."],["Pindah pekerjaan setara disebut…",["Horizontal","Vertikal","Antarwaktu","Pasif"],"Horizontal."]],"e":[["Pengusaha bangkrut menjadi pekerja. Mobilitas…",["Vertikal turun","Vertikal naik","Horizontal","Tidak ada"],"Turun."],["Faktor pendorong mobilitas?",["Pendidikan dan keterampilan","Kemiskinan","Diskriminasi","Larangan"],"Pendorong."],["Faktor penghambat mobilitas?",["Diskriminasi dan kemiskinan","Pelatihan","Beasiswa","Kesempatan"],"Penghambat."],["Stratifikasi terbuka membuat mobilitas…",["Lebih mudah","Mustahil","Tertutup","Dilarang"],"Terbuka."],["Anak petani menjadi dokter. Ini mobilitas…",["Vertikal naik","Horizontal","Turun","Tidak ada"],"Lewat pendidikan."],["Perkawinan dapat menjadi saluran mobilitas karena…",["Dapat mengubah status sosial","Menetap saja","Tidak berpengaruh","Menghalangi"],"Salah satu saluran."],["Pindah kerja ke jabatan setara. Mobilitas…",["Horizontal","Vertikal naik","Vertikal turun","Tidak ada"],"Status tetap."],["Mengapa pendidikan penting bagi mobilitas?",["Membuka peluang pekerjaan lebih baik","Menutup peluang","Mengurangi keterampilan","Tidak berpengaruh"],"Peluang meningkat."],["Social climbing artinya…",["Naik ke lapisan lebih tinggi","Turun","Tetap","Pindah kota"],"Mobilitas naik."],["Seorang siswa rajin belajar dan mendapat beasiswa. Ini…",["Awal mobilitas naik lewat pendidikan","Mobilitas turun","Tak ada hubungan","Hambatan"],"Pendidikan = saluran."]]},"C.1.7":{"k":8,"g":"Menjelaskan masuk dan berkembangnya Islam di Indonesia, cara penyebarannya, kerajaan Islam, dan bentuk akulturasi budayanya.","core":"<p>Islam masuk melalui pelayaran dan perdagangan di jalur Selat Malaka. Para ahli mengajukan beberapa teori asal (Gujarat, Arab/Mekah, Persia, Cina). Pedagang muslim menetap di pelabuhan dan membentuk komunitas.</p><p><b>Cara penyebaran</b>: <b>perdagangan</b>, <b>perkawinan</b> (pedagang muslim menikah dengan penduduk setempat), <b>pendidikan</b> (pesantren), <b>kesenian</b> (misalnya wayang dan gamelan oleh Walisongo), <b>tasawuf</b> (pendekatan sufi), dan <b>politik</b> (raja memeluk Islam diikuti rakyat).</p><p><b>Kerajaan Islam</b>: Samudra Pasai (kerajaan Islam pertama), Aceh Darussalam, Demak, Mataram Islam, Banten, Cirebon, Gowa-Tallo, Ternate dan Tidore.</p><p><b>Akulturasi budaya</b>: Masjid Agung Demak beratap tumpang, Menara Kudus yang mirip candi, seni kaligrafi, nisan dan makam beraksara Arab, serta kalender Jawa Sultan Agung yang memadukan tarikh Saka dan Hijriah. Unsur lokal dan Islam berpadu tanpa menghilangkan budaya asli.</p>","ex":"<ul><li>Sunan Kalijaga mengenalkan nilai Islam melalui wayang.</li><li>Menara Kudus berbentuk mirip candi: akulturasi Hindu-Buddha dan Islam.</li></ul>","cmp":"<ul><li><b>Akulturasi</b> memadukan unsur, <b>asimilasi</b> melebur unsur asli.</li></ul>","mis":"<ul><li>Mengira Islam disebarkan hanya lewat perang.</li><li>Mengira budaya lokal hilang setelah Islam datang.</li><li>Menyebut Demak sebagai kerajaan Islam pertama.</li></ul>","p":[["Kerajaan Islam pertama di Indonesia?",["Samudra Pasai","Demak","Mataram","Banten"],"Samudra Pasai."],["Salah satu cara penyebaran Islam?",["Perdagangan","Perang saja","Pajak","Penjajahan"],"Dagang."],["Wayang dipakai menyebarkan Islam oleh…",["Walisongo","Pangeran Diponegoro","Hayam Wuruk","Airlangga"],"Walisongo."],["Pendidikan pesantren termasuk saluran…",["Pendidikan","Politik","Perkawinan","Seni"],"Pendidikan."]],"e":[["Pedagang muslim menikah dengan penduduk setempat adalah saluran…",["Perkawinan","Perang","Pajak","Pendidikan"],"Perkawinan."],["Raja memeluk Islam dan diikuti rakyat adalah saluran…",["Politik","Dagang","Seni","Tasawuf"],"Politik."],["Menara Kudus mirip…",["Candi","Gereja","Benteng","Pasar"],"Akulturasi."],["Kalender Sultan Agung memadukan…",["Saka dan Hijriah","Masehi dan Cina","Hijriah dan Romawi","Saka dan Barat"],"Dua tarikh."],["Masjid Agung Demak beratap…",["Tumpang","Kubah besar","Datar","Menara kaca"],"Atap tumpang."],["Contoh kerajaan Islam di Jawa?",["Demak","Sriwijaya","Kutai","Tarumanegara"],"Demak."],["Contoh akulturasi di nisan?",["Aksara Arab dengan hiasan lokal","Hanya bahasa Inggris","Tanpa tulisan","Plastik"],"Perpaduan."],["Pesantren berperan…",["Menyebarkan pengetahuan dan nilai Islam","Menjual barang","Menarik pajak","Membangun candi"],"Pendidikan."],["Mengapa Selat Malaka penting bagi masuknya Islam?",["Jalur pelayaran dan perdagangan","Jauh dari laut","Tak ada kapal","Hanya jalur perang"],"Jalur dagang."],["Seorang wali memakai wayang untuk dakwah. Ini contoh…",["Penyebaran lewat kesenian","Lewat perang","Lewat pajak","Lewat paksaan"],"Kesenian."]]},"D.0.1":{"k":8,"g":"Membedakan kolonialisme dan imperialisme serta menjelaskan kebijakan VOC dan pemerintah kolonial beserta perlawanan rakyat.","core":"<p><b>Kolonialisme</b> adalah penguasaan suatu wilayah oleh bangsa lain untuk kepentingan ekonomi dan politik. <b>Imperialisme</b> adalah paham atau politik memperluas kekuasaan atas wilayah lain.</p><ul><li><b>VOC</b> (1602–1799): kongsi dagang Belanda dengan hak monopoli dan hak istimewa (oktroi); mempraktikkan monopoli rempah dan pelayaran hongi.</li><li><b>Daendels</b> (1808–1811): membangun Jalan Raya Pos Anyer–Panarukan dengan kerja paksa.</li><li><b>Raffles</b> (1811–1816, Inggris): sistem sewa tanah (landrente).</li><li><b>Tanam Paksa</b> (<i>Cultuurstelsel</i>, 1830, Van den Bosch): rakyat wajib menanam tanaman ekspor di sebagian lahannya; rakyat mengalami kemiskinan dan kelaparan, sedangkan Belanda untung besar.</li><li><b>Politik Etis</b> (1901): irigasi, edukasi (pendidikan), dan emigrasi (transmigrasi).</li></ul><p><b>Perlawanan</b>: Sultan Agung menyerang Batavia (1628–1629), Sultan Hasanuddin (Perang Makassar, Perjanjian Bongaya 1667), Pattimura (1817), Imam Bonjol (Perang Padri), Pangeran Diponegoro (Perang Jawa 1825–1830), Perang Aceh.</p>","ex":"<ul><li>Rakyat Jawa menanam kopi dan tebu untuk Belanda saat Tanam Paksa, sehingga lahan pangan berkurang.</li><li>Jalan Anyer–Panarukan dibangun dengan kerja paksa rakyat.</li></ul>","cmp":"<ul><li><b>Kolonialisme</b> penguasaan wilayah, <b>imperialisme</b> politik perluasan kekuasaan.</li><li><b>Tanam Paksa</b> untuk keuntungan Belanda, <b>Politik Etis</b> (balas budi) lewat irigasi, edukasi, emigrasi.</li></ul>","mis":"<ul><li>Menukar Tanam Paksa dan Politik Etis.</li><li>Mengira perlawanan hanya di Jawa.</li><li>Mengira VOC adalah pemerintah negara.</li></ul>","p":[["Penguasaan wilayah bangsa lain untuk kepentingan ekonomi?",["Kolonialisme","Nasionalisme","Liberalisme","Federalisme"],"Kolonialisme."],["Pembuat Jalan Raya Pos Anyer–Panarukan?",["Daendels","Raffles","Van den Bosch","Coen"],"Daendels."],["Tanam Paksa diberlakukan tahun…",["1830","1602","1945","1901"],"Van den Bosch."],["Tiga program Politik Etis?",["Irigasi, edukasi, emigrasi","Pajak, rodi, monopoli","Tanam, panen, jual","Dagang, perang, pajak"],"Irigasi, edukasi, emigrasi."]],"e":[["VOC adalah…",["Kongsi dagang Belanda","Kerajaan Nusantara","Partai politik","Pasukan Inggris"],"Kongsi dagang."],["Sistem sewa tanah diterapkan oleh…",["Raffles","Daendels","Van den Bosch","Coen"],"Landrente."],["Pelaksana Tanam Paksa?",["Van den Bosch","Raffles","Daendels","Hasanuddin"],"1830."],["Perang Jawa 1825–1830 dipimpin…",["Pangeran Diponegoro","Imam Bonjol","Pattimura","Sultan Agung"],"Diponegoro."],["Perang Padri dipimpin…",["Imam Bonjol","Diponegoro","Hasanuddin","Pattimura"],"Imam Bonjol."],["Perjanjian Bongaya terjadi setelah perlawanan…",["Sultan Hasanuddin","Pattimura","Diponegoro","Sultan Agung"],"Perang Makassar."],["Dampak Tanam Paksa bagi rakyat?",["Kemiskinan dan kelaparan","Kemakmuran","Tanah bertambah","Pajak dihapus"],"Rakyat menderita."],["Politik Etis dikenal sebagai…",["Politik balas budi","Politik dagang","Politik perang","Politik tutup"],"Balas budi."],["Imperialisme berarti…",["Politik memperluas kekuasaan","Gotong royong","Perdagangan bebas","Kerja sama budaya"],"Perluasan kekuasaan."],["Pendidikan bagi pribumi meluas setelah…",["Politik Etis","Tanam Paksa","Pendudukan Jepang saja","VOC"],"Edukasi."]]},"D.0.2":{"k":8,"g":"Menjelaskan perubahan kehidupan masyarakat akibat penjajahan Barat dan pendudukan Jepang.","core":"<p><b>Akibat penjajahan Barat</b></p><ul><li><b>Ekonomi</b>: perkebunan besar dan ekonomi uang berkembang, rakyat tetap miskin akibat tanam paksa dan pajak.</li><li><b>Sosial</b>: masyarakat dibagi tiga lapis (Eropa, Timur Asing, pribumi).</li><li><b>Infrastruktur</b>: jalan dan rel kereta api (jalur pertama Semarang–Tanggung, 1867) dibangun terutama demi mengangkut hasil bumi.</li><li><b>Pendidikan</b>: sekolah model Barat lahir dan memunculkan kaum terpelajar, yang kemudian menumbuhkan <b>nasionalisme</b>.</li></ul><p><b>Pendudukan Jepang (1942–1945)</b> menggantikan Belanda setelah Belanda menyerah di Kalijati (Maret 1942).</p><ul><li><b>Kehidupan sulit</b>: padi dan hasil bumi diserahkan untuk perang; <b>romusha</b> (kerja paksa) menimbulkan banyak korban.</li><li><b>Organisasi militer</b>: <b>PETA</b> dan Heiho; Kinpeitai (polisi militer).</li><li><b>Kebijakan</b>: organisasi lama dibubarkan, bahasa Belanda dilarang dan bahasa Indonesia berkembang; muncul Putera dan Jawa Hokokai.</li></ul>","ex":"<ul><li>Jalur kereta api dibangun menghubungkan perkebunan dan pelabuhan.</li><li>PETA melatih pemuda Indonesia yang kelak menjadi inti tentara nasional.</li></ul>","cmp":"<ul><li>Belanda memakai <b>tanam paksa</b>; Jepang memakai <b>romusha</b>.</li></ul>","mis":"<ul><li>Mengira infrastruktur dibangun demi rakyat.</li><li>Mengira Jepang menjajah lebih lama daripada Belanda.</li><li>Menukar PETA dan romusha.</li></ul>","p":[["Kerja paksa masa Jepang?",["Romusha","Rodi","Landrente","Tanam paksa"],"Romusha."],["Organisasi militer bentukan Jepang untuk pemuda?",["PETA","VOC","BPUPKI","Budi Utomo"],"PETA."],["Jepang menduduki Indonesia pada tahun…",["1942","1908","1928","1900"],"1942."],["Jalur kereta api pertama menghubungkan…",["Semarang–Tanggung","Jakarta–Bogor","Bandung–Cirebon","Surabaya–Malang"],"1867."]],"e":[["Tiga lapisan masyarakat kolonial?",["Eropa, Timur Asing, pribumi","Bangsawan, ulama, petani","Raja, patih, rakyat","Kaya, miskin, sedang"],"Stratifikasi kolonial."],["Jepang menyerahkan hasil bumi untuk…",["Kebutuhan perang","Kesejahteraan rakyat","Wisata","Ekspor santai"],"Perang."],["Bahasa yang dilarang masa Jepang?",["Bahasa Belanda","Bahasa Indonesia","Bahasa Jawa","Bahasa Bugis"],"Belanda dilarang."],["Jepang menggantikan Belanda setelah menyerah di…",["Kalijati","Rengasdengklok","Bongaya","Yogyakarta"],"Maret 1942."],["Dampak pendidikan Barat bagi pribumi?",["Muncul kaum terpelajar dan nasionalisme","Tak ada sekolah","Pendidikan dilarang","Kebodohan"],"Terpelajar."],["Kinpeitai adalah…",["Polisi militer Jepang","Partai politik","Sekolah","Bank"],"Polisi militer."],["Mengapa rel kereta dibangun Belanda?",["Mengangkut hasil perkebunan","Mengangkut wisatawan","Mengangkut guru","Mengangkut pengungsi"],"Kepentingan ekonomi."],["Dampak romusha?",["Banyak korban kerja paksa","Rakyat sejahtera","Upah tinggi","Libur panjang"],"Menderita."],["Putera dan Jawa Hokokai termasuk…",["Organisasi bentukan Jepang","Organisasi VOC","Partai Belanda","Lembaga Inggris"],"Bentukan Jepang."],["Rakyat tetap miskin masa kolonial karena…",["Tanam paksa dan pajak tinggi","Panen berlimpah","Upah tinggi","Tanah luas"],"Eksploitasi."]]},"D.0.3":{"k":8,"g":"Menjelaskan organisasi pergerakan nasional, tokoh, dan perannya hingga Sumpah Pemuda.","core":"<p>Pendidikan Barat melahirkan kesadaran nasional dan <b>organisasi pergerakan</b>.</p><ul><li><b>Budi Utomo</b> (20 Mei 1908): dipelopori para pelajar STOVIA dengan Dr. Soetomo; bergerak sosial-budaya dan pendidikan. Tanggalnya diperingati sebagai Hari Kebangkitan Nasional.</li><li><b>Sarekat Dagang Islam</b> (1905, Haji Samanhudi) menjadi <b>Sarekat Islam</b> (1912, H.O.S. Tjokroaminoto).</li><li><b>Indische Partij</b> (1912): Tiga Serangkai (E.F.E. Douwes Dekker, Tjipto Mangunkusumo, Soewardi Soerjaningrat/Ki Hajar Dewantara), partai politik pertama menuntut kemerdekaan.</li><li><b>Muhammadiyah</b> (1912, KH Ahmad Dahlan), <b>Taman Siswa</b> (1922), <b>Nahdlatul Ulama</b> (1926).</li><li><b>PNI</b> (1927, Soekarno): menekankan kemerdekaan penuh.</li></ul><p><b>Sumpah Pemuda</b> (28 Oktober 1928, Kongres Pemuda II): satu tanah air, satu bangsa, satu bahasa persatuan, Indonesia. Lagu Indonesia Raya karya W.R. Supratman dikumandangkan.</p>","ex":"<ul><li>Taman Siswa memberi pendidikan bagi rakyat pribumi.</li><li>Pemuda dari berbagai daerah bersatu dalam Kongres Pemuda II.</li></ul>","cmp":"<ul><li><b>Budi Utomo</b> sosial-budaya, <b>Indische Partij</b> dan <b>PNI</b> politik.</li></ul>","mis":"<ul><li>Menyebut Budi Utomo berdiri 1928.</li><li>Mengira Sumpah Pemuda adalah proklamasi kemerdekaan.</li><li>Menukar tokoh Muhammadiyah dan NU.</li></ul>","p":[["Budi Utomo berdiri pada…",["20 Mei 1908","28 Oktober 1928","17 Agustus 1945","1 Juni 1945"],"20 Mei 1908."],["Pendiri Muhammadiyah?",["KH Ahmad Dahlan","KH Hasyim Asy'ari","Tjokroaminoto","Soekarno"],"Ahmad Dahlan."],["Sumpah Pemuda tanggal…",["28 Oktober 1928","20 Mei 1908","17 Agustus 1945","2 Mei 1922"],"1928."],["PNI dipimpin…",["Soekarno","Hatta","Soetomo","Samanhudi"],"Soekarno."]],"e":[["Tiga Serangkai mendirikan…",["Indische Partij","Budi Utomo","Muhammadiyah","PNI"],"Indische Partij."],["Sarekat Islam dipimpin…",["H.O.S. Tjokroaminoto","Soekarno","Hatta","Soetomo"],"Tjokroaminoto."],["Nahdlatul Ulama didirikan tahun…",["1926","1908","1945","1912"],"1926."],["Taman Siswa bergerak di bidang…",["Pendidikan","Perdagangan","Militer","Politik partai"],"Pendidikan."],["Hari Kebangkitan Nasional diperingati…",["20 Mei","28 Oktober","17 Agustus","2 Mei"],"20 Mei."],["Isi Sumpah Pemuda?",["Satu tanah air, bangsa, bahasa persatuan","Merdeka atau mati","Lima sila","Gotong royong"],"Tiga ikrar."],["Pencipta lagu Indonesia Raya?",["W.R. Supratman","Ismail Marzuki","Kusbini","C. Simanjuntak"],"Supratman."],["Sarekat Dagang Islam didirikan oleh…",["Haji Samanhudi","Soekarno","Hatta","Kartini"],"1905."],["Partai politik pertama yang menuntut merdeka?",["Indische Partij","Budi Utomo","Muhammadiyah","NU"],"Politik."],["Mengapa pendidikan Barat memunculkan pergerakan?",["Melahirkan kaum terpelajar yang sadar nasional","Menghapus pergerakan","Melarang berorganisasi","Menjauhkan rakyat"],"Kaum terpelajar."]]},"D.0.4":{"k":8,"g":"Menjelaskan jalan menuju proklamasi: BPUPKI, PPKI, peristiwa Rengasdengklok, dan teks proklamasi 17 Agustus 1945.","core":"<p>Menjelang kekalahannya, Jepang menjanjikan kemerdekaan. <b>BPUPKI</b> (ketua dr. Radjiman Wedyodiningrat) bersidang 29 Mei–1 Juni dan 10–17 Juli 1945 membahas dasar negara dan UUD. Pada <b>1 Juni 1945</b> Soekarno mengusulkan dasar negara bernama <b>Pancasila</b>. Setelah itu dibentuk <b>PPKI</b> (7 Agustus 1945; ketua Soekarno, wakil Hatta).</p><p>Jepang menyerah kepada Sekutu setelah bom atom dijatuhkan di <b>Hiroshima dan Nagasaki</b> (Agustus 1945). Golongan muda (Soekarni, Wikana, Chaerul Saleh) mendesak proklamasi segera, lalu membawa Soekarno dan Hatta ke <b>Rengasdengklok (16 Agustus)</b>. Mereka kembali ke Jakarta, dan teks proklamasi dirumuskan di rumah <b>Laksamana Maeda</b>, diketik Sayuti Melik, ditandatangani Soekarno-Hatta.</p><p><b>Proklamasi</b> dibacakan Soekarno pada <b>17 Agustus 1945</b> pukul 10.00 di Jalan Pegangsaan Timur 56, Jakarta. Pada <b>18 Agustus</b> PPKI mengesahkan UUD 1945 dan memilih Soekarno-Hatta sebagai Presiden dan Wakil Presiden.</p>","ex":"<ul><li>Teks proklamasi pertama ditulis tangan Soekarno lalu diketik Sayuti Melik.</li></ul>","cmp":"<ul><li><b>BPUPKI</b> menyiapkan dasar negara, <b>PPKI</b> mengesahkan UUD dan memilih presiden.</li><li>Golongan <b>tua</b> berhati-hati, golongan <b>muda</b> menginginkan proklamasi segera.</li></ul>","mis":"<ul><li>Menyebut proklamasi di Rengasdengklok.</li><li>Menukar BPUPKI dan PPKI.</li><li>Menyebut Sumpah Pemuda sebagai proklamasi.</li></ul>","p":[["Dasar negara yang diusulkan Soekarno 1 Juni 1945?",["Pancasila","UUD","Garuda","Bhinneka"],"Pancasila."],["Proklamasi dibacakan pada…",["17 Agustus 1945","28 Oktober 1928","1 Juni 1945","20 Mei 1908"],"17 Agustus 1945."],["Tempat teks proklamasi dirumuskan?",["Rumah Laksamana Maeda","Rengasdengklok","Istana","Sekolah"],"Rumah Maeda."],["Pengetik teks proklamasi?",["Sayuti Melik","Soekarno","Hatta","Wikana"],"Sayuti Melik."]],"e":[["Ketua BPUPKI?",["dr. Radjiman Wedyodiningrat","Soekarno","Hatta","Soetomo"],"Radjiman."],["PPKI dibentuk tanggal…",["7 Agustus 1945","1 Juni 1945","17 Agustus 1945","28 Mei 1945"],"7 Agustus."],["Bom atom dijatuhkan di…",["Hiroshima dan Nagasaki","Tokyo dan Osaka","Jakarta","Seoul"],"Dua kota."],["Soekarno-Hatta dibawa golongan muda ke…",["Rengasdengklok","Bandung","Surabaya","Semarang"],"16 Agustus."],["Lokasi proklamasi dibacakan?",["Jl. Pegangsaan Timur 56","Rengasdengklok","Monas","Kota Tua"],"Pegangsaan Timur."],["Tokoh golongan muda?",["Soekarni, Wikana, Chaerul Saleh","Soekarno, Hatta","Radjiman","Maeda"],"Golongan muda."],["PPKI memilih Presiden dan Wakil pada…",["18 Agustus 1945","17 Agustus 1945","1 Juni 1945","7 Agustus 1945"],"Sidang PPKI."],["Mengapa golongan muda mendesak proklamasi?",["Jepang telah menyerah dan terjadi kekosongan kekuasaan","Jepang menang","Belanda kembali","Tak ada alasan"],"Kesempatan merdeka."],["Presiden pertama RI?",["Soekarno","Hatta","Sjahrir","Radjiman"],"Soekarno."],["BPUPKI bersidang membahas…",["Dasar negara dan UUD","Perang dingin","Perdagangan","Pendidikan dasar"],"Dasar negara dan UUD."]]},"D.0.5":{"k":8,"g":"Menjelaskan kondisi geografis dan kesenjangan pembangunan, fungsi dan jenis lembaga keuangan, serta manfaatnya.","core":"<p>Sebagai negara kepulauan, Indonesia menghadapi <b>kesenjangan pembangunan</b>: pembangunan lebih terpusat di Jawa, sedangkan daerah terpencil dan perbatasan (3T: terdepan, terluar, tertinggal) infrastrukturnya terbatas. Upaya pemerataan: pembangunan infrastruktur (jalan, pelabuhan, tol laut), dana desa, dan pendidikan.</p><p><b>Lembaga keuangan</b> menghimpun dana dari masyarakat dan menyalurkannya untuk kesejahteraan.</p><ul><li><b>Bank</b>: Bank Indonesia (bank sentral), bank umum, dan BPR. Simpanan dijamin <b>LPS</b>.</li><li><b>Nonbank</b>: pegadaian, asuransi, koperasi simpan pinjam, dana pensiun, pasar modal, dan perusahaan pembiayaan.</li><li><b>OJK</b> (Otoritas Jasa Keuangan) mengawasi lembaga keuangan.</li></ul><p><b>Manfaat</b>: tempat menyimpan uang yang aman, sumber modal usaha, memperlancar transaksi, dan membantu pemerataan kesejahteraan. Pastikan memakai lembaga yang legal dan diawasi OJK.</p>","ex":"<ul><li>Petani di desa terpencil meminjam modal dari koperasi untuk membeli benih.</li><li>Tol laut menurunkan harga barang di pulau terpencil.</li></ul>","cmp":"<ul><li><b>Bank</b> menerima simpanan dan memberi kredit; <b>nonbank</b> seperti pegadaian memberi pinjaman dengan gadai.</li></ul>","mis":"<ul><li>Mengira pembangunan sudah merata.</li><li>Menganggap koperasi sebagai bank.</li><li>Memakai pinjaman daring tanpa izin OJK.</li></ul>","p":[["Bank sentral Indonesia?",["Bank Indonesia","BRI","BNI","Mandiri"],"BI."],["Pegadaian termasuk lembaga…",["Keuangan nonbank","Bank sentral","Bank umum","BPR"],"Nonbank."],["Lembaga pengawas jasa keuangan?",["OJK","LPS","BPS","BMKG"],"OJK."],["Daerah terdepan, terluar, tertinggal disebut…",["3T","2T","4T","5T"],"3T."]],"e":[["Penyebab kesenjangan pembangunan?",["Kondisi kepulauan dan pembangunan terpusat","Hujan","Cuaca saja","Zona waktu"],"Geografis."],["Upaya pemerataan?",["Infrastruktur dan dana desa","Menutup desa","Menghapus sekolah","Menaikkan pajak"],"Pembangunan."],["Fungsi bank?",["Menghimpun dan menyalurkan dana","Menanam padi","Menambang emas","Membuat peta"],"Fungsi utama."],["Simpanan di bank dijamin…",["LPS","OJK","BPS","BI saja"],"LPS."],["Contoh lembaga keuangan nonbank?",["Asuransi","BPR","Bank umum","Bank sentral"],"Asuransi."],["Manfaat lembaga keuangan?",["Modal usaha dan penyimpanan yang aman","Menambah utang selalu","Menutup usaha","Menghilangkan uang"],"Manfaat."],["Tol laut dibangun untuk…",["Menurunkan harga barang di pulau terpencil","Menambah macet","Mengurangi kapal","Menutup pelabuhan"],"Pemerataan."],["Pinjaman daring yang aman harus…",["Terdaftar dan diawasi OJK","Anonim","Tanpa izin","Tanpa kontrak"],"Legal."],["Koperasi simpan pinjam termasuk…",["Lembaga keuangan nonbank","Bank sentral","Bank umum","BPR"],"Nonbank."],["Daerah 3T membutuhkan perhatian karena…",["Infrastruktur dan layanan terbatas","Terlalu maju","Terlalu padat","Terlalu kaya"],"Tertinggal."]]},"D.0.6":{"k":8,"g":"Menjelaskan penyebab, bentuk, dampak, dan cara penanganan konflik sosial.","core":"<p><b>Konflik sosial</b> adalah pertentangan antarindividu atau kelompok yang ingin menyingkirkan lawannya.</p><p><b>Penyebab</b>: perbedaan individu (pendirian dan perasaan), perbedaan <b>kepentingan</b> (ekonomi atau politik), perbedaan <b>budaya</b>, dan <b>perubahan sosial</b> yang terlalu cepat. Prasangka dan ketidakadilan memperburuknya.</p><p><b>Dampak positif</b>: memperkuat solidaritas kelompok dan mendorong perubahan. <b>Dampak negatif</b>: korban jiwa dan harta, rusaknya fasilitas, trauma, dan perpecahan.</p><p><b>Penanganan (bentuk akomodasi)</b>: <b>negosiasi/kompromi</b> (masing-masing mengalah), <b>mediasi</b> (pihak ketiga netral memberi saran), <b>arbitrasi</b> (pihak ketiga memutuskan dan keputusannya mengikat), <b>konsiliasi</b> (mempertemukan pihak berselisih), serta <b>toleransi</b> dan <b>ajudikasi</b> (lewat pengadilan).</p>","ex":"<ul><li>Dua desa berebut batas lahan lalu dimediasi kepala kecamatan.</li><li>Dua kelompok pelajar bentrok lalu didamaikan guru dan orang tua.</li></ul>","cmp":"<ul><li><b>Mediasi</b> pihak ketiga hanya menyarankan; <b>arbitrasi</b> pihak ketiga memutuskan dan mengikat.</li></ul>","mis":"<ul><li>Mengira konflik selalu berupa kekerasan fisik.</li><li>Menyamakan mediasi dan arbitrasi.</li><li>Mengira konflik pasti tidak ada manfaat sama sekali.</li></ul>","p":[["Pihak ketiga netral yang memberi saran?",["Mediasi","Arbitrasi","Koersi","Stalemate"],"Mediasi."],["Pihak ketiga yang memutuskan dan mengikat?",["Arbitrasi","Mediasi","Kompromi","Toleransi"],"Arbitrasi."],["Konflik karena perbedaan budaya termasuk penyebab…",["Perbedaan budaya","Perbedaan cuaca","Perbedaan zona","Perbedaan harga"],"Budaya."],["Dampak negatif konflik?",["Korban dan kerusakan","Solidaritas saja","Perdamaian","Kemakmuran"],"Kerugian."]],"e":[["Kompromi berarti…",["Masing-masing pihak mengalah","Satu menang mutlak","Perang","Tidak bertemu"],"Mengalah."],["Perubahan sosial yang terlalu cepat dapat memicu…",["Konflik","Kerja sama otomatis","Pajak","Cuaca"],"Konflik."],["Dampak positif konflik?",["Solidaritas kelompok meningkat","Korban jiwa","Trauma","Kerusakan"],"Solidaritas."],["Konsiliasi berarti…",["Mempertemukan pihak berselisih","Memutuskan perkara","Menghukum","Mengusir"],"Mempertemukan."],["Ajudikasi dilakukan melalui…",["Pengadilan","Pasar","Sekolah","Rumah ibadah"],"Pengadilan."],["Penyebab konflik dari perbedaan kepentingan?",["Rebutan sumber daya atau kekuasaan","Hujan","Gempa","Cuaca"],"Kepentingan."],["Prasangka buruk memengaruhi konflik dengan cara…",["Memperburuk hubungan","Menyelesaikan","Menghapus","Tak berpengaruh"],"Memperburuk."],["Dua desa berebut batas lahan lalu dimediasi. Tujuannya…",["Menghentikan konflik secara damai","Memperbesar masalah","Menutup desa","Memindah penduduk"],"Damai."],["Perbedaan pendirian dan perasaan antarindividu adalah penyebab dari…",["Perbedaan individu","Perubahan cuaca","Letak geologis","Zona waktu"],"Individu."],["Cara terbaik menangani konflik di sekolah?",["Dialog dan mediasi guru","Saling balas","Diam saja","Mengeluarkan siswa tanpa dialog"],"Damai."]]},"D.0.7":{"k":8,"g":"Menjelaskan integrasi sosial, faktor pendorong dan penghambatnya, serta upaya mewujudkannya.","core":"<p><b>Integrasi sosial</b> adalah proses menyatukan unsur-unsur masyarakat yang berbeda menjadi satu kesatuan yang serasi. Bentuknya antara lain <b>asimilasi</b> dan <b>akulturasi</b>.</p><p><b>Faktor pendorong</b>: sikap <b>toleransi</b>, kesempatan yang seimbang dalam bidang ekonomi, kesamaan nilai dan budaya, saling menghargai, dan adanya musuh bersama. <b>Faktor penghambat</b>: kurang berbaur, prasangka, sikap <b>etnosentrisme</b> (menganggap budaya sendiri paling baik), dan ketimpangan ekonomi.</p><p><b>Perekat bangsa</b>: <b>empat pilar kebangsaan</b>, yaitu <b>Pancasila, UUD 1945, NKRI, dan Bhinneka Tunggal Ika</b>.</p><p><b>Upaya mewujudkan integrasi</b>: dialog antarkelompok, gotong royong, pendidikan yang menanamkan toleransi, pemerataan pembangunan, dan menjaga bahasa persatuan.</p>","ex":"<ul><li>Warga beragam agama bergotong royong membersihkan kampung: integrasi.</li><li>Seseorang menganggap adatnya paling benar dan menolak yang lain: etnosentrisme.</li></ul>","cmp":"<ul><li><b>Integrasi</b> menyatukan, <b>disintegrasi</b> memecah.</li></ul>","mis":"<ul><li>Mengira integrasi berarti menyeragamkan semua budaya.</li><li>Mengira cukup dilakukan pemerintah.</li><li>Menyebut tiga pilar saja.</li></ul>","p":[["Proses menyatukan unsur berbeda menjadi satu?",["Integrasi sosial","Disintegrasi","Konflik","Isolasi"],"Integrasi."],["Menganggap budaya sendiri paling baik?",["Etnosentrisme","Toleransi","Akulturasi","Asimilasi"],"Etnosentrisme."],["Salah satu pilar kebangsaan?",["Pancasila","APBN","Zona waktu","ASEAN"],"Empat pilar."],["Faktor pendorong integrasi?",["Toleransi","Prasangka","Diskriminasi","Ketimpangan"],"Toleransi."]],"e":[["Empat pilar kebangsaan?",["Pancasila, UUD 1945, NKRI, Bhinneka Tunggal Ika","Pancasila, ASEAN, PBB, APBN","UUD, BI, OJK, LPS","Merdeka, Bhinneka, PBB, WTO"],"Empat pilar."],["Faktor penghambat integrasi?",["Prasangka dan etnosentrisme","Toleransi","Gotong royong","Dialog"],"Penghambat."],["Upaya mewujudkan integrasi?",["Dialog dan gotong royong","Saling curiga","Memisahkan kelompok","Menutup diri"],"Upaya."],["Bentuk integrasi sosial?",["Asimilasi dan akulturasi","Konflik dan persaingan","Kontravensi","Boikot"],"Dua bentuk."],["Mengapa pemerataan pembangunan mendukung integrasi?",["Mengurangi kecemburuan antardaerah","Menambah kesenjangan","Memecah bangsa","Menaikkan prasangka"],"Keadilan."],["Musuh bersama dapat mendorong…",["Persatuan","Perpecahan","Isolasi","Konflik internal"],"Persatuan."],["Pendidikan toleransi berguna untuk…",["Menanamkan sikap saling menghargai","Membenci","Memisahkan","Memaksa"],"Toleransi."],["Integrasi tidak berarti…",["Menyeragamkan semua budaya","Bersatu dalam perbedaan","Gotong royong","Saling menghargai"],"Bhinneka."],["Warga berbeda agama bergotong royong. Ini contoh…",["Integrasi sosial","Disintegrasi","Konflik","Etnosentrisme"],"Persatuan."],["Bahasa persatuan Indonesia berperan sebagai…",["Perekat bangsa","Pemisah suku","Penghalang","Pembatas"],"Perekat."]]},"D.1.0":{"k":8,"g":"Menjelaskan kondisi ekonomi Indonesia pada awal kemerdekaan dan kebijakan pemerintah mengatasinya.","core":"<p>Setelah proklamasi, ekonomi Indonesia sangat sulit: <b>inflasi tinggi</b> karena beredar tiga jenis mata uang (uang Jepang, uang Belanda/NICA, dan uang De Javasche Bank), <b>blokade ekonomi Belanda</b> yang menutup jalur ekspor-impor, serta kas negara kosong dan infrastruktur rusak.</p><p><b>Kebijakan pemerintah</b></p><ul><li><b>Oeang Republik Indonesia (ORI)</b> diterbitkan 30 Oktober 1946 sebagai mata uang sah.</li><li><b>Gunting Syafruddin</b> (1950): uang digunting menjadi dua, bagian kiri berlaku sebagai alat bayar dan bagian kanan menjadi obligasi, untuk menekan inflasi.</li><li><b>Program Benteng</b> (1950, Sumitro Djojohadikusumo): membantu pengusaha pribumi agar kuat.</li><li><b>Nasionalisasi De Javasche Bank</b> (1951) menjadi Bank Indonesia.</li></ul><p>Pada masa Demokrasi Liberal ekonomi tidak stabil, pemerintah sering berganti, dan inflasi tinggi berlanjut hingga akhir Orde Lama.</p>","ex":"<ul><li>Pedagang bingung memakai uang karena ada tiga mata uang yang beredar.</li><li>Gunting Syafruddin memotong nilai uang untuk mengurangi uang beredar.</li></ul>","cmp":"<ul><li><b>ORI</b> membuat mata uang nasional, <b>Gunting Syafruddin</b> menekan inflasi, <b>Program Benteng</b> menguatkan pengusaha pribumi.</li></ul>","mis":"<ul><li>Mengira ekonomi stabil begitu merdeka.</li><li>Menukar Gunting Syafruddin dan Program Benteng.</li><li>Menyamakan ORI dengan uang Jepang.</li></ul>","p":[["ORI diterbitkan pada…",["30 Oktober 1946","17 Agustus 1945","1 Juni 1945","28 Oktober 1928"],"1946."],["Penyebab inflasi awal kemerdekaan?",["Beredar tiga mata uang","Harga murah","Panen berlebih","Terlalu banyak bank"],"Tiga mata uang."],["Kebijakan menguatkan pengusaha pribumi?",["Program Benteng","Gunting Syafruddin","Sanering","ORI"],"Benteng."],["Gunting Syafruddin dilakukan tahun…",["1950","1946","1965","1998"],"1950."]],"e":[["Tiga mata uang yang beredar awal merdeka?",["Jepang, NICA/Belanda, De Javasche Bank","Rupiah, dolar, yen","ORI, euro, rupiah","Poundsterling, franc, mark"],"Tiga jenis."],["Blokade ekonomi Belanda bertujuan…",["Melumpuhkan perdagangan Indonesia","Membantu ekspor","Menurunkan inflasi","Menambah devisa"],"Menutup jalur dagang."],["Gunting Syafruddin membagi uang menjadi…",["Alat bayar dan obligasi","Dua alat bayar","Dua obligasi","Dibuang"],"Dua bagian."],["Pencetus Program Benteng?",["Sumitro Djojohadikusumo","Syafruddin","Hatta","Soekarno"],"Sumitro."],["De Javasche Bank dinasionalisasi menjadi…",["Bank Indonesia","Bank Dunia","BRI","BNI"],"1951."],["Tujuan ORI?",["Mata uang sah nasional","Mata uang Belanda","Uang Jepang","Uang asing"],"Alat bayar sah."],["Mengapa inflasi parah di awal kemerdekaan?",["Uang beredar banyak dan barang sulit","Barang berlimpah","Upah tinggi","Pajak nol"],"Uang banyak, barang sedikit."],["Pada masa Demokrasi Liberal ekonomi…",["Tidak stabil","Sangat stabil","Selalu surplus","Bebas inflasi"],"Tidak stabil."],["Tujuan Program Benteng?",["Memperkuat pengusaha nasional","Menutup perusahaan","Menaikkan pajak","Membatasi impor saja"],"Pribumi."],["Pemerintah mengurangi uang beredar dengan memotong nilai uang. Itu…",["Gunting Syafruddin","Program Benteng","ORI","Oktroi"],"Pemotongan."]]},"D.1.1":{"k":8,"g":"Menjelaskan kebijakan ekonomi Orde Baru, Repelita, swasembada beras, serta kelebihan dan kelemahannya.","core":"<p><b>Orde Baru</b> (1966–1998) mengutamakan stabilitas politik dan pembangunan ekonomi dengan <b>Trilogi Pembangunan</b>: stabilitas nasional, pertumbuhan ekonomi, dan pemerataan pembangunan.</p><p>Awalnya pemerintah menekan inflasi (stabilisasi), lalu melaksanakan <b>Repelita</b> (Rencana Pembangunan Lima Tahun) sejak 1969: tiap lima tahun ada target pembangunan, terutama pertanian. Program pertanian: <b>Revolusi Hijau</b> (bibit unggul, pupuk, irigasi), <b>Bimas</b>, dan program <b>Keluarga Berencana</b>. Indonesia mencapai <b>swasembada beras pada 1984</b>. Penerimaan dari minyak bumi dan gas menopang pembangunan.</p><p><b>Kelebihan</b>: pertumbuhan ekonomi tinggi, inflasi terkendali, infrastruktur bertambah. <b>Kelemahan</b>: ketergantungan utang luar negeri, <b>korupsi, kolusi, nepotisme (KKN)</b>, kesenjangan, dan ekonomi yang rapuh sehingga runtuh saat krisis 1997–1998.</p>","ex":"<ul><li>Petani memakai bibit unggul dan pupuk lewat program Bimas sehingga panen padi naik.</li></ul>","cmp":"<ul><li><b>Orde Lama</b> inflasi tinggi dan tidak stabil; <b>Orde Baru</b> inflasi terkendali dan pertumbuhan tinggi, tetapi bergantung utang dan KKN.</li></ul>","mis":"<ul><li>Mengira Orde Baru tanpa kelemahan.</li><li>Mengira swasembada beras terjadi 1998.</li><li>Menukar Repelita dan Pelita VI.</li></ul>","p":[["Repelita adalah…",["Rencana Pembangunan Lima Tahun","Rencana harian","Sistem pajak","Program sekolah"],"Lima tahun."],["Swasembada beras tercapai tahun…",["1984","1945","1998","2010"],"1984."],["Masa pemerintahan Orde Baru?",["1966–1998","1945–1966","1998–sekarang","1900–1945"],"Orde Baru."],["Kelemahan ekonomi Orde Baru?",["Ketergantungan utang dan KKN","Harga stabil","Swasembada","Inflasi rendah"],"Kelemahan."]],"e":[["Trilogi Pembangunan terdiri dari…",["Stabilitas, pertumbuhan, pemerataan","Produksi, distribusi, konsumsi","Pajak, utang, subsidi","Politik, sosial, budaya"],"Tiga unsur."],["Revolusi Hijau memakai…",["Bibit unggul, pupuk, irigasi","Senjata","Mesin cetak","Satelit"],"Pertanian."],["Program pengendalian penduduk?",["Keluarga Berencana","Bimas","Repelita","Transmigrasi"],"KB."],["Penopang pembangunan selain pertanian?",["Minyak bumi dan gas","Batu es","Emas dunia","Gandum"],"Migas."],["KKN singkatan dari…",["Korupsi, kolusi, nepotisme","Kerja, kuliah, nikah","Kota, kabupaten, nasional","Kas, kredit, neraca"],"KKN."],["Mengapa ekonomi runtuh 1997–1998?",["Fondasi rapuh dan utang besar","Panen berlebih","Pajak nol","Subsidi tinggi"],"Rapuh."],["Bimas bertujuan…",["Membimbing petani meningkatkan panen","Menaikkan pajak","Mengurangi sekolah","Memusatkan industri"],"Pertanian."],["Repelita mulai dilaksanakan…",["1969","1945","1998","1957"],"1969."],["Keuntungan Orde Baru?",["Inflasi terkendali dan pertumbuhan tinggi","Tidak ada utang","Tanpa KKN","Semua merata"],"Kelebihan."],["Swasembada beras berarti…",["Kebutuhan beras tercukupi dari produksi sendiri","Mengimpor semua beras","Tidak makan nasi","Ekspor semua"],"Cukup sendiri."]]},"D.1.2":{"k":8,"g":"Menjelaskan krisis moneter 1997–1998, reformasi, dan perkembangan ekonomi masa Reformasi.","core":"<p>Pada 1997 <b>krisis moneter</b> dari Asia Tenggara melanda Indonesia: nilai rupiah anjlok, harga melonjak, bank dan perusahaan bangkrut, PHK massal, dan kemiskinan naik. Krisis berubah menjadi krisis politik, dan <b>Orde Baru berakhir pada Mei 1998</b>, dimulailah era <b>Reformasi</b>.</p><p><b>Langkah pemulihan</b>: bantuan dan program dari <b>IMF</b>, restrukturisasi dan penutupan bank bermasalah (BPPN), serta penguatan pengawasan keuangan.</p><p><b>Perubahan masa Reformasi</b>: <b>otonomi daerah</b> (daerah mengatur urusannya sendiri), <b>independensi Bank Indonesia</b> (1999), pembentukan <b>KPK</b> (2002) untuk memberantas korupsi, amendemen UUD 1945, dan kebebasan berusaha lebih luas. Ekonomi kembali tumbuh rata-rata sekitar 5% per tahun, tetapi masih ada tantangan: korupsi, ketimpangan, dan ketergantungan pada ekspor bahan mentah.</p>","ex":"<ul><li>Harga sembako naik tajam saat rupiah melemah tahun 1998.</li><li>Pemerintah daerah mengelola anggaran sendiri berkat otonomi daerah.</li></ul>","cmp":"<ul><li><b>Orde Baru</b> pemerintahan terpusat; <b>Reformasi</b> otonomi daerah dan lembaga antikorupsi.</li></ul>","mis":"<ul><li>Mengira krisis hanya soal politik.</li><li>Mengira reformasi langsung menyelesaikan semua masalah.</li><li>Menukar KPK dengan BPPN.</li></ul>","p":[["Krisis moneter melanda Indonesia tahun…",["1997–1998","1945","1965","2010"],"1997."],["Lembaga antikorupsi bentukan Reformasi?",["KPK","BPPN","OJK","LPS"],"KPK."],["Orde Baru berakhir…",["Mei 1998","Maret 1966","Agustus 1945","Oktober 1928"],"1998."],["Otonomi daerah artinya…",["Daerah mengatur urusannya sendiri","Pusat mengatur semua","Daerah merdeka","Tanpa pemerintah"],"Mengatur sendiri."]],"e":[["Ciri krisis moneter 1997?",["Rupiah anjlok dan harga melonjak","Rupiah menguat","Harga turun","Banyak lapangan kerja"],"Rupiah anjlok."],["Lembaga internasional yang membantu pemulihan?",["IMF","WHO","UNESCO","FIFA"],"IMF."],["BPPN bertugas…",["Merestrukturisasi bank bermasalah","Menumpas korupsi","Mengawasi OJK","Menerbitkan uang"],"Bank."],["Independensi Bank Indonesia terjadi tahun…",["1999","1945","1966","2020"],"1999."],["KPK dibentuk tahun…",["2002","1969","1984","1945"],"2002."],["Pertumbuhan ekonomi Reformasi rata-rata…",["Sekitar 5% per tahun","50%","0%","−10%"],"Sekitar 5%."],["Tantangan ekonomi Reformasi?",["Korupsi dan ketimpangan","Tak ada tantangan","Inflasi nol","Tanpa utang"],"Masih ada."],["Dampak krisis bagi pekerja?",["PHK massal","Kenaikan gaji","Libur panjang","Lapangan kerja bertambah"],"PHK."],["Mengapa otonomi daerah dibentuk?",["Mendekatkan pelayanan dan pembangunan","Memusatkan kekuasaan","Menghapus daerah","Menghentikan pajak"],"Pemerataan."],["Era setelah Orde Baru disebut…",["Reformasi","Demokrasi Terpimpin","Demokrasi Liberal","Kolonial"],"Reformasi."]]},"D.1.3":{"k":8,"g":"Menjelaskan ekspor dan impor, faktor penyebab, prosedur, komoditas, devisa, dan neraca perdagangan.","core":"<p><b>Ekspor</b> adalah menjual barang atau jasa ke luar negeri. <b>Impor</b> adalah membeli dari luar negeri. Perdagangan internasional terjadi karena <b>perbedaan sumber daya alam</b>, teknologi, selera, dan kebutuhan antarnegara.</p><p><b>Prosedur ekspor</b>: eksportir mencari pembeli, sepakat dalam kontrak dan cara pembayaran (misalnya <b>L/C</b>, surat kredit), mengurus dokumen dan <b>bea cukai</b>, mengirim barang, lalu menerima pembayaran. <b>Prosedur impor</b>: importir mengurus izin, membayar, mengurus dokumen impor, membayar <b>bea masuk</b>, lalu menerima barang.</p><p><b>Komoditas</b>: ekspor Indonesia antara lain minyak kelapa sawit, batu bara, karet, dan tekstil; impor antara lain mesin, bahan bakar, dan gandum.</p><p><b>Manfaat</b>: menambah <b>devisa</b> (mata uang asing), memperluas pasar, dan memenuhi kebutuhan yang tak diproduksi sendiri. <b>Neraca perdagangan</b> membandingkan nilai ekspor dan impor: surplus bila ekspor lebih besar, defisit bila impor lebih besar.</p>","ex":"<ul><li>Indonesia menjual minyak sawit ke luar negeri dan membeli gandum untuk membuat mi dan roti.</li></ul>","cmp":"<ul><li><b>Surplus</b>: ekspor lebih besar. <b>Defisit</b>: impor lebih besar.</li></ul>","mis":"<ul><li>Menukar ekspor dan impor.</li><li>Mengira impor selalu merugikan.</li><li>Mengira devisa berupa rupiah.</li></ul>","p":[["Menjual barang ke luar negeri?",["Ekspor","Impor","Barter","Subsidi"],"Ekspor."],["Devisa adalah…",["Mata uang asing","Rupiah","Pajak","Subsidi"],"Devisa."],["Neraca dengan ekspor lebih besar?",["Surplus","Defisit","Impas","Inflasi"],"Surplus."],["Contoh komoditas ekspor Indonesia?",["Minyak sawit","Gandum","Mesin canggih","Gadget impor"],"Sawit."]],"e":[["Penyebab perdagangan internasional?",["Perbedaan SDA, teknologi, dan kebutuhan","Kesamaan hasil","Larangan","Cuaca"],"Perbedaan."],["Pihak yang melakukan ekspor?",["Eksportir","Importir","Konsumen","Bank sentral"],"Eksportir."],["L/C berfungsi sebagai…",["Jaminan pembayaran antara penjual dan pembeli","Pajak","Peta","Hukum adat"],"Surat kredit."],["Pembayaran pajak barang masuk disebut…",["Bea masuk","Bea ekspor","PPh","PBB"],"Bea masuk."],["Impor pangan seperti gandum dilakukan karena…",["Tidak cukup diproduksi sendiri","Terlalu murah","Terlalu banyak","Dilarang"],"Kebutuhan."],["Defisit neraca perdagangan berarti…",["Impor lebih besar dari ekspor","Ekspor lebih besar","Sama","Tak ada impor"],"Defisit."],["Manfaat ekspor?",["Menambah devisa","Mengurangi pasar","Menghabiskan SDA","Menutup pabrik"],"Devisa."],["Dokumen ekspor diurus melalui…",["Bea cukai","Pegadaian","OJK","LPS"],"Bea cukai."],["Komoditas impor Indonesia?",["Mesin dan bahan bakar","Minyak sawit","Karet","Batu bara"],"Impor."],["Sebuah negara membeli barang yang tidak diproduksinya. Itu…",["Impor","Ekspor","Barter","Subsidi"],"Impor."]]},"D.1.4":{"k":8,"g":"Menjelaskan alasan, bentuk, dan manfaat kerja sama ekonomi antarnegara, termasuk ASEAN, AFTA, APEC, dan WTO.","core":"<p>Negara bekerja sama karena <b>tidak ada negara yang mampu memenuhi semua kebutuhannya</b> sendiri: SDA, teknologi, dan modal berbeda, serta ingin memperluas pasar.</p><p><b>Bentuk kerja sama</b>: <b>bilateral</b> (dua negara), <b>regional</b> (satu kawasan), dan <b>multilateral</b> (banyak negara).</p><ul><li><b>ASEAN</b> (1967, Bangkok): kerja sama negara Asia Tenggara.</li><li><b>AFTA</b> (1992): kawasan perdagangan bebas ASEAN, menurunkan tarif; Masyarakat Ekonomi ASEAN (MEA) berlaku akhir 2015.</li><li><b>APEC</b> (1989): kerja sama ekonomi kawasan Asia-Pasifik.</li><li><b>WTO</b> (1995): organisasi perdagangan dunia yang mengatur perdagangan antarnegara.</li><li><b>OPEC</b>: organisasi negara pengekspor minyak.</li></ul><p><b>Manfaat</b>: pasar lebih luas, alih teknologi, menurunnya hambatan dagang, dan tambahan lapangan kerja. <b>Tantangan</b>: persaingan ketat dan ketergantungan antarnegara, sehingga produk dalam negeri perlu berdaya saing.</p>","ex":"<ul><li>Barang dari negara ASEAN masuk dengan tarif rendah karena AFTA.</li></ul>","cmp":"<ul><li><b>Bilateral</b> dua negara, <b>regional</b> satu kawasan, <b>multilateral</b> banyak negara.</li></ul>","mis":"<ul><li>Menyebut ASEAN berdiri 1945.</li><li>Mengira kerja sama ekonomi tanpa risiko.</li><li>Menukar APEC dan ASEAN.</li></ul>","p":[["ASEAN berdiri tahun…",["1967","1945","1992","1995"],"1967."],["WTO mengatur…",["Perdagangan dunia","Olahraga dunia","Pendidikan dunia","Kesehatan dunia"],"Perdagangan."],["Kerja sama dua negara disebut…",["Bilateral","Regional","Multilateral","Global"],"Bilateral."],["AFTA bertujuan…",["Perdagangan bebas ASEAN","Menutup pasar","Menaikkan tarif","Membatasi impor"],"Perdagangan bebas."]],"e":[["Mengapa negara perlu bekerja sama?",["Tidak ada negara yang bisa memenuhi semua kebutuhannya","Semua sama","Tak ada kebutuhan","Dilarang"],"Saling melengkapi."],["APEC mencakup kawasan…",["Asia-Pasifik","Eropa","Afrika","Atlantik"],"Asia-Pasifik."],["MEA berlaku akhir tahun…",["2015","1967","1992","1998"],"2015."],["OPEC adalah organisasi negara…",["Pengekspor minyak","Pengimpor gandum","Penghasil karet","Penghasil kopi"],"Minyak."],["Manfaat kerja sama ekonomi?",["Pasar luas dan alih teknologi","Pasar sempit","Teknologi hilang","Hambatan naik"],"Manfaat."],["Tantangan MEA?",["Persaingan produk antarnegara","Tak ada tantangan","Tak ada pasar","Tarif naik"],"Persaingan."],["Kerja sama banyak negara disebut…",["Multilateral","Bilateral","Lokal","Nasional"],"Multilateral."],["AFTA dibentuk tahun…",["1992","1967","1995","2015"],"1992."],["WTO berdiri tahun…",["1995","1967","1989","1992"],"1995."],["Agar bersaing di MEA, produk lokal perlu…",["Berkualitas dan berdaya saing","Mahal","Langka","Sederhana saja"],"Berdaya saing."]]},"D.1.5":{"k":8,"g":"Menjelaskan pengaruh perkembangan iptek terhadap ekonomi, peluang, dan tantangannya.","core":"<p><b>Iptek</b> (ilmu pengetahuan dan teknologi) membuat produksi lebih <b>cepat, efisien, dan murah</b>. Contohnya mesin otomatis di pabrik, aplikasi belanja daring, dan pembayaran digital. Perkembangan industri dibagi menjadi <b>Revolusi Industri 1.0–4.0</b> (mesin uap, listrik dan produksi massal, komputer dan otomatisasi, lalu digitalisasi, internet, dan kecerdasan buatan).</p><p><b>Dampak positif</b>: produktivitas naik, lahir usaha baru (<b>e-commerce</b>, transportasi daring, fintech), pasar makin luas, dan pekerjaan baru yang menuntut keterampilan digital.</p><p><b>Tantangan</b>: sebagian pekerjaan <b>tergantikan mesin</b> sehingga pekerja perlu belajar keterampilan baru; kesenjangan digital antara yang punya dan tak punya akses; serta risiko penipuan daring. Negara dengan iptek maju umumnya ekonominya lebih kuat, sehingga pendidikan dan penelitian penting.</p>","ex":"<ul><li>Petani memasarkan hasil panen lewat media sosial sehingga pembelinya makin luas.</li><li>Pabrik memakai mesin otomatis sehingga produksi lebih cepat.</li></ul>","cmp":"<ul><li><b>Revolusi Industri 4.0</b> memakai digitalisasi dan kecerdasan buatan, <b>1.0</b> memakai mesin uap.</li></ul>","mis":"<ul><li>Mengira teknologi tidak berdampak buruk.</li><li>Mengira otomatisasi menambah semua pekerjaan.</li><li>Mengira hanya pabrik yang terkena dampak iptek.</li></ul>","p":[["Revolusi Industri 1.0 ditandai…",["Mesin uap","Internet","AI","Robot"],"Mesin uap."],["Contoh usaha baru akibat iptek?",["E-commerce","Barter","Berburu","Kerja bakti"],"E-commerce."],["Dampak positif iptek?",["Produksi lebih efisien","Produksi lambat","Biaya naik","Pasar sempit"],"Efisien."],["Tantangan iptek bagi pekerja?",["Pekerjaan tergantikan mesin","Libur panjang","Gaji otomatis naik","Tak ada"],"Digantikan."]],"e":[["Iptek singkatan dari…",["Ilmu pengetahuan dan teknologi","Industri, pajak, ekonomi","Ilmu, produksi, tenaga","Investasi, pasar, kredit"],"Iptek."],["Revolusi Industri 4.0 memakai…",["Digitalisasi dan kecerdasan buatan","Mesin uap","Hanya tenaga manusia","Hanya hewan"],"4.0."],["Kesenjangan digital berarti…",["Perbedaan akses teknologi","Perbedaan cuaca","Perbedaan zona","Perbedaan jarak"],"Akses."],["Fintech berkaitan dengan…",["Layanan keuangan digital","Pertanian","Peternakan","Perikanan"],"Keuangan digital."],["Agar tidak tergeser mesin, pekerja perlu…",["Belajar keterampilan baru","Berhenti bekerja","Menolak teknologi","Menutup usaha"],"Kompetensi."],["Mengapa negara maju iptek ekonominya kuat?",["Produktivitas dan inovasi tinggi","Penduduk sedikit","Tak ada industri","Tak ada pasar"],"Iptek."],["Petani menjual lewat media sosial. Dampaknya…",["Pasar lebih luas","Pasar sempit","Harga hilang","Tak ada"],"Jangkauan luas."],["Risiko belanja daring?",["Penipuan","Selalu gratis","Barang pasti tiba","Tanpa biaya"],"Waspada."],["Mesin otomatis di pabrik menyebabkan produksi…",["Lebih cepat","Lebih lambat","Berhenti","Tak berubah"],"Efisien."],["Mengapa pendidikan penting menghadapi era digital?",["Membekali keterampilan baru","Tak perlu","Menghambat","Membatasi"],"Kompetensi."]]},"D.1.6":{"k":8,"g":"Menjelaskan dampak dinamika penduduk bagi negara serta cara mengatasinya.","core":"<p><b>Dampak</b> pertumbuhan penduduk yang cepat dan tidak merata:</p><ul><li><b>Pengangguran</b> dan kemiskinan karena lapangan kerja tidak sebanding dengan angkatan kerja.</li><li><b>Kepadatan penduduk</b> dan permukiman kumuh di kota, terutama akibat <b>urbanisasi</b>.</li><li><b>Tekanan lingkungan</b>: kebutuhan pangan dan lahan naik, hutan dan air terkuras.</li><li><b>Beban pelayanan</b> pendidikan, kesehatan, dan transportasi bertambah.</li></ul><p><b>Peluang</b>: <b>bonus demografi</b> bila penduduk usia produktif berkualitas.</p><p><b>Cara mengatasi</b></p><ul><li><b>Program Keluarga Berencana (KB)</b> menekan angka kelahiran.</li><li><b>Pemerataan penduduk</b>: transmigrasi dan pembangunan desa agar penduduk tidak menumpuk di kota.</li><li><b>Meningkatkan kualitas SDM</b> lewat pendidikan dan pelatihan.</li><li><b>Menambah lapangan kerja</b> dan mendorong wirausaha.</li></ul>","ex":"<ul><li>Banyak pemuda desa pindah ke kota tanpa keterampilan, lalu menjadi pengangguran: dampak urbanisasi.</li><li>Pelatihan kerja dan pembangunan desa mengurangi arus urbanisasi.</li></ul>","cmp":"<ul><li><b>Bonus demografi</b> peluang bila SDM berkualitas, <b>beban demografi</b> bila banyak pengangguran.</li></ul>","mis":"<ul><li>Mengira penduduk banyak selalu masalah.</li><li>Mengira KB hanya urusan pemerintah.</li><li>Mengira transmigrasi memaksa.</li></ul>","p":[["Dampak pertumbuhan penduduk cepat?",["Pengangguran dan kemiskinan","Panen naik otomatis","Tanah bertambah","Hutan bertambah"],"Dampak negatif."],["Program menekan kelahiran?",["Keluarga Berencana","Transmigrasi","Bimas","Repelita"],"KB."],["Perpindahan penduduk dari desa ke kota?",["Urbanisasi","Transmigrasi","Emigrasi","Imigrasi"],"Urbanisasi."],["Peluang jika SDM berkualitas?",["Bonus demografi","Beban demografi","Krisis","Konflik"],"Bonus demografi."]],"e":[["Mengapa pengangguran muncul?",["Lapangan kerja tidak sebanding angkatan kerja","Terlalu banyak pabrik","Upah terlalu tinggi","Terlalu sedikit penduduk"],"Tak seimbang."],["Dampak urbanisasi di kota?",["Permukiman kumuh dan padat","Kota lengang","Banyak sawah","Udara bersih selalu"],"Padat."],["Transmigrasi bertujuan…",["Memeratakan penduduk","Memusatkan penduduk","Menghapus desa","Menambah pajak"],"Pemerataan."],["Dampak bagi lingkungan?",["Tekanan pada lahan dan air","Lahan bertambah","Air melimpah","Hutan meluas"],"Tekanan."],["KB bertujuan…",["Menekan angka kelahiran","Menambah kelahiran","Menghentikan sekolah","Mengurangi pangan"],"Mengendalikan."],["Upaya meningkatkan kualitas SDM?",["Pendidikan dan pelatihan","Menutup sekolah","Menaikkan pajak","Mengurangi gizi"],"Kualitas."],["Pembangunan desa mengurangi…",["Arus urbanisasi","Lapangan kerja","Pendidikan","Produksi"],"Desa lebih maju."],["Beban pelayanan publik bertambah karena…",["Penduduk bertambah cepat","Penduduk menurun","Sekolah banyak","Rumah sakit banyak"],"Kebutuhan naik."],["Bonus demografi bermanfaat jika…",["Penduduk produktif berkualitas","Banyak pengangguran","Tak sekolah","Tak bekerja"],"Kualitas."],["Pemuda desa pindah ke kota tanpa keterampilan. Risikonya…",["Menjadi pengangguran","Langsung kaya","Dapat gaji tinggi","Tak ada risiko"],"Tanpa keterampilan."]]}};

ad2('A.0.0','<p><b>Lebih lengkap</b>: garis lintang juga dipakai membagi iklim dunia (tropis, subtropis, sedang, dingin), sedangkan garis bujur membagi zona waktu. Sebelum 1884 tiap kota mengatur waktu menurut posisi matahari setempat, dan Inggris membangun observatorium di Greenwich pada 1675 untuk membantu navigasi. Perbedaan waktu baru menjadi masalah ketika kereta api antarkota berkembang, sehingga dibutuhkan standar yang sama. Konferensi Meridian 1884 di Washington DC menetapkan Greenwich sebagai standar waktu internasional (<b>GMT</b>). Bujur dipindah 15° ke timur: waktu lebih cepat 1 jam; 15° ke barat: lebih lambat 1 jam.</p><p>Contoh lokasi relatif: Kabupaten Tana Tidung dahulu bagian Provinsi Kalimantan Timur, kini bagian Kalimantan Utara. Lokasi dekat jalan raya harga tanahnya lebih mahal tetapi kurang cocok untuk tempat tinggal karena polusi suara dan udara. Setiap lokasi punya kelebihan dan kekurangan menurut keadaan sekitarnya. Di Penajam Paser Utara harga tanah naik 5–10 kali lipat sejak 2019 (sekitar Rp100–200 juta menjadi sekitar Rp1 miliar per hektare) setelah rencana pemindahan ibu kota.</p>');
qe2('A.0.0',['Konferensi Meridian 1884 diselenggarakan di…',['Washington DC','London','Paris','Jakarta'],'Washington DC.'],['Bujur dipindah 15° ke barat, waktu menjadi…',['Lebih lambat 1 jam','Lebih cepat 1 jam','Sama','Lebih cepat 15 jam'],'Ke barat lebih lambat.'],['Selain zona waktu, garis lintang dipakai membagi…',['Iklim dunia','Batas negara','Jenis tanah','Jumlah penduduk'],'Tropis, subtropis, sedang, dingin.'],['Kabupaten Tana Tidung pindah dari Kaltim ke Kaltara. Ini contoh…',['Lokasi relatif berubah','Lokasi absolut berubah','Lintang bergeser','Zona waktu berubah'],'Lokasi relatif ikut berubah.'],['Tanah dekat jalan raya mahal tetapi kurang cocok untuk tempat tinggal karena…',['Polusi suara dan udara','Terlalu sepi','Tak ada listrik','Terlalu dekat laut'],'Kekurangan lokasi relatif.']);
ad2('A.0.1','<p>Interaksi adalah peristiwa saling memengaruhi. Karakteristik muka bumi memengaruhi mata pencaharian: kawasan pesisir menghasilkan hasil laut dan dataran tinggi menghasilkan sayuran, dan <b>jaringan jalan serta transportasi</b> memungkinkan keduanya bertukar. Basis ekonomi desa adalah pertanian (padi, jagung, sayur, buah); basis ekonomi kota adalah industri, perdagangan, dan jasa (tempat makan, pusat belanja, penatu). Pekerjaan kota heterogen karena lahan terbuka terbatas, misalnya pedagang, pencuci sepatu, dan penyedia jasa desain grafis. Di desa ruang terbuka lebih luas sehingga mampu menghasilkan pangan bagi kota. Contoh: musim kemarau petani menanam jagung, musim hujan menanam padi; karyawan kantor tidak terpengaruh cuaca karena bekerja di dalam ruangan.</p>');
qe2('A.0.1',['Interaksi pesisir dan dataran tinggi juga dipengaruhi…',['Jaringan jalan dan transportasi','Warna rumah','Jumlah sekolah','Zona waktu'],'Akses jalan memungkinkan pertukaran.'],['Contoh pekerjaan heterogen di kota?',['Pencuci sepatu dan penyedia jasa desain grafis','Hanya petani','Hanya nelayan','Hanya penambang'],'Beragam peluang kerja.'],['Karyawan kantor kurang terpengaruh cuaca karena…',['Bekerja di dalam ruangan','Tak ada hujan','Tak ada musim','Bekerja di sawah'],'Pekerjaan dalam ruangan.']);
ad2('A.0.2','<p><b>Unsur iklim</b>: <i>penyinaran matahari</i> (lamanya matahari bersinar cerah, memengaruhi fotosintesis dan menaikkan suhu), <i>suhu</i> (derajat panas atau dingin), <i>kelembapan</i> (kemampuan udara mengandung uap air), <i>angin</i> (gerak udara sejajar permukaan bumi akibat perbedaan tekanan atmosfer), <i>curah hujan</i> (intensitas turunnya butir air akibat kondensasi). Contoh cuaca: suhu di Bantul pagi ini 24°C. Contoh iklim: curah hujan tertinggi di Riau tahun 2022 terjadi pada April (417 mm).</p><p><b>Perubahan iklim</b> menurut Kementerian Lingkungan Hidup adalah berubahnya kondisi fisik atmosfer, terutama suhu dan distribusi curah hujan, yang berdampak luas. Dampaknya: siklus hujan berubah, kekeringan panjang (air langka), serta hujan intensitas tinggi yang menyebabkan banjir, terutama di perkotaan dan pesisir. Pelayaran dapat tertunda karena siklon tropis. Dampak sosial budaya: kenaikan permukaan laut dan cuaca tak menentu membuat nelayan sulit mencari ikan sehingga berpotensi kehilangan pekerjaan, dan orang sering membawa payung dan jas hujan.</p>');
qe2('A.0.2',['Lamanya matahari bersinar cerah disebut…',['Penyinaran matahari','Kelembapan','Curah hujan','Angin'],'Penyinaran matahari.'],['Gerak udara sejajar permukaan bumi akibat perbedaan tekanan?',['Angin','Awan','Hujan','Kabut'],'Angin.'],['Kemampuan udara mengandung uap air disebut…',['Kelembapan','Suhu','Angin','Penyinaran'],'Kelembapan.'],['Penundaan pelayaran dapat disebabkan oleh…',['Siklon tropis','Gempa bumi','Letusan gunung','Pasang purnama'],'Siklon tropis.'],['Hujan intensitas tinggi dan lama dapat menyebabkan…',['Banjir, terutama di perkotaan dan pesisir','Kekeringan','Salju','Gempa'],'Banjir.']);
ad2('A.0.3','<p>Jalur pegunungan Indonesia membentang dari ujung utara Sumatra melalui pantai barat Sumatra, Jawa, Nusa Tenggara, Banda, Sulawesi, hingga Halmahera. Pertemuan lempeng dapat menimbulkan patahan dan retakan kerak bumi sehingga magma mengalir ke permukaan dan terbentuk gunung berapi. Gempa bumi dapat terjadi karena tumbukan lempeng, patahan aktif, aktivitas gunung api, atau runtuhan batuan; dampaknya korban jiwa, luka, dan kerusakan bangunan. Contoh bencana: gempa Palu 2018, tsunami Aceh 2005, letusan Gunung Sinabung, dan gempa Sumatra Barat 2009 (7,6 SR).</p><p><b>Dampak positif lainnya</b>: bagian tengah Indonesia memiliki flora-fauna peralihan. Kekayaan hayati dimanfaatkan ekonomi, misalnya jamu kunyit asam dari bahan alam dan suvenir Komodo (fauna endemik NTT) yang mendorong kerajinan tangan dan wisata. Gas alam berasal dari gas metana dan endapan yang terbentuk selama jutaan tahun; mineral talk berasal dari batuan metamorf.</p>');
qe2('A.0.3',['Jalur pegunungan Indonesia membentang dari…',['Ujung utara Sumatra hingga Halmahera','Papua hingga Sumatra','Kalimantan hingga Bali','Jawa hingga Papua'],'Sesuai buku.'],['Gunung berapi terbentuk karena…',['Magma mengalir ke permukaan lewat patahan dan retakan','Hujan deras','Angin kencang','Pasang laut'],'Pertemuan lempeng.'],['Contoh pemanfaatan fauna endemik NTT?',['Suvenir Komodo dan wisata','Tambang minyak','Industri baja','Pabrik mobil'],'Ekonomi dari hayati.'],['Mineral talk berasal dari…',['Batuan metamorf','Pasir pantai','Air laut','Abu vulkanik saja'],'Batuan metamorf.'],['Penyebab gempa bumi menurut buku?',['Tumbukan lempeng, patahan aktif, aktivitas gunung api, runtuhan batuan','Hanya badai','Hanya hujan','Hanya angin'],'Beberapa penyebab.']);
ad2('A.0.4','<p>Produksi barang dibedakan menjadi <b>barang modal</b> (dipakai memproduksi lagi) dan <b>barang konsumsi</b>. Makna produksi luas: menambang minyak, menanam dan memanen padi, menjahit kain menjadi baju, mengolah tanah liat menjadi batu bata atau gerabah. <b>Empat tujuan distribusi</b>: menjadi agen penyalur dari produsen ke konsumen, agar hasil produksi dimanfaatkan maksimal, memenuhi kebutuhan barang dan jasa tertentu, dan menjaga keberlangsungan produksi perusahaan. <b>Tujuan konsumsi lain</b>: menjaga status sosial dengan produk kebutuhan tersier, menjaga kesehatan (vitamin dan gizi seimbang), memenuhi kebutuhan jasmani, rohani, dan estetika. Kenaikan harga BBM memengaruhi berbagai kegiatan ekonomi sehingga perlu penghematan BBM.</p>');
qe2('A.0.4',['Barang yang dipakai untuk memproduksi barang lain disebut…',['Barang modal','Barang konsumsi','Jasa','Limbah'],'Barang modal.'],['Mengolah tanah liat menjadi gerabah termasuk…',['Produksi','Distribusi','Konsumsi','Impor'],'Produksi.'],['Salah satu tujuan distribusi?',['Menjaga keberlangsungan produksi','Menurunkan produksi','Menghentikan konsumen','Menahan barang'],'Tujuan distribusi.'],['Membeli produk tersier demi status sosial termasuk tujuan…',['Konsumsi','Produksi','Distribusi','Investasi'],'Tujuan konsumsi.'],['Kenaikan harga BBM berdampak pada…',['Berbagai kegiatan ekonomi','Zona waktu','Curah hujan','Garis lintang'],'Biaya ekonomi.']);
ad2('A.0.5','<p>Interaksi sosial menyebabkan individu atau kelompok saling memengaruhi, dan terjadi sejak lahir (keluarga adalah lingkungan belajar pertama). Komunikasi verbal memakai <b>lisan dan tulisan</b>; nonverbal memakai simbol, gestur tubuh, dan bahasa isyarat. Arti terpenting komunikasi: seseorang menafsirkan perilaku atau informasi, lalu penerima memberi reaksi. Contoh akomodasi: ketua RT memediasi warga yang ingin membangun peternakan ayam dan warga yang menolaknya. Kerja sama menghasilkan kerukunan. Contoh persaingan: antartim sepak bola. Tawuran suporter yang menimbulkan korban jiwa termasuk pertentangan (disosiatif).</p>');
qe2('A.0.5',['Komunikasi verbal memakai…',['Lisan dan tulisan','Gestur saja','Simbol saja','Bahasa isyarat saja'],'Lisan dan tulisan.'],['Bahasa isyarat termasuk komunikasi…',['Nonverbal','Verbal','Lisan','Tulisan'],'Nonverbal.'],['Tawuran suporter dengan korban jiwa termasuk…',['Pertentangan (disosiatif)','Persaingan','Kerja sama','Akomodasi'],'Disertai kekerasan.'],['Ketua RT memediasi pro-kontra peternakan ayam. Itu…',['Akomodasi','Kontravensi','Persaingan','Konflik'],'Meredakan pertentangan.'],['Kerja sama menghasilkan…',['Kerukunan','Perpecahan','Konflik','Kecurigaan'],'Kerukunan.']);
ad2('A.0.6','<p><b>Tradisi lisan lebih sulit dianalisis</b> sejarawan karena perlu menangkap kenyataan di balik cerita dan didukung dokumen seperti arsip atau buku. Isi dongeng banyak yang tidak masuk akal dan penuh khayalan. Contoh cerita rakyat: Batu Mamberoki dan Tindawa dari Yapen, Papua. <b>Ciri cerita rakyat</b>: disebarkan lisan dari mulut ke mulut, tradisional (relatif standar antargenerasi), tiap daerah punya versi, penciptanya tidak diketahui, berpola dan berumus, berguna dalam kehidupan, punya logika sendiri, milik bersama, dan polos. <b>Nilai luhurnya</b>: keimanan, kejujuran, keadilan, kerja keras, kerendahhatian, kerja sama, keberanian, kepatuhan, kerelaan berkorban, menepati janji, tolong-menolong, saling menyayangi, dan kerukunan. Cerita rakyat perlu dilestarikan, apalagi saat minat generasi muda menurun akibat gim daring dan media sosial.</p>');
qe2('A.0.6',['Mengapa tradisi lisan lebih sulit dianalisis?',['Perlu menangkap kenyataan di balik cerita','Terlalu lengkap','Selalu tertulis','Tidak punya versi'],'Sesuai buku.'],['Batu Mamberoki dan Tindawa berasal dari…',['Yapen, Papua','Aceh','Bali','Jawa Barat'],'Contoh cerita rakyat.'],['Ciri cerita rakyat?',['Penciptanya tidak diketahui dan milik bersama','Pencipta tunggal terkenal','Tidak ada versi','Hanya tertulis'],'Ciri cerita rakyat.'],['Contoh nilai luhur cerita rakyat?',['Kejujuran dan tolong-menolong','Kekerasan','Kecurangan','Kemalasan'],'Budi pekerti.'],['Mengapa cerita rakyat perlu dilestarikan?',['Mendidik budi pekerti anak','Menggantikan sekolah','Menambah pajak','Menghapus budaya'],'Nilai luhur bangsa.']);
ad2('A.1.0','<p>Menurut buku, zaman Paleozoikum berlangsung sekitar 340 juta tahun, Mesozoikum sekitar 140 juta tahun lalu, dan Tersier sekitar 60 juta tahun lalu. Zaman Kuarter adalah zaman terpenting bagi munculnya aktivitas manusia.</p><p><b>Tambahan pencemaran</b>: pencemaran udara juga berasal dari asap pabrik peleburan logam (misalnya di Padalarang, 2022) yang mengotori rumah dan pakaian; partikel CO<sub>x</sub>, SO<sub>x</sub>, NO<sub>x</sub>, dan O<sub>x</sub> memicu asma dan bronkitis. Tanaman yang menyerap partikel beracun menurun produktivitasnya. Air sumur dapat tercemar rembesan limbah pabrik, septic tank, dan minyak. Ikan beracun yang dimakan manusia dikhawatirkan merusak saraf serta memicu kanker dan kemandulan. Pestisida dan herbisida bersifat karsinogenik dan dapat merusak otak dan ginjal; pencemaran tanah juga mengubah metabolisme mikroorganisme, memusnahkan spesies, dan mengganggu rantai makanan.</p>');
qe2('A.1.0',['Zaman yang paling penting bagi munculnya aktivitas manusia?',['Kuarter','Tersier','Mesozoikum','Arkaekum'],'Kuarter.'],['Asap pabrik peleburan logam di Padalarang mencemari…',['Udara dan lingkungan sekitar rumah','Hanya laut','Hanya salju','Hanya cahaya'],'Pencemaran udara.'],['Air sumur dapat tercemar oleh…',['Limbah pabrik, septic tank, dan minyak','Hujan saja','Angin','Embun'],'Rembesan limbah.'],['Pestisida bersifat karsinogenik artinya…',['Dapat memicu kanker dan merusak organ','Menyuburkan tanah','Menghilangkan hama selamanya','Menghijaukan daun'],'Berbahaya bagi kesehatan.'],['Pencemaran tanah dapat mengganggu…',['Rantai makanan','Zona waktu','Letak astronomis','Jam digital'],'Ekosistem terganggu.']);
ad2('A.1.1','<p>Perubahan sosial sering membuat keteraturan sosial tidak berjalan semestinya. Contoh dinamika sosial lain: ibu rumah tangga menjadi pegawai. Budaya membentuk cara individu memandang dunia (budaya Barat, Timur Tengah, Korea Selatan), dan cara hidup tiap budaya tampak “normal” bagi pemiliknya. Contoh culture shock: orang dari Sumatra Barat menganggap adat pernikahan Jawa tampak aneh; pola asuh keluarga pesisir Sulawesi berbeda dengan keluarga pedalaman Papua. Mengenal aturan tidak tertulis membuat orang merasa aman dan “normal”.</p>');
qe2('A.1.1',['Perubahan sosial dapat membuat…',['Keteraturan sosial tidak berjalan semestinya','Masyarakat tak berubah','Semua orang sama','Tak ada interaksi'],'Sesuai buku.'],['Ibu rumah tangga menjadi pegawai termasuk…',['Dinamika sosial','Bencana alam','Eutrofikasi','Zaman geologi'],'Perubahan status.'],['Pola asuh anak berbeda antardaerah menunjukkan…',['Perilaku dipelajari dari adat setempat','Perilaku turunan','Pengaruh cuaca','Pengaruh gempa'],'Perilaku dipelajari.']);
ad2('A.1.2','<p><b>Pelestarian lingkungan hidup</b> adalah upaya menjaga kondisi lingkungan dengan meningkatkan daya dukungnya agar SDA dapat mendukung kehidupan secara berkesinambungan. Efek gas karbon berupa pencairan es di kutub utara dan pemanasan global. Pemerintah mengendalikan emisi buang kendaraan pribadi, dan pohon memproduksi oksigen sehingga udara lebih bersih. Pelajar dapat tidak merokok, tidak membakar sampah, menanam pohon, dan memakai transportasi umum. Pelestarian air berarti <b>memelihara dan melindungi sumber air</b>. Swasembada beras pada era Presiden Soeharto memakai pupuk kimia berlebihan sehingga tanah menjadi kurang produktif. Pelestarian tanah berarti melindungi, memperbaiki, dan meningkatkan produktivitas tanah; bioremediasi mengubah zat pencemar menjadi tidak beracun; kurangi kemasan plastik dan pakai barang yang dapat dipakai ulang.</p>');
qe2('A.1.2',['Pelestarian lingkungan bertujuan menjaga…',['Daya dukung lingkungan agar berkesinambungan','Harga barang','Zona waktu','Curah hujan'],'Sesuai buku.'],['Efek gas karbon bagi kutub utara?',['Pencairan es','Es makin tebal','Hujan salju lebat','Tidak ada'],'Pencairan es.'],['Pelestarian sumber daya tanah mencakup…',['Melindungi, memperbaiki, dan meningkatkan produktivitas','Membakar lahan','Menambah plastik','Membuang limbah'],'Tiga langkah.'],['Bioremediasi mengubah zat pencemar menjadi…',['Bahan tidak beracun','Lebih beracun','Gas','Es'],'Mendegradasi pencemar.']);
ad2('B.0.0','<p>Aktivitas nelayan di Indonesia dipengaruhi iklim tropis dan arus laut. Contoh kawasan: <b>hutan lindung</b> Bukit Putri Pencit (Tuban), <b>cagar alam</b> Telaga Renjeng, <b>suaka margasatwa</b> Baluran. Hasil tambang tersebar di berbagai wilayah Indonesia dan pemanfaatannya melalui tahapan yang perlu diikuti pemulihan lahan. Contoh nelayan tradisional: Banyuwangi; nelayan modern: Pelabuhan Balohan, Aceh. Pembangkit listrik tenaga ombak (misalnya Pelamis di Portugal) adalah sumber energi terbarukan. Pertambahan populasi memengaruhi kerusakan lingkungan, dan eksploitasi hutan menyebabkan kerusakan hutan.</p>');
