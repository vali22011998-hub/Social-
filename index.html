<script>
// ===== DATA =====
const C=[
['A','Kelas 7 · Semester 1','Target: memahami lingkungan sekitar, kegiatan ekonomi, interaksi sosial, sejarah, dan kebutuhan manusia (Buku IPS Kemendikbud Kelas VII, Tema I-II).',[['Tema I · Kehidupan Sosial & Kondisi Lingkungan',['Mengenal lokasi tempat tinggal','Konektivitas antarruang','Perubahan iklim','Potensi bencana alam','Kegiatan ekonomi','Interaksi sosial','Konsep dasar ilmu sejarah']],['Tema II · Keberagaman Lingkungan Sekitar',['Alam & pencemaran lingkungan','Dinamika sosial & budaya','Melestarikan lingkungan','Manusia zaman praaksara','Kebutuhan, kelangkaan & SDGs']]]],
['B','Kelas 7 · Semester 2','Target: memahami potensi ekonomi lingkungan, struktur sosial, keragaman budaya, keuangan, dan pemberdayaan masyarakat (Tema III-IV).',[['Tema III · Potensi Ekonomi Lingkungan',['Pemanfaatan sumber daya alam','Potensi Indonesia menjadi negara maju','Toponimi','Pelaku ekonomi & pasar','Permintaan, penawaran & harga','Status & peran sosial','Sosialisasi, nilai & norma']],['Tema IV · Pemberdayaan Masyarakat',['Keragaman sosial budaya','Sejarah lokal & keteladanan tokoh','Permasalahan lingkungan & budaya','Uang & pengelolaan keuangan','Menabung, lembaga keuangan & ekonomi digital','Komunitas & pemberdayaan masyarakat','Hukum adat & pahlawan nasional']]]],
['C','Kelas 8 · Semester 1','Target: memahami kondisi geografis, SDA dan SDM, lembaga sosial, kerajaan Hindu-Buddha dan Islam, ekonomi dan kependudukan (Buku IPS Kemendikbud Kelas VIII, Tema 1-2).',[['Tema 1 · Kondisi Geografis & Pelestarian SDA',['Letak geografis & iklim Indonesia','Geografi dan keragaman sosial budaya','Potensi & pemanfaatan SDA','Sumber daya manusia','Lembaga sosial & norma','Peran lembaga sosial','Interaksi dengan bangsa asing','Hindu-Buddha di Nusantara']],['Tema 2 · Kemajemukan Masyarakat Indonesia',['Pengaruh cuaca & iklim','Bentuk muka bumi','Aktivitas ekonomi & lingkungan','Perdagangan antarpulau','Dinamika penduduk','Keragaman masyarakat','Mobilitas sosial','Interaksi budaya Islam']]]],
['D','Kelas 8 · Semester 2','Target: memahami penjajahan, pergerakan kebangsaan, kemerdekaan, lembaga keuangan, konflik dan integrasi, serta pembangunan ekonomi (Buku IPS Kemendikbud Kelas VIII, Tema 3-4).',[['Tema 3 · Nasionalisme & Jati Diri Bangsa',['Penjelajahan samudra','Kolonialisme & imperialisme','Perubahan akibat penjajahan Barat & Jepang','Organisasi pergerakan','Proses kemerdekaan','Pemerataan pembangunan & lembaga keuangan','Konflik sosial','Integrasi sosial']],['Tema 4 · Pembangunan Perekonomian Indonesia',['Ekonomi awal kemerdekaan','Ekonomi Orde Baru','Ekonomi masa Reformasi','Ekspor dan impor','Kerja sama ekonomi antarnegara','Iptek dan ekonomi','Dampak dinamika penduduk']]]],
['E','Kelas 9 · Semester 1','Target: memahami pergerakan nasional dan kemerdekaan.',[['Bab 9 · Pergerakan Nasional',['Organisasi pergerakan','Sumpah Pemuda']],['Bab 10 · Kemerdekaan',['Proklamasi 17 Agustus 1945']]]],
['F','Kelas 9 · Semester 2','Target: memahami globalisasi dan ekonomi dunia.',[['Bab 11 · Globalisasi',['Globalisasi & dampaknya']],['Bab 12 · Ekonomi Global',['Kerja sama ekonomi global']]]]];
const R=(a,b)=>`<ruby>${a}<rt>${b}</rt></ruby>`;
const T=(n,rows)=>`<div class=t><table>${rows.map(r=>'<tr>'+r.map(x=>`<td class=jp>${x}</td>`).join('')+'</tr>').join('')}</table></div>`;
const CT={"A.0.0":{"k":8,"g":"Menentukan lokasi absolut dan relatif, memahami garis lintang dan bujur, serta menghitung perbedaan waktu antar zona.","core":"<p>Setiap tempat di Bumi punya \"alamat\". Ada dua cara menyebutkannya.</p><p><b>1. Lokasi absolut</b>: letak yang pasti dan tidak berubah, ditulis dengan koordinat <b>garis lintang</b> dan <b>garis bujur</b>. Indonesia berada di 6°LU–11°LS dan 95°BT–141°BT.</p><ul><li><b>Garis lintang</b> mengukur posisi utara–selatan. Patokannya <b>khatulistiwa</b> (0°). Di utara disebut LU, di selatan LS.</li><li><b>Garis bujur</b> mengukur posisi timur–barat. Patokannya garis nol di <b>Greenwich</b>, Inggris. Di timur disebut BT, di barat BB.</li></ul><p><b>2. Lokasi relatif</b>: letak yang dilihat dari keadaan sekitarnya, misalnya \"di dekat pasar\" atau \"di tepi jalan raya\". Karena bergantung pada lingkungan, lokasi relatif <b>bisa berubah</b> (misalnya setelah dibangun jalan tol, tempat itu menjadi lebih mudah dijangkau).</p><p><b>3. Zona waktu</b>: Bumi berputar, sehingga matahari tiba di tiap daerah pada saat berbeda. Tahun 1884 Konferensi Meridian menetapkan Greenwich sebagai acuan waktu dunia. Setiap <b>15° bujur = beda 1 jam</b>, dan makin ke timur waktunya makin cepat. Indonesia punya tiga zona: WIB (GMT+7), WITA (GMT+8), dan WIT (GMT+9).</p><p><b>Peta digital</b> memudahkan hidup: transportasi daring menemukan penjemput terdekat, perusahaan ekspedisi menghitung biaya dari jarak, undangan digital menampilkan lokasi lewat barcode, dan aplikasi menyarankan rute tercepat sesuai kepadatan lalu lintas. Lokasi relatif juga memengaruhi nilai tanah: harga tanah di sekitar rencana Ibu Kota Nusantara naik tajam karena lokasinya menjadi strategis.</p>","ex":"<ul><li>Absolut: Jakarta berada di sekitar 6°LS dan 107°BT.</li><li>Relatif: \"Rumah Rina dua rumah dari masjid, seberang SMP.\" Jika SMP pindah, petunjuk ini tidak berlaku lagi.</li><li>Waktu: pukul 12.00 WIB di Jakarta berarti 13.00 WITA di Makassar dan 14.00 WIT di Jayapura. Siaran langsung pukul 19.00 WIB ditonton pukul 20.00 WITA di Makassar.</li></ul>","cmp":"<ul><li><b>Absolut</b>: pasti, berupa koordinat, tidak berubah. <b>Relatif</b>: bergantung sekitar, bisa berubah.</li><li><b>Lintang</b>: utara–selatan, patokan khatulistiwa. <b>Bujur</b>: timur–barat, patokan Greenwich.</li></ul>","mis":"<ul><li>Menganggap lokasi relatif tidak pernah berubah.</li><li>Menukar lintang dan bujur. Ingat: lintang = utara–selatan, bujur = timur–barat.</li><li>Mengira zona waktu dibagi berdasarkan garis lintang. Yang benar: garis bujur.</li></ul>","p":[["Letak yang pasti dan ditulis dengan koordinat disebut…",["Lokasi absolut","Lokasi relatif","Lokasi sementara","Lokasi sosial"],"Koordinat lintang-bujur = lokasi absolut."],["Garis lintang mengukur posisi…",["Utara–selatan dari khatulistiwa","Timur–barat dari Greenwich","Tinggi dari laut","Jarak ke ibu kota"],"Lintang mengukur utara–selatan."],["Titik nol garis bujur berada di…",["Greenwich","Jakarta","Khatulistiwa","Makassar"],"Greenwich, Inggris."],["\"Rumah dekat pasar\" adalah contoh lokasi…",["Relatif","Absolut","Astronomis","Koordinat"],"Berdasar keadaan sekitar = relatif."]],"e":[["Letak absolut Indonesia menurut buku?",["6°LU–11°LS dan 95°BT–141°BT","0°–10°LU","11°LU–6°LS","141°BT–180°BT"],"Sesuai buku."],["Garis 0° lintang disebut…",["Khatulistiwa","Greenwich","Meridian","Kutub"],"0° lintang = khatulistiwa."],["Mengapa lokasi relatif bisa berubah?",["Lingkungan sekitarnya berubah","Koordinatnya bergeser","Bumi berhenti berputar","Garis bujur pindah"],"Lokasi relatif bergantung sekitarnya."],["Garis yang dipakai membagi zona waktu?",["Garis bujur","Garis lintang","Garis pantai","Garis batas negara"],"Zona waktu dibagi per bujur."],["Beda 1 jam setara berapa derajat bujur?",["15°","10°","30°","5°"],"360° : 24 jam = 15° per jam."],["Pukul 12.00 WIB; di Jayapura (WIT) pukul…",["14.00","13.00","12.00","11.00"],"WIT = WIB + 2 jam."],["Makin ke timur, waktu setempat makin…",["Cepat","Lambat","Sama","Mundur satu hari"],"Makin ke timur makin cepat."],["Konferensi Meridian 1884 menetapkan…",["Greenwich sebagai acuan waktu dunia","Jakarta sebagai pusat waktu","Kalender baru","Batas samudra"],"Greenwich dipilih sebagai acuan."],["Toko A dijelaskan \"di sebelah bank\". Bank pindah, penjelasan itu tak berlaku. Ini menunjukkan…",["Lokasi relatif dapat berubah","Lokasi absolut berubah","Lintang bergeser","Zona waktu berubah"],"Petunjuk relatif ikut berubah bersama lingkungan."],["Pertandingan dimulai 19.00 WIB. Penonton di Makassar (WITA) menonton pukul…",["20.00 WITA","19.00 WITA","18.00 WITA","21.00 WITA"],"WITA = WIB + 1 jam."],["Harga tanah di dekat rencana ibu kota baru melonjak. Ini dipengaruhi lokasi…",["Relatif","Absolut","Astronomis","Koordinat"],"Nilai tanah dipengaruhi lingkungan sekitar (lokasi relatif)."],["Peta digital membantu ekspedisi menghitung…",["Estimasi biaya dan waktu pengiriman","Jumlah penduduk","Curah hujan","Jenis tanah"],"Berdasarkan jarak."],["Undangan digital menampilkan lokasi lewat…",["Barcode peta digital","Surat kabar","Radio","Kompas"],"Barcode terhubung ke peta."]]},"A.0.1":{"k":8,"g":"Menjelaskan mengapa wilayah saling berinteraksi, tiga faktor interaksi menurut Edward Ullman, serta perbedaan desa dan kota.","core":"<p><b>Konektivitas antarruang</b> adalah keterhubungan dan interaksi antarwilayah, misalnya desa–kota atau pulau–pulau.</p><p><b>Mengapa wilayah saling berinteraksi?</b> Karena setiap wilayah punya potensi dan kebutuhan yang berbeda. Desa menghasilkan beras dan sayur, kota menghasilkan barang industri dan jasa. Keduanya saling membutuhkan.</p><p><b>Tiga faktor interaksi wilayah (Edward Ullman)</b></p><ul><li><b>Wilayah saling melengkapi</b>: wilayah A kelebihan sesuatu yang dibutuhkan B, dan sebaliknya.</li><li><b>Kesempatan berintervensi</b>: jika ada wilayah C yang bisa memenuhi kebutuhan B dengan lebih dekat atau murah, B tidak lagi bergantung pada A.</li><li><b>Kemudahan pemindahan dalam ruang</b>: diukur dari jarak, biaya, dan transportasi. Makin dekat, murah, dan lancar, makin mudah terjadi interaksi.</li></ul><p><b>Ciri desa dan kota</b>: desa umumnya agraris, pekerjaan warga seragam (homogen), jumlah penduduk rendah, dan sangat dipengaruhi cuaca. Kota umumnya bergerak di industri, perdagangan, dan jasa, pekerjaan beragam (heterogen), padat, dan kurang bergantung pada cuaca.</p><p><b>Rumah dan tempat kerja</b>: di desa biasanya dekat (rumah dekat sawah); di kota sering berjauhan karena kegiatan ekonomi terpusat dan sewa tempat tinggal mahal. <b>Kepadatan</b>: kota lebih padat karena banyak perantau, desa kurang padat karena banyak penduduk bekerja ke luar desa. Ruang terbuka desa lebih luas karena lahan banyak dipakai untuk pertanian.</p>","ex":"<ul><li>Brebes menghasilkan bawang merah dan Wonosobo menghasilkan kentang. Keduanya saling mengirim hasil: wilayah saling melengkapi.</li><li>Pedagang di kota B biasa membeli sayur dari desa A. Lalu desa C yang lebih dekat menjual lebih murah, sehingga B beralih ke C: kesempatan berintervensi.</li><li>Dibangunnya jalan tol memperpendek waktu tempuh dan menurunkan biaya angkut: kemudahan pemindahan dalam ruang.</li></ul>","cmp":"<ul><li><b>Desa</b>: agraris, homogen, jarang penduduk, cuaca sangat berpengaruh.</li><li><b>Kota</b>: industri/dagang/jasa, heterogen, padat, cuaca kurang berpengaruh.</li></ul>","mis":"<ul><li>Mengira interaksi wilayah hanya soal jarak. Ada tiga faktor.</li><li>Menukar ciri desa dan kota.</li><li>Mengira intervensi berarti perang. Maksudnya ada wilayah lain yang bisa memenuhi kebutuhan.</li></ul>","p":[["Siapa perumus tiga faktor interaksi wilayah?",["Edward Ullman","Greenwich","Adam Smith","Auguste Comte"],"Edward Ullman."],["Brebes dan Wonosobo saling mengirim hasil tani: wilayah yang…",["Saling melengkapi","Berintervensi","Terisolasi","Berkonflik"],"Saling melengkapi kebutuhan."],["Mata pencaharian desa umumnya…",["Agraris","Industri besar","Jasa keuangan","Perbankan"],"Desa umumnya agraris."],["Jarak, biaya, dan transportasi termasuk faktor…",["Kemudahan pemindahan dalam ruang","Saling melengkapi","Kesempatan berintervensi","Komunikasi"],"Itulah kemudahan pemindahan."]],"e":[["Wilayah berinteraksi karena…",["Potensi dan kebutuhannya berbeda","Potensinya sama","Jaraknya dekat saja","Agamanya berbeda"],"Perbedaan potensi dan kebutuhan."],["Pekerjaan warga desa umumnya…",["Seragam (homogen)","Sangat beragam","Hanya jasa","Hanya industri"],"Desa cenderung homogen."],["Yang dipengaruhi cuaca paling besar?",["Petani di desa","Karyawan bank di kota","Pegawai kantor","Pemilik toko online"],"Pertanian sangat bergantung cuaca."],["Kota B beralih membeli sayur dari desa C yang lebih dekat. Ini…",["Kesempatan berintervensi","Saling melengkapi","Kemudahan pemindahan","Akulturasi"],"C mengintervensi hubungan A–B."],["Jalan tol memudahkan interaksi karena…",["Menurunkan jarak tempuh dan biaya","Menambah penduduk","Menghapus desa","Menaikkan harga"],"Jarak dan biaya berkurang."],["Ciri kota yang benar?",["Padat dan pekerjaan beragam","Seluruh warga petani","Jarang penduduk","Sangat bergantung cuaca"],"Kota padat dan heterogen."],["Kegiatan utama kota umumnya…",["Industri, perdagangan, jasa","Bertani padi","Berburu","Menangkap ikan"],"Sesuai ciri kota."],["Wilayah A kelebihan beras dan butuh garam; B sebaliknya. Ini…",["Saling melengkapi","Berintervensi","Terisolasi","Berkonflik"],"Saling memenuhi kebutuhan."],["Mengapa harga sayur di kota lebih mahal saat transportasi sulit?",["Biaya angkut naik","Sayur melimpah","Penduduk berkurang","Cuaca cerah"],"Transportasi sulit menaikkan biaya pemindahan."],["Desa memasok beras ke kota, kota memasok barang industri ke desa. Ini menunjukkan…",["Konektivitas dan saling ketergantungan","Persaingan","Konflik","Isolasi"],"Keduanya saling bergantung."],["Di desa, rumah dengan tempat kerja (sawah) umumnya…",["Dekat","Berjauhan","Selalu di kota","Berbeda negara"],"Lokasi pertanian masih satu desa."],["Kota lebih padat karena…",["Banyak perantau datang","Penduduk pindah semua","Tidak ada pekerjaan","Lahan sangat luas"],"Perantau menambah kepadatan."]]},"A.0.2":{"k":8,"g":"Membedakan cuaca dan iklim, menyebut unsur iklim, serta menjelaskan dampak perubahan iklim.","core":"<p><b>Cuaca</b> adalah keadaan udara pada waktu singkat (jam atau hari) di wilayah sempit. <b>Iklim</b> adalah rata-rata keadaan cuaca tahunan di wilayah yang luas.</p><p><b>Unsur iklim</b>: penyinaran matahari, suhu udara, kelembapan, angin, dan curah hujan.</p><p><b>Iklim Indonesia</b> adalah tropis dengan dua musim: musim hujan (umumnya Oktober–Maret) dan musim kemarau (umumnya April–September), diselingi masa peralihan (pancaroba). Karena itu padi ditanam saat musim hujan karena butuh banyak air, sedangkan jagung ditanam saat kemarau.</p><p><b>Perubahan iklim</b> adalah berubahnya pola iklim akibat naiknya suhu Bumi. Penyebab utamanya gas rumah kaca (misalnya CO₂ dari pembakaran bahan bakar). Akibatnya: musim kacau, kekeringan panjang, hujan sangat deras, dan banjir.</p><p><b>Dampaknya</b>: pertanian (gagal panen), perikanan (nelayan sulit melaut), perhubungan (penerbangan dan pelayaran tertunda karena cuaca buruk), kesehatan (penyakit musiman), dan ekonomi (harga pangan naik).</p><p><b>Pengaruh unsur iklim pada tanaman</b>: penyinaran matahari memengaruhi fotosintesis; suhu tinggi membuat tanaman cenderung mengering; kelembapan membatasi hilangnya air; angin membantu penyerbukan; hujan menambah air tetapi dapat mengikis tanah. Iklim juga memengaruhi <b>industri</b> (kelembapan dan hujan membuat mesin berkarat) dan <b>kesehatan</b> (saat pancaroba, panas dan debu memicu radang tenggorokan, demam, influenza). Musim hujan di Indonesia bagian barat dipengaruhi arus angin yang membawa banyak uap air dari Samudra Pasifik; makin ke timur curah hujan makin sedikit.</p>","ex":"<ul><li>Hujan deras di sekolah hari ini: cuaca. Indonesia hangat dan lembap sepanjang tahun: iklim.</li><li>Kemarau panjang membuat sawah kekeringan dan petani gagal panen: dampak di bidang ekonomi.</li><li>Gelombang tinggi membuat nelayan tidak melaut dan penghasilan turun.</li></ul>","cmp":"<ul><li><b>Cuaca</b>: singkat, wilayah sempit, cepat berubah.</li><li><b>Iklim</b>: rata-rata puluhan tahun, wilayah luas, relatif tetap.</li></ul>","mis":"<ul><li>Menyamakan cuaca dan iklim.</li><li>Mengira gempa bumi termasuk unsur iklim. Gempa urusan geologi.</li><li>Mengira perubahan iklim tidak mengganggu ekonomi.</li></ul>","p":[["Keadaan udara singkat di wilayah sempit?",["Cuaca","Iklim","Musim","Pancaroba"],"Cuaca = singkat dan sempit."],["Musim hujan di Indonesia umumnya…",["Oktober–Maret","April–September","Juni–Agustus","Sepanjang tahun"],"Okt–Mar."],["Yang BUKAN unsur iklim?",["Gempa bumi","Suhu udara","Angin","Curah hujan"],"Gempa bukan unsur iklim."],["Gas penyebab utama perubahan iklim?",["Gas rumah kaca (CO₂)","Oksigen","Nitrogen","Helium"],"Gas rumah kaca."]],"e":[["Iklim berbeda dari cuaca karena iklim…",["Rata-rata dalam waktu lama di wilayah luas","Berubah tiap jam","Hanya di kota","Hanya malam hari"],"Iklim = rata-rata lama dan luas."],["Lima unsur iklim adalah…",["Sinar matahari, suhu, kelembapan, angin, curah hujan","Gempa, tsunami, banjir, longsor, gunung","Lintang, bujur, zona, waktu, peta","Hutan, laut, tanah, air, udara"],"Lima unsur iklim."],["Jagung umumnya ditanam saat…",["Kemarau","Hujan deras","Banjir","Pancaroba"],"Jagung tak butuh banyak air."],["Padi ditanam saat musim hujan karena…",["Butuh banyak air","Tidak butuh air","Takut panas","Butuh salju"],"Padi butuh banyak air."],["Dampak perubahan iklim bagi petani?",["Gagal panen","Panen selalu naik","Libur bertambah","Tanah menjadi laut"],"Musim kacau, gagal panen."],["Penundaan penerbangan karena cuaca buruk dampak di bidang…",["Perhubungan","Pertanian","Pendidikan","Hukum"],"Perhubungan."],["Penyebab utama naiknya suhu Bumi?",["Gas rumah kaca","Gempa","Pasang surut","Rotasi Bumi"],"Gas rumah kaca menahan panas."],["Mengapa nelayan kehilangan penghasilan saat gelombang tinggi?",["Tidak bisa melaut","Ikan hilang selamanya","Pajak naik","Kapal dilarang"],"Cuaca ekstrem menghalangi melaut."],["Rata-rata hujan tahunan suatu wilayah selama puluhan tahun termasuk…",["Iklim","Cuaca","Gempa","Zona waktu"],"Rata-rata lama = iklim."],["Hujan lebat sehari lalu banjir. Pernyataan yang tepat?",["Hujan itu cuaca, kekeringan panjang berulang bisa tanda perubahan iklim","Hujan itu iklim","Banjir unsur iklim","Cuaca tak memengaruhi manusia"],"Cuaca harian beda dari pola iklim jangka panjang."],["Mesin industri mudah berkarat karena…",["Kelembapan dan curah hujan tinggi","Suhu terlalu rendah","Angin terlalu pelan","Tidak ada hujan"],"Kelembapan dan hujan memicu karat."],["Angin membantu tanaman dalam…",["Penyerbukan","Pembuatan karat","Pembekuan","Penguapan laut"],"Membantu penyerbukan."],["Saat pancaroba, penyakit yang sering muncul?",["Radang tenggorokan dan influenza","Patah tulang","Gigi berlubang","Rabun jauh"],"Panas dan debu memicu penyakit."],["Makin ke timur, curah hujan Indonesia umumnya…",["Makin sedikit","Makin banyak","Sama","Tak berubah"],"Uap air banyak jatuh di barat."]]},"A.0.3":{"k":8,"g":"Menjelaskan letak geologis Indonesia, jenis bencana alam, dampak positif dan negatifnya, serta cara mitigasi.","core":"<p>Indonesia berada di pertemuan <b>tiga lempeng</b> (Eurasia, Indo-Australia, Pasifik) dan dilalui dua jalur pegunungan dunia: <b>Sirkum Pasifik</b> dan <b>Sirkum Mediterania</b>. Terdapat 127 gunung api aktif. Itulah letak geologis Indonesia.</p><p><b>Dampak positif</b>: tanah vulkanik subur, pasir dan batuan untuk bahan bangunan, pemandangan indah untuk wisata, dan sumber mineral.</p><p><b>Dampak negatif</b> (bencana): <b>gempa bumi</b> (getaran akibat pergeseran lempeng atau patahan), <b>tsunami</b> (rangkaian gelombang laut raksasa, sering dipicu gempa di dasar laut), dan <b>gunung meletus</b> (magma didorong gas bertekanan tinggi).</p><p><b>Mitigasi</b> (mengurangi risiko): <b>sebelum</b> bencana siapkan tas siaga dan kenali jalur evakuasi; <b>saat</b> gempa lindungi kepala dan berlindung di bawah meja, lalu setelah reda keluar ke tempat terbuka; jika di pantai dan gempa kuat, segera menuju tempat tinggi; <b>sesudah</b> bencana ikuti arahan petugas dan waspadai gempa susulan.</p><p><b>Keanekaragaman flora-fauna</b>: bagian barat Indonesia mirip Asia, bagian timur mirip Australia, bagian tengah peralihan. <b>Sumber daya mineral</b>: talk untuk bedak, minyak bumi diolah menjadi bensin, solar, dan avtur, gas alam dimanfaatkan sebagai LPG. <b>Tsunami</b> dapat menjalar hingga 900 km/jam atau lebih di tengah laut, dipicu gempa dasar laut, longsoran di dasar laut, atau letusan gunung api di laut. <b>Magma</b> letusan bersuhu lebih dari 1.000°C dan abunya dapat melambung hingga radius 18 km atau lebih.</p>","ex":"<ul><li>Petani sayur di lereng gunung api diuntungkan tanah subur, tetapi harus waspada letusan.</li><li>Gempa kuat di pantai: jangan menunggu peringatan, langsung menuju tempat yang lebih tinggi karena tsunami bisa datang.</li></ul>","cmp":"<ul><li><b>Gempa</b>: getaran tanah dari pergeseran lempeng.</li><li><b>Tsunami</b>: gelombang laut besar, sering akibat gempa dasar laut.</li><li><b>Gunung meletus</b>: magma keluar dari kawah.</li></ul>","mis":"<ul><li>Mengira letak geologis hanya merugikan.</li><li>Mengira gempa bisa diprediksi waktunya. Belum bisa.</li><li>Mengira tsunami sama dengan ombak biasa.</li></ul>","p":[["Tiga lempeng yang bertemu di Indonesia?",["Eurasia, Indo-Australia, Pasifik","Afrika, Atlantik, Arktik","Amerika, Asia, Eropa","Pasifik, Atlantik, Hindia"],"Tiga lempeng itu."],["Tanah dekat gunung api subur karena…",["Kaya unsur hara hasil letusan","Selalu tergenang","Tanpa hujan","Bebas mineral"],"Material vulkanik kaya unsur hara."],["Tsunami sering dipicu oleh…",["Gempa di dasar laut","Hujan lebat","Angin darat","Bulan purnama"],"Gempa dasar laut."],["Saat gempa terasa di dalam rumah, tindakan awal?",["Lindungi kepala dan berlindung di bawah meja","Berlari ke lift","Berdiri di jendela","Menyalakan api"],"Lindungi kepala, berlindung."]],"e":[["Jumlah gunung api aktif di Indonesia menurut buku?",["127","27","227","12"],"127."],["Dua jalur pegunungan yang melintasi Indonesia?",["Sirkum Pasifik dan Sirkum Mediterania","Himalaya dan Alpen","Andes dan Rocky","Ural dan Kaukasus"],"Dua sirkum."],["Dampak positif letak geologis?",["Tanah vulkanik subur","Gempa bumi","Tsunami","Letusan"],"Tanah subur."],["Gempa bumi disebabkan oleh…",["Pergeseran lempeng atau patahan","Hujan deras","Angin kencang","Pasang laut"],"Pergeseran lempeng."],["Letusan gunung terjadi karena…",["Magma didorong gas bertekanan tinggi","Hujan asam","Gempa susulan","Angin laut"],"Magma dan gas."],["Gempa kuat di pantai. Tindakan paling tepat?",["Segera ke tempat tinggi","Berenang ke laut","Menunggu di pantai","Memotret ombak"],"Tsunami mungkin datang, ke tempat tinggi."],["Tas siaga bencana disiapkan…",["Sebelum bencana","Setelah semua selesai","Saat banjir surut","Tidak perlu"],"Mitigasi sebelum bencana."],["Mengapa Indonesia rawan gempa?",["Berada di pertemuan tiga lempeng","Dekat khatulistiwa saja","Memiliki banyak sawah","Beriklim tropis"],"Letak geologis."],["Mitigasi bencana adalah…",["Upaya mengurangi risiko bencana","Menunggu bencana","Menyalahkan alam","Membangun di zona bahaya"],"Mitigasi = mengurangi risiko."],["Petani di lereng gunung api diuntungkan tetapi juga berisiko. Pernyataan tepat?",["Letak geologis berdampak positif dan negatif","Hanya merugikan","Hanya menguntungkan","Tidak berdampak"],"Dua sisi dampak."],["Bagian timur Indonesia flora-faunanya mirip…",["Australia","Asia","Eropa","Afrika"],"Berada di kawasan lempeng Australia."],["Gas alam dimanfaatkan sehari-hari sebagai…",["LPG","Aspal","Bedak","Avtur"],"LPG untuk memasak."],["Kecepatan tsunami di laut dalam bisa mencapai…",["900 km/jam atau lebih","9 km/jam","90 m/jam","1 km/jam"],"Sangat cepat."],["Suhu magma letusan lebih dari…",["1.000°C","100°C","10°C","500°C saja"],"Sangat panas."]]},"A.0.4":{"k":8,"g":"Menjelaskan produksi, distribusi, dan konsumsi, faktor produksi, jenis distribusi, serta faktor yang memengaruhi konsumsi.","core":"<p>Kegiatan ekonomi ada tiga: <b>produksi</b>, <b>distribusi</b>, <b>konsumsi</b>.</p><p><b>1. Produksi</b>: menciptakan atau menambah nilai guna barang dan jasa. <b>Barang</b> berwujud (beras, sepatu), <b>jasa</b> tidak berwujud (dokter, ojek). Produksi memerlukan <b>faktor produksi</b>: <b>alam</b> (tanah, air), <b>tenaga kerja</b>, <b>modal</b> (uang, mesin, gedung), dan <b>keahlian</b> (kemampuan mengelola semuanya).</p><p><b>2. Distribusi</b>: menyalurkan barang dari produsen ke konsumen. <b>Langsung</b> (petani menjual ke pembeli), <b>semilangsung</b> (lewat perantara yang masih bagian dari produsen, misalnya toko resmi milik produsen ponsel), <b>tidak langsung</b> (lewat perantara di luar produsen: agen, minimarket, pasar, pedagang kecil).</p><p><b>3. Konsumsi</b>: menghabiskan atau mengurangi manfaat barang dan jasa untuk memenuhi kebutuhan. Dipengaruhi faktor <b>internal</b> (motivasi, sikap, selera) dan <b>eksternal</b> (pekerjaan, harga, budaya).</p><p><b>Tujuan produksi</b>: memenuhi kebutuhan demi <b>kemakmuran</b> (keadaan ketika alat pemuas kebutuhan cukup), dan bagi produsen memperoleh keuntungan. <b>Tujuan distribusi</b>: menyalurkan hasil produksi, agar dimanfaatkan maksimal, memenuhi kebutuhan, dan menjaga keberlangsungan produksi. <b>Tujuan konsumsi</b> lain: menjaga kesehatan (gizi seimbang), memenuhi kebutuhan jasmani, rohani, dan estetika.</p>","ex":"<ul><li>Risa membuat kue (produksi), menitipkannya ke warung (distribusi), dan Sani memakannya (konsumsi).</li><li>Petani menjual langsung di pasar: distribusi langsung. Sayur dari petani, ke tengkulak, ke minimarket, ke pembeli: tidak langsung.</li><li>Kayu diolah menjadi meja: nilai gunanya bertambah. Itulah produksi (menambah nilai guna).</li></ul>","cmp":"<ul><li><b>Barang</b> berwujud, <b>jasa</b> tidak berwujud.</li><li><b>Internal</b> datang dari diri (selera), <b>eksternal</b> dari luar (harga, budaya).</li></ul>","mis":"<ul><li>Mengira produksi hanya di pabrik.</li><li>Mengira modal hanya uang tunai. Mesin dan gedung juga modal.</li><li>Menukar distribusi semilangsung dan tidak langsung.</li></ul>","p":[["Menyalurkan barang dari produsen ke konsumen?",["Distribusi","Produksi","Konsumsi","Investasi"],"Distribusi."],["Mesin dan gedung termasuk faktor…",["Modal","Alam","Tenaga kerja","Keahlian"],"Modal."],["Dokter dan tukang ojek menghasilkan…",["Jasa","Barang","Bahan baku","Modal"],"Mereka menghasilkan jasa."],["Selera dan motivasi termasuk faktor konsumsi…",["Internal","Eksternal","Geografis","Politik"],"Dari dalam diri."]],"e":[["Empat faktor produksi adalah…",["Alam, tenaga kerja, modal, keahlian","Uang, buku, gedung, guru","Produksi, distribusi, konsumsi, jasa","Barang, jasa, harga, pajak"],"Empat faktor produksi."],["Faktor produksi yang mengelola faktor lain?",["Keahlian","Alam","Modal","Konsumen"],"Keahlian."],["Petani menjual langsung ke pembeli. Jenis distribusi?",["Langsung","Semilangsung","Tidak langsung","Tidak ada"],"Tanpa perantara."],["Sayur dari petani ke tengkulak ke minimarket ke pembeli?",["Tidak langsung","Langsung","Semilangsung","Bebas"],"Banyak perantara."],["Konsumsi bertujuan…",["Memenuhi kebutuhan","Menumpuk barang","Menaikkan pajak","Menghentikan produksi"],"Memenuhi kebutuhan."],["Harga barang memengaruhi konsumsi sebagai faktor…",["Eksternal","Internal","Sosial budaya saja","Alamiah"],"Datang dari luar diri."],["Jasa pengobatan termasuk hasil produksi…",["Jasa","Barang","Bahan baku","Modal"],"Tidak berwujud."],["Mengapa kue yang dibuat perlu didistribusikan?",["Agar sampai ke konsumen","Agar harganya naik","Agar cepat basi","Agar tak laku"],"Fungsi distribusi."],["Produksi disebut menambah nilai guna. Contohnya?",["Kayu diolah jadi meja","Meja dipakai duduk","Meja dijual ke tetangga","Meja dibeli"],"Mengubah kayu jadi meja menambah nilai guna."],["Orang membeli sepatu karena gengsi teman-temannya. Faktor?",["Eksternal (lingkungan sosial)","Internal (kebutuhan fisik)","Alam","Modal"],"Dipengaruhi lingkungan luar."],["Keadaan ketika alat pemuas kebutuhan cukup disebut…",["Kemakmuran","Kelangkaan","Inflasi","Kemiskinan"],"Itu tujuan produksi."],["Produsen ponsel menjual lewat toko resmi miliknya. Distribusi…",["Semilangsung","Langsung","Tidak langsung","Tidak ada"],"Perantara masih bagian produsen."],["Penjahit menyerahkan baju langsung ke pelanggan. Distribusi…",["Langsung","Semilangsung","Tidak langsung","Bebas"],"Tanpa perantara."],["Agen dan minimarket sebagai perantara termasuk distribusi…",["Tidak langsung","Langsung","Semilangsung","Tidak ada"],"Perantara di luar produsen."]]},"A.0.5":{"k":8,"g":"Menjelaskan syarat interaksi sosial serta mengenali bentuk asosiatif dan disosiatif beserta contohnya.","core":"<p><b>Interaksi sosial</b> adalah hubungan sosial yang dinamis antarperorangan, antarkelompok, atau perorangan dengan kelompok.</p><p><b>Dua syarat terjadinya interaksi</b></p><ul><li><b>Kontak sosial</b>: hubungan awal. Bisa <b>langsung</b> (bertatap muka) atau <b>tidak langsung</b> (lewat telepon, surat, media sosial).</li><li><b>Komunikasi</b>: penyampaian pesan, baik <b>verbal</b> (kata-kata) maupun <b>nonverbal</b> (isyarat, ekspresi).</li></ul><p><b>Bentuk asosiatif</b> (mengarah pada persatuan)</p><ul><li><b>Kerja sama</b>: bekerja bersama mencapai tujuan, misalnya gotong royong.</li><li><b>Akomodasi</b>: upaya meredakan atau menyelesaikan pertentangan, misalnya pengurus RT menengahi warga yang berselisih.</li><li><b>Akulturasi</b>: berpadunya dua budaya tanpa menghilangkan ciri budaya asli, misalnya Candi Borobudur memadukan budaya India dan lokal.</li></ul><p><b>Bentuk disosiatif</b> (mengarah pada perpecahan)</p><ul><li><b>Persaingan</b>: berlomba meraih sesuatu tanpa ancaman dan kekerasan.</li><li><b>Kontravensi</b>: ketidaksukaan yang disembunyikan, misalnya menyebar kabar buruk diam-diam.</li><li><b>Pertentangan (konflik)</b>: benturan terbuka yang ingin menyingkirkan lawan dan sering disertai kekerasan.</li></ul>","ex":"<ul><li>Dua tim kelas lomba cerdas cermat: persaingan. Bila salah satu tim mengancam tim lawan: pertentangan.</li><li>Teman mengobrol lewat video call: kontak sosial tidak langsung.</li><li>Warga bergantian ronda: kerja sama.</li></ul>","cmp":"<ul><li><b>Persaingan</b> sehat tanpa kekerasan, <b>konflik</b> bertujuan menyingkirkan lawan.</li><li><b>Akomodasi</b> menyelesaikan pertentangan, <b>akulturasi</b> memadukan budaya.</li></ul>","mis":"<ul><li>Mengira kontak sosial harus bertatap muka.</li><li>Menyamakan persaingan dengan konflik.</li><li>Memasukkan akulturasi ke bentuk disosiatif.</li></ul>","p":[["Dua syarat interaksi sosial?",["Kontak sosial dan komunikasi","Uang dan jabatan","Usia dan tempat tinggal","Kuasa dan kekayaan"],"Kontak dan komunikasi."],["Telepon atau media sosial termasuk kontak sosial…",["Tidak langsung","Langsung","Tidak sah","Disosiatif"],"Tanpa bertatap muka."],["Gotong royong termasuk…",["Kerja sama","Konflik","Kontravensi","Persaingan"],"Bekerja bersama."],["Bentuk disosiatif?",["Persaingan","Kerja sama","Akomodasi","Akulturasi"],"Persaingan, kontravensi, konflik."]],"e":[["Ketua RT menengahi warga yang berselisih. Bentuknya?",["Akomodasi","Persaingan","Kontravensi","Konflik"],"Meredakan pertentangan."],["Berpadunya dua budaya tanpa menghilangkan budaya asli?",["Akulturasi","Konflik","Persaingan","Kontravensi"],"Akulturasi."],["Ketidaksukaan yang disembunyikan disebut…",["Kontravensi","Kerja sama","Akomodasi","Persaingan"],"Kontravensi."],["Bentuk disosiatif yang disertai kekerasan?",["Pertentangan (konflik)","Persaingan","Akomodasi","Kerja sama"],"Konflik."],["Penyampaian pesan lewat isyarat tubuh disebut komunikasi…",["Nonverbal","Verbal","Digital","Massal"],"Nonverbal."],["Contoh interaksi asosiatif?",["Kerja bakti kampung","Tawuran suporter","Fitnah terselubung","Perebutan lahan"],"Kerja bakti = kerja sama."],["Dua siswa berlomba juara kelas dengan sehat. Itu…",["Persaingan","Konflik","Kontravensi","Akomodasi"],"Tanpa kekerasan."],["Candi Borobudur memadukan budaya India dan lokal. Contoh…",["Akulturasi","Konflik","Kontravensi","Persaingan"],"Dua budaya berpadu."],["Mengapa interaksi tidak bisa terjadi tanpa komunikasi?",["Pesan tidak tersampaikan","Tidak perlu bertemu","Tidak ada kontak","Tidak perlu tujuan"],"Komunikasi syarat kedua."],["Siswa menyebar kabar buruk tentang temannya secara diam-diam. Bentuknya?",["Kontravensi","Kerja sama","Akomodasi","Akulturasi"],"Ketidaksukaan tersembunyi."]]},"A.0.6":{"k":8,"g":"Menjelaskan pengertian, ciri, unsur, dan sumber sejarah serta membedakan mitos, legenda, dan dongeng.","core":"<p><b>Sejarah</b> berasal dari kata Arab <i>syajarah</i> yang berarti pohon kayu: peristiwa masa lalu tumbuh dan berkaitan seperti cabang pohon.</p><p><b>Tiga ciri peristiwa sejarah</b></p><ul><li><b>Unik</b>: hanya terjadi sekali dan tidak terulang persis sama.</li><li><b>Abadi</b>: terus dikenang dan dituturkan.</li><li><b>Penting</b>: bermakna bagi orang banyak.</li></ul><p><b>Tiga unsur sejarah</b>: <b>ruang</b> (di mana), <b>waktu</b> (kapan), dan <b>manusia</b> (siapa pelakunya).</p><p><b>Sumber sejarah</b></p><ul><li><b>Tertulis</b>: prasasti, surat, dokumen, surat kabar.</li><li><b>Benda</b>: candi, patung, relief, alat-alat, foto.</li><li><b>Lisan</b>: <b>oral history</b> (kesaksian pelaku atau saksi sezaman) dan <b>tradisi lisan</b> (cerita turun-temurun).</li></ul><p><b>Cerita rakyat</b>: <b>mitos</b> dianggap benar dan suci; <b>legenda</b> dianggap benar-benar terjadi; <b>dongeng</b> tidak dianggap benar-benar terjadi.</p><p><b>Sumber benda</b> meliputi monumen (candi, masjid, makam), ornamen (relief), grafis (peta), fotografi, dan fonografi (rekaman suara). <b>Sumber tertulis</b> meliputi prasasti, piagam, babad, kronik, biografi, buku harian, dan surat kabar. Unsur <b>waktu</b> menjelaskan kronologi peristiwa. <b>Ciri cerita rakyat</b>: disebarkan secara lisan dari mulut ke mulut, tradisional, ada versi berbeda tiap daerah, penciptanya tidak diketahui, dan menjadi milik bersama. Cerita rakyat memuat nilai budi pekerti seperti kejujuran, kerja sama, keberanian, dan tolong-menolong, sehingga perlu dilestarikan.</p>","ex":"<ul><li>Proklamasi 17 Agustus 1945: unik (sekali), abadi (diperingati tiap tahun), penting (lahirnya negara).</li><li>Wawancara dengan veteran pejuang: oral history. Kisah Malin Kundang yang diceritakan turun-temurun: tradisi lisan (legenda).</li></ul>","cmp":"<ul><li><b>Oral history</b>: kesaksian pelaku atau saksi. <b>Tradisi lisan</b>: cerita turun-temurun.</li><li><b>Mitos</b> suci dan dianggap benar, <b>legenda</b> dianggap pernah terjadi, <b>dongeng</b> tidak dianggap terjadi.</li></ul>","mis":"<ul><li>Mengira sejarah hanya hafalan tahun.</li><li>Menyamakan cerita rakyat dengan fakta.</li><li>Mengira peristiwa sejarah bisa terulang persis sama. Ciri uniknya menyatakan tidak.</li></ul>","p":[["Tiga unsur sejarah?",["Ruang, waktu, manusia","Uang, buku, guru","Peta, kompas, laut","Raja, rakyat, pajak"],"Ruang, waktu, manusia."],["Candi termasuk sumber sejarah…",["Benda","Tertulis","Lisan","Digital"],"Candi adalah benda."],["\"Sejarah\" berasal dari bahasa…",["Arab","Latin","Sanskerta","Belanda"],"Syajarah, bahasa Arab."],["Peristiwa sejarah hanya terjadi sekali. Itu ciri…",["Unik","Abadi","Penting","Biasa"],"Unik."]],"e":[["Tiga ciri peristiwa sejarah?",["Unik, abadi, penting","Berulang, sementara, biasa","Rahasia, kecil, acak","Mudah, murah, cepat"],"Unik, abadi, penting."],["Cerita rakyat yang dianggap benar dan suci?",["Mitos","Legenda","Dongeng","Fabel"],"Mitos."],["Prasasti dan dokumen termasuk sumber…",["Tertulis","Lisan","Benda saja","Digital"],"Sumber tertulis."],["Kesaksian langsung pelaku sejarah disebut…",["Oral history","Tradisi lisan","Mitos","Dongeng"],"Oral history."],["Cerita yang dianggap benar-benar pernah terjadi adalah…",["Legenda","Dongeng","Mitos","Fabel"],"Legenda."],["Patung dan relief adalah sumber…",["Benda","Tertulis","Lisan","Digital"],"Benda."],["Ruang dalam unsur sejarah menjawab…",["Di mana peristiwa terjadi","Kapan terjadi","Siapa pelakunya","Mengapa"],"Ruang = tempat."],["Mengapa Proklamasi disebut peristiwa sejarah?",["Unik, dikenang, dan penting","Terjadi tiap hari","Tidak berarti apa-apa","Hanya cerita"],"Memenuhi tiga ciri."],["Cerita turun-temurun di desa tentang asal-usul sebuah gunung termasuk…",["Tradisi lisan","Prasasti","Foto","Surat kabar"],"Cerita lisan turun-temurun."],["Mengapa peristiwa sejarah tidak bisa terulang persis sama?",["Karena bersifat unik","Karena abadi","Karena penting","Karena tertulis"],"Ciri unik."],["Ciri cerita rakyat?",["Disebarkan lisan dan penciptanya tidak diketahui","Ditulis pencipta terkenal","Hanya satu versi","Milik pribadi"],"Ciri cerita rakyat."],["Nilai yang terkandung dalam cerita rakyat?",["Budi pekerti","Harga barang","Zona waktu","Curah hujan"],"Pendidikan moral."],["Rekaman suara termasuk sumber…",["Benda (fonografi)","Tertulis","Lisan","Digital saja"],"Fonografi."],["Unsur waktu dalam sejarah menjelaskan…",["Kronologi peristiwa","Tempat kejadian","Pelaku","Alat"],"Urutan waktu."]]},"A.1.2":{"k":8,"g":"Menjelaskan upaya melestarikan udara, air, dan tanah dalam kehidupan sehari-hari.","core":"<p><b>Melestarikan lingkungan</b> berarti menjaga agar lingkungan tetap bersih, sehat, dan lestari untuk generasi sekarang dan nanti. Tugas ini milik <b>semua orang</b>, bukan hanya pemerintah.</p><ul><li><b>Udara</b>: menanam pohon, memakai transportasi umum atau kendaraan berbahan bakar gas/listrik, tidak membakar sampah, merawat kendaraan agar emisinya kecil.</li><li><b>Air</b>: membuat <b>sumur resapan</b>, ikut program kali bersih, tidak membuang limbah dan sampah ke sungai, memakai detergen ramah lingkungan agar kualitas air terjaga, menghemat air.</li><li><b>Tanah</b>: memakai <b>pupuk organik</b>, mengurangi plastik sekali pakai, memilah sampah, berkebun organik, dan <b>bioremediasi</b> (memakai jamur atau bakteri untuk menguraikan zat pencemar).</li></ul><p>Pembiasaan kecil yang dilakukan terus-menerus lebih berdampak daripada aksi besar yang hanya sekali.</p><p>Pemerintah mengupayakan kendaraan bukan berbahan bakar fosil (gas dan listrik), misalnya bus umum DKI berbahan bakar gas. Air hujan dapat disimpan dalam tanah lewat <b>sumur resapan</b>; juga perlu merawat pintu air dan menindak pembuang limbah ke sungai. Jangan membuang cat, pelarut, dan produk pembersih beracun sembarangan. Timbunan sampah dapat meresapkan cairan ke tanah sehingga tanah bau dan tidak produktif.</p>","ex":"<ul><li>Berangkat sekolah bersepeda atau naik angkutan umum: mengurangi asap.</li><li>Membawa tas belanja dan botol minum sendiri: mengurangi sampah plastik di tanah.</li><li>Membuat sumur resapan di halaman: air hujan meresap, mengurangi banjir.</li></ul>","cmp":"<ul><li><b>Pupuk organik</b> memperbaiki tanah, <b>pupuk kimia berlebih</b> merusak tanah.</li><li><b>Bioremediasi</b> memakai makhluk hidup untuk membersihkan tanah tercemar.</li></ul>","mis":"<ul><li>Mengira pelestarian hanya tugas pemerintah.</li><li>Menganggap membakar sampah sebagai solusi. Justru mencemari udara.</li><li>Mengira aksi kecil tidak berarti.</li></ul>","p":[["Contoh pelestarian udara?",["Menanam pohon","Membakar sampah","Membuang limbah ke sungai","Memakai pestisida berlebih"],"Pohon menyerap CO₂."],["Sumur resapan membantu melestarikan…",["Air","Garis lintang","Zona waktu","Letak astronomis"],"Air hujan diresapkan."],["Pembersihan tanah memakai jamur atau bakteri disebut…",["Bioremediasi","Eutrofikasi","Urbanisasi","Akulturasi"],"Bioremediasi."],["Pupuk yang lebih aman bagi tanah?",["Pupuk organik","Pupuk kimia berlebih","Pestisida berlebih","Plastik"],"Pupuk organik."]],"e":[["Perilaku yang mengurangi pencemaran air?",["Tidak membuang limbah ke sungai","Membuang sampah ke kali","Memakai banyak deterjen","Menguras sumur"],"Menjaga air tetap bersih."],["Kendaraan yang membantu menurunkan polusi udara?",["Kendaraan listrik","Kendaraan berasap pekat","Pembakaran terbuka","Mesin tua tanpa perawatan"],"Emisinya rendah."],["Membawa tas belanja sendiri mengurangi…",["Sampah plastik di tanah","Gempa bumi","Perubahan musim","Garis bujur"],"Mengurangi sampah plastik."],["Mengapa tidak boleh membakar sampah?",["Mencemari udara","Menyuburkan tanah","Menjernihkan air","Mengurangi pohon"],"Asapnya mencemari udara."],["Siapa yang bertanggung jawab melestarikan lingkungan?",["Semua orang","Hanya pemerintah","Hanya guru","Hanya petugas kebersihan"],"Tugas bersama."],["Detergen ramah lingkungan dipakai untuk menjaga…",["Kualitas air","Kualitas udara saja","Garis pantai","Suhu Bumi"],"Mengurangi pencemaran air."],["Tindakan terbaik untuk mengurangi banjir di halaman rumah?",["Membuat sumur resapan","Menutup seluruh tanah dengan semen","Membuang sampah ke got","Menebang pohon"],"Air meresap ke tanah."],["Berkebun organik menguntungkan tanah karena…",["Tidak memakai bahan kimia berlebih","Memakai banyak pestisida","Membuang plastik","Membakar jerami"],"Menjaga kesuburan tanah."],["Kebiasaan kecil yang konsisten lebih efektif daripada…",["Aksi besar yang hanya sekali","Aksi kecil harian","Memilah sampah","Menanam pohon"],"Konsistensi menentukan dampak."],["Rani naik angkutan umum, membawa botol minum, dan memilah sampah. Dampaknya?",["Mengurangi pencemaran udara dan tanah","Menambah pencemaran","Tidak berdampak","Menaikkan suhu"],"Tiga kebiasaan baik untuk lingkungan."],["Bus umum DKI memakai bahan bakar gas karena…",["Polusinya lebih rendah","Lebih lambat","Lebih mahal selalu","Tidak butuh mesin"],"Emisi lebih rendah."],["Timbunan sampah mencemari tanah lewat…",["Cairan yang meresap","Sinar matahari","Angin","Cahaya bulan"],"Cairan sampah terserap tanah."]]},"C.0.0":{"k":8,"g":"Menjelaskan letak geografis, astronomis, dan geologis Indonesia, zona waktu, serta pengaruh letak terhadap iklim.","core":"<p>Indonesia negara terluas di Asia Tenggara: daratan ±1,9 juta km² dan lautan ±5,8 juta km². Letaknya dapat dilihat dari tiga sisi.</p><ul><li><b>Letak geografis</b>: posisi berdasarkan kenyataan di permukaan bumi, yaitu di antara dua benua (<b>Asia dan Australia</b>) dan dua samudra (<b>Hindia dan Pasifik</b>).</li><li><b>Letak astronomis</b>: posisi berdasarkan garis lintang dan bujur, yaitu 6°LU–11°LS dan 95°BT–141°BT (sebagian buku menulis 144°BT). Akibatnya ada perbedaan waktu: <b>WIB, WITA, WIT</b>, masing-masing berselisih 1 jam, sehingga WIT lebih awal 2 jam dari WIB. Zona waktu ini ditetapkan sejak 1 Januari 1988.</li><li><b>Letak geologis</b>: posisi berdasarkan struktur batuan. Indonesia dilalui Sirkum Pasifik dan Sirkum Mediterania dengan 127 gunung api aktif, dan berada di pertemuan tiga lempeng: Eurasia (utara), Indo-Australia (selatan), Pasifik (timur). Pertemuan lempeng membuat banyak gunung api dan rawan gempa.</li></ul><p><b>Cuaca dan iklim</b>: iklim tropis dengan musim hujan (Oktober–Maret) dan kemarau (April–September). Angin lembap dari Samudra Pasifik lewat Laut Cina Selatan membawa hujan ke barat; makin ke timur hujan makin sedikit. Tidak semua daerah sama: savana di Nusa Tenggara punya kemarau lebih panjang. Matahari bersinar sepanjang tahun di seluruh Indonesia.</p>","ex":"<ul><li>Pukul 06.00 di Aceh (WIB), maka di Bali (WITA) pukul 07.00 dan di Papua (WIT) pukul 08.00.</li><li>Kalimantan hampir tidak punya gunung api, sedangkan Jawa dan Sumatra banyak.</li></ul>","cmp":"<ul><li><b>Geografis</b> = benua dan samudra, <b>astronomis</b> = lintang dan bujur, <b>geologis</b> = struktur batuan dan lempeng.</li></ul>","mis":"<ul><li>Menukar letak astronomis dengan geografis.</li><li>Mengira seluruh Indonesia mengalami musim yang sama.</li><li>Mengira gunung api tersebar merata di semua pulau.</li></ul>","p":[["Letak yang dilihat dari lintang dan bujur?",["Astronomis","Geografis","Geologis","Relatif"],"Astronomis."],["Indonesia berada di antara dua benua…",["Asia dan Australia","Eropa dan Afrika","Amerika dan Asia","Antartika dan Asia"],"Asia dan Australia."],["Selisih WIT dengan WIB?",["2 jam","1 jam","3 jam","Tidak ada"],"WIT lebih awal 2 jam."],["Jumlah gunung api aktif?",["127","27","227","12"],"127 gunung api."]],"e":[["Dua samudra yang mengapit Indonesia?",["Hindia dan Pasifik","Atlantik dan Arktik","Pasifik dan Atlantik","Hindia dan Arktik"],"Hindia dan Pasifik."],["Zona waktu Indonesia ditetapkan sejak…",["1 Januari 1988","17 Agustus 1945","1 Juni 1945","1 Januari 2000"],"Sejak 1988."],["Letak geologis ditentukan oleh…",["Struktur batuan dan lempeng","Lintang dan bujur","Benua dan samudra","Jumlah penduduk"],"Struktur geologi."],["Tiga lempeng di sekitar Indonesia?",["Eurasia, Indo-Australia, Pasifik","Afrika, Eurasia, Pasifik","Amerika, Asia, Eropa","Pasifik, Atlantik, Hindia"],"Tiga lempeng."],["Mengapa hujan di Indonesia barat lebih banyak?",["Angin lembap dari Pasifik melewati wilayah barat lebih dulu","Barat dekat gurun","Tak ada gunung","Timur lebih dingin"],"Hujan banyak jatuh di barat."],["Savana di Nusa Tenggara menunjukkan…",["Tidak semua daerah mengalami musim yang sama","Seluruh Indonesia sama","Tak ada kemarau","Selalu hujan"],"Iklim bervariasi."],["Pukul 06.00 di Aceh. Di Papua pukul…",["08.00","07.00","06.00","05.00"],"WIT = WIB + 2."],["Musim hujan umumnya…",["Oktober–Maret","April–September","Mei–Juli","Juni–Agustus"],"Okt–Mar."],["Rawannya Indonesia terhadap gempa berkaitan dengan letak…",["Geologis","Astronomis","Geografis saja","Relatif"],"Pertemuan lempeng."],["Matahari bersinar sepanjang tahun karena Indonesia berada di wilayah…",["Tropis","Kutub","Subtropis","Gurun"],"Iklim tropis."]]},"D.0.0":{"k":8,"g":"Menjelaskan faktor, tokoh, dan tujuan penjelajahan samudra bangsa Eropa serta pengaruh kondisi geografis Nusantara.","core":"<p><b>Penjelajahan samudra</b> adalah pelayaran bangsa Eropa mencari sumber rempah dan kekayaan. Faktor pendorongnya: jatuhnya <b>Konstantinopel ke tangan Turki Utsmani (1453)</b> yang memutus jalur dagang Eropa–Asia, semangat Renaisans, dan teknologi (kompas, kapal karavel). Motif umumnya <b>3G: Gold, Gospel, Glory</b>.</p><ul><li><b>Portugis</b>: Vasco da Gama tiba di Kalikut, India (1498); Portugis merebut <b>Malaka (1511)</b>.</li><li><b>Spanyol</b>: pelayaran Magellan dan awaknya mencapai Maluku (1521).</li><li><b>Belanda</b>: Cornelis de Houtman tiba di Banten (1596); VOC didirikan 1602.</li></ul><p>Untuk menghindari persaingan, Portugis dan Spanyol membagi dunia lewat <b>Perjanjian Tordesillas (1494)</b>.</p><p><b>Pengaruh kondisi geografis</b>: Maluku adalah penghasil cengkih dan pala, Nusantara berada di jalur Selat Malaka, dan angin muson memudahkan pelayaran. Itulah yang membuat Nusantara diincar bangsa Eropa.</p>","ex":"<ul><li>Pedagang Eropa berebut cengkih dan pala di Maluku karena harganya sangat tinggi di Eropa.</li><li>Pelabuhan Malaka yang strategis direbut Portugis tahun 1511.</li></ul>","cmp":"<ul><li><b>Gold</b> kekayaan, <b>Gospel</b> penyebaran agama, <b>Glory</b> kejayaan.</li></ul>","mis":"<ul><li>Mengira Belanda bangsa Eropa pertama di Nusantara (Portugis lebih dulu).</li><li>Menukar Portugis dan Spanyol.</li><li>Mengira tujuan mereka hanya berdagang.</li></ul>","p":[["Bangsa Eropa pertama yang merebut Malaka?",["Portugis","Belanda","Spanyol","Inggris"],"Portugis 1511."],["Arti 3G?",["Gold, Gospel, Glory","Gula, Garam, Gandum","Gunung, Gurun, Gua","Giat, Gigih, Gagah"],"3G."],["Pelayaran Belanda pertama ke Banten dipimpin…",["Cornelis de Houtman","Vasco da Gama","Magellan","Drake"],"1596."],["Daerah penghasil cengkih dan pala?",["Maluku","Jawa Barat","Sumatra Barat","Bali"],"Maluku."]],"e":[["Peristiwa yang memutus jalur dagang Eropa–Asia?",["Jatuhnya Konstantinopel 1453","Perang Dunia I","Revolusi Industri","Proklamasi"],"1453."],["Alat navigasi yang membantu penjelajahan?",["Kompas","Radio","Telepon","Radar"],"Kompas."],["Perjanjian pembagian dunia Portugis–Spanyol?",["Tordesillas","Bongaya","Giyanti","Linggarjati"],"1494."],["VOC didirikan tahun…",["1602","1511","1596","1945"],"1602."],["Vasco da Gama tiba di…",["Kalikut, India","Banten","Malaka","Maluku"],"1498."],["Spanyol mencapai Maluku pada tahun…",["1521","1596","1945","1602"],"Magellan dan awaknya."],["Mengapa Maluku diincar bangsa Eropa?",["Penghasil rempah bernilai tinggi","Penghasil emas saja","Tak ada penduduk","Dekat Eropa"],"Rempah."],["Angin muson berguna bagi…",["Pelayaran antarwilayah","Pertanian saja","Penambangan","Penerbangan"],"Memudahkan berlayar."],["Letak Selat Malaka penting karena…",["Jalur pelayaran dan dagang dunia","Jauh dari laut","Hanya jalur perang","Tidak ada kapal"],"Jalur strategis."],["Motif Gospel dalam penjelajahan berarti…",["Menyebarkan agama","Mencari emas","Meraih kejayaan","Berdagang gula"],"Agama."]]},"F.0.0":{"k":5,"g":"Menjelaskan globalisasi, pendorong, dan dampaknya.","core":"<p>Globalisasi = proses mendunianya hubungan antarbangsa dalam ekonomi, budaya, dan informasi. Pendorong utama: teknologi komunikasi dan transportasi.</p><p><b>Positif</b>: akses informasi, pasar luas. <b>Negatif</b>: budaya asing tak tersaring, gaya hidup konsumtif, persaingan ketat.</p>","ex":"<p>Belanja daring lintas negara, media sosial, dan batik yang dikenal dunia.</p>","cmp":"Globalisasi berbeda dari westernisasi: pengaruhnya dua arah, budaya lokal juga bisa mendunia.","mis":"Menganggap globalisasi pasti buruk atau pasti baik; menyamakan dengan westernisasi.","p":[["Pendorong utama globalisasi?",["Teknologi komunikasi dan transportasi","Bencana alam","Perang saudara","Pajak"],"Teknologi."],["Dampak positif globalisasi?",["Akses informasi luas","Budaya hilang","Konsumtif","Ketergantungan"],"Akses informasi."],["Sikap bijak menghadapi budaya asing?",["Menyaring sesuai jati diri","Menolak semua","Menerima semua","Mengabaikan"],"Disaring."]],"e":[["Globalisasi adalah…",["Mendunianya hubungan antarbangsa","Penutupan perbatasan","Bencana global","Perang dunia"],"Definisi."],["Contoh dampak negatif?",["Gaya hidup konsumtif","Pasar lebih luas","Info cepat","Kerja sama"],"Konsumtif."],["Globalisasi bersifat…",["Dua arah","Searah dari Barat","Hanya ekonomi","Hanya militer"],"Dua arah."],["Belanja daring lintas negara contoh globalisasi di bidang…",["Ekonomi","Militer","Agama","Hukum pidana"],"Ekonomi."],["Cara memperkuat jati diri?",["Melestarikan budaya lokal","Meniru semuanya","Menutup internet","Melarang impor"],"Lestarikan budaya lokal."]]},"A.1.0":{"k":8,"g":"Mengenal zaman geologi Bumi serta jenis, penyebab, dan dampak pencemaran udara, air, dan tanah.","core":"<p><b>Alam menunjang hidup manusia.</b> Sandang (kapas), pangan (nasi, sagu, jagung, umbi), dan papan (kayu, pasir) semuanya berasal dari alam. Ilmuwan membagi sejarah Bumi menjadi zaman geologi: <b>Arkaekum</b> (Bumi masih panas, belum ada kehidupan), <b>Paleozoikum</b> (tanda kehidupan muncul), <b>Mesozoikum</b> (zaman reptil raksasa; burung dan mamalia muncul setelah dinosaurus punah), dan <b>Neozoikum</b> yang terdiri atas <b>Tersier</b> (hewan menyusui berkembang) dan <b>Kuarter</b> (manusia mulai muncul).</p><p>Kini Bumi mengalami <b>pemanasan global</b> akibat efek rumah kaca dan polusi, yang sebagian besar berasal dari perilaku manusia. Interaksi manusia dengan alam punya sisi positif (misalnya logam tambang untuk membuat kendaraan) dan sisi negatif (pencemaran).</p><ul><li><b>Pencemaran udara</b>: pembakaran menghasilkan CO₂. CO₂ berlebih menimbulkan <b>efek rumah kaca</b>: panas Matahari mudah masuk tetapi sulit dipantulkan kembali, sehingga suhu Bumi naik. Dampak: penyakit pernapasan (asma, bronkitis), jarak pandang terganggu hingga rawan kecelakaan, hasil pertanian menurun, dan bangunan mudah berkarat.</li><li><b>Pencemaran air</b>: akibat bahan peledak untuk menangkap ikan dan limbah industri atau rumah tangga. Dampak: air tidak layak minum; terjadi <b>eutrofikasi</b>, yaitu ledakan alga yang menutupi permukaan air sehingga cahaya tidak menembus, fitoplankton gagal berfotosintesis, oksigen turun, dan makhluk air terancam; ikan beracun yang dimakan manusia bisa merusak saraf.</li><li><b>Pencemaran tanah</b>: akibat sampah yang sulit terurai dan pestisida berlebihan. Hanya sekitar 20% pestisida mengenai hama, sedangkan 80% jatuh ke tanah, sehingga tanah kehilangan unsur hara, tidak produktif, dan mengancam ketahanan pangan.</li></ul>","ex":"<ul><li>Agustus 2023 kualitas udara Jakarta sangat buruk sehingga pegawai Pemerintah DKI diminta bekerja dari rumah.</li><li>Sungai tertutup ganggang hijau dan ikan mati: eutrofikasi.</li><li>Petani memakai pestisida berlebihan, sehingga tahun-tahun berikutnya tanahnya kurang subur.</li></ul>","cmp":"<ul><li><b>Udara</b>: sumbernya pembakaran, akibat khasnya efek rumah kaca.</li><li><b>Air</b>: sumbernya limbah dan bahan peledak, akibat khasnya eutrofikasi.</li><li><b>Tanah</b>: sumbernya sampah dan pestisida, akibat khasnya hilangnya unsur hara.</li></ul>","mis":"<ul><li>Mengira pemanasan global terjadi murni alami. Sebagian besar akibat ulah manusia.</li><li>Mengira pencemaran hanya berasal dari pabrik. Rumah tangga juga menyumbang.</li><li>Menyamakan efek rumah kaca dengan hujan asam.</li></ul>","p":[["Zaman geologi saat manusia mulai muncul?",["Kuarter","Arkaekum","Paleozoikum","Mesozoikum"],"Manusia muncul pada zaman Kuarter."],["Gas hasil pembakaran yang memicu efek rumah kaca?",["CO₂","Oksigen","Nitrogen murni","Helium"],"CO₂ berlebih menahan panas."],["Ledakan alga akibat limbah di perairan disebut…",["Eutrofikasi","Erosi","Abrasi","Sedimentasi"],"Eutrofikasi."],["Berapa persen pestisida yang benar-benar mengenai hama?",["Sekitar 20%","Sekitar 80%","100%","0%"],"Sekitar 80% jatuh ke tanah."]],"e":[["Pada zaman apa dinosaurus punah lalu burung dan mamalia berkembang?",["Mesozoikum","Arkaekum","Kuarter","Tersier"],"Burung dan mamalia muncul setelah reptil raksasa punah di Mesozoikum."],["Efek rumah kaca membuat suhu Bumi naik karena…",["Panas Matahari terperangkap","Matahari makin dekat","Bumi berhenti berputar","Hujan berkurang"],"Panas masuk tetapi sulit dipantulkan kembali."],["Penyakit pernapasan akibat udara tercemar?",["Asma dan bronkitis","Patah tulang","Diabetes","Rabun jauh"],"Partikel pencemar mengganggu paru-paru."],["Mengapa ikan mati saat eutrofikasi?",["Oksigen di air turun","Air terlalu dingin","Ikan terlalu banyak","Air terlalu jernih"],"Alga menutup permukaan sehingga fotosintesis terhambat dan oksigen turun."],["Menangkap ikan dengan bahan peledak termasuk penyebab pencemaran…",["Air","Udara","Tanah","Cahaya"],"Itu contoh pencemaran air."],["Sekitar 80% pestisida jatuh ke tanah. Dampaknya…",["Tanah kehilangan unsur hara","Tanah menjadi subur","Hujan bertambah","Udara bersih"],"Tanah tidak produktif."],["Polusi udara dapat memicu kecelakaan lalu lintas karena…",["Jarak pandang terganggu","Jalan menyempit","Ban cepat habis","Rambu hilang"],"Udara pekat menutup pandangan."],["Dampak pencemaran tanah bagi ketahanan pangan?",["Hasil pertanian menurun","Produksi pangan melonjak","Tidak ada","Harga selalu turun"],"Tanah tak produktif mengganggu pangan."],["Pemerintah meminta pegawai bekerja dari rumah saat udara buruk. Ini contoh pengaruh pencemaran terhadap…",["Aktivitas manusia","Zaman geologi","Pasang laut","Letak astronomis"],"Pencemaran udara mengubah aktivitas."],["Interaksi manusia dengan alam disebut berdampak positif ketika…",["Logam tambang diolah menjadi kendaraan","Limbah dibuang ke sungai","Hutan dibakar","Pestisida berlebihan"],"Pemanfaatan alam yang bermanfaat."]]},"A.1.1":{"k":8,"g":"Menjelaskan perubahan dan dinamika sosial, faktor penyebabnya, jenis dinamika sosial, serta budaya dan culture shock.","core":"<p><b>Perubahan sosial</b> adalah perubahan cara berpikir, perilaku, dan alat-alat kehidupan masyarakat. Bandingkan Tugu Jogja tahun 1930 (sepeda ontel) dengan 2015 (kendaraan bermotor), atau TV tabung dengan TV pintar.</p><p><b>Dinamika sosial</b> adalah perubahan sosial dalam masyarakat (\"dinamis\" = selalu berubah). Dapat terjadi pada perorangan maupun kelompok, dan muncul bila ada interaksi dan komunikasi. <b>Faktor internal</b> (dari dalam): bertambah atau berkurangnya penduduk, konflik sosial, revolusi. <b>Faktor eksternal</b> (dari luar): bencana alam, peperangan, pengaruh budaya lain. Contoh: perpindahan penduduk desa ke kota (urbanisasi) karena lapangan kerja di kota lebih banyak.</p><p><b>Jenis dinamika sosial</b></p><ul><li><b>Difusi</b>: penyebaran unsur kebudayaan dari satu tempat ke tempat lain.</li><li><b>Akulturasi</b>: dua budaya berpadu, budaya asli masih ada.</li><li><b>Asimilasi</b>: budaya berbaur hingga ciri aslinya melebur menjadi budaya baru.</li><li><b>Sosialisasi</b>: proses mempelajari nilai dan norma masyarakat.</li><li><b>Internalisasi</b>: nilai ditanamkan ke dalam diri hingga menjadi bagian kepribadian.</li></ul><p><b>Budaya</b> mencakup ide, keyakinan, perilaku, dan produk yang membentuk cara hidup suatu kelompok. Hampir semua perilaku dipelajari, sehingga adat tiap daerah bisa berbeda (misalnya adat pernikahan dan pola asuh anak). Bertemu budaya yang sangat berbeda dapat menimbulkan <b>culture shock</b> (kebingungan). Kebiasaan yang berbeda bukan berarti salah, jadi perlu sikap saling menghargai.</p>","ex":"<ul><li>Warga desa pindah ke kota karena banyak lowongan kerja: dinamika sosial (faktor internal, perpindahan penduduk).</li><li>Mahasiswa dari Sumatra Barat kaget melihat adat pernikahan Jawa: culture shock.</li><li>Musik K-pop digemari remaja Indonesia: difusi budaya.</li></ul>","cmp":"<ul><li><b>Akulturasi</b> budaya asli masih ada, <b>asimilasi</b> budaya asli melebur.</li><li><b>Sosialisasi</b> mempelajari nilai dan norma, <b>internalisasi</b> menjadikannya bagian dari diri.</li></ul>","mis":"<ul><li>Menyamakan akulturasi dan asimilasi.</li><li>Menganggap budaya sendiri paling benar dan budaya lain aneh.</li><li>Mengira masyarakat bisa tetap tidak berubah.</li></ul>","p":[["Dinamika sosial berasal dari kata \"dinamis\" yang berarti…",["Selalu berubah","Tetap","Berhenti","Kuno"],"Dinamis = selalu berubah."],["Konflik sosial sebagai penyebab perubahan termasuk faktor…",["Internal","Eksternal","Geologis","Astronomis"],"Terjadi di dalam masyarakat."],["Penyebaran unsur budaya dari satu tempat ke tempat lain disebut…",["Difusi","Asimilasi","Internalisasi","Revolusi"],"Difusi."],["Kebingungan menghadapi budaya yang sangat berbeda disebut…",["Culture shock","Akulturasi","Sosialisasi","Difusi"],"Culture shock."]],"e":[["Contoh dinamika sosial yang disebut buku?",["Perpindahan penduduk dari desa ke kota","Terbitnya bulan","Pergantian siang malam","Gerhana"],"Urbanisasi."],["Bencana alam sebagai penyebab perubahan sosial termasuk faktor…",["Eksternal","Internal","Genetik","Moral"],"Datang dari luar masyarakat."],["Bertambahnya penduduk termasuk faktor…",["Internal","Eksternal","Astronomis","Hukum"],"Berasal dari dalam masyarakat."],["Dua budaya berpadu dan budaya asli masih ada disebut…",["Akulturasi","Asimilasi","Difusi","Culture shock"],"Akulturasi."],["Budaya berbaur hingga ciri aslinya melebur disebut…",["Asimilasi","Akulturasi","Difusi","Sosialisasi"],"Asimilasi."],["Menanamkan nilai ke dalam diri hingga menjadi kepribadian disebut…",["Internalisasi","Difusi","Akulturasi","Revolusi"],"Internalisasi."],["Mengapa adat tiap daerah bisa berbeda?",["Perilaku dipelajari dari lingkungan masing-masing","Semua orang sama","Adat diwariskan lewat gen","Adat tidak berubah"],"Perilaku adalah hasil belajar."],["Sikap yang tepat ketika menemui adat yang berbeda?",["Saling menghargai","Menertawakan","Memaksa mengubah","Menjauhi"],"Berbeda bukan berarti salah."],["Perbedaan Tugu Jogja 1930 dan 2015 menunjukkan…",["Perubahan sosial dari waktu ke waktu","Tidak ada perubahan","Bencana alam","Perang"],"Masyarakat berubah."],["Mengapa dinamika sosial disebut terjadi karena interaksi dan komunikasi?",["Perubahan muncul dari hubungan antarmanusia","Karena cuaca","Karena gempa","Karena jarak"],"Dinamika muncul dari interaksi."]]},"B.0.0":{"k":8,"g":"Membedakan SDA terbarukan dan tak terbarukan, mengenal kawasan hutan dan pemanfaatannya, serta prinsip pemanfaatan berkelanjutan.","core":"<p><b>Sumber daya alam (SDA)</b> adalah segala sesuatu dari alam yang dimanfaatkan manusia.</p><ul><li><b>SDA yang dapat diperbarui</b> bisa pulih bila dikelola baik: hutan, ikan, air. <b>SDA tidak dapat diperbarui</b> habis bila terus diambil: minyak bumi, emas, nikel, pasir.</li></ul><p><b>Kawasan hutan</b></p><ul><li><b>Hutan produksi</b>: diambil hasilnya (misalnya kayu jati).</li><li><b>Hutan lindung</b>: menjaga tata air dan mencegah erosi dan banjir.</li><li><b>Cagar alam dan suaka margasatwa</b>: melindungi flora dan fauna, termasuk yang langka.</li></ul><p><b>Contoh pemanfaatan</b>: pertambangan (minyak, emas, pasir), perikanan (nelayan tradisional memakai alat sederhana, nelayan modern memakai teknologi), energi laut (pembangkit listrik tenaga ombak), dan wisata bahari.</p><p><b>Prinsip pemanfaatan berkelanjutan</b>: manfaatkan <b>sambil melestarikan</b>. Pertambahan penduduk dan eksploitasi berlebihan membuat kebutuhan naik dan lingkungan rusak (hutan gundul, laut tercemar), sehingga SDA harus dikelola dengan bijak.</p><p><b>Pertambangan</b>: minyak bumi (diolah menjadi bahan bakar), emas, dan pasir. Penambangan sebaiknya diikuti pemulihan lahan sesudah tambang selesai. <b>Kawasan pelestarian alam</b> mencakup taman nasional, taman hutan raya, dan taman wisata alam. <b>Nelayan tradisional</b> memakai perahu dan alat sederhana, <b>nelayan modern</b> memakai kapal besar dan alat canggih. <b>Wisata bahari</b> (misalnya snorkeling) memanfaatkan laut tanpa mengambil hasilnya. Pertambahan penduduk menaikkan kebutuhan dan eksploitasi sehingga hutan dan laut rusak bila tidak dikelola.</p>","ex":"<ul><li>Hutan jati ditebang bergilir dan ditanam kembali: hutan produksi dikelola berkelanjutan.</li><li>Nelayan menangkap ikan secukupnya agar stok ikan pulih.</li><li>Ombak menggerakkan turbin untuk listrik: energi terbarukan.</li></ul>","cmp":"<ul><li><b>Hutan produksi</b> diambil hasilnya, <b>hutan lindung</b> menjaga air dan tanah, <b>cagar alam</b> melindungi flora-fauna.</li><li><b>Terbarukan</b> bisa pulih, <b>tak terbarukan</b> habis bila terus diambil.</li></ul>","mis":"<ul><li>Mengira hutan tidak mungkin habis.</li><li>Mengira semua SDA dapat diperbarui.</li><li>Mengira melestarikan berarti tidak boleh memanfaatkan sama sekali.</li></ul>","p":[["Contoh SDA yang tidak dapat diperbarui?",["Minyak bumi","Ikan","Hutan","Air hujan"],"Minyak bumi habis bila diambil terus."],["Hutan jati yang diambil kayunya termasuk…",["Hutan produksi","Hutan lindung","Cagar alam","Suaka margasatwa"],"Diambil hasilnya."],["Hutan yang menjaga tata air dan mencegah erosi?",["Hutan lindung","Hutan produksi","Tambang","Kebun"],"Hutan lindung."],["Contoh energi terbarukan dari laut?",["Pembangkit tenaga ombak","Batu bara","Minyak bumi","Gas alam"],"Ombak."]],"e":[["Kawasan yang melindungi flora dan fauna langka?",["Cagar alam","Hutan produksi","Tambang pasir","Pelabuhan"],"Cagar alam dan suaka margasatwa."],["SDA yang habis bila terus diambil?",["Tidak dapat diperbarui","Dapat diperbarui","Energi ombak","Air hujan"],"Tak terbarukan."],["Pemanfaatan SDA yang benar adalah…",["Memanfaatkan sambil melestarikan","Mengambil sebanyak-banyaknya","Menutup semua akses","Menjual semuanya"],"Berkelanjutan."],["Pertambahan penduduk tak terkendali berdampak pada…",["Kerusakan lingkungan","Naiknya cadangan SDA","Hutan makin lebat","Kebutuhan berkurang"],"Kebutuhan naik, lingkungan tertekan."],["Emas dan nikel termasuk SDA…",["Tidak dapat diperbarui","Dapat diperbarui","Hayati","Energi surya"],"Tambang tak terbarukan."],["Nelayan modern berbeda dari tradisional karena…",["Memakai teknologi","Memakai alat sederhana","Tidak melaut","Tidak menjual ikan"],"Teknologi."],["Hutan jati ditebang bergilir lalu ditanam lagi. Maksudnya?",["Dikelola berkelanjutan","Dibuang","Dilindungi penuh","Dijual selamanya"],"Menjaga pasokan kayu."],["Mengapa hutan gundul berbahaya?",["Air dan tanah tak terjaga, banjir dan erosi","Menambah oksigen","Menyuburkan laut","Mengurangi hujan jahat"],"Tata air terganggu."],["Ikan dapat diperbarui asalkan…",["Ditangkap secukupnya","Ditangkap habis","Dicemari","Ditinggalkan"],"Stok perlu pulih."],["Pembangkit tenaga ombak dianggap baik karena…",["Terbarukan dan ramah lingkungan","Memakai batu bara","Menghabiskan minyak","Mencemari laut"],"Energi bersih."],["Taman nasional termasuk…",["Kawasan pelestarian alam","Kawasan tambang","Hutan produksi","Kawasan industri"],"Dilindungi untuk pelestarian."],["Snorkeling di laut termasuk…",["Wisata bahari","Penambangan","Penebangan","Penggundulan"],"Memanfaatkan laut tanpa mengambil hasilnya."],["Pemulihan lahan setelah tambang bertujuan…",["Mengembalikan fungsi lingkungan","Menambah polusi","Menambah tambang","Menutup desa"],"Reklamasi."],["Eksploitasi hutan berlebih berdampak…",["Kerusakan lingkungan","Hutan bertambah","Banjir berhenti","Hujan reda"],"Kerusakan."]]},"A.1.3":{"k":8,"g":"Menjelaskan kehidupan manusia zaman praaksara dari Paleolitikum hingga masa logam.","core":"<p><b>Praaksara</b> adalah masa sebelum manusia mengenal tulisan. Dengan <b>akal</b>, manusia membuat teknologi dari alam (batu, tulang, kayu) untuk berburu dan mengumpulkan makanan. Para ahli membaginya secara arkeologis menjadi empat masa.</p><ul><li><b>Paleolitikum</b> (Zaman Batu Tua, sekitar 50.000–10.000 tahun SM): berburu dan mengumpulkan makanan <b>tingkat sederhana</b>, hidup berpindah-pindah (nomaden). Alat batu kasar seperti <b>kapak genggam</b>.</li><li><b>Mesolitikum</b> (Zaman Batu Madya): berburu dan meramu <b>tingkat lanjut</b>, mulai menetap sementara di pantai dan gua. Jejaknya <b>kjokkenmoddinger</b>, tumpukan sampah dapur berupa kulit kerang di pinggir pantai.</li><li><b>Neolitikum</b> (Zaman Batu Muda): mulai <b>bercocok tanam</b> dan menetap. Alat batu diasah halus, contohnya <b>beliung persegi</b> dan mata tombak.</li><li><b>Masa Logam</b>: manusia mengenal logam seperti perunggu, dibuat menjadi alat dan perhiasan.</li></ul><p>Perkembangan ini menunjukkan manusia terus berinovasi sesuai kebutuhan zamannya.</p>","ex":"<ul><li>Kapak genggam ditemukan sebagai alat berburu masa awal.</li><li>Tumpukan kulit kerang di pantai menandakan manusia Mesolitikum tinggal di dekat laut.</li><li>Perhiasan perunggu menandakan masa logam.</li></ul>","cmp":"<ul><li><b>Paleolitikum</b> berburu sederhana dan berpindah; <b>Mesolitikum</b> berburu-meramu lanjut dan semi menetap; <b>Neolitikum</b> bercocok tanam dan menetap.</li><li>Alat batu <b>kasar</b> (Paleolitikum) dan <b>diasah halus</b> (Neolitikum).</li></ul>","mis":"<ul><li>Mengira manusia purba sudah bercocok tanam sejak awal.</li><li>Menukar urutan masa praaksara.</li><li>Mengira praaksara berarti belum ada kebudayaan sama sekali.</li></ul>","p":[["Masa sebelum manusia mengenal tulisan?",["Praaksara","Sejarah","Modern","Kolonial"],"Praaksara."],["Alat khas Paleolitikum?",["Kapak genggam","Beliung persegi","Perhiasan perunggu","Gerabah halus"],"Kapak genggam."],["Kjokkenmoddinger adalah…",["Sampah dapur kulit kerang","Alat berburu","Lukisan gua","Makam"],"Tumpukan kulit kerang."],["Bercocok tanam dan menetap dimulai pada masa…",["Neolitikum","Paleolitikum","Mesolitikum","Arkaekum"],"Neolitikum."]],"e":[["Urutan masa praaksara secara arkeologis?",["Paleolitikum, Mesolitikum, Neolitikum, Logam","Logam, Neolitikum, Mesolitikum, Paleolitikum","Neolitikum, Logam, Paleolitikum, Mesolitikum","Mesolitikum, Paleolitikum, Logam, Neolitikum"],"Dari tua ke muda."],["Cara hidup Paleolitikum?",["Berburu dan mengumpulkan makanan tingkat sederhana","Bercocok tanam menetap","Berdagang antarpulau","Membuat perhiasan emas"],"Nomaden."],["Mengapa manusia Paleolitikum hidup berpindah?",["Mengikuti keberadaan hewan buruan dan makanan","Menyukai perjalanan","Takut tanah","Tidak punya akal"],"Makanan mudah habis di satu tempat."],["Bukti manusia Mesolitikum tinggal dekat pantai?",["Kjokkenmoddinger","Beliung persegi","Perhiasan perunggu","Candi"],"Sampah kerang."],["Beliung persegi termasuk peninggalan masa…",["Neolitikum","Paleolitikum","Mesolitikum","Logam saja"],"Alat diasah halus."],["Perhiasan perunggu termasuk masa…",["Logam","Paleolitikum","Mesolitikum","Neolitikum awal"],"Bahan logam."],["Alat batu diasah halus menandakan…",["Kemajuan teknologi","Kemunduran","Tidak ada","Kerusakan"],"Teknologi berkembang."],["Bahan alat praaksara yang disebut buku?",["Batu, tulang, kayu","Plastik, baja, kaca","Karet, kertas, kain","Semen, besi, beton"],"Bahan dari alam."],["Perubahan dari berburu ke bercocok tanam berdampak pada…",["Kehidupan menetap","Hidup nomaden","Tak ada","Penghapusan alat"],"Menetap karena menanam."],["Manusia dapat membuat teknologi sederhana karena memiliki…",["Akal","Bulu tebal","Sayap","Insang"],"Akal dan indra."]]},"A.1.4":{"k":8,"g":"Menjelaskan kebutuhan, kelangkaan, skala prioritas, biaya peluang, masalah pokok ekonomi, dan SDGs.","core":"<p><b>Kebutuhan</b> adalah sesuatu yang harus dipenuhi agar hidup layak, sedangkan <b>keinginan</b> adalah hasrat yang belum tentu wajib dipenuhi. Menurut tingkat kepentingannya, kebutuhan dibagi tiga: <b>primer</b> (pangan, sandang, papan), <b>sekunder</b> (pelengkap, misalnya sepeda), dan <b>tersier</b> (mewah). Kebutuhan juga dipengaruhi lingkungan; misalnya orang di pegunungan membutuhkan pakaian hangat.</p><p><b>Kelangkaan</b> terjadi karena kebutuhan manusia <b>tak terbatas</b>, tetapi alat pemuas kebutuhan <b>terbatas</b>. Langka tidak sama dengan mahal. Karena terbatas, orang harus memilih memakai <b>skala prioritas</b> (urutan kebutuhan dari yang terpenting). Setiap pilihan menimbulkan <b>biaya peluang</b>, yaitu nilai pilihan terbaik yang dikorbankan.</p><p><b>Masalah pokok ekonomi</b> ada tiga: <b>apa</b> yang diproduksi, <b>bagaimana</b> cara memproduksinya, dan <b>untuk siapa</b> barang itu diproduksi.</p><p><b>SDGs</b> (<i>Sustainable Development Goals</i>) atau Tujuan Pembangunan Berkelanjutan disepakati dunia tahun 2015. Isinya 17 tujuan yang ditargetkan tercapai tahun 2030, dengan empat pilar: sosial, ekonomi, lingkungan, serta hukum dan tata kelola. Intinya, kebutuhan sekarang dipenuhi tanpa mengorbankan kebutuhan generasi mendatang.</p>","ex":"<ul><li>Uang saku Rp20.000 dipakai membeli buku sehingga tidak bisa jajan. Jajan yang dikorbankan adalah biaya peluangnya.</li><li>Ani membeli sepatu sekolah dahulu (primer) sebelum game baru (tersier): skala prioritas.</li><li>Desa memakai tenaga manusia membuat bata merah: contoh jawaban atas pertanyaan \"bagaimana\" memproduksi.</li></ul>","cmp":"<ul><li><b>Langka</b> = jumlah terbatas dibanding kebutuhan; <b>mahal</b> = harga tinggi.</li><li><b>Kebutuhan</b> wajib dipenuhi; <b>keinginan</b> tidak selalu.</li></ul>","mis":"<ul><li>Menyamakan langka dan mahal.</li><li>Mengira biaya peluang selalu berupa uang.</li><li>Menganggap SDGs hanya urusan pemerintah.</li></ul>","p":[["Kelangkaan terjadi karena…",["Kebutuhan tak terbatas, alat pemuas terbatas","Barang terlalu murah","Semua orang kaya","Produksi berlebih"],"Alat pemuas terbatas."],["Pangan, sandang, papan termasuk kebutuhan…",["Primer","Sekunder","Tersier","Mewah"],"Kebutuhan pokok."],["Biaya peluang adalah…",["Nilai pilihan terbaik yang dikorbankan","Harga barang","Pajak","Keuntungan"],"Yang dikorbankan saat memilih."],["SDGs memiliki berapa tujuan?",["17","7","10","30"],"17 tujuan."]],"e":[["Mengapa orang harus membuat pilihan?",["Sumber daya terbatas","Barang selalu murah","Kebutuhan sedikit","Tidak ada penjual"],"Karena kelangkaan."],["Kebutuhan mewah disebut…",["Tersier","Primer","Sekunder","Pokok"],"Mewah = tersier."],["Tiga masalah pokok ekonomi?",["Apa, bagaimana, untuk siapa","Kapan, di mana, siapa","Beli, jual, simpan","Pajak, bunga, laba"],"Tiga pertanyaan pokok."],["Barang melimpah tetapi mahal. Pernyataan tepat?",["Mahal tidak sama dengan langka","Mahal pasti langka","Langka pasti murah","Langka berarti gratis"],"Mahal ≠ langka."],["Sepeda untuk ke sekolah termasuk kebutuhan…",["Sekunder","Primer","Tersier","Bukan kebutuhan"],"Pelengkap."],["Skala prioritas dipakai untuk…",["Mengurutkan kebutuhan terpenting","Menaikkan harga","Menghitung pajak","Menjual barang"],"Mengurutkan kebutuhan."],["Uang hanya cukup untuk makan atau game. Pilihan bijak?",["Makan, karena primer","Game, karena tersier","Keduanya","Tidak memilih"],"Primer didahulukan."],["SDGs ditargetkan tercapai pada tahun…",["2030","2015","2045","2100"],"Target 2030."],["Intinya SDGs adalah…",["Memenuhi kebutuhan kini tanpa merugikan generasi mendatang","Menghabiskan sumber daya","Menutup industri","Menghentikan ekonomi"],"Pembangunan berkelanjutan."],["Orang di pegunungan membutuhkan pakaian hangat. Ini menunjukkan kebutuhan…",["Dipengaruhi lingkungan","Tidak berubah","Hanya soal gengsi","Sama di mana saja"],"Lingkungan memengaruhi kebutuhan."]]},"B.0.1":{"k":8,"g":"Menjelaskan potensi dan tantangan Indonesia menjadi negara maju, termasuk bonus demografi dan hilirisasi.","core":"<p><b>Negara maju</b> ditandai pendapatan penduduk tinggi, ekonomi kuat, teknologi dan pendidikan maju, kesehatan baik, serta infrastruktur memadai. Indonesia bercita-cita menjadi negara maju pada 100 tahun kemerdekaan (<b>Indonesia Emas 2045</b>).</p><p><b>Potensi Indonesia</b></p><ul><li><b>Sumber daya alam</b> melimpah: perkebunan kopi, hasil perikanan, kayu jati, minyak bumi, nikel, sinar matahari (panel surya), dan flora unik seperti Rafflesia arnoldii.</li><li><b>Sumber daya manusia</b>: pengembangan sains seperti bioteknologi di laboratorium.</li><li><b>Bonus demografi</b>: kondisi ketika penduduk usia produktif (15–64 tahun) jauh lebih banyak daripada usia nonproduktif. Bila dibekali pendidikan dan keterampilan, ini menjadi tenaga penggerak ekonomi. Infrastruktur seperti kereta cepat dibangun untuk menjawab peluang ini.</li><li><b>Hilirisasi</b>: mengolah bahan mentah menjadi barang bernilai tambah, misalnya sawit menjadi biodiesel dan nikel menjadi bahan baterai.</li></ul><p><b>Tantangan</b>: kualitas pendidikan dan keterampilan SDM, pemerataan infrastruktur, kelestarian lingkungan, dan ketergantungan pada ekspor bahan mentah.</p>","ex":"<ul><li>Minyak sawit diolah menjadi biodiesel: hilirisasi menambah nilai jual.</li><li>Remaja usia produktif yang terampil digital: modal bonus demografi.</li><li>Kereta cepat memangkas waktu tempuh: infrastruktur pendukung ekonomi.</li></ul>","cmp":"<ul><li><b>Bahan mentah</b> dijual apa adanya bernilai kecil; <b>hilirisasi</b> mengolahnya sehingga bernilai lebih tinggi.</li><li><b>Bonus demografi</b> menjadi peluang bila SDM berkualitas, tetapi menjadi beban bila banyak penganggur.</li></ul>","mis":"<ul><li>Mengira bonus demografi otomatis membawa kemakmuran.</li><li>Mengira kaya SDA berarti pasti maju.</li><li>Mengira hilirisasi berarti berhenti menambang.</li></ul>","p":[["Usia produktif dalam bonus demografi?",["15–64 tahun","0–10 tahun","65 tahun ke atas","Hanya 20 tahun"],"Usia 15–64 tahun."],["Mengolah sawit menjadi biodiesel disebut…",["Hilirisasi","Eksploitasi","Urbanisasi","Impor"],"Menambah nilai tambah."],["Target Indonesia Emas?",["2045","2030","2025","2100"],"100 tahun merdeka."],["Rafflesia arnoldii adalah contoh…",["Flora unik Indonesia","Barang tambang","Alat berat","Mata uang"],"Flora endemik."]],"e":[["Ciri negara maju?",["Pendapatan tinggi, teknologi dan pendidikan maju","Banyak penganggur","Infrastruktur terbatas","Bergantung bahan mentah"],"Ciri umum negara maju."],["Bonus demografi terjadi ketika…",["Usia produktif jauh lebih banyak dari nonproduktif","Penduduk berkurang","Semua penduduk lansia","Tak ada pekerja"],"Rasio produktif tinggi."],["Agar bonus demografi bermanfaat diperlukan…",["Pendidikan dan keterampilan SDM","Menambah pengangguran","Menutup sekolah","Mengurangi lapangan kerja"],"SDM berkualitas."],["Bahan mentah nikel diolah menjadi bahan baterai. Ini…",["Hilirisasi","Impor","Boikot","Devaluasi"],"Nilai tambah."],["Manfaat hilirisasi?",["Nilai jual naik dan lapangan kerja bertambah","Harga turun terus","Bahan baku habis seketika","Ekspor berhenti"],"Menambah nilai tambah."],["Panel surya memanfaatkan…",["Sinar matahari","Angin laut","Batu bara","Minyak bumi"],"Energi surya."],["Tantangan menuju negara maju?",["Kualitas SDM dan pemerataan infrastruktur","Terlalu banyak sekolah","Terlalu murah","Terlalu cerah"],"Dua tantangan utama."],["Mengapa hanya menjual bahan mentah kurang menguntungkan?",["Nilai tambahnya kecil","Terlalu laris","Tak ada pembeli","Terlalu murah dibuat"],"Barang olahan lebih bernilai."],["Kereta cepat dibangun untuk…",["Memperlancar mobilitas dan ekonomi","Mengurangi penduduk","Menutup jalan","Menaikkan pajak"],"Infrastruktur."],["Seorang remaja rajin belajar keterampilan digital. Ini mendukung…",["Pemanfaatan bonus demografi","Pencemaran","Konflik","Isolasi"],"SDM produktif."]]},"B.0.2":{"k":8,"g":"Menjelaskan pengertian, fungsi, dan jenis toponimi serta contoh asal-usul nama tempat.","core":"<p><b>Toponimi</b> adalah ilmu yang mempelajari <b>asal-usul nama tempat</b> (kota, desa, sungai, jalan, gunung). Nama tempat bukan sekadar label; ia menyimpan <b>jejak sejarah, budaya, dan kondisi alam</b> daerah itu.</p><p><b>Fungsi toponimi</b>: sebagai identitas tempat, menyimpan sejarah, memudahkan orang mencari dan menunjuk lokasi, serta menjaga budaya lokal.</p><p><b>Asal nama tempat</b> umumnya berkaitan dengan tiga aspek:</p><ul><li><b>Aspek fisik/alam</b>: bentuk muka bumi, air, tumbuhan, hewan (misalnya Kebon Jeruk, Banyuwangi).</li><li><b>Aspek sosial</b>: kegiatan, mata pencaharian, atau kelompok penduduk (misalnya Pasar Minggu).</li><li><b>Aspek budaya dan sejarah</b>: tokoh, peristiwa, atau kepercayaan (misalnya Jayakarta).</li></ul><p>Nama tempat dapat <b>berubah</b> mengikuti sejarah. Contoh: Jayakarta menjadi <b>Batavia</b> pada masa VOC, lalu menjadi <b>Jakarta</b>. Mengetahui asal nama membuat kita lebih menghargai identitas tempat tinggal.</p>","ex":"<ul><li>Banyuwangi dari \"banyu\" (air) dan \"wangi\" (harum), sesuai legenda daerahnya.</li><li>Kebon Jeruk: dulu dikenal karena kebun jeruk (aspek fisik/tumbuhan).</li><li>Peta lama Jakarta bertuliskan Batavia: bukti perubahan nama.</li></ul>","cmp":"<ul><li>Nama dari <b>alam</b> (air, tumbuhan), dari <b>kegiatan sosial</b> (pasar), dari <b>sejarah/tokoh</b> (peristiwa).</li><li><b>Toponimi</b> mempelajari nama tempat, <b>topografi</b> mempelajari bentuk muka bumi.</li></ul>","mis":"<ul><li>Mengira nama tempat tidak punya makna.</li><li>Mengira nama tempat tidak pernah berubah.</li><li>Menyamakan toponimi dengan peta biasa.</li></ul>","p":[["Toponimi mempelajari…",["Asal-usul nama tempat","Cuaca harian","Jenis tanah","Harga barang"],"Asal nama tempat."],["Batavia kini bernama…",["Jakarta","Bandung","Surabaya","Medan"],"Jayakarta, Batavia, Jakarta."],["Nama tempat yang berasal dari tumbuhan termasuk aspek…",["Fisik/alam","Sosial","Politik","Hukum"],"Tumbuhan adalah unsur alam."],["Banyuwangi dari kata banyu dan wangi. Banyu berarti…",["Air","Api","Angin","Tanah"],"Banyu = air."]],"e":[["Fungsi toponimi?",["Menyimpan identitas dan sejarah tempat","Menghitung pajak","Mengukur suhu","Menentukan harga"],"Identitas dan sejarah."],["Nama Pasar Minggu berkaitan dengan aspek…",["Sosial (kegiatan pasar)","Fisik","Geologis","Astronomis"],"Kegiatan pasar mingguan."],["Jayakarta menjadi Batavia pada masa…",["VOC","Kerajaan Kutai","Mataram Kuno","Kemerdekaan"],"Masa VOC."],["Nama tempat bisa berubah karena…",["Perubahan sejarah dan pemerintahan","Gempa saja","Cuaca","Musim"],"Mengikuti sejarah."],["Banyuwangi menurut legenda berarti…",["Air yang harum","Api yang besar","Angin kencang","Tanah subur"],"Banyu + wangi."],["Mengapa toponimi penting bagi budaya lokal?",["Menjaga identitas tempat","Menghapus budaya","Menambah pajak","Mengganti bahasa"],"Merawat identitas."],["Nama kampung dari bentuk bukit termasuk aspek…",["Fisik","Sosial","Hukum","Ekonomi"],"Muka bumi."],["Peta lama bertuliskan Batavia menunjukkan…",["Perubahan n
