<script>
// ===== DATA =====
const C=[
['A','Kelas 7 · Semester 1','Target: memahami lingkungan sekitar, kegiatan ekonomi, interaksi sosial, sejarah, praaksara, dan pembangunan berkelanjutan (Buku IPS Kemendikbud Kelas VII, Tema I-II).',[['Tema I · Kehidupan Sosial & Kondisi Lingkungan',['Mengenal lokasi tempat tinggal','Konektivitas antarruang','Perubahan iklim','Potensi bencana alam','Kegiatan ekonomi','Interaksi sosial','Konsep dasar ilmu sejarah']],['Tema II · Keberagaman Lingkungan Sekitar',['Alam & pencemaran lingkungan','Dinamika sosial & budaya','Melestarikan lingkungan','Manusia zaman praaksara','Pembangunan berkelanjutan & masalah pokok ekonomi']]]],
['B','Kelas 7 · Semester 2','Target: memahami potensi SDA, pelaku ekonomi, status sosial, keragaman budaya, sejarah lokal, keuangan, dan pemberdayaan masyarakat (Tema III-IV).',[['Tema III · Potensi Ekonomi Lingkungan',['SDA: hutan dan tambang','SDA kemaritiman & perdagangan internasional','Potensi Indonesia menjadi negara maju','Toponimi','Pelaku ekonomi','Pasar','Harga','Status & peran sosial']],['Tema IV · Pemberdayaan Masyarakat',['Keragaman budaya & faktor geografis','Jenis keragaman & warisan budaya','Sejarah lokal & keteladanan tokoh','Permasalahan sosial budaya','Uang, pendapatan, tabungan & investasi','Literasi & pengelolaan keuangan','Lembaga keuangan & ekonomi digital','Komunitas & pemberdayaan masyarakat']]]],
['C','Kelas 8 · Semester 1','Target: memahami kondisi geografis, SDA dan SDM, lembaga sosial, kerajaan Hindu-Buddha dan Islam, ekonomi dan kependudukan (Buku IPS Kemendikbud Kelas VIII, Tema 1-2).',[['Tema 1 · Kondisi Geografis & Pelestarian SDA',['Letak geografis & iklim Indonesia','Geografi dan keragaman sosial budaya','Potensi & pemanfaatan SDA','Sumber daya manusia','Lembaga sosial & norma','Peran lembaga sosial','Interaksi dengan bangsa asing','Hindu-Buddha di Nusantara']],['Tema 2 · Kemajemukan Masyarakat Indonesia',['Pengaruh cuaca & iklim','Bentuk muka bumi','Aktivitas ekonomi & lingkungan','Perdagangan antarpulau','Dinamika penduduk','Keragaman masyarakat','Mobilitas sosial','Interaksi budaya Islam']]]],
['D','Kelas 8 · Semester 2','Target: memahami penjajahan, pergerakan kebangsaan, kemerdekaan, lembaga keuangan, konflik dan integrasi, serta pembangunan ekonomi (Buku IPS Kemendikbud Kelas VIII, Tema 3-4).',[['Tema 3 · Nasionalisme & Jati Diri Bangsa',['Penjelajahan samudra','Kolonialisme & imperialisme','Perubahan akibat penjajahan Barat & Jepang','Organisasi pergerakan','Proses kemerdekaan','Pemerataan pembangunan & lembaga keuangan','Konflik sosial','Integrasi sosial']],['Tema 4 · Pembangunan Perekonomian Indonesia',['Ekonomi awal kemerdekaan','Ekonomi Orde Baru','Ekonomi masa Reformasi','Ekspor dan impor','Kerja sama ekonomi antarnegara','Iptek dan ekonomi','Dampak dinamika penduduk']]]],
['E','Kelas 9 · Semester 1','Target: memahami pergerakan nasional dan kemerdekaan.',[['Bab 9 · Pergerakan Nasional',['Organisasi pergerakan','Sumpah Pemuda']],['Bab 10 · Kemerdekaan',['Proklamasi 17 Agustus 1945']]]],
['F','Kelas 9 · Semester 2','Target: memahami globalisasi dan ekonomi dunia.',[['Bab 11 · Globalisasi',['Globalisasi & dampaknya']],['Bab 12 · Ekonomi Global',['Kerja sama ekonomi global']]]]];
const R=(a,b)=>`<ruby>${a}<rt>${b}</rt></ruby>`;
const T=(n,rows)=>`<div class=t><table>${rows.map(r=>'<tr>'+r.map(x=>`<td class=jp>${x}</td>`).join('')+'</tr>').join('')}</table></div>`;
const CT={"C.0.0":{"k":8,"g":"Menjelaskan letak geografis, astronomis, dan geologis Indonesia, zona waktu, serta pengaruh letak terhadap iklim.","core":"<p>Indonesia negara terluas di Asia Tenggara: daratan ±1,9 juta km² dan lautan ±5,8 juta km². Letaknya dapat dilihat dari tiga sisi.</p><ul><li><b>Letak geografis</b>: posisi berdasarkan kenyataan di permukaan bumi, yaitu di antara dua benua (<b>Asia dan Australia</b>) dan dua samudra (<b>Hindia dan Pasifik</b>).</li><li><b>Letak astronomis</b>: posisi berdasarkan garis lintang dan bujur, yaitu 6°LU–11°LS dan 95°BT–141°BT (sebagian buku menulis 144°BT). Akibatnya ada perbedaan waktu: <b>WIB, WITA, WIT</b>, masing-masing berselisih 1 jam, sehingga WIT lebih awal 2 jam dari WIB. Zona waktu ini ditetapkan sejak 1 Januari 1988.</li><li><b>Letak geologis</b>: posisi berdasarkan struktur batuan. Indonesia dilalui Sirkum Pasifik dan Sirkum Mediterania dengan 127 gunung api aktif, dan berada di pertemuan tiga lempeng: Eurasia (utara), Indo-Australia (selatan), Pasifik (timur). Pertemuan lempeng membuat banyak gunung api dan rawan gempa.</li></ul><p><b>Cuaca dan iklim</b>: iklim tropis dengan musim hujan (Oktober–Maret) dan kemarau (April–September). Angin lembap dari Samudra Pasifik lewat Laut Cina Selatan membawa hujan ke barat; makin ke timur hujan makin sedikit. Tidak semua daerah sama: savana di Nusa Tenggara punya kemarau lebih panjang. Matahari bersinar sepanjang tahun di seluruh Indonesia.</p>","ex":"<ul><li>Pukul 06.00 di Aceh (WIB), maka di Bali (WITA) pukul 07.00 dan di Papua (WIT) pukul 08.00.</li><li>Kalimantan hampir tidak punya gunung api, sedangkan Jawa dan Sumatra banyak.</li></ul>","cmp":"<ul><li><b>Geografis</b> = benua dan samudra, <b>astronomis</b> = lintang dan bujur, <b>geologis</b> = struktur batuan dan lempeng.</li></ul>","mis":"<ul><li>Menukar letak astronomis dengan geografis.</li><li>Mengira seluruh Indonesia mengalami musim yang sama.</li><li>Mengira gunung api tersebar merata di semua pulau.</li></ul>","p":[["Letak yang dilihat dari lintang dan bujur?",["Astronomis","Geografis","Geologis","Relatif"],"Astronomis."],["Indonesia berada di antara dua benua…",["Asia dan Australia","Eropa dan Afrika","Amerika dan Asia","Antartika dan Asia"],"Asia dan Australia."],["Selisih WIT dengan WIB?",["2 jam","1 jam","3 jam","Tidak ada"],"WIT lebih awal 2 jam."],["Jumlah gunung api aktif?",["127","27","227","12"],"127 gunung api."]],"e":[["Dua samudra yang mengapit Indonesia?",["Hindia dan Pasifik","Atlantik dan Arktik","Pasifik dan Atlantik","Hindia dan Arktik"],"Hindia dan Pasifik."],["Zona waktu Indonesia ditetapkan sejak…",["1 Januari 1988","17 Agustus 1945","1 Juni 1945","1 Januari 2000"],"Sejak 1988."],["Letak geologis ditentukan oleh…",["Struktur batuan dan lempeng","Lintang dan bujur","Benua dan samudra","Jumlah penduduk"],"Struktur geologi."],["Tiga lempeng di sekitar Indonesia?",["Eurasia, Indo-Australia, Pasifik","Afrika, Eurasia, Pasifik","Amerika, Asia, Eropa","Pasifik, Atlantik, Hindia"],"Tiga lempeng."],["Mengapa hujan di Indonesia barat lebih banyak?",["Angin lembap dari Pasifik melewati wilayah barat lebih dulu","Barat dekat gurun","Tak ada gunung","Timur lebih dingin"],"Hujan banyak jatuh di barat."],["Savana di Nusa Tenggara menunjukkan…",["Tidak semua daerah mengalami musim yang sama","Seluruh Indonesia sama","Tak ada kemarau","Selalu hujan"],"Iklim bervariasi."],["Pukul 06.00 di Aceh. Di Papua pukul…",["08.00","07.00","06.00","05.00"],"WIT = WIB + 2."],["Musim hujan umumnya…",["Oktober–Maret","April–September","Mei–Juli","Juni–Agustus"],"Okt–Mar."],["Rawannya Indonesia terhadap gempa berkaitan dengan letak…",["Geologis","Astronomis","Geografis saja","Relatif"],"Pertemuan lempeng."],["Matahari bersinar sepanjang tahun karena Indonesia berada di wilayah…",["Tropis","Kutub","Subtropis","Gurun"],"Iklim tropis."]]},"D.0.0":{"k":8,"g":"Menjelaskan faktor, tokoh, dan tujuan penjelajahan samudra bangsa Eropa serta pengaruh kondisi geografis Nusantara.","core":"<p><b>Penjelajahan samudra</b> adalah pelayaran bangsa Eropa mencari sumber rempah dan kekayaan. Faktor pendorongnya: jatuhnya <b>Konstantinopel ke tangan Turki Utsmani (1453)</b> yang memutus jalur dagang Eropa–Asia, semangat Renaisans, dan teknologi (kompas, kapal karavel). Motif umumnya <b>3G: Gold, Gospel, Glory</b>.</p><ul><li><b>Portugis</b>: Vasco da Gama tiba di Kalikut, India (1498); Portugis merebut <b>Malaka (1511)</b>.</li><li><b>Spanyol</b>: pelayaran Magellan dan awaknya mencapai Maluku (1521).</li><li><b>Belanda</b>: Cornelis de Houtman tiba di Banten (1596); VOC didirikan 1602.</li></ul><p>Untuk menghindari persaingan, Portugis dan Spanyol membagi dunia lewat <b>Perjanjian Tordesillas (1494)</b>.</p><p><b>Pengaruh kondisi geografis</b>: Maluku adalah penghasil cengkih dan pala, Nusantara berada di jalur Selat Malaka, dan angin muson memudahkan pelayaran. Itulah yang membuat Nusantara diincar bangsa Eropa.</p>","ex":"<ul><li>Pedagang Eropa berebut cengkih dan pala di Maluku karena harganya sangat tinggi di Eropa.</li><li>Pelabuhan Malaka yang strategis direbut Portugis tahun 1511.</li></ul>","cmp":"<ul><li><b>Gold</b> kekayaan, <b>Gospel</b> penyebaran agama, <b>Glory</b> kejayaan.</li></ul>","mis":"<ul><li>Mengira Belanda bangsa Eropa pertama di Nusantara (Portugis lebih dulu).</li><li>Menukar Portugis dan Spanyol.</li><li>Mengira tujuan mereka hanya berdagang.</li></ul>","p":[["Bangsa Eropa pertama yang merebut Malaka?",["Portugis","Belanda","Spanyol","Inggris"],"Portugis 1511."],["Arti 3G?",["Gold, Gospel, Glory","Gula, Garam, Gandum","Gunung, Gurun, Gua","Giat, Gigih, Gagah"],"3G."],["Pelayaran Belanda pertama ke Banten dipimpin…",["Cornelis de Houtman","Vasco da Gama","Magellan","Drake"],"1596."],["Daerah penghasil cengkih dan pala?",["Maluku","Jawa Barat","Sumatra Barat","Bali"],"Maluku."]],"e":[["Peristiwa yang memutus jalur dagang Eropa–Asia?",["Jatuhnya Konstantinopel 1453","Perang Dunia I","Revolusi Industri","Proklamasi"],"1453."],["Alat navigasi yang membantu penjelajahan?",["Kompas","Radio","Telepon","Radar"],"Kompas."],["Perjanjian pembagian dunia Portugis–Spanyol?",["Tordesillas","Bongaya","Giyanti","Linggarjati"],"1494."],["VOC didirikan tahun…",["1602","1511","1596","1945"],"1602."],["Vasco da Gama tiba di…",["Kalikut, India","Banten","Malaka","Maluku"],"1498."],["Spanyol mencapai Maluku pada tahun…",["1521","1596","1945","1602"],"Magellan dan awaknya."],["Mengapa Maluku diincar bangsa Eropa?",["Penghasil rempah bernilai tinggi","Penghasil emas saja","Tak ada penduduk","Dekat Eropa"],"Rempah."],["Angin muson berguna bagi…",["Pelayaran antarwilayah","Pertanian saja","Penambangan","Penerbangan"],"Memudahkan berlayar."],["Letak Selat Malaka penting karena…",["Jalur pelayaran dan dagang dunia","Jauh dari laut","Hanya jalur perang","Tidak ada kapal"],"Jalur strategis."],["Motif Gospel dalam penjelajahan berarti…",["Menyebarkan agama","Mencari emas","Meraih kejayaan","Berdagang gula"],"Agama."]]},"F.0.0":{"k":5,"g":"Menjelaskan globalisasi, pendorong, dan dampaknya.","core":"<p>Globalisasi = proses mendunianya hubungan antarbangsa dalam ekonomi, budaya, dan informasi. Pendorong utama: teknologi komunikasi dan transportasi.</p><p><b>Positif</b>: akses informasi, pasar luas. <b>Negatif</b>: budaya asing tak tersaring, gaya hidup konsumtif, persaingan ketat.</p>","ex":"<p>Belanja daring lintas negara, media sosial, dan batik yang dikenal dunia.</p>","cmp":"Globalisasi berbeda dari westernisasi: pengaruhnya dua arah, budaya lokal juga bisa mendunia.","mis":"Menganggap globalisasi pasti buruk atau pasti baik; menyamakan dengan westernisasi.","p":[["Pendorong utama globalisasi?",["Teknologi komunikasi dan transportasi","Bencana alam","Perang saudara","Pajak"],"Teknologi."],["Dampak positif globalisasi?",["Akses informasi luas","Budaya hilang","Konsumtif","Ketergantungan"],"Akses informasi."],["Sikap bijak menghadapi budaya asing?",["Menyaring sesuai jati diri","Menolak semua","Menerima semua","Mengabaikan"],"Disaring."]],"e":[["Globalisasi adalah…",["Mendunianya hubungan antarbangsa","Penutupan perbatasan","Bencana global","Perang dunia"],"Definisi."],["Contoh dampak negatif?",["Gaya hidup konsumtif","Pasar lebih luas","Info cepat","Kerja sama"],"Konsumtif."],["Globalisasi bersifat…",["Dua arah","Searah dari Barat","Hanya ekonomi","Hanya militer"],"Dua arah."],["Belanja daring lintas negara contoh globalisasi di bidang…",["Ekonomi","Militer","Agama","Hukum pidana"],"Ekonomi."],["Cara memperkuat jati diri?",["Melestarikan budaya lokal","Meniru semuanya","Menutup internet","Melarang impor"],"Lestarikan budaya lokal."]]},"C.0.1":{"k":8,"g":"Menjelaskan pengaruh faktor geografis terhadap keragaman sosial budaya dan tujuh unsur kebudayaan.","core":"<p><b>Budaya</b> mencakup cara hidup, cara berpakaian, adat istiadat, mata pencaharian, tata upacara keagamaan, dan benda hasil budaya (senjata, alat bajak sawah, tempat tinggal). Budaya diperoleh lewat pembelajaran, bukan naluri. Perbedaan budaya dipengaruhi sejarah, keturunan, keyakinan, dan <b>faktor geografis</b>.</p><ul><li><b>Isolasi geografis</b>: Indonesia negara kepulauan; laut memisahkan kelompok, terlebih ketika teknologi pelayaran terbatas, sehingga budaya berkembang sendiri.</li><li><b>Iklim</b>: mikro iklim beragam; perbedaan ketinggian membuat suhu berbeda. Warga pesisir utara Jawa umumnya nelayan, warga pegunungan umumnya petani.</li><li><b>Letak geografis strategis</b>: di persilangan dua benua dan dua samudra, di jalur Selat Malaka, sehingga banyak dilalui bangsa asing dan terjadi pertukaran budaya.</li></ul><p><b>Tujuh unsur kebudayaan</b>: bahasa, sistem pengetahuan, organisasi sosial, peralatan hidup dan teknologi, mata pencaharian, religi, kesenian. Contoh: <b>kapal pinisi</b> (suku Bugis dan Luwu, Sulawesi Selatan, sudah ada sebelum abad ke-16) menjadi simbol Indonesia sebagai negara maritim. Nenek moyang bangsa Indonesia datang dari Yunan, Tiongkok.</p>","ex":"<ul><li>Pinisi lahir dari kedekatan masyarakat Bugis dengan laut.</li><li>Nelayan pesisir utara Jawa dan petani pegunungan hidup berbeda karena kondisi alamnya berbeda.</li></ul>","cmp":"<ul><li><b>Isolasi</b> membuat budaya berbeda, <b>letak strategis</b> mempertemukan budaya.</li></ul>","mis":"<ul><li>Mengira budaya hanya tarian dan pakaian.</li><li>Mengira budaya terbawa sejak lahir (naluri).</li><li>Mengira geografi tidak memengaruhi budaya.</li></ul>","p":[["Laut yang memisahkan kelompok disebut…",["Isolasi geografis","Akulturasi","Difusi","Asimilasi"],"Isolasi geografis."],["Kapal pinisi berasal dari suku…",["Bugis dan Luwu","Jawa","Batak","Dayak"],"Sulawesi Selatan."],["Warga pesisir utara Jawa umumnya…",["Nelayan","Petani teh","Penambang","Peternak sapi perah"],"Dekat laut."],["Berapa unsur kebudayaan?",["Tujuh","Tiga","Lima","Sepuluh"],"Tujuh unsur."]],"e":[["Budaya diperoleh melalui…",["Pembelajaran","Naluri","Keturunan semata","Cuaca"],"Bukan naluri."],["Perbedaan budaya dipengaruhi…",["Sejarah, keturunan, keyakinan, geografis","Hanya gempa","Hanya harga","Hanya angin"],"Beberapa faktor."],["Mikro iklim beragam artinya…",["Perbedaan ketinggian menghasilkan suhu berbeda","Semua daerah sama","Tak ada hujan","Selalu dingin"],"Ketinggian memengaruhi suhu."],["Letak strategis di jalur Selat Malaka menyebabkan…",["Banyak dilalui bangsa asing dan pertukaran budaya","Terisolasi","Tak ada pelaut","Tak ada pedagang"],"Persilangan jalur."],["Salah satu unsur budaya?",["Sistem religi","Pajak","Zona waktu","Cuaca"],"Religi termasuk."],["Kapal pinisi menjadi simbol…",["Negara maritim","Negara agraris","Negara industri","Negara kutub"],"Tradisi kelautan."],["Nenek moyang Indonesia berasal dari…",["Yunan, Tiongkok","Arab","Eropa","Australia"],"Dari Yunan."],["Mengapa budaya antarpulau bisa berbeda?",["Laut memisahkan dan lingkungan berbeda","Penduduknya sama","Tak ada laut","Tak ada budaya"],"Isolasi dan lingkungan."],["Contoh benda hasil budaya?",["Alat bajak sawah","Hujan","Gunung","Matahari"],"Buatan manusia."],["Teknologi pelayaran yang terbatas dulu membuat…",["Kelompok sulit berpindah antarpulau","Semua pulau bersatu","Tidak ada perahu","Budaya seragam"],"Isolasi."]]},"C.0.2":{"k":8,"g":"Menjelaskan potensi dan pemanfaatan sumber daya alam, tahapan pertambangan, dan dampak eksploitasi berlebihan.","core":"<p><b>Sumber daya alam</b> adalah segala sesuatu di udara, daratan, dan perairan yang dapat dimanfaatkan untuk memenuhi kebutuhan manusia. Menurut kelestariannya: <b>dapat diperbarui</b> (air, tanah, hutan) dan <b>tidak dapat diperbarui</b> (minyak bumi, batu bara). Potensi Indonesia mencakup <b>hutan</b>, <b>tambang</b>, dan <b>kemaritiman</b>.</p><p>Contoh tambang: tambang Freeport di Papua memiliki cadangan <b>tembaga, emas, dan perak</b>. Tahapan pertambangan secara umum: <b>prospeksi</b> (mencari endapan bahan galian), <b>eksplorasi</b> (mengetahui ukuran, bentuk, posisi, kadar, dan besar cadangan), <b>eksploitasi</b> (penambangan), lalu pengolahan dan pemasaran.</p><p><b>Dampak pemanfaatan berlebihan</b>: penduduk bertambah, konsumsi naik, eksploitasi SDA berlebih, lalu terjadi pencemaran dan kerusakan lingkungan, sehingga potensi SDA menurun. Pemakaian SDA, termasuk yang dapat diperbarui, harus dihemat. Pemanfaatan harus memperhatikan kelestarian. Pembangunan berkelanjutan berarti memanfaatkan sambil melestarikan SDA agar tetap tersedia bagi generasi mendatang.</p>","ex":"<ul><li>Hutan menghasilkan kayu bahan bangunan; laut menghasilkan ikan; tambang menghasilkan pasir, emas, nikel.</li><li>Penambangan terus-menerus tanpa pemulihan membuat lahan rusak dan cadangan menipis.</li></ul>","cmp":"<ul><li><b>Prospeksi</b> mencari, <b>eksplorasi</b> memperinci cadangan, <b>eksploitasi</b> menambang.</li><li><b>Terbarukan</b> dapat pulih, <b>tidak terbarukan</b> habis.</li></ul>","mis":"<ul><li>Mengira SDA terbarukan boleh dipakai tanpa batas.</li><li>Mengira tambang tidak berdampak pada lingkungan.</li><li>Menukar urutan tahapan tambang.</li></ul>","p":[["Minyak bumi termasuk SDA…",["Tidak dapat diperbarui","Dapat diperbarui","Hayati","Surya"],"Tidak terbarukan."],["Tambang Freeport menghasilkan…",["Tembaga, emas, perak","Batu bara","Garam","Pasir kaca"],"Mineral berharga."],["Tahap pertama pertambangan?",["Prospeksi","Eksploitasi","Pemasaran","Pengolahan"],"Prospeksi."],["Tiga potensi SDA Indonesia di buku?",["Hutan, tambang, kemaritiman","Hutan, pabrik, jalan","Sungai, bandara, pasar","Tambang, mal, sekolah"],"Sesuai buku."]],"e":[["Air, tanah, hutan termasuk SDA…",["Dapat diperbarui","Tidak dapat diperbarui","Mineral","Energi fosil"],"Terbarukan."],["Tahap mengetahui ukuran dan cadangan?",["Eksplorasi","Eksploitasi","Pemasaran","Prospeksi saja"],"Eksplorasi."],["Alur dampak: penduduk naik lalu…",["Konsumsi naik, eksploitasi naik","Konsumsi turun","SDA bertambah","Lingkungan membaik"],"Rantai dampak."],["Eksploitasi berlebih menyebabkan…",["Pencemaran dan penurunan potensi SDA","Peningkatan potensi SDA","Hutan makin lebat","Laut makin jernih"],"Kerusakan."],["SDA terbarukan tetap harus…",["Dihemat","Dihabiskan","Dibuang","Diabaikan"],"Tetap dihemat."],["Contoh SDA kemaritiman?",["Ikan dan hasil laut","Batu bara","Hutan jati","Gunung api"],"Laut."],["Pembangunan berkelanjutan berarti…",["Memanfaatkan sambil melestarikan","Memanfaatkan sebanyak mungkin","Berhenti memanfaatkan","Menjual semua"],"Kelestarian."],["Batu bara habis karena…",["Tidak terbarukan","Terbarukan","Hujan","Pasang laut"],"Tidak dapat diperbarui."],["Mengapa pemanfaatan SDA harus bijak?",["Agar generasi mendatang masih memakainya","Agar harga turun","Agar cepat habis","Agar hutan hilang"],"Kelestarian."],["Penambang menemukan endapan emas baru. Itu tahap…",["Prospeksi","Pemasaran","Pengolahan","Reklamasi"],"Menemukan endapan."]]},"C.0.3":{"k":8,"g":"Menjelaskan kualitas SDM, Indeks Pembangunan Manusia, bonus demografi, dan upaya meningkatkan kualitas SDM.","core":"<p>Penduduk Indonesia lebih dari 270 juta jiwa, modal penting pembangunan, tetapi jumlah besar tidak selalu menguntungkan bila <b>kualitas dan produktivitas</b> rendah. <b>Pendidikan</b> adalah kunci kemajuan: makin tinggi pendidikan penduduk, makin tinggi kemampuannya mengolah SDA dan makin sejahtera. Data BPS 2016 menunjukkan angkatan kerja Indonesia masih didominasi tamatan SD.</p><p>Kualitas SDM diukur dengan <b>Indeks Pembangunan Manusia (IPM / HDI)</b> dari UNDP. Komponennya: <b>usia harapan hidup, rata-rata lama sekolah, harapan lama sekolah, dan pendapatan nasional kasar</b>. Negara dikelompokkan sangat tinggi, tinggi, sedang, dan rendah. Indonesia berada pada kelompok <b>sedang</b> (peringkat 108 pada laporan yang dikutip buku).</p><p><b>Bonus demografi</b>: penduduk usia produktif lebih banyak daripada nonproduktif. Agar bermanfaat, SDM harus berkualitas.</p><p><b>Prioritas meningkatkan kualitas SDM</b>: (1) sistem pendidikan yang baik dan bermutu, (2) penguatan peran agama untuk membangun karakter, (3) peningkatan kapasitas lewat pelatihan dan kompetensi, (4) pembinaan generasi muda agar kreatif, inovatif, dan berdaya saing.</p>","ex":"<ul><li>Petani yang dilatih teknologi pertanian menghasilkan panen lebih baik.</li><li>Pemuda yang mengikuti pelatihan keterampilan lebih mudah bersaing di dunia kerja.</li></ul>","cmp":"<ul><li><b>Kuantitas</b> (jumlah penduduk) berbeda dari <b>kualitas</b> (pendidikan, kesehatan, keterampilan).</li></ul>","mis":"<ul><li>Mengira penduduk banyak pasti menguntungkan.</li><li>Mengira IPM hanya soal pendapatan.</li><li>Mengira pelatihan tidak perlu.</li></ul>","p":[["Lembaga yang menyusun IPM?",["UNDP","BMKG","WHO","ASEAN"],"UNDP."],["IPM Indonesia berada pada kelompok…",["Sedang","Sangat tinggi","Rendah","Tak masuk"],"Medium."],["Kunci utama kemajuan bangsa?",["Pendidikan","Gedung","Jalan tol","Pajak"],"Pendidikan."],["Bonus demografi artinya usia…",["Produktif lebih banyak","Lansia lebih banyak","Anak lebih banyak","Seimbang"],"Produktif lebih banyak."]],"e":[["Komponen IPM?",["Usia harapan hidup, lama sekolah, pendapatan","Luas daratan, gunung, laut","Jumlah mal, pabrik, bandara","Harga, pajak, bunga"],"Komponen IPM."],["Penduduk banyak tidak selalu untung bila…",["Kualitas dan produktivitas rendah","Banyak sekolah","Banyak lapangan kerja","Banyak pelatihan"],"Kualitas rendah."],["Prioritas SDM nomor satu?",["Sistem pendidikan bermutu","Mal baru","Jalan tol","Impor"],"Pendidikan."],["Peran agama dalam SDM adalah…",["Membangun karakter","Menghitung pajak","Menanam padi","Mengukur curah hujan"],"Karakter."],["Pelatihan dan kompetensi bertujuan…",["Meningkatkan kapasitas SDM","Menambah pengangguran","Mengurangi sekolah","Menaikkan harga"],"Kapasitas SDM."],["Pembinaan generasi muda diharapkan menghasilkan…",["Kreatif, inovatif, berdaya saing","Pasif","Konsumtif","Tertinggal"],"Berdaya saing."],["Angkatan kerja didominasi tamatan SD menunjukkan…",["Taraf pendidikan rendah","Taraf pendidikan tinggi","Tak ada masalah","Kelebihan sarjana"],"Perlu peningkatan."],["Bonus demografi bermanfaat bila…",["SDM berkualitas","Menganggur","Tak sekolah","Tak bekerja"],"SDM berkualitas."],["Seorang petani ikut pelatihan teknologi dan panennya naik. Ini menunjukkan…",["Pelatihan meningkatkan kualitas SDM","Pelatihan sia-sia","Panen tak ada kaitan","Teknologi merugikan"],"Kapasitas SDM."],["Pendidikan tinggi membuat penduduk lebih mampu…",["Mengolah SDA","Merusak SDA","Menjual lahan","Menutup pabrik"],"Mengelola SDA."]]},"C.0.4":{"k":8,"g":"Menjelaskan pengertian lembaga sosial, norma, empat tingkatan norma, dan fungsi lembaga sosial.","core":"<p><b>Lembaga sosial</b> adalah keseluruhan sistem norma yang terbentuk berdasarkan tujuan dan fungsi tertentu dalam masyarakat. Ia muncul karena manusia membutuhkan <b>keteraturan hidup bersama</b>. Ibarat sepeda motor yang butuh rem dan roda, masyarakat butuh lembaga agar tidak kacau. Contohnya lembaga keluarga, agama, ekonomi, pendidikan, dan politik.</p><p><b>Norma</b> adalah aturan atau pedoman tingkah laku yang menunjukkan perilaku benar atau salah. Kekuatan mengikat norma berbeda-beda, dalam <b>empat tingkatan</b>:</p><ul><li><b>Cara (usage)</b>: penyimpangan hanya dicela. Contoh: cara berpakaian.</li><li><b>Kebiasaan (folkways)</b>: perbuatan berulang dalam bentuk sama. Contoh: memberi hormat kepada yang lebih tua.</li><li><b>Tata kelakuan (mores)</b>: kebiasaan yang diterima sebagai patokan, ada pengawasan dan sanksi. Contoh: tata tertib sekolah.</li><li><b>Adat istiadat (customs)</b>: pelanggar mendapat sanksi adat yang berat.</li></ul><p><b>Fungsi lembaga sosial</b>: memenuhi kebutuhan pokok anggota, menjaga keutuhan masyarakat, dan menjadi pedoman <b>pengendalian sosial</b> (kontrol sosial) atas perilaku anggota.</p>","ex":"<ul><li>Siswa terlambat dicatat dan diberi sanksi: tata kelakuan.</li><li>Berbicara membentak kepada orang tua dicela masyarakat: cara.</li><li>Kebutuhan mata pencaharian melahirkan lembaga industri, perdagangan, koperasi, pertanian.</li></ul>","cmp":"<ul><li>Dari yang paling ringan: <b>cara</b>, <b>kebiasaan</b>, <b>tata kelakuan</b>, <b>adat istiadat</b> (paling mengikat).</li></ul>","mis":"<ul><li>Mengira lembaga sosial hanya berupa gedung.</li><li>Mengira semua norma sanksinya sama.</li><li>Menukar cara dan tata kelakuan.</li></ul>","p":[["Sistem norma berdasarkan tujuan dan fungsi tertentu?",["Lembaga sosial","Individu","Pasar","Kelompok bermain"],"Lembaga sosial."],["Norma yang paling ringan sanksinya?",["Cara","Adat istiadat","Tata kelakuan","Hukum pidana"],"Hanya dicela."],["Tata tertib sekolah termasuk…",["Tata kelakuan","Cara","Kebiasaan","Adat"],"Ada sanksi."],["Fungsi lembaga sosial sebagai kontrol sosial berarti…",["Mengawasi tingkah laku anggota","Menghitung pajak","Menanam padi","Mengukur cuaca"],"Pengendalian sosial."]],"e":[["Lembaga sosial muncul karena kebutuhan akan…",["Keteraturan hidup bersama","Persaingan","Kekacauan","Isolasi"],"Keteraturan."],["Tingkatan norma yang paling mengikat?",["Adat istiadat","Cara","Kebiasaan","Folkways"],"Adat."],["Memberi hormat kepada yang tua termasuk…",["Kebiasaan","Cara","Adat","Hukum"],"Berulang."],["Norma berfungsi sebagai…",["Pedoman benar atau salah","Alat tukar","Alat ukur","Alat produksi"],"Pedoman."],["Contoh lembaga sosial?",["Keluarga","Gunung","Pantai","Awan"],"Keluarga."],["Tanpa lembaga sosial, masyarakat akan…",["Kacau","Tertib","Makmur","Seragam"],"Kekacauan."],["Kebutuhan mata pencaharian melahirkan lembaga…",["Ekonomi","Politik","Agama","Keluarga"],"Industri, koperasi, dll."],["Pelanggar adat istiadat mendapat sanksi…",["Sesuai adat","Tidak ada","Hanya senyum","Hadiah"],"Sanksi adat."],["Mengapa norma perlu ada?",["Agar hubungan manusia terlaksana sebagaimana diharapkan","Agar hidup bebas aturan","Agar bersaing","Agar tak berinteraksi"],"Tertib."],["Siswa melanggar tata tertib dan ditegur guru. Ini bentuk…",["Sanksi tata kelakuan","Hadiah","Sosialisasi","Difusi"],"Ada sanksi."]]},"C.0.5":{"k":8,"g":"Menjelaskan peran lembaga keluarga, agama, ekonomi, pendidikan, dan politik dalam pemanfaatan SDA dan SDM.","core":"<p><b>Peran dalam pemanfaatan SDA</b></p><ul><li><b>Keluarga</b>: membentuk kepribadian agar memakai SDA secara arif.</li><li><b>Agama</b>: menuntun manusia berperilaku baik kepada sesama, makhluk lain, dan alam.</li><li><b>Ekonomi</b>: membuat aturan agar produsen memakai SDA efektif dan efisien (contoh: BUMN).</li><li><b>Pendidikan</b>: menumbuhkan kesadaran melestarikan alam.</li><li><b>Politik</b>: membuat undang-undang yang melindungi SDA dari eksploitasi berlebihan agar generasi mendatang tetap menikmatinya.</li></ul><p>Contoh nyata: masyarakat <b>Baduy</b> menaati aturan adat, tidak memakai pupuk dan obat kimia, sehingga lahan tidak tercemar dan hutan tidak lekas habis.</p><p><b>Peran dalam pemanfaatan SDM</b></p><ul><li><b>Keluarga</b>: tempat sosialisasi pertama; anak diperkenalkan aturan dan nilai.</li><li><b>Agama</b>: sistem keyakinan, pelopor tertib sosial, mengatur kehidupan rohani.</li><li><b>Ekonomi</b>: mengatur hubungan manusia dalam memenuhi kebutuhan pokok demi kesejahteraan.</li><li><b>Pendidikan</b>: mengubah tingkah laku menjadi lebih baik. Menurut Ki Hajar Dewantara, pendidikan berlangsung di <b>keluarga, sekolah, dan masyarakat</b>.</li><li><b>Politik</b>: badan yang mengatur kekuasaan dan wewenang demi ketertiban masyarakat.</li></ul>","ex":"<ul><li>Undang-undang kehutanan melarang penebangan liar: peran politik.</li><li>Sekolah menggalakkan Adiwiyata dan bank sampah: peran pendidikan.</li></ul>","cmp":"<ul><li>Pada SDA lembaga <b>menjaga kelestarian alam</b>; pada SDM lembaga <b>membentuk dan mengelola manusia</b>.</li></ul>","mis":"<ul><li>Mengira hanya pemerintah yang berperan.</li><li>Mengira pendidikan hanya di sekolah.</li><li>Mengira tradisi adat menghambat pelestarian.</li></ul>","p":[["Siapa pelopor ucapan tiga lingkungan pendidikan?",["Ki Hajar Dewantara","Soekarno","Hatta","Kartini"],"Ki Hajar Dewantara."],["Tempat sosialisasi pertama anak?",["Keluarga","Sekolah","Pasar","Kantor"],"Keluarga."],["Pembuat undang-undang perlindungan SDA?",["Lembaga politik","Lembaga keluarga","Lembaga agama","Pasar"],"Politik."],["Masyarakat yang menjaga lahan dengan aturan adat tanpa pupuk kimia?",["Baduy","Betawi","Jawa kota","Batak kota"],"Baduy."]],"e":[["Tiga lingkungan pendidikan menurut Ki Hajar Dewantara?",["Keluarga, sekolah, masyarakat","Rumah, kantor, pasar","Desa, kota, negara","Kelas, lab, kantin"],"Tripusat pendidikan."],["Peran lembaga ekonomi dalam SDA?",["Aturan agar SDA dipakai efektif dan efisien","Menghentikan produksi","Menebang hutan","Menutup pasar"],"Efektif dan efisien."],["Lembaga agama berperan menuntun perilaku baik pada…",["Sesama, makhluk lain, dan alam","Mesin","Uang","Peta"],"Termasuk alam."],["Aturan adat Baduy menguntungkan karena…",["Lahan tidak tercemar dan hutan tidak lekas habis","Lahan rusak","Hutan habis","Air kotor"],"Pelestarian."],["Lembaga politik berperan dalam SDM sebagai…",["Mengatur kekuasaan dan wewenang demi ketertiban","Menanam padi","Mencetak uang","Membuat peta"],"Tertib."],["Peran lembaga pendidikan dalam SDM?",["Mengubah tingkah laku menjadi lebih baik","Menghambat belajar","Menaikkan harga","Menahan perubahan"],"Mengubah perilaku."],["BUMN contoh lembaga…",["Ekonomi","Agama","Keluarga","Pendidikan"],"Contoh buku."],["Orang tua mengajarkan menghemat air. Itu peran…",["Keluarga","Politik","Ekonomi","Agama"],"Pembiasaan di keluarga."],["Undang-undang yang melindungi hutan berperan agar…",["Generasi mendatang tetap menikmati SDA","SDA habis","Hutan gundul","Harga turun"],"Berkelanjutan."],["Mengapa sosialisasi pertama di keluarga penting?",["Anak mengenal aturan dan nilai sebelum hidup di masyarakat","Anak tak perlu aturan","Anak belajar berdagang","Anak berburu"],"Dasar karakter."]]},"C.0.6":{"k":8,"g":"Menjelaskan jalur perdagangan awal Masehi dan peran letak geografis Nusantara dalam hubungan dengan bangsa asing.","core":"<p>Hubungan dagang India–Cina semula lewat <b>Jalur Sutra</b> darat yang membentang dari Cina melewati Asia Tengah sampai Eropa. Komoditas utamanya <b>kain sutra</b>, ditambah wewangian dan rempah-rempah. Sejak awal abad Masehi jalur darat <b>tidak aman</b>, sehingga dialihkan lewat <b>laut</b>. Rute laut terdekat dari India ke Cina melewati <b>Selat Malaka</b>.</p><p>Akibatnya Kepulauan Indonesia menjadi daerah <b>transit</b> bagi pedagang Cina dan India. Masyarakat Nusantara ikut aktif berdagang, sehingga terjadi kontak Indonesia–India dan Indonesia–Cina.</p><p>Menurut Wolters, <b>Ko-ying</b> adalah kerajaan di pantai timur Sumatra (antara Jambi dan Palembang), lokasi strategis karena kapal menunggu <b>angin muson</b> untuk berlayar ke timur. Dari Palembang kapal bisa tiba di Kanton dalam sekitar lima hari tanpa transit. Hubungan ini bukan hanya dagang, melainkan juga sosial budaya. Agama Hindu berkembang di India sejak ±2000 SM dan Buddha pada abad ke-6 SM. Kondisi geografis sudah memengaruhi kehidupan masyarakat Indonesia sejak masa praaksara.</p>","ex":"<ul><li>Pedagang India berhenti di Sumatra menunggu angin muson sebelum melanjutkan ke Cina.</li><li>Pelabuhan di pesisir Sumatra ramai karena berada di jalur Selat Malaka.</li></ul>","cmp":"<ul><li><b>Jalur Sutra darat</b> melewati Asia Tengah, <b>jalur laut</b> melewati Selat Malaka.</li></ul>","mis":"<ul><li>Mengira Nusantara hanya dilewati tanpa ikut berdagang.</li><li>Mengira hubungan hanya dagang tanpa budaya.</li><li>Menyebut jalur utama lewat Samudra Atlantik.</li></ul>","p":[["Komoditas utama Jalur Sutra?",["Kain sutra","Batu bara","Minyak bumi","Karet"],"Sutra."],["Jalur dialihkan ke laut karena jalur darat…",["Tidak aman","Terlalu pendek","Terlalu murah","Terlalu sepi"],"Tidak aman."],["Selat yang dilewati rute laut India–Cina?",["Selat Malaka","Selat Sunda","Selat Bali","Selat Makassar"],"Selat Malaka."],["Angin yang ditunggu kapal untuk berlayar?",["Muson","Siklon","Tornado","Badai salju"],"Angin muson."]],"e":[["Nusantara menjadi…",["Daerah transit pedagang","Daerah terisolasi","Daerah terlarang","Daerah gurun"],"Transit."],["Ko-ying terletak di…",["Pantai timur Sumatra","Pantai barat Papua","Selatan Jawa","Utara Kalimantan"],"Antara Jambi dan Palembang."],["Palembang ke Kanton dalam waktu sekitar…",["Lima hari","Lima bulan","Satu tahun","Sehari"],"Lima hari tanpa transit."],["Keuntungan peralihan jalur bagi Nusantara?",["Masyarakat ikut aktif berdagang","Tak ada pengaruh","Pelayaran berhenti","Perdagangan menurun"],"Keuntungan ekonomi."],["Hubungan dengan bangsa asing bersifat…",["Dagang dan sosial budaya","Hanya militer","Hanya politik","Tidak ada"],"Dagang dan budaya."],["Komoditas selain sutra?",["Wewangian dan rempah","Plastik","Elektronik","Baja"],"Wewangian dan rempah."],["Mengapa Sumatra pesisir strategis?",["Kapal menunggu angin muson di sana","Dekat gunung es","Tak ada ombak","Jauh dari laut"],"Menunggu muson."],["Kondisi geografis memengaruhi masyarakat sejak…",["Masa praaksara","Masa modern","Masa kolonial saja","Masa digital"],"Sejak praaksara."],["Jalur laut India–Cina yang terdekat?",["Melalui Selat Malaka","Melalui Kutub","Melalui Atlantik","Melalui gurun"],"Selat Malaka."],["Pedagang kapal menunggu angin muson. Ini menunjukkan…",["Pengaruh iklim pada pelayaran","Tak ada pengaruh","Pengaruh gempa","Pengaruh kutub"],"Cuaca memengaruhi pelayaran."]]},"C.0.7":{"k":8,"g":"Menjelaskan teori masuknya Hindu-Buddha dan pengaruhnya pada candi, seni, dan sastra.","core":"<p>Hindu-Buddha masuk lewat hubungan dagang dan sosial budaya. Cara persisnya masih diperdebatkan, sehingga ada beberapa teori: <b>teori waisya</b> (dibawa pedagang India lewat jalur damai), <b>teori brahmana</b> (kaum brahmana diundang raja), <b>teori ksatria</b> (bangsawan atau prajurit India), dan <b>teori arus balik</b> (orang Nusantara belajar ke India lalu menyebarkannya pulang).</p><p><b>Pengaruh Hindu-Buddha</b> bagi bangsa Indonesia: awal peradaban masa sejarah, mencakup agama, pemerintahan, sosial, ekonomi, dan seni budaya.</p><ul><li><b>Candi</b>: berasal dari nama Dewi Durga, <i>Candika</i>. Dibangun untuk memuliakan orang yang wafat, khususnya raja dan tokoh. Terdiri atas <b>kaki, tubuh, atap</b>. Contoh: Borobudur, Prambanan, Mendut, Kalasan, Dieng, Muara Takus (Jambi).</li><li><b>Seni pahat dan ukir</b>: arca dewa dan relief yang menceritakan kitab seperti Ramayana dan Karmawibhangga. Arca Buddha sederhana, berjubah, rambut keriting.</li><li><b>Barang logam</b>: arca logam kecil dan perhiasan emas.</li><li><b>Kesusastraan</b>: ditulis di daun lontar, misalnya Ramayana, Mahabharata, Arjunawiwaha, Bharatayuddha, Nagarakrtagama.</li></ul>","ex":"<ul><li>Relief candi menceritakan epos Ramayana.</li><li>Jumlah candi terbanyak di Pulau Jawa.</li></ul>","cmp":"<ul><li><b>Teori waisya</b>: pedagang; <b>brahmana</b>: pendeta; <b>ksatria</b>: bangsawan; <b>arus balik</b>: orang Nusantara belajar ke India.</li></ul>","mis":"<ul><li>Mengira Hindu-Buddha masuk lewat penaklukan perang saja.</li><li>Mengira candi dibangun sebagai tempat tinggal raja.</li><li>Menukar bagian candi.</li></ul>","p":[["Teori yang menyebut pedagang India sebagai pembawa?",["Teori waisya","Teori brahmana","Teori ksatria","Teori arus balik"],"Waisya."],["Bagian candi?",["Kaki, tubuh, atap","Pintu, jendela, lantai","Kepala, tangan, kaki","Dasar, pagar, taman"],"Tiga bagian."],["Fungsi candi pada masa Hindu-Buddha?",["Memuliakan orang yang wafat","Pasar","Pelabuhan","Benteng"],"Memuliakan raja dan tokoh."],["Naskah kuno ditulis di…",["Daun lontar","Plastik","Kain nilon","Logam besi"],"Daun lontar."]],"e":[["Teori arus balik menyatakan…",["Orang Nusantara belajar ke India lalu pulang menyebarkan","Pedagang India menetap","Raja India menaklukkan Nusantara","Hindu tak masuk"],"Arus balik."],["Teori brahmana menyatakan…",["Kaum brahmana diundang penguasa","Pedagang membawa","Prajurit menyerbu","Tidak ada"],"Brahmana."],["Candi berasal dari nama…",["Candika (Dewi Durga)","Dewa Siwa","Dewa Wisnu","Buddha"],"Candika."],["Ciri arca Buddha?",["Rambut keriting dan jubah sederhana","Bersenjata banyak","Berhias emas berat","Bertangan banyak"],"Sederhana."],["Relief candi sering menceritakan…",["Ramayana","Resep makanan","Peta dunia","Hukum pajak"],"Epos keagamaan."],["Mengapa banyak kesusastraan Hindu-Buddha hilang?",["Daun lontar mudah rusak","Terlalu banyak","Tak ada penulis","Dibuang raja"],"Mudah rusak."],["Contoh candi Buddha?",["Borobudur","Candi Prambanan sebagai candi Buddha","Tugu Monas","Masjid Demak"],"Borobudur."],["Pengaruh Hindu-Buddha mencakup…",["Agama, pemerintahan, sosial, ekonomi, seni","Hanya agama","Hanya seni","Tak ada"],"Banyak bidang."],["Muara Takus terletak di…",["Jambi","Bali","Papua","Maluku"],"Jambi."],["Pedagang India lewat jalur laut membawa budayanya secara damai. Teori?",["Waisya","Ksatria","Brahmana","Arus balik"],"Damai lewat dagang."]]},"C.1.0":{"k":8,"g":"Menjelaskan pengaruh cuaca dan iklim, termasuk La Nina, terhadap pertanian, perhubungan, industri, kesehatan, dan lingkungan.","core":"<p>Cuaca dan iklim memengaruhi hampir semua bidang kehidupan.</p><ul><li><b>Pertanian</b>: menentukan waktu tanam dan jenis tanaman.</li><li><b>Perhubungan</b>: cuaca, suhu, arah dan kecepatan angin, awan, dan kabut memengaruhi penerbangan; pelayaran dipengaruhi arah angin, tinggi gelombang, dan badai.</li><li><b>Industri</b>: industri tradisional bergantung panas matahari, misalnya garam, genteng, batu bata, dan kerupuk.</li><li><b>Kesehatan</b>: penyakit muncul pada cuaca tertentu, misalnya demam berdarah dan malaria yang disebarkan nyamuk.</li><li><b>Lingkungan hidup</b>: kemarau panjang mengganggu siklus hidrologi sehingga ekosistem terganggu.</li></ul><p><b>La Nina</b> adalah anomali iklim saat suhu permukaan laut Pasifik tengah dan timur lebih dingin dari biasanya (ambang di bawah −0,5°C pada indeks ENSO). Akibatnya curah hujan bulanan di Indonesia bisa meningkat (naik) hingga <b>40% di atas normal</b>, dengan dampak berbeda antardaerah. Hujan ekstrem berpotensi memicu bencana hidrometeorologis seperti <b>banjir dan tanah longsor</b>.</p>","ex":"<ul><li>Pengrajin garam gagal produksi saat hujan terus-menerus.</li><li>Pesawat ditunda karena kabut tebal.</li><li>Kasus demam berdarah naik pada musim hujan.</li></ul>","cmp":"<ul><li><b>La Nina</b> membuat hujan bertambah, sedangkan kemarau panjang menyebabkan kekeringan.</li></ul>","mis":"<ul><li>Mengira dampak La Nina sama di seluruh Indonesia.</li><li>Mengira cuaca tidak memengaruhi industri.</li><li>Mengira banjir hanya soal sungai.</li></ul>","p":[["Industri yang bergantung panas matahari?",["Garam dan batu bata","Pabrik mobil","Perbankan","Penerbitan"],"Industri tradisional."],["Penyakit yang disebarkan nyamuk?",["Demam berdarah dan malaria","Asma","Patah tulang","Rabun"],"Dibawa nyamuk."],["La Nina menyebabkan hujan…",["Meningkat","Berkurang","Berhenti","Salju"],"Naik hingga 40%."],["Dampak hujan ekstrem?",["Banjir dan longsor","Kekeringan","Gempa","Tsunami"],"Hidrometeorologis."]],"e":[["Cuaca memengaruhi pertanian dalam hal…",["Waktu tanam dan jenis tanaman","Harga emas","Jumlah penduduk","Zona waktu"],"Sesuai buku."],["Faktor yang memengaruhi penerbangan?",["Angin, awan, kabut","Harga tiket","Jumlah bandara","Warna pesawat"],"Cuaca."],["Pelayaran dipengaruhi…",["Tinggi gelombang dan badai","Jumlah penumpang","Warna kapal","Harga BBM saja"],"Cuaca laut."],["Kemarau panjang menyebabkan…",["Gangguan siklus hidrologi","Air berlimpah","Hujan tiap hari","Banjir"],"Kekeringan."],["La Nina ditandai dengan…",["Suhu laut Pasifik dingin","Suhu laut panas","Tak ada angin","Es mencair"],"Laut dingin."],["Kasus demam berdarah naik saat…",["Musim hujan","Selalu sama","Musim gugur","Tidak berubah"],"Nyamuk berkembang."],["Genteng dan kerupuk dijemur. Industri ini…",["Bergantung cuaca","Tak bergantung cuaca","Hanya malam","Hanya dalam ruangan"],"Bergantung matahari."],["La Nina berpotensi menyebabkan…",["Banjir dan tanah longsor","Kekeringan ekstrem","Gempa","Letusan"],"Curah hujan tinggi."],["Dampak La Nina bagi Sumatra pada Oktober–November berbeda karena…",["Dampak tiap daerah tidak sama","Sumatra bukan Indonesia","Tak ada hujan","Semua sama"],"Dampak bervariasi."],["Pemerintah mengingatkan warga waspada banjir saat La Nina. Alasannya…",["Curah hujan bisa jauh di atas normal","Cuaca cerah","Tak ada risiko","Suhu naik"],"Hujan ekstrem."]]},"C.1.1":{"k":8,"g":"Menjelaskan tenaga endogen dan eksogen serta bentuk-bentuk muka bumi di Indonesia.","core":"<p>Bentuk muka bumi terus berubah karena dua tenaga.</p><ul><li><b>Tenaga endogen</b>: berasal dari dalam bumi dan menggerakkan kulit bumi. Meliputi <b>vulkanisme</b> (aktivitas gunung api), <b>tektonisme</b> (pergerakan lapisan bumi), dan <b>seisme</b> (gempa).</li><li><b>Tenaga eksogen</b>: berasal dari luar/permukaan bumi, yaitu <b>air, angin, organisme, sinar matahari, es</b>, dan kegiatan manusia.</li></ul><p><b>Bentuk muka bumi</b></p><ul><li><b>Gunung</b>: berbentuk kerucut atau kubah dengan satu puncak, tinggi di atas 600 mdpl.</li><li><b>Pegunungan</b>: gunung-gunung berbaris membentuk gugusan, tinggi lebih dari 1000 mdpl.</li><li><b>Bukit</b>: lebih tinggi dari sekitarnya, kurang dari 600 mdpl, tidak curam.</li><li><b>Dataran tinggi</b>: daerah datar dengan ketinggian lebih dari 400 mdpl.</li><li><b>Dataran rendah</b>: ketinggian 0–200 mdpl, subur karena tanah endapan (aluvial).</li><li><b>Depresi kontinental</b>: dataran di bawah permukaan laut, sangat jarang.</li></ul>","ex":"<ul><li>Letusan gunung api membentuk tanah vulkanik (endogen). Sungai mengikis tebing (eksogen).</li><li>Dataran rendah aluvial di sekitar sungai cocok untuk persawahan.</li></ul>","cmp":"<ul><li><b>Endogen</b> dari dalam bumi, <b>eksogen</b> dari permukaan bumi.</li><li><b>Gunung</b> satu puncak, <b>pegunungan</b> banyak gunung berbaris.</li></ul>","mis":"<ul><li>Menyamakan bukit dan gunung (bukit &lt; 600 m).</li><li>Mengira manusia bukan penyebab perubahan muka bumi.</li><li>Menukar endogen dan eksogen.</li></ul>","p":[["Tenaga dari dalam bumi?",["Endogen","Eksogen","Meteorologi","Hidrologi"],"Endogen."],["Gempa termasuk…",["Seisme","Vulkanisme","Eksogen","Abrasi"],"Seisme."],["Ketinggian gunung menurut buku?",["Di atas 600 mdpl","Di bawah 600 mdpl","200 mdpl","0 mdpl"],"Di atas 600."],["Dataran rendah subur karena tanah…",["Aluvial (endapan)","Berpasir kering","Batu keras","Es"],"Endapan."]],"e":[["Tiga jenis tenaga endogen?",["Vulkanisme, tektonisme, seisme","Air, angin, es","Hujan, salju, kabut","Panas, dingin, lembap"],"Endogen."],["Contoh tenaga eksogen?",["Angin dan air","Gempa","Letusan","Patahan"],"Dari luar."],["Bukit berketinggian…",["Kurang dari 600 mdpl","Lebih dari 1000 mdpl","Lebih dari 2000","Nol"],"Kurang dari 600."],["Pegunungan memiliki ketinggian…",["Lebih dari 1000 mdpl","Kurang dari 200","Kurang dari 100","Nol"],"Lebih dari 1000."],["Dataran tinggi lebih dari…",["400 mdpl","200 mdpl","100 mdpl","0 mdpl"],"400 mdpl."],["Depresi kontinental berada…",["Di bawah permukaan laut","Di puncak gunung","Di langit","Di bukit"],"Rendah dari laut."],["Gunung api berbentuk…",["Kerucut atau kubah","Datar","Bulat penuh","Segitiga rata"],"Kerucut."],["Kikisan sungai pada tebing termasuk tenaga…",["Eksogen","Endogen","Tektonik","Vulkanik"],"Air = eksogen."],["Mengapa dataran rendah cocok untuk sawah?",["Tanahnya subur karena endapan","Tak ada air","Terlalu tinggi","Berbatu"],"Aluvial subur."],["Pergerakan lempeng membentuk pegunungan. Tenaga yang berperan?",["Tektonisme","Hujan","Angin","Es"],"Endogen."]]},"C.1.2":{"k":8,"g":"Menjelaskan aktivitas ekonomi menurut bentuk muka bumi, pemanfaatan lingkungan, dan kearifan lokal.","core":"<p>Kegiatan ekonomi (produksi, distribusi, konsumsi) bergantung pada tempat tinggal.</p><ul><li><b>Dataran rendah</b>: perdagangan, perkantoran, perindustrian, pariwisata, perikanan, peternakan.</li><li><b>Dataran tinggi</b>: perkebunan (misalnya teh), pertanian, pariwisata, karena iklim sejuk cocok untuk tanaman tertentu seperti teh dan kopi.</li><li><b>Pantai</b>: perikanan, pariwisata, perhotelan.</li></ul><p><b>Pemanfaatan lingkungan</b> berupa <b>barang mentah</b> (hasil tani), <b>setengah jadi</b>, dan <b>barang jadi</b>; mengolahnya menambah nilai jual. Lingkungan juga dimanfaatkan untuk jasa wisata (edukasi, religi, rekreasi).</p><p><b>Prinsip pemanfaatan</b>: pembangunan berkelanjutan dengan prinsip regenerasi, memperhatikan analisis dampak lingkungan, dan memprioritaskan kebutuhan saat ini dengan bijak.</p><p><b>Kearifan lokal Dayak Iban Sungai Utik</b> (Kalimantan Barat): hutan adat ±9.453 hektar dibagi zona permukiman, hutan lindung, hutan produksi, dan hutan cadangan. Setiap kepala keluarga dilarang menebang lebih dari 30 pohon per tahun, ada denda bagi pelanggar, ladang digilir, dan lahan yang sudah dipakai baru dipakai lagi setelah 3 tahun. Mereka memiliki lebih dari 40 jenis padi lokal.</p><p><b>Waspada berjualan/berbelanja daring</b>: periksa produk, ulasan toko, pilih barang dengan teliti, dan teliti saat mentransfer uang.</p>","ex":"<ul><li>Daerah pegunungan memproduksi kopi lalu diolah menjadi kopi bubuk.</li><li>Daerah pantai memproduksi garam dan hasil laut.</li></ul>","cmp":"<ul><li>Barang <b>mentah</b> (sayur, beras) diolah jadi <b>barang jadi</b> yang bernilai lebih tinggi.</li></ul>","mis":"<ul><li>Mengira semua daerah punya aktivitas ekonomi sama.</li><li>Mengambil sumber daya tanpa memikirkan generasi mendatang.</li><li>Percaya semua toko daring tanpa cek.</li></ul>","p":[["Aktivitas khas dataran tinggi?",["Perkebunan teh","Penangkapan ikan laut","Perhotelan pantai","Garam laut"],"Perkebunan."],["Aktivitas khas pantai?",["Perikanan","Perkebunan teh","Pertambangan batu","Peternakan sapi perah"],"Perikanan."],["Kopi menjadi kopi bubuk berarti barang…",["Setengah jadi/jadi","Mentah","Limbah","Gratis"],"Diolah."],["Batas tebang per KK di Sungai Utik per tahun?",["30 pohon","3 pohon","300 pohon","Tidak dibatasi"],"30 pohon."]],"e":[["Aktivitas dataran rendah yang relatif beragam termasuk…",["Perdagangan dan perindustrian","Hanya berburu","Hanya tambang","Hanya wisata es"],"Beragam."],["Mengolah barang mentah bertujuan…",["Menambah nilai jual","Mengurangi nilai","Menghabiskan SDA","Menaikkan pajak"],"Nilai tambah."],["Wisata edukasi dan religi termasuk…",["Jasa wisata","Barang mentah","Pertambangan","Pertanian"],"Jasa."],["Ladang berpindah digilir dengan jeda…",["3 tahun","3 hari","30 tahun","Tidak ada"],"Tiga tahun."],["Jumlah jenis padi lokal Dayak Iban?",["Lebih dari 40","Dua","Lima","Tidak ada"],"Lebih dari 40."],["Hutan adat dibagi menjadi…",["Permukiman, lindung, produksi, cadangan","Sawah dan pasar","Kota dan desa","Laut dan darat"],"Empat zona."],["Prinsip pemanfaatan lingkungan?",["Berkelanjutan dengan regenerasi","Habiskan sekarang","Tanpa analisis dampak","Abaikan lingkungan"],"Berkelanjutan."],["Saat belanja daring pastikan…",["Cek ulasan dan keaslian toko","Transfer cepat tanpa cek","Percaya semua","Tidak membaca"],"Waspada penipuan."],["Mengapa daerah pegunungan banyak berkebun?",["Iklim sejuk cocok tanaman tertentu","Dekat laut","Tak ada tanah","Tak ada hujan"],"Karakteristik wilayah."],["Desa menjaga hutan lewat denda adat. Ini contoh…",["Kearifan lokal","Eksploitasi","Pembalakan liar","Alih fungsi lahan"],"Adat menjaga hutan."]]},"C.1.3":{"k":8,"g":"Menjelaskan pengertian, tujuan, faktor pendorong, dan manfaat perdagangan antarpulau.","core":"<p><b>Perdagangan</b> adalah tukar-menukar barang atau jasa berdasarkan kesepakatan tanpa paksaan. <b>Perdagangan antarpulau (antardaerah)</b> dilakukan penduduk atau lembaga satu pulau dengan pulau lain dalam satu negara. Sejak awal abad ke-16 telah berkembang pusat-pusat perdagangan di Jawa dan di Indonesia tengah-timur dengan kapal sederhana; jadi perdagangan antarpulau sudah ada sejak zaman nenek moyang.</p><p><b>Tujuan</b></p><ul><li><b>Memperoleh keuntungan</b>: selisih harga jual dan harga beli (atau biaya produksi).</li><li><b>Memperluas jangkauan pasar</b>: konsumen makin banyak dan tersebar.</li></ul><p><b>Faktor pendorong</b>: <b>perbedaan faktor produksi</b> (misalnya Kalimantan penghasil kayu, Jakarta butuh bahan baku mebel) dan <b>perbedaan tingkat harga antardaerah</b> (durian murah di daerah penghasil).</p><p><b>Manfaat</b>: menyediakan <b>alternatif alat pemuas kebutuhan</b>, <b>meningkatkan produktivitas</b> produsen, dan <b>memperluas kesempatan kerja</b> (termasuk usaha jasa kirim dan transportasi).</p>","ex":"<ul><li>Maros (Sulawesi Selatan) memasarkan bandeng dan ternak ke daerah lain.</li><li>Kayu dari Kalimantan dikirim ke Jawa untuk industri mebel.</li></ul>","cmp":"<ul><li><b>Perbedaan faktor produksi</b> mendorong tukar-menukar hasil; <b>perbedaan harga</b> mendorong pembelian dari daerah yang lebih murah.</li></ul>","mis":"<ul><li>Mengira perdagangan antarpulau baru ada di zaman modern.</li><li>Mengira keuntungan hanya untuk penjual.</li><li>Menyamakan dengan ekspor-impor.</li></ul>","p":[["Tujuan utama perdagangan?",["Memperoleh keuntungan","Menambah pajak","Mengurangi barang","Menutup pasar"],"Keuntungan."],["Perdagangan antarpulau terjadi dalam…",["Satu negara","Antarbenua","Antargalaksi","Satu rumah"],"Dalam satu negara."],["Daerah penghasil kayu yang disebut buku?",["Kalimantan","Bali","Madura","Gili"],"Kalimantan."],["Memperluas pasar berarti konsumen…",["Makin banyak dan tersebar","Makin sedikit","Hilang","Tetap"],"Pasar luas."]],"e":[["Keuntungan perdagangan dihitung dari…",["Selisih harga jual dan beli/biaya produksi","Jumlah penduduk","Curah hujan","Zona waktu"],"Selisih harga."],["Faktor pendorong perdagangan antarpulau?",["Perbedaan faktor produksi dan harga","Kesamaan hasil","Tak ada transportasi","Larangan dagang"],"Dua faktor."],["Mengapa Jakarta membeli kayu dari Kalimantan?",["Jakarta minim hasil kayu","Kayu terlalu murah di Jakarta","Tak ada industri","Kalimantan tak punya hutan"],"Perbedaan faktor produksi."],["Manfaat bagi konsumen?",["Alternatif pemuas kebutuhan","Barang menghilang","Harga selalu naik","Pilihan berkurang"],"Konsumen punya pilihan."],["Meningkatnya pesanan mendorong produsen…",["Meningkatkan produksi","Menutup pabrik","Mengurangi pekerja","Berhenti"],"Produktivitas naik."],["Usaha jasa kirim muncul karena…",["Perdagangan lintas daerah","Hujan","Gempa","Libur"],"Kesempatan kerja."],["Alat transportasi dagang abad ke-16?",["Kapal sederhana","Pesawat jet","Kereta cepat","Truk besar"],"Kapal sederhana."],["Durian lebih murah di daerah penghasil. Ini mendorong…",["Pembelian dari daerah itu","Larangan jual","Kenaikan harga","Berhenti dagang"],"Perbedaan harga."],["Perluasan pasar membuat produk tradisional…",["Makin dikenal","Makin hilang","Dilarang","Berkurang"],"Pengguna bertambah."],["Mengapa perdagangan antarpulau penting bagi Indonesia?",["Wilayahnya kepulauan dengan potensi berbeda","Semua pulau sama","Tak ada laut","Tak ada kapal"],"Saling melengkapi."]]},"C.1.4":{"k":8,"g":"Menjelaskan dinamika penduduk, rumus pertambahan penduduk, kategori angka kelahiran dan kematian, piramida, dan komposisi penduduk.","core":"<p><b>Dinamika penduduk</b> adalah perubahan jumlah penduduk suatu wilayah akibat <b>kelahiran (natalitas)</b>, <b>kematian (mortalitas)</b>, dan <b>perpindahan (migrasi)</b>. Pertambahan penduduk dihitung: <b>P = (L − M) + (I − E)</b>, dengan L lahir, M mati, I penduduk masuk, E penduduk keluar. Indonesia berpenduduk terbesar keempat di dunia.</p><ul><li><b>Natalitas</b> (per 1000 penduduk per tahun): tinggi &gt; 30, sedang 20–30, rendah &lt; 20.</li><li><b>Mortalitas</b>: tinggi &gt; 18, sedang 14–18, rendah 9–13.</li></ul><p><b>Piramida penduduk</b>: <b>muda (ekspansif)</b> kelahiran tinggi, kematian rendah, pertumbuhan cepat (Indonesia, Malaysia, Filipina, India); <b>dewasa (stasioner)</b> seimbang (Amerika Serikat, Inggris); <b>tua (konstruktif)</b> kelahiran turun, kematian rendah (Jerman).</p><p><b>Komposisi penduduk</b>: pengelompokan menurut umur, jenis kelamin, pekerjaan, agama, pendidikan, dan lain-lain. Berdasarkan umur, penduduk <b>usia produktif</b> 15–64 tahun (sebagian buku 15–65). Bila usia di bawah 15 dan di atas 65 lebih banyak, beban penduduk produktif makin berat. <b>Sex ratio</b> membandingkan laki-laki dan perempuan. Pertumbuhan penduduk cepat dapat menimbulkan pengangguran muda dan persebaran penduduk tidak merata.</p>","ex":"<ul><li>Sebuah kota: lahir 5.000, mati 2.000, masuk 3.000, keluar 1.000. P = (5.000 − 2.000) + (3.000 − 1.000) = 5.000.</li></ul>","cmp":"<ul><li><b>Imigrasi</b> penduduk masuk, <b>emigrasi</b> penduduk keluar.</li><li><b>Piramida muda</b> pertumbuhan cepat, <b>tua</b> penduduk menua.</li></ul>","mis":"<ul><li>Lupa menghitung migrasi pada rumus.</li><li>Menukar piramida muda dan tua.</li><li>Mengira penduduk banyak selalu menguntungkan.</li></ul>","p":[["Tiga faktor dinamika penduduk?",["Kelahiran, kematian, migrasi","Hujan, angin, suhu","Gempa, banjir, tsunami","Pajak, harga, upah"],"Tiga faktor."],["Rumus pertambahan penduduk?",["P = (L − M) + (I − E)","P = L + M","P = L × M","P = I + E"],"Sesuai buku."],["Piramida muda disebut juga…",["Ekspansif","Stasioner","Konstruktif","Datar"],"Ekspansif."],["Natalitas tinggi jika di atas…",["30 per 1000","10 per 1000","20 per 1000","5 per 1000"],"> 30."]],"e":[["Penduduk keluar suatu wilayah dilambangkan…",["E","I","L","M"],"Emigrasi."],["Natalitas sedang berkisar…",["20–30","Di atas 30","Di bawah 20","0"],"20–30."],["Mortalitas rendah berkisar…",["9–13","14–18","Di atas 18","0–5"],"9–13."],["Negara dengan piramida stasioner?",["Amerika Serikat","Indonesia","India","Filipina"],"AS dan Inggris."],["Negara dengan piramida tua?",["Jerman","Malaysia","India","Filipina"],"Jerman."],["Usia produktif menurut buku…",["15–65 tahun","0–5 tahun","5–10 tahun","70 tahun ke atas"],"15–65."],["Kota: lahir 4.000, mati 1.000, masuk 2.000, keluar 500. Pertambahan penduduk?",["4.500","3.000","1.500","6.000"],"(4000−1000)+(2000−500)=4.500."],["Pertumbuhan cepat dapat menyebabkan…",["Pengangguran usia muda","Surplus lapangan kerja","Penduduk berkurang","Tak ada masalah"],"Masalah kependudukan."],["Sex ratio membandingkan…",["Laki-laki dan perempuan","Muda dan tua","Kota dan desa","Kaya dan miskin"],"Perbandingan jenis kelamin."],["Piramida muda menggambarkan wilayah dengan…",["Kelahiran tinggi, kematian rendah","Kelahiran rendah","Kematian tinggi","Penduduk menyusut"],"Pertumbuhan cepat."]]},"C.1.5":{"k":8,"g":"Menjelaskan bentuk keragaman masyarakat Indonesia, penyebabnya, serta sikap yang tepat menghadapinya.","core":"<p>Masyarakat Indonesia <b>majemuk</b>: terdiri atas banyak kelompok dengan latar berbeda. Bentuk keragamannya: <b>suku bangsa</b> (lebih dari 1.300 suku menurut sensus BPS 2010), <b>bahasa daerah</b>, <b>agama dan kepercayaan</b> (enam agama yang diakui negara: Islam, Kristen, Katolik, Hindu, Buddha, Konghucu), <b>ras</b>, <b>adat dan budaya</b>, serta <b>golongan sosial ekonomi</b>.</p><p><b>Penyebab keragaman</b>: kondisi geografis (kepulauan, iklim, bentuk muka bumi), sejarah (kerajaan Hindu-Buddha, Islam, kolonial), dan pertemuan dengan bangsa asing.</p><p><b>Manfaat</b>: kekayaan budaya, saling melengkapi, dan daya tarik wisata. <b>Tantangan</b>: kesalahpahaman dan konflik jika tidak ada saling menghargai.</p><p><b>Sikap menghadapi keragaman</b>: toleransi, hak kelompok minoritas dihargai, saling menghormati, gotong royong, tidak membeda-bedakan, dan menjunjung <b>Bhinneka Tunggal Ika</b>.</p>","ex":"<ul><li>Dalam satu kelas ada siswa berbeda suku, bahasa, dan agama yang tetap bekerja sama.</li><li>Rumah ibadah berbeda berdampingan di satu kampung.</li></ul>","cmp":"<ul><li><b>Keragaman</b> adalah fakta perbedaan; <b>toleransi</b> adalah sikap menyikapinya.</li></ul>","mis":"<ul><li>Menganggap kelompok sendiri paling baik.</li><li>Mengira keragaman pasti menimbulkan konflik.</li><li>Mengira hanya suku mayoritas yang penting.</li></ul>","p":[["Masyarakat dengan banyak kelompok berbeda disebut…",["Majemuk","Homogen","Tunggal","Terisolasi"],"Majemuk."],["Semboyan persatuan?",["Bhinneka Tunggal Ika","Tut Wuri Handayani","Merdeka","Gotong Royong"],"Berbeda tetapi satu."],["Sikap menghadapi perbedaan?",["Toleransi","Menghina","Menjauhi","Memaksa"],"Toleransi."],["Penyebab keragaman?",["Geografis dan sejarah","Cuaca harian","Harga barang","Zona waktu"],"Geografis dan sejarah."]],"e":[["Bentuk keragaman masyarakat?",["Suku, agama, ras, adat","Hanya pakaian","Hanya makanan","Hanya zona waktu"],"Beragam bentuk."],["Jumlah agama yang diakui negara?",["Enam","Dua","Tiga","Sepuluh"],"Enam agama."],["Manfaat keragaman?",["Kekayaan budaya","Konflik pasti","Perpecahan","Isolasi"],"Kekayaan budaya."],["Tantangan keragaman?",["Kesalahpahaman dan konflik","Tidak ada","Hanya wisata","Hanya perdagangan"],"Perlu saling menghargai."],["Contoh sikap toleransi?",["Menghormati ibadah teman","Mengejek budaya lain","Menolak berteman","Memaksakan adat"],"Menghormati."],["Faktor sejarah memengaruhi keragaman lewat…",["Pengaruh kerajaan dan bangsa asing","Hujan","Gempa","Pajak"],"Pertemuan budaya."],["Mengapa keragaman Indonesia besar?",["Wilayah kepulauan yang luas","Satu pulau","Tidak ada laut","Tak ada sejarah"],"Faktor geografis."],["Gotong royong membantu keragaman karena…",["Menyatukan perbedaan dalam kerja bersama","Memisahkan","Menimbulkan konflik","Mengabaikan"],"Persatuan."],["Kelompok minoritas sebaiknya…",["Dihargai haknya","Diabaikan","Dilarang","Dipisah"],"Toleransi."],["Dalam satu kelas siswa berbeda suku tetap kompak. Ini mencerminkan…",["Bhinneka Tunggal Ika","Isolasi","Konflik","Diskriminasi"],"Persatuan dalam perbedaan."]]},"C.1.6":{"k":8,"g":"Menjelaskan mobilitas sosial, jenis, saluran, serta faktor pendorong dan penghambatnya.","core":"<p><b>Mobilitas sosial</b> adalah perpindahan seseorang atau kelompok dari satu kedudukan (status) sosial ke kedudukan lain dalam masyarakat.</p><ul><li><b>Vertikal naik</b> (social climbing): naik ke lapisan lebih tinggi, misalnya buruh menjadi pemilik usaha.</li><li><b>Vertikal turun</b> (social sinking): turun ke lapisan lebih rendah, misalnya pengusaha bangkrut.</li><li><b>Horizontal</b>: berpindah pekerjaan atau tempat tanpa mengubah tingkat status, misalnya guru SMP menjadi guru SMA.</li><li><b>Antargenerasi</b>: perbedaan status anak dibanding orang tua.</li></ul><p><b>Saluran mobilitas</b>: pendidikan, pekerjaan, organisasi, perkawinan, dan kegiatan ekonomi. <b>Pendorong</b>: pendidikan, keterampilan, kesempatan, kerja keras. <b>Penghambat</b>: kemiskinan, diskriminasi, kurangnya akses pendidikan. Mobilitas mudah pada masyarakat dengan stratifikasi terbuka dan sulit pada stratifikasi tertutup.</p>","ex":"<ul><li>Anak petani menjadi dokter lewat pendidikan: mobilitas vertikal naik.</li><li>Karyawan pindah kerja ke kantor lain dengan jabatan setara: horizontal.</li></ul>","cmp":"<ul><li><b>Vertikal</b> mengubah tingkat status, <b>horizontal</b> tidak.</li></ul>","mis":"<ul><li>Mengira mobilitas hanya naik.</li><li>Menyamakan pindah kerja setara dengan naik status.</li><li>Mengira status selalu ditentukan lahir.</li></ul>","p":[["Perpindahan status sosial disebut…",["Mobilitas sosial","Interaksi","Akulturasi","Difusi"],"Mobilitas sosial."],["Buruh menjadi pemilik usaha adalah mobilitas…",["Vertikal naik","Vertikal turun","Horizontal","Tidak ada"],"Naik."],["Saluran mobilitas yang utama?",["Pendidikan","Cuaca","Gempa","Zona waktu"],"Pendidikan."],["Pindah pekerjaan setara disebut…",["Horizontal","Vertikal","Antarwaktu","Pasif"],"Horizontal."]],"e":[["Pengusaha bangkrut menjadi pekerja. Mobilitas…",["Vertikal turun","Vertikal naik","Horizontal","Tidak ada"],"Turun."],["Faktor pendorong mobilitas?",["Pendidikan dan keterampilan","Kemiskinan","Diskriminasi","Larangan"],"Pendorong."],["Faktor penghambat mobilitas?",["Diskriminasi dan kemiskinan","Pelatihan","Beasiswa","Kesempatan"],"Penghambat."],["Stratifikasi terbuka membuat mobilitas…",["Lebih mudah","Mustahil","Tertutup","Dilarang"],"Terbuka."],["Anak petani menjadi dokter. Ini mobilitas…",["Vertikal naik","Horizontal","Turun","Tidak ada"],"Lewat pendidikan."],["Perkawinan dapat menjadi saluran mobilitas karena…",["Dapat mengubah status sosial","Menetap saja","Tidak berpengaruh","Menghalangi"],"Salah satu saluran."],["Pindah kerja ke jabatan setara. Mobilitas…",["Horizontal","Vertikal naik","Vertikal turun","Tidak ada"],"Status tetap."],["Mengapa pendidikan penting bagi mobilitas?",["Membuka peluang pekerjaan lebih baik","Menutup peluang","Mengurangi keterampilan","Tidak berpengaruh"],"Peluang meningkat."],["Social climbing artinya…",["Naik ke lapisan lebih tinggi","Turun","Tetap","Pindah kota"],"Mobilitas naik."],["Seorang siswa rajin belajar dan mendapat beasiswa. Ini…",["Awal mobilitas naik lewat pendidikan","Mobilitas turun","Tak ada hubungan","Hambatan"],"Pendidikan = saluran."]]},"C.1.7":{"k":8,"g":"Menjelaskan masuk dan berkembangnya Islam di Indonesia, cara penyebarannya, kerajaan Islam, dan bentuk akulturasi budayanya.","core":"<p>Islam masuk melalui pelayaran dan perdagangan di jalur Selat Malaka. Para ahli mengajukan beberapa teori asal (Gujarat, Arab/Mekah, Persia, Cina). Pedagang muslim menetap di pelabuhan dan membentuk komunitas.</p><p><b>Cara penyebaran</b>: <b>perdagangan</b>, <b>perkawinan</b> (pedagang muslim menikah dengan penduduk setempat), <b>pendidikan</b> (pesantren), <b>kesenian</b> (misalnya wayang dan gamelan oleh Walisongo), <b>tasawuf</b> (pendekatan sufi), dan <b>politik</b> (raja memeluk Islam diikuti rakyat).</p><p><b>Kerajaan Islam</b>: Samudra Pasai (kerajaan Islam pertama), Aceh Darussalam, Demak, Mataram Islam, Banten, Cirebon, Gowa-Tallo, Ternate dan Tidore.</p><p><b>Akulturasi budaya</b>: Masjid Agung Demak beratap tumpang, Menara Kudus yang mirip candi, seni kaligrafi, nisan dan makam beraksara Arab, serta kalender Jawa Sultan Agung yang memadukan tarikh Saka dan Hijriah. Unsur lokal dan Islam berpadu tanpa menghilangkan budaya asli.</p>","ex":"<ul><li>Sunan Kalijaga mengenalkan nilai Islam melalui wayang.</li><li>Menara Kudus berbentuk mirip candi: akulturasi Hindu-Buddha dan Islam.</li></ul>","cmp":"<ul><li><b>Akulturasi</b> memadukan unsur, <b>asimilasi</b> melebur unsur asli.</li></ul>","mis":"<ul><li>Mengira Islam disebarkan hanya lewat perang.</li><li>Mengira budaya lokal hilang setelah Islam datang.</li><li>Menyebut Demak sebagai kerajaan Islam pertama.</li></ul>","p":[["Kerajaan Islam pertama di Indonesia?",["Samudra Pasai","Demak","Mataram","Banten"],"Samudra Pasai."],["Salah satu cara penyebaran Islam?",["Perdagangan","Perang saja","Pajak","Penjajahan"],"Dagang."],["Wayang dipakai menyebarkan Islam oleh…",["Walisongo","Pangeran Diponegoro","Hayam Wuruk","Airlangga"],"Walisongo."],["Pendidikan pesantren termasuk saluran…",["Pendidikan","Politik","Perkawinan","Seni"],"Pendidikan."]],"e":[["Pedagang muslim menikah dengan penduduk setempat adalah saluran…",["Perkawinan","Perang","Pajak","Pendidikan"],"Perkawinan."],["Raja memeluk Islam dan diikuti rakyat adalah saluran…",["Politik","Dagang","Seni","Tasawuf"],"Politik."],["Menara Kudus mirip…",["Candi","Gereja","Benteng","Pasar"],"Akulturasi."],["Kalender Sultan Agung memadukan…",["Saka dan Hijriah","Masehi dan Cina","Hijriah dan Romawi","Saka dan Barat"],"Dua tarikh."],["Masjid Agung Demak beratap…",["Tumpang","Kubah besar","Datar","Menara kaca"],"Atap tumpang."],["Contoh kerajaan Islam di Jawa?",["Demak","Sriwijaya","Kutai","Tarumanegara"],"Demak."],["Contoh akulturasi di nisan?",["Aksara Arab dengan hiasan lokal","Hanya bahasa Inggris","Tanpa tulisan","Plastik"],"Perpaduan."],["Pesantren berperan…",["Menyebarkan pengetahuan dan nilai Islam","Menjual barang","Menarik pajak","Membangun candi"],"Pendidikan."],["Mengapa Selat Malaka penting bagi masuknya Islam?",["Jalur pelayaran dan perdagangan","Jauh dari laut","Tak ada kapal","Hanya jalur perang"],"Jalur dagang."],["Seorang wali memakai wayang untuk dakwah. Ini contoh…",["Penyebaran lewat kesenian","Lewat perang","Lewat pajak","Lewat paksaan"],"Kesenian."]]},"D.0.1":{"k":8,"g":"Membedakan kolonialisme dan imperialisme serta menjelaskan kebijakan VOC dan pemerintah kolonial beserta perlawanan rakyat.","core":"<p><b>Kolonialisme</b> adalah penguasaan suatu wilayah oleh bangsa lain untuk kepentingan ekonomi dan politik. <b>Imperialisme</b> adalah paham atau politik memperluas kekuasaan atas wilayah lain.</p><ul><li><b>VOC</b> (1602–1799): kongsi dagang Belanda dengan hak monopoli dan hak istimewa (oktroi); mempraktikkan monopoli rempah dan pelayaran hongi.</li><li><b>Daendels</b> (1808–1811): membangun Jalan Raya Pos Anyer–Panarukan dengan kerja paksa.</li><li><b>Raffles</b> (1811–1816, Inggris): sistem sewa tanah (landrente).</li><li><b>Tanam Paksa</b> (<i>Cultuurstelsel</i>, 1830, Van den Bosch): rakyat wajib menanam tanaman ekspor di sebagian lahannya; rakyat mengalami kemiskinan dan kelaparan, sedangkan Belanda untung besar.</li><li><b>Politik Etis</b> (1901): irigasi, edukasi (pendidikan), dan emigrasi (transmigrasi).</li></ul><p><b>Perlawanan</b>: Sultan Agung menyerang Batavia (1628–1629), Sultan Hasanuddin (Perang Makassar, Perjanjian Bongaya 1667), Pattimura (1817), Imam Bonjol (Perang Padri), Pangeran Diponegoro (Perang Jawa 1825–1830), Perang Aceh.</p>","ex":"<ul><li>Rakyat Jawa menanam kopi dan tebu untuk Belanda saat Tanam Paksa, sehingga lahan pangan berkurang.</li><li>Jalan Anyer–Panarukan dibangun dengan kerja paksa rakyat.</li></ul>","cmp":"<ul><li><b>Kolonialisme</b> penguasaan wilayah, <b>imperialisme</b> politik perluasan kekuasaan.</li><li><b>Tanam Paksa</b> untuk keuntungan Belanda, <b>Politik Etis</b> (balas budi) lewat irigasi, edukasi, emigrasi.</li></ul>","mis":"<ul><li>Menukar Tanam Paksa dan Politik Etis.</li><li>Mengira perlawanan hanya di Jawa.</li><li>Mengira VOC adalah pemerintah negara.</li></ul>","p":[["Penguasaan wilayah bangsa lain untuk kepentingan ekonomi?",["Kolonialisme","Nasionalisme","Liberalisme","Federalisme"],"Kolonialisme."],["Pembuat Jalan Raya Pos Anyer–Panarukan?",["Daendels","Raffles","Van den Bosch","Coen"],"Daendels."],["Tanam Paksa diberlakukan tahun…",["1830","1602","1945","1901"],"Van den Bosch."],["Tiga program Politik Etis?",["Irigasi, edukasi, emigrasi","Pajak, rodi, monopoli","Tanam, panen, jual","Dagang, perang, pajak"],"Irigasi, edukasi, emigrasi."]],"e":[["VOC adalah…",["Kongsi dagang Belanda","Kerajaan Nusantara","Partai politik","Pasukan Inggris"],"Kongsi dagang."],["Sistem sewa tanah diterapkan oleh…",["Raffles","Daendels","Van den Bosch","Coen"],"Landrente."],["Pelaksana Tanam Paksa?",["Van den Bosch","Raffles","Daendels","Hasanuddin"],"1830."],["Perang Jawa 1825–1830 dipimpin…",["Pangeran Diponegoro","Imam Bonjol","Pattimura","Sultan Agung"],"Diponegoro."],["Perang Padri dipimpin…",["Imam Bonjol","Diponegoro","Hasanuddin","Pattimura"],"Imam Bonjol."],["Perjanjian Bongaya terjadi setelah perlawanan…",["Sultan Hasanuddin","Pattimura","Diponegoro","Sultan Agung"],"Perang Makassar."],["Dampak Tanam Paksa bagi rakyat?",["Kemiskinan dan kelaparan","Kemakmuran","Tanah bertambah","Pajak dihapus"],"Rakyat menderita."],["Politik Etis dikenal sebagai…",["Politik balas budi","Politik dagang","Politik perang","Politik tutup"],"Balas budi."],["Imperialisme berarti…",["Politik memperluas kekuasaan","Gotong royong","Perdagangan bebas","Kerja sama budaya"],"Perluasan kekuasaan."],["Pendidikan bagi pribumi meluas setelah…",["Politik Etis","Tanam Paksa","Pendudukan Jepang saja","VOC"],"Edukasi."]]},"D.0.2":{"k":8,"g":"Menjelaskan perubahan kehidupan masyarakat akibat penjajahan Barat dan pendudukan Jepang.","core":"<p><b>Akibat penjajahan Barat</b></p><ul><li><b>Ekonomi</b>: perkebunan besar dan ekonomi uang berkembang, rakyat tetap miskin akibat tanam paksa dan pajak.</li><li><b>Sosial</b>: masyarakat dibagi tiga lapis (Eropa, Timur Asing, pribumi).</li><li><b>Infrastruktur</b>: jalan dan rel kereta api (jalur pertama Semarang–Tanggung, 1867) dibangun terutama demi mengangkut hasil bumi.</li><li><b>Pendidikan</b>: sekolah model Barat lahir dan memunculkan kaum terpelajar, yang kemudian menumbuhkan <b>nasionalisme</b>.</li></ul><p><b>Pendudukan Jepang (1942–1945)</b> menggantikan Belanda setelah Belanda menyerah di Kalijati (Maret 1942).</p><ul><li><b>Kehidupan sulit</b>: padi dan hasil bumi diserahkan untuk perang; <b>romusha</b> (kerja paksa) menimbulkan banyak korban.</li><li><b>Organisasi militer</b>: <b>PETA</b> dan Heiho; Kinpeitai (polisi militer).</li><li><b>Kebijakan</b>: organisasi lama dibubarkan, bahasa Belanda dilarang dan bahasa Indonesia berkembang; muncul Putera dan Jawa Hokokai.</li></ul>","ex":"<ul><li>Jalur kereta api dibangun menghubungkan perkebunan dan pelabuhan.</li><li>PETA melatih pemuda Indonesia yang kelak menjadi inti tentara nasional.</li></ul>","cmp":"<ul><li>Belanda memakai <b>tanam paksa</b>; Jepang memakai <b>romusha</b>.</li></ul>","mis":"<ul><li>Mengira infrastruktur dibangun demi rakyat.</li><li>Mengira Jepang menjajah lebih lama daripada Belanda.</li><li>Menukar PETA dan romusha.</li></ul>","p":[["Kerja paksa masa Jepang?",["Romusha","Rodi","Landrente","Tanam paksa"],"Romusha."],["Organisasi militer bentukan Jepang untuk pemuda?",["PETA","VOC","BPUPKI","Budi Utomo"],"PETA."],["Jepang menduduki Indonesia pada tahun…",["1942","1908","1928","1900"],"1942."],["Jalur kereta api pertama menghubungkan…",["Semarang–Tanggung","Jakarta–Bogor","Bandung–Cirebon","Surabaya–Malang"],"1867."]],"e":[["Tiga lapisan masyarakat kolonial?",["Eropa, Timur Asing, pribumi","Bangsawan, ulama, petani","Raja, patih, rakyat","Kaya, miskin, sedang"],"Stratifikasi kolonial."],["Jepang menyerahkan hasil bumi untuk…",["Kebutuhan perang","Kesejahteraan rakyat","Wisata","Ekspor santai"],"Perang."],["Bahasa yang dilarang masa Jepang?",["Bahasa Belanda","Bahasa Indonesia","Bahasa Jawa","Bahasa Bugis"],"Belanda dilarang."],["Jepang menggantikan Belanda setelah menyerah di…",["Kalijati","Rengasdengklok","Bongaya","Yogyakarta"],"Maret 1942."],["Dampak pendidikan Barat bagi pribumi?",["Muncul kaum terpelajar dan nasionalisme","Tak ada sekolah","Pendidikan dilarang","Kebodohan"],"Terpelajar."],["Kinpeitai adalah…",["Polisi militer Jepang","Partai politik","Sekolah","Bank"],"Polisi militer."],["Mengapa rel kereta dibangun Belanda?",["Mengangkut hasil perkebunan","Mengangkut wisatawan","Mengangkut guru","Mengangkut pengungsi"],"Kepentingan ekonomi."],["Dampak romusha?",["Banyak korban kerja paksa","Rakyat sejahtera","Upah tinggi","Libur panjang"],"Menderita."],["Putera dan Jawa Hokokai termasuk…",["Organisasi bentukan Jepang","Organisasi VOC","Partai Belanda","Lembaga Inggris"],"Bentukan Jepang."],["Rakyat tetap miskin masa kolonial karena…",["Tanam paksa dan pajak tinggi","Panen berlimpah","Upah tinggi","Tanah luas"],"Eksploitasi."]]},"D.0.3":{"k":8,"g":"Menjelaskan organisasi pergerakan nasional, tokoh, dan perannya hingga Sumpah Pemuda.","core":"<p>Pendidikan Barat melahirkan kesadaran nasional dan <b>organisasi pergerakan</b>.</p><ul><li><b>Budi Utomo</b> (20 Mei 1908): dipelopori para pelajar STOVIA dengan Dr. Soetomo; bergerak sosial-budaya dan pendidikan. Tanggalnya diperingati sebagai Hari Kebangkitan Nasional.</li><li><b>Sarekat Dagang Islam</b> (1905, Haji Samanhudi) menjadi <b>Sarekat Islam</b> (1912, H.O.S. Tjokroaminoto).</li><li><b>Indische Partij</b> (1912): Tiga Serangkai (E.F.E. Douwes Dekker, Tjipto Mangunkusumo, Soewardi Soerjaningrat/Ki Hajar Dewantara), partai politik pertama menuntut kemerdekaan.</li><li><b>Muhammadiyah</b> (1912, KH Ahmad Dahlan), <b>Taman Siswa</b> (1922), <b>Nahdlatul Ulama</b> (1926).</li><li><b>PNI</b> (1927, Soekarno): menekankan kemerdekaan penuh.</li></ul><p><b>Sumpah Pemuda</b> (28 Oktober 1928, Kongres Pemuda II): satu tanah air, satu bangsa, satu bahasa persatuan, Indonesia. Lagu Indonesia Raya karya W.R. Supratman dikumandangkan.</p>","ex":"<ul><li>Taman Siswa memberi pendidikan bagi rakyat pribumi.</li><li>Pemuda dari berbagai daerah bersatu dalam Kongres Pemuda II.</li></ul>","cmp":"<ul><li><b>Budi Utomo</b> sosial-budaya, <b>Indische Partij</b> dan <b>PNI</b> politik.</li></ul>","mis":"<ul><li>Menyebut Budi Utomo berdiri 1928.</li><li>Mengira Sumpah Pemuda adalah proklamasi kemerdekaan.</li><li>Menukar tokoh Muhammadiyah dan NU.</li></ul>","p":[["Budi Utomo berdiri pada…",["20 Mei 1908","28 Oktober 1928","17 Agustus 1945","1 Juni 1945"],"20 Mei 1908."],["Pendiri Muhammadiyah?",["KH Ahmad Dahlan","KH Hasyim Asy'ari","Tjokroaminoto","Soekarno"],"Ahmad Dahlan."],["Sumpah Pemuda tanggal…",["28 Oktober 1928","20 Mei 1908","17 Agustus 1945","2 Mei 1922"],"1928."],["PNI dipimpin…",["Soekarno","Hatta","Soetomo","Samanhudi"],"Soekarno."]],"e":[["Tiga Serangkai mendirikan…",["Indische Partij","Budi Utomo","Muhammadiyah","PNI"],"Indische Partij."],["Sarekat Islam dipimpin…",["H.O.S. Tjokroaminoto","Soekarno","Hatta","Soetomo"],"Tjokroaminoto."],["Nahdlatul Ulama didirikan tahun…",["1926","1908","1945","1912"],"1926."],["Taman Siswa bergerak di bidang…",["Pendidikan","Perdagangan","Militer","Politik partai"],"Pendidikan."],["Hari Kebangkitan Nasional diperingati…",["20 Mei","28 Oktober","17 Agustus","2 Mei"],"20 longan <b>tua</b> berhati-hati, golongan <b>muda</b> menginginkan proklamasi segera.</li></ul>","mis":"<ul><li>Menyebut proklamasi di Rengasdengklok.</li><li>Menukar BPUPKI dan PPKI.</li><li>Menyebut Sumpah Pemuda sebagai proklamasi.</li></ul>","p":[["Dasar negara yang diusulkan Soekarno 1 Juni 1945?",["Pancasila","UUD","Garuda","Bhinneka"],"Pancasila."],["Proklamasi dibacakan pada…",["17 Agustus 1945","28 Oktober 1928","1 Juni 1945","20 Mei 1908"],"17 Agustus 1945."],["Tempat teks proklamasi dirumuskan?",["Rumah Laksamana Maeda","Rengasdengklok","Istana","Sekolah"],"Rumah Maeda."],["Pengetik teks proklamasi?",["Sayuti Melik","Soekarno","Hatta","Wikana"],"Sayuti Melik."]],"e":[["Ketua BPUPKI?",["dr. Radjiman Wedyodiningrat","Soekarno","Hatta","Soetomo"],"Radjiman."],["PPKI dibentuk tanggal…",["7 Agustus 1945","1 Juni 1945","17 Agustus 1945","28 Mei 1945"],"7 Agustus."],["Bom atom dijatuhkan di…",["Hiroshima dan Nagasaki","Tokyo dan Osaka","Jakarta","Seoul"],"Dua kota."],["Soekarno-Hatta dibawa golongan muda ke…",["Rengasdengklok","Bandung","Surabaya","Semarang"],"16 Agustus."],["Lokasi proklamasi dibacakan?",["Jl. Pegangsaan Timur 56","Rengasdengklok","Monas","Kota Tua"],"Pegangsaan Timur."],["Tokoh golongan muda?",["Soekarni, Wikana, Chaerul Saleh","Soekarno, Hatta","Radjiman","Maeda"],"Golongan muda."],["PPKI memilih Presiden dan Wakil pada…",["18 Agustus 1945","17 Agustus 1945","1 Juni 1945","7 Agustus 1945"],"Sidang PPKI."],["Mengapa golongan muda mendesak proklamasi?",["Jepang telah menyerah dan terjadi kekosongan kekuasaan","Jepang menang","Belanda kembali","Tak ada alasan"],"Kesempatan merdeka."],["Presiden pertama RI?",["Soekarno","Hatta","Sjahrir","Radjiman"],"Soekarno."],["BPUPKI bersidang membahas…",["Dasar negara dan UUD","Perang dingin","Perdagangan","Pendidikan dasar"],"Dasar negara dan UUD."]]},"D.0.5":{"k":8,"g":"Menjelaskan kondisi geografis dan kesenjangan pembangunan, fungsi dan jenis lembaga keuangan, serta manfaatnya.","core":"<p>Sebagai negara kepulauan, Indonesia menghadapi <b>kesenjangan pembangunan</b>: pembangunan lebih terpusat di Jawa, sedangkan daerah terpencil dan perbatasan (3T: terdepan, terluar, tertinggal) infrastrukturnya terbatas. Upaya pemerataan: pembangunan infrastruktur (jalan, pelabuhan, tol laut), dana desa, dan pendidikan.</p><p><b>Lembaga keuangan</b> menghimpun dana dari masyarakat dan menyalurkannya untuk kesejahteraan.</p><ul><li><b>Bank</b>: Bank Indonesia (bank sentral), bank umum, dan BPR. Simpanan dijamin <b>LPS</b>.</li><li><b>Nonbank</b>: pegadaian, asuransi, koperasi simpan pinjam, dana pensiun, pasar modal, dan perusahaan pembiayaan.</li><li><b>OJK</b> (Otoritas Jasa Keuangan) mengawasi lembaga keuangan.</li></ul><p><b>Manfaat</b>: tempat menyimpan uang yang aman, sumber modal usaha, memperlancar transaksi, dan membantu pemerataan kesejahteraan. Pastikan memakai lembaga yang legal dan diawasi OJK.</p>","ex":"<ul><li>Petani di desa terpencil meminjam modal dari koperasi untuk membeli benih.</li><li>Tol laut menurunkan harga barang di pulau terpencil.</li></ul>","cmp":"<ul><li><b>Bank</b> menerima simpanan dan memberi kredit; <b>nonbank</b> seperti pegadaian memberi pinjaman dengan gadai.</li></ul>","mis":"<ul><li>Mengira pembangunan sudah merata.</li><li>Menganggap koperasi sebagai bank.</li><li>Memakai pinjaman daring tanpa izin OJK.</li></ul>","p":[["Bank sentral Indonesia?",["Bank Indonesia","BRI","BNI","Mandiri"],"BI."],["Pegadaian termasuk lembaga…",["Keuangan nonbank","Bank sentral","Bank umum","BPR"],"Nonbank."],["Lembaga pengawas jasa keuangan?",["OJK","LPS","BPS","BMKG"],"OJK."],["Daerah terdepan, terluar, tertinggal disebut…",["3T","2T","4T","5T"],"3T."]],"e":[["Penyebab kesenjangan pembangunan?",["Kondisi kepulauan dan pembangunan terpusat","Hujan","Cuaca saja","Zona waktu"],"Geografis."],["Upaya pemerataan?",["Infrastruktur dan dana desa","Menutup desa","Menghapus sekolah","Menaikkan pajak"],"Pembangunan."],["Fungsi bank?",["Menghimpun dan menyalurkan dana","Menanam padi","Menambang emas","Membuat peta"],"Fungsi utama."],["Simpanan di bank dijamin…",["LPS","OJK","BPS","BI saja"],"LPS."],["Contoh lembaga keuangan nonbank?",["Asuransi","BPR","Bank umum","Bank sentral"],"Asuransi."],["Manfaat lembaga keuangan?",["Modal usaha dan penyimpanan yang aman","Menambah utang selalu","Menutup usaha","Menghilangkan uang"],"Manfaat."],["Tol laut dibangun untuk…",["Menurunkan harga barang di pulau terpencil","Menambah macet","Mengurangi kapal","Menutup pelabuhan"],"Pemerataan."],["Pinjaman daring yang aman harus…",["Terdaftar dan diawasi OJK","Anonim","Tanpa izin","Tanpa kontrak"],"Legal."],["Koperasi simpan pinjam termasuk…",["Lembaga keuangan nonbank","Bank sentral","Bank umum","BPR"],"Nonbank."],["Daerah 3T membutuhkan perhatian karena…",["Infrastruktur dan layanan terbatas","Terlalu maju","Terlalu padat","Terlalu kaya"],"Tertinggal."]]},"D.0.6":{"k":8,"g":"Menjelaskan penyebab, bentuk, dampak, dan cara penanganan konflik sosial.","core":"<p><b>Konflik sosial</b> adalah pertentangan antarindividu atau kelompok yang ingin menyingkirkan lawannya.</p><p><b>Penyebab</b>: perbedaan individu (pendirian dan perasaan), perbedaan <b>kepentingan</b> (ekonomi atau politik), perbedaan <b>budaya</b>, dan <b>perubahan sosial</b> yang terlalu cepat. Prasangka dan ketidakadilan memperburuknya.</p><p><b>Dampak positif</b>: memperkuat solidaritas kelompok dan mendorong perubahan. <b>Dampak negatif</b>: korban jiwa dan harta, rusaknya fasilitas, trauma, dan perpecahan.</p><p><b>Penanganan (bentuk akomodasi)</b>: <b>negosiasi/kompromi</b> (masing-masing mengalah), <b>mediasi</b> (pihak ketiga netral memberi saran), <b>arbitrasi</b> (pihak ketiga memutuskan dan keputusannya mengikat), <b>konsiliasi</b> (mempertemukan pihak berselisih), serta <b>toleransi</b> dan <b>ajudikasi</b> (lewat pengadilan).</p>","ex":"<ul><li>Dua desa berebut batas lahan lalu dimediasi kepala kecamatan.</li><li>Dua kelompok pelajar bentrok lalu didamaikan guru dan orang tua.</li><
