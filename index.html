awar-menawar?",["Pasar tradisional","Pasar modern","Pasar abstrak","Pasar saham"],"Tradisional."],["Penyedia layanan publik dan pemungut pajak?",["Rumah tangga pemerintah","Rumah tangga keluarga","Perusahaan swasta","Masyarakat luar negeri"],"Pemerintah."],["Memajang barang di etalase termasuk…",["Promosi","Distribusi","Produksi","Impor"],"Promosi."]],"e":[["Rumah tangga keluarga berperan sebagai…",["Konsumen dan penyedia tenaga kerja","Produsen utama","Regulator","Pengekspor"],"Konsumen dan penyedia tenaga kerja."],["Pelaku ekspor dan impor?",["Masyarakat luar negeri","Rumah tangga keluarga","Kelurahan","Pasar tradisional"],"Hubungan dengan luar negeri."],["Pasar yang transaksinya lewat aplikasi?",["Pasar abstrak","Pasar nyata","Pasar tradisional","Pasar pagi"],"Tidak bertemu langsung."],["Pasar membentuk harga melalui…",["Pertemuan penjual dan pembeli","Penetapan satu pihak","Pajak","Cuaca"],"Fungsi pembentuk harga."],["Harga pas dan label harga ciri pasar…",["Modern","Tradisional","Abstrak","Konkret"],"Pasar modern."],["Diskon bertujuan…",["Menarik pembeli","Menghilangkan barang","Menaikkan pajak","Mengurangi produksi"],"Promosi."],["Mengapa pemerintah disebut pelaku ekonomi?",["Membuat aturan dan melayani publik, serta memungut pajak","Hanya berdagang","Tidak melakukan apa-apa","Hanya membeli"],"Peran pemerintah."],["Pabrik sepatu termasuk…",["Rumah tangga perusahaan","Rumah tangga keluarga","Pemerintah","Luar negeri"],"Produsen."],["Pasar berfungsi sebagai sarana…",["Distribusi","Mengurangi kebutuhan","Menutup produksi","Menahan harga"],"Menyalurkan barang."],["Warung memasang spanduk \"Beli 2 gratis 1\". Ini…",["Promosi","Produksi","Konsumsi","Investasi"],"Cara menarik pembeli."]]},"B.0.4":{"k":8,"g":"Menjelaskan permintaan, penawaran, hukumnya, dan terbentuknya harga keseimbangan.","core":"<p><b>Permintaan</b> adalah jumlah barang yang ingin dan mampu dibeli pada berbagai tingkat harga. <b>Hukum permintaan</b>: bila harga naik, jumlah barang yang diminta <b>turun</b>; bila harga turun, jumlah diminta <b>naik</b> (faktor lain dianggap tetap).</p><p><b>Penawaran</b> adalah jumlah barang yang ingin dijual pada berbagai tingkat harga. <b>Hukum penawaran</b>: bila harga naik, jumlah barang yang ditawarkan <b>naik</b>; bila harga turun, jumlah ditawarkan <b>turun</b>.</p><p>Permintaan juga dipengaruhi pendapatan, selera, jumlah penduduk, dan harga barang lain. Penawaran dipengaruhi biaya produksi dan teknologi.</p><p><b>Harga keseimbangan</b> terbentuk di titik temu kurva permintaan dan penawaran, yaitu saat jumlah yang diminta sama dengan jumlah yang ditawarkan. Jika harga <b>di atas</b> keseimbangan, barang berlebih (surplus) sehingga harga cenderung turun. Jika harga <b>di bawah</b> keseimbangan, barang kurang (kelangkaan) sehingga harga cenderung naik.</p>","ex":"<ul><li>Harga mangga turun saat panen raya: penawaran melimpah.</li><li>Harga es krim naik, pembeli berkurang: hukum permintaan.</li><li>Harga beras naik, petani menanam lebih banyak padi: hukum penawaran.</li></ul>","cmp":"<ul><li><b>Permintaan</b>: harga naik, jumlah diminta turun. <b>Penawaran</b>: harga naik, jumlah ditawarkan naik.</li><li><b>Surplus</b> (barang berlebih) menekan harga turun; <b>kekurangan</b> mendorong harga naik.</li></ul>","mis":"<ul><li>Menukar arah hukum permintaan dan penawaran.</li><li>Mengira harga keseimbangan tetap selamanya.</li><li>Mengira keinginan tanpa kemampuan membeli adalah permintaan.</li></ul>","p":[["Hukum permintaan: harga naik, jumlah diminta…",["Turun","Naik","Tetap","Nol"],"Berlawanan arah."],["Hukum penawaran: harga naik, jumlah ditawarkan…",["Naik","Turun","Tetap","Nol"],"Searah."],["Harga keseimbangan terjadi saat…",["Jumlah diminta sama dengan jumlah ditawarkan","Barang habis","Barang menumpuk","Harga nol"],"Titik temu."],["Harga di atas keseimbangan menimbulkan…",["Surplus barang","Kekurangan barang","Pajak","Devisa"],"Barang berlebih."]],"e":[["Panen raya membuat harga cabai turun karena…",["Penawaran meningkat","Permintaan naik","Barang langka","Pajak naik"],"Barang melimpah."],["Saat harga HP naik tajam, jumlah pembeli cenderung…",["Berkurang","Bertambah","Tetap","Hilang"],"Hukum permintaan."],["Harga kopi naik, petani menambah tanaman kopi. Ini…",["Hukum penawaran","Hukum permintaan","Keseimbangan","Kontravensi"],"Penawaran naik saat harga naik."],["Titik temu kurva permintaan dan penawaran disebut…",["Harga keseimbangan","Biaya peluang","Pajak","Inflasi"],"Equilibrium."],["Harga di bawah keseimbangan menyebabkan…",["Kekurangan barang dan harga cenderung naik","Barang menumpuk","Harga turun terus","Produksi berhenti"],"Permintaan lebih besar."],["Faktor yang memengaruhi permintaan?",["Pendapatan dan selera","Biaya produksi saja","Teknologi pabrik","Cuaca di bulan"],"Pendapatan dan selera."],["Faktor yang memengaruhi penawaran?",["Biaya produksi dan teknologi","Selera konsumen","Pendapatan konsumen","Jumlah penduduk"],"Sisi penjual."],["Mengapa harga bisa berubah-ubah?",["Permintaan dan penawaran berubah","Matahari berubah","Peta berubah","Kalender berubah"],"Keseimbangan bergeser."],["Orang ingin membeli mobil tetapi tak punya uang. Ini bukan permintaan karena…",["Tidak mampu membeli","Tidak ada mobil","Harga murah","Selera rendah"],"Permintaan perlu kemampuan membeli."],["Pedagang memberi diskon saat barang menumpuk. Tujuannya…",["Mengurangi surplus","Menaikkan harga","Menghentikan produksi","Menambah pajak"],"Menurunkan harga untuk menarik pembeli."]]},"B.0.5":{"k":8,"g":"Menjelaskan status sosial, peran sosial, diferensiasi, dan stratifikasi sosial.","core":"<p><b>Status sosial</b> adalah kedudukan seseorang dalam masyarakat. Ada tiga macam: <b>ascribed status</b> (didapat sejak lahir, misalnya putra bangsawan atau sultan), <b>achieved status</b> (diraih lewat usaha, misalnya pianis berprestasi atau dokter), dan <b>assigned status</b> (diberikan masyarakat atau negara karena jasa, misalnya gelar pahlawan).</p><p><b>Peran sosial</b> adalah perilaku yang diharapkan dari seseorang sesuai statusnya. Contoh: kepala sekolah berperan memimpin sekolah, guru mengajar, siswa belajar. Bila peran tidak dijalankan, harapan masyarakat tidak terpenuhi.</p><p><b>Diferensiasi sosial</b> adalah pembedaan masyarakat secara <b>horizontal</b> (sejajar, tanpa tingkatan) berdasarkan suku, agama, profesi, atau jenis kelamin. <b>Stratifikasi sosial</b> adalah pembedaan masyarakat secara <b>vertikal</b> (bertingkat) menjadi lapisan, misalnya kelas atas, menengah, dan bawah menurut kekayaan, pendidikan, atau kekuasaan. Stratifikasi <b>terbuka</b> memungkinkan orang naik atau turun lapisan; <b>tertutup</b> tidak memungkinkan.</p>","ex":"<ul><li>Sultan Hamengkubuwono IX: status sosial sebagai sultan (ascribed). Joey Alexander, pianis muda berprestasi: achieved. Gelar Proklamator bagi Sukarno-Hatta: diberikan karena jasa (assigned).</li><li>Kepala sekolah memimpin rapat: menjalankan peran sosial.</li><li>Perbedaan suku dan agama di kelas: diferensiasi.</li></ul>","cmp":"<ul><li><b>Diferensiasi</b> horizontal (sejajar), <b>stratifikasi</b> vertikal (bertingkat).</li><li><b>Status</b> adalah kedudukan, <b>peran</b> adalah tindakan yang menyertainya.</li></ul>","mis":"<ul><li>Menyamakan status dan peran.</li><li>Mengira perbedaan suku sebagai tingkatan.</li><li>Mengira status selalu diwariskan.</li></ul>","p":[["Status yang didapat sejak lahir?",["Ascribed status","Achieved status","Assigned status","Peran sosial"],"Didapat tanpa usaha."],["Perilaku sesuai status disebut…",["Peran sosial","Status","Stratifikasi","Mobilitas"],"Peran."],["Pembedaan masyarakat tanpa tingkatan?",["Diferensiasi sosial","Stratifikasi sosial","Mobilitas","Segregasi"],"Horizontal."],["Pembedaan masyarakat berlapis-lapis?",["Stratifikasi sosial","Diferensiasi sosial","Akulturasi","Difusi"],"Vertikal."]],"e":[["Pianis berprestasi mendapat status melalui…",["Usaha (achieved)","Kelahiran (ascribed)","Keberuntungan semata","Warisan"],"Diraih lewat prestasi."],["Gelar pahlawan dari negara termasuk…",["Assigned status","Ascribed status","Achieved status","Peran sosial"],"Diberikan karena jasa."],["Putra sultan yang menjadi sultan termasuk…",["Ascribed status","Achieved status","Assigned status","Difusi"],"Karena kelahiran."],["Kepala sekolah memimpin sekolah. Ini…",["Peran sosial","Status saja","Diferensiasi","Stratifikasi"],"Tindakan sesuai status."],["Perbedaan suku dan agama termasuk…",["Diferensiasi","Stratifikasi","Asimilasi","Mobilitas"],"Horizontal."],["Kelas atas, menengah, bawah termasuk…",["Stratifikasi","Diferensiasi","Difusi","Akulturasi"],"Bertingkat."],["Stratifikasi terbuka berarti…",["Orang bisa naik atau turun lapisan","Tak bisa pindah lapisan","Tidak ada lapisan","Hanya lahir"],"Terbuka memungkinkan perpindahan."],["Mengapa peran sosial penting dijalankan?",["Agar harapan masyarakat terpenuhi","Agar harga naik","Agar suhu turun","Agar hujan reda"],"Menjaga keteraturan sosial."],["Seorang dokter yang bekerja keras kuliah memperoleh status…",["Achieved","Ascribed","Assigned","Tak ada"],"Diraih lewat usaha."],["Siswa mengikuti upacara dan belajar dengan tertib. Ini…",["Menjalankan peran sebagai siswa","Mengubah status","Stratifikasi","Konflik"],"Peran sesuai status."]]},"B.0.6":{"k":8,"g":"Menjelaskan sosialisasi dan agen sosialisasi, serta nilai dan norma beserta jenis dan sanksinya.","core":"<p><b>Sosialisasi</b> adalah proses seumur hidup untuk mempelajari pola budaya, perilaku, dan harapan masyarakat agar dapat diterima kelompoknya. <b>Agen sosialisasi</b>: <b>keluarga</b> (agen pertama dan terpenting; keluarga inti: ayah, ibu, saudara sekandung; kerabat: kakek, nenek, paman, bibi), <b>sekolah</b>, <b>teman sebaya</b>, dan <b>media massa</b> (termasuk media sosial).</p><p><b>Nilai</b> adalah sesuatu yang dianggap baik dan berharga, misalnya nilai kebenaran, keindahan (estetika), kebaikan (moral), dan religius. <b>Norma</b> adalah aturan yang mengatur perilaku agar sesuai dengan nilai.</p><ul><li><b>Norma agama</b>: berasal dari ajaran agama.</li><li><b>Norma kesusilaan</b>: berasal dari hati nurani (baik-buruk).</li><li><b>Norma kesopanan</b>: tata krama pergaulan.</li><li><b>Norma hukum</b>: tertulis, dibuat pemerintah, bersifat <b>memaksa</b> dengan sanksi tegas.</li></ul><p>Pelanggaran norma dapat dikenai <b>sanksi</b>: teguran atau penolakan sosial, sampai hukuman resmi pada norma hukum. Norma menjaga ketertiban dan mencegah konflik.</p>","ex":"<ul><li>Anak belajar bersalaman dari orang tua: sosialisasi lewat keluarga.</li><li>Remaja meniru gaya berbelanja dari media sosial: pengaruh media massa.</li><li>Menyeberangkan lansia di jalan padat: nilai moral (kebaikan). Mencuri: melanggar norma hukum, bersanksi.</li></ul>","cmp":"<ul><li><b>Nilai</b> adalah ukuran baik dan berharga, <b>norma</b> adalah aturan berperilaku.</li><li>Hanya <b>norma hukum</b> yang bersifat memaksa dengan sanksi resmi.</li></ul>","mis":"<ul><li>Mengira sosialisasi hanya terjadi saat kecil.</li><li>Menyamakan nilai dan norma.</li><li>Mengira semua norma bersanksi hukuman penjara.</li></ul>","p":[["Agen sosialisasi pertama dan terpenting?",["Keluarga","Sekolah","Teman sebaya","Media"],"Keluarga."],["Aturan yang bersifat memaksa?",["Norma hukum","Norma kesopanan","Norma agama","Norma kesusilaan"],"Hukum."],["Sesuatu yang dianggap baik dan berharga disebut…",["Nilai","Norma","Sanksi","Status"],"Nilai."],["Sosialisasi berlangsung…",["Seumur hidup","Hanya saat kecil","Hanya di sekolah","Hanya saat dewasa"],"Seumur hidup."]],"e":[["Termasuk keluarga inti?",["Ayah, ibu, saudara sekandung","Kakek, nenek, paman","Teman, guru","Tetangga"],"Keluarga inti."],["Kakek, nenek, paman, bibi termasuk…",["Kerabat (extended family)","Keluarga inti","Teman sebaya","Media massa"],"Kekerabatan."],["Media sosial termasuk agen sosialisasi…",["Media massa","Keluarga","Sekolah","Teman sebaya"],"Media."],["Norma tata krama pergaulan?",["Kesopanan","Hukum","Agama","Kesusilaan"],"Kesopanan."],["Nilai estetika berkaitan dengan…",["Keindahan","Kebenaran saja","Hukuman","Pajak"],"Keindahan."],["Menyeberangkan lansia adalah contoh nilai…",["Moral (kebaikan)","Estetika","Material","Politik"],"Perbuatan baik."],["Sanksi norma hukum bersifat…",["Tegas dan resmi","Hanya teguran","Tidak ada","Hanya bisik-bisik"],"Memaksa."],["Fungsi norma?",["Menjaga ketertiban dan mencegah konflik","Menaikkan harga","Menambah libur","Mengurangi sekolah"],"Ketertiban."],["Teman sebaya memengaruhi gaya bicaramu. Ini…",["Sosialisasi lewat teman sebaya","Hanya keluarga","Hukum","Stratifikasi"],"Teman sebaya adalah agen."],["Remaja ikut membeli barang karena iklan dan teman. Agen sosialisasinya?",["Media massa dan teman sebaya","Hanya kerabat","Hanya sekolah","Tidak ada"],"Dua agen sekaligus."]]},"B.1.0":{"k":8,"g":"Menjelaskan faktor penyebab keragaman sosial budaya Indonesia, jenisnya, dan tujuh unsur kebudayaan universal.","core":"<p>Indonesia sangat beragam: ratusan suku, bahasa daerah, agama, adat, pakaian, dan rumah adat. Semboyan <b>Bhinneka Tunggal Ika</b> mengingatkan bahwa berbeda-beda tetapi tetap satu. Nenek moyang bangsa Indonesia datang bergelombang dari <b>Yunan</b> (Tiongkok bagian selatan).</p><p><b>Penyebab keragaman</b></p><ul><li><b>Faktor geografis</b>: Indonesia negara kepulauan. Laut menjadi <b>isolasi alami</b> (orang butuh kapal untuk berpindah pulau), sehingga budaya tiap pulau berkembang sendiri. Iklim dan lingkungan juga memengaruhi budaya, misalnya rumah adat Baduy menghadap utara-selatan agar cahaya matahari masuk dan udara mengalir lancar.</li><li><b>Kontak antarbudaya (akulturasi)</b>: Gedung Sate Bandung memadukan arsitektur Belanda, Masjid Cheng Ho Surabaya memadukan arsitektur Tionghoa.</li></ul><p><b>Tujuh unsur kebudayaan universal</b>: bahasa, sistem pengetahuan, organisasi sosial, sistem peralatan hidup dan teknologi, sistem mata pencaharian, sistem religi, dan kesenian.</p><p>Contoh keragaman: baju adat Papua Barat dan Batak berbeda, upacara Melasti di Bali. Sikap yang tepat: toleransi, saling menghargai, dan menjaga persatuan.</p>","ex":"<ul><li>Pulau-pulau yang dipisahkan laut memiliki bahasa dan adat berbeda.</li><li>Upacara Melasti dilakukan umat Hindu di Bali: contoh keragaman agama dan adat.</li><li>Masjid Cheng Ho: akulturasi budaya Islam dan Tionghoa.</li></ul>","cmp":"<ul><li><b>Isolasi geografis</b> membuat budaya berbeda; <b>kontak budaya</b> membuat budaya berpadu.</li><li><b>Keragaman</b> adalah perbedaan; <b>persatuan</b> adalah sikap menyatukannya.</li></ul>","mis":"<ul><li>Mengira keragaman adalah sumber perpecahan.</li><li>Mengira semua budaya Indonesia sama.</li><li>Mengira rumah adat dibuat tanpa mempertimbangkan lingkungan.</li></ul>","p":[["Nenek moyang bangsa Indonesia datang dari…",["Yunan","Arab","Eropa","Australia"],"Dari Yunan."],["Laut sebagai pemisah pulau disebut…",["Isolasi alami","Akulturasi","Asimilasi","Difusi"],"Isolasi geografis."],["Gedung Sate memadukan arsitektur…",["Belanda","Tionghoa","Arab","Jepang"],"Akulturasi Belanda."],["Semboyan Indonesia?",["Bhinneka Tunggal Ika","Tut Wuri Handayani","Merdeka atau Mati","Gotong Royong"],"Berbeda-beda tetap satu."]],"e":[["Mengapa budaya antarpulau bisa berbeda?",["Laut menjadi isolasi alami","Semua pulau sama","Tidak ada laut","Penduduk sedikit"],"Isolasi geografis."],["Tujuh unsur kebudayaan universal salah satunya?",["Sistem religi","Pajak","Harga","Cuaca"],"Religi termasuk."],["Unsur kebudayaan universal berikut kecuali…",["Zona waktu","Bahasa","Kesenian","Mata pencaharian"],"Zona waktu bukan unsur."],["Rumah adat Baduy menghadap utara-selatan agar…",["Cahaya masuk dan udara lancar","Tampak megah","Dekat sungai","Lebih tinggi"],"Menyesuaikan lingkungan."],["Masjid Cheng Ho contoh…",["Akulturasi","Konflik","Persaingan","Isolasi"],"Budaya berpadu."],["Melasti dilakukan di…",["Bali","Papua","Aceh","Jawa Barat"],"Upacara umat Hindu Bali."],["Sikap menghadapi keragaman?",["Toleransi","Menghina","Menjauhi","Memaksa"],"Saling menghargai."],["Baju adat Batak dan Papua Barat berbeda karena…",["Budaya dan lingkungan berbeda","Keduanya sama","Tidak ada alasan","Cuaca sama"],"Keragaman budaya."],["Contoh unsur sistem pengetahuan?",["Pengetahuan tentang alam dan pertanian","Pajak","Peta","Mata uang"],"Pengetahuan lokal."],["Bila dua budaya bertemu dan berpadu, hasilnya…",["Akulturasi","Isolasi","Boikot","Perang"],"Kontak budaya."]]},"B.1.1":{"k":8,"g":"Mengenal sejarah lokal dan meneladani tokoh Sultan Nuku, Ratu Kalinyamat, dan Laksamana Malahayati.","core":"<p><b>Sejarah lokal</b> adalah sejarah suatu daerah, yang berperan menumbuhkan kebanggaan dan jati diri. Tiga tokoh lokal yang perlu diteladani:</p><ul><li><b>Sultan Nuku</b> dari Tidore (Maluku Utara) memimpin perlawanan terhadap penjajah Belanda (VOC) dan menjadi Sultan Tidore pada 1797. Keteladanan: berani, pemersatu, cerdas menyusun strategi.</li><li><b>Ratu Kalinyamat</b> penguasa Jepara pada abad ke-16. Di bawah pemerintahannya Pelabuhan Jepara menjadi pelabuhan penting di pesisir utara Jawa dan armadanya menyerang Portugis di Malaka. Keteladanan: berani, tegas, pemimpin maritim.</li><li><b>Laksamana Malahayati</b> dari Aceh memimpin <b>Armada Inong Balee</b> (pasukan para janda) melawan Belanda. Keteladanan: berani, tangguh, bela tanah air.</li></ul><p>Nilai yang dapat kita teladani: keberanian, persatuan, kepemimpinan, dan cinta tanah air.</p>","ex":"<ul><li>Pelabuhan Jepara ramai karena armada dagang dan perang Ratu Kalinyamat.</li><li>Reruntuhan pangkalan Armada Inong Balee di Desa Lamreh, Aceh: sumber sejarah benda.</li><li>Lukisan Masjid di Waru, Seram, markas Sultan Nuku saat melawan Belanda.</li></ul>","cmp":"<ul><li>Sultan Nuku (Maluku Utara, melawan Belanda), Ratu Kalinyamat (Jawa, melawan Portugis), Malahayati (Aceh, melawan Belanda).</li><li><b>Sejarah nasional</b> mencakup bangsa, <b>sejarah lokal</b> mencakup daerah.</li></ul>","mis":"<ul><li>Mengira tokoh lokal tidak penting karena bukan tingkat nasional.</li><li>Menukar daerah asal tokoh.</li><li>Menghafal tanpa meneladani nilai.</li></ul>","p":[["Sultan Nuku berasal dari…",["Tidore","Aceh","Jepara","Makassar"],"Tidore, Maluku Utara."],["Ratu Kalinyamat memerintah di…",["Jepara","Tidore","Aceh","Banten"],"Jepara."],["Armada Inong Balee dipimpin oleh…",["Laksamana Malahayati","Ratu Kalinyamat","Sultan Nuku","Cut Nyak Dien"],"Malahayati."],["Nilai keteladanan tokoh lokal?",["Berani dan cinta tanah air","Egois","Malas","Curang"],"Keberanian dan cinta tanah air."]],"e":[["Sultan Nuku melawan…",["Belanda (VOC)","Portugis","Jepang","Inggris"],"Melawan Belanda."],["Pada tahun berapa Sultan Nuku menjadi Sultan Tidore?",["1797","1602","1945","1511"],"1797."],["Ratu Kalinyamat menyerang Portugis di…",["Malaka","Batavia","Banda","Ambon"],"Malaka."],["Pelabuhan Jepara terletak di pesisir…",["Utara Jawa","Selatan Jawa","Barat Sumatra","Timur Papua"],"Pesisir utara Jawa."],["Armada Inong Balee beranggotakan…",["Para janda","Anak-anak","Pedagang asing","Pelaut Belanda"],"Pasukan janda."],["Malahayati berasal dari…",["Aceh","Jepara","Tidore","Banten"],"Aceh."],["Nilai keteladanan Sultan Nuku?",["Pemersatu dan strategis","Mudah menyerah","Egois","Penakut"],"Mempersatukan rakyat."],["Mengapa kita mempelajari sejarah lokal?",["Menumbuhkan jati diri dan kebanggaan daerah","Menghitung pajak","Mengukur curah hujan","Menentukan zona waktu"],"Identitas."],["Reruntuhan pangkalan Inong Balee termasuk sumber…",["Benda","Tertulis","Lisan","Digital"],"Sumber benda."],["Meneladani tokoh berarti…",["Menerapkan nilai juangnya sehari-hari","Hanya menghafal nama","Membandingkan harga","Menggambar peta"],"Menerapkan nilai."]]},"B.1.2":{"k":8,"g":"Menjelaskan permasalahan lingkungan akibat pertambahan penduduk dan kerusakan hutan, serta masalah pelestarian cagar budaya.","core":"<p><b>Pertambahan penduduk</b> membuat kebutuhan pangan, tempat tinggal, dan energi meningkat, sehingga tekanan terhadap lingkungan naik. Akibatnya <b>tutupan hutan alam</b> Indonesia terus berkurang karena penebangan, pembukaan lahan, dan kebakaran. <b>Hutan hujan tropis</b> menyimpan keanekaragaman hayati, menjaga tata air, dan menyerap karbon. Bila rusak: banjir, tanah longsor, satwa kehilangan habitat, dan perubahan iklim memburuk. Upaya: reboisasi (menanam kembali), penegakan hukum, pengelolaan hutan lestari, dan mengurangi pemborosan.</p><p><b>Permasalahan budaya</b>: <b>vandalisme</b> (mencoret atau merusak) pada situs <b>cagar budaya</b> menghilangkan nilai sejarahnya. Cagar budaya adalah warisan budaya yang dilindungi negara. Upaya pelestarian: tidak merusak dan tidak mencoret, merawat, melaporkan kerusakan, serta mengedukasi teman. Pengaruh budaya asing juga dapat membuat budaya lokal (misalnya cerita rakyat) ditinggalkan bila tidak dilestarikan.</p>","ex":"<ul><li>Hutan ditebang untuk lahan, saat hujan deras terjadi banjir bandang.</li><li>Pengunjung mencoret dinding candi: vandalisme di cagar budaya.</li><li>Sekolah menanam pohon bersama: reboisasi.</li></ul>","cmp":"<ul><li><b>Reboisasi</b> menanam kembali hutan gundul, <b>konservasi</b> menjaga hutan yang masih ada.</li><li><b>Pelestarian budaya</b> menjaga warisan, <b>vandalisme</b> merusaknya.</li></ul>","mis":"<ul><li>Mengira hutan hanya sumber kayu.</li><li>Mengira mencoret situs hanya masalah kecil.</li><li>Mengira pelestarian hanya tugas pemerintah.</li></ul>","p":[["Penanaman kembali hutan gundul disebut…",["Reboisasi","Urbanisasi","Erosi","Hilirisasi"],"Reboisasi."],["Mencoret candi termasuk…",["Vandalisme","Akulturasi","Konservasi","Hilirisasi"],"Vandalisme."],["Hutan hujan tropis berfungsi…",["Menjaga tata air dan keanekaragaman hayati","Menambah pajak","Membuat gurun","Mengurangi hujan"],"Fungsi ekologis."],["Cagar budaya adalah…",["Warisan budaya yang dilindungi","Tempat wisata baru","Pasar modern","Gedung kantor"],"Dilindungi negara."]],"e":[["Pertambahan penduduk dapat menyebabkan…",["Tekanan pada lingkungan naik","Hutan bertambah","Sampah hilang","Kebutuhan turun"],"Kebutuhan naik."],["Penyebab berkurangnya tutupan hutan?",["Penebangan dan pembukaan lahan","Hujan","Gempa kecil","Pasang laut"],"Alih fungsi lahan."],["Dampak hutan rusak?",["Banjir dan longsor","Udara lebih sejuk selalu","Panen melimpah","Air bersih bertambah"],"Tata air terganggu."],["Satwa kehilangan habitat karena…",["Hutan rusak","Hutan lestari","Hujan","Musim kemarau"],"Habitat rusak."],["Contoh upaya pelestarian hutan?",["Reboisasi","Pembakaran lahan","Penebangan liar","Membuang limbah"],"Menanam kembali."],["Mencoret dinding candi berdampak…",["Merusak nilai sejarah","Menambah nilai","Tidak berdampak","Memperindah"],"Situs rusak."],["Sikap tepat di situs cagar budaya?",["Tidak mencoret dan merawat","Mengambil batu","Memanjat arca","Membuang sampah"],"Menjaga."],["Mengapa hutan disebut penyerap karbon?",["Pohon menyerap CO₂","Pohon memproduksi CO₂","Tanah memanas","Air menguap"],"Pohon menyerap CO₂."],["Budaya lokal bisa tergerus bila…",["Tidak dilestarikan","Selalu dirayakan","Dipelajari","Dicatat"],"Perlu dilestarikan."],["Kamu melihat temanmu mencoret batu situs sejarah. Tindakan terbaik?",["Menegur dan mengingatkan","Ikut mencoret","Membiarkan","Memotret"],"Mengedukasi."]]},"B.1.3":{"k":8,"g":"Menjelaskan fungsi uang, hukum Engel, perbedaan kebutuhan dan keinginan, serta menyusun anggaran dan pencatatan keuangan sederhana.","core":"<p><b>Uang</b> adalah alat tukar yang diterima secara umum (uang kertas dan uang logam). Sebelum ada uang orang melakukan <b>barter</b> (tukar barang dengan barang) yang menyulitkan karena harus bertemu orang yang saling membutuhkan. <b>Fungsi uang</b>: alat tukar, satuan hitung (menyatakan nilai barang), dan penyimpan nilai (emas batangan juga dipakai menyimpan nilai).</p><p><b>Hukum Engel</b> (Ernst Engel): semakin tinggi pendapatan, semakin <b>kecil persentase</b> pengeluaran untuk makanan, karena kebutuhan pokok sudah tercukupi dan sisanya dipakai untuk kebutuhan lain.</p><p><b>Kebutuhan</b> harus didahulukan daripada <b>keinginan</b>. Agar uang tidak habis tanpa rencana, buat <b>anggaran</b> (rencana pemasukan dan pengeluaran). Contohnya <b>metode amplop</b>: uang dibagi ke amplop sesuai pos kebutuhan. Lakukan <b>pencatatan keuangan sederhana</b> berisi tanggal, uraian, pemasukan, pengeluaran, dan saldo. <b>Literasi keuangan</b> adalah pengetahuan dan keterampilan mengelola uang secara bijak.</p>","ex":"<ul><li>Uang saku Rp50.000 seminggu: Rp30.000 kebutuhan sekolah, Rp10.000 jajan, Rp10.000 ditabung.</li><li>Catatan: Senin masuk Rp50.000, Selasa beli buku keluar Rp15.000, saldo Rp35.000.</li></ul>","cmp":"<ul><li><b>Barter</b> butuh kecocokan kebutuhan, <b>uang</b> memudahkan transaksi.</li><li><b>Anggaran</b> adalah rencana, <b>pencatatan</b> adalah bukti pelaksanaan.</li></ul>","mis":"<ul><li>Mengira persentase makanan naik saat pendapatan naik (justru turun).</li><li>Membeli karena ikut-ikutan, bukan karena butuh.</li><li>Tidak mencatat pengeluaran.</li></ul>","p":[["Tukar barang dengan barang?",["Barter","Jual beli","Sewa","Gadai"],"Barter."],["Fungsi uang sebagai alat tukar berarti…",["Dipakai membeli barang dan jasa","Dipakai menghitung pajak","Dipakai menyimpan hewan","Dipakai membuat peta"],"Alat tukar."],["Hukum Engel: pendapatan naik, persentase pengeluaran makanan…",["Menurun","Naik","Tetap","Nol"],"Persentasenya turun."],["Rencana pemasukan dan pengeluaran disebut…",["Anggaran","Barter","Subsidi","Pajak"],"Anggaran."]],"e":[["Kelemahan barter?",["Sulit menemukan pihak yang saling membutuhkan","Terlalu murah","Terlalu cepat","Tak ada barang"],"Kebutuhan harus cocok."],["Satuan hitung berarti uang dipakai untuk…",["Menyatakan nilai barang","Membeli saja","Menyimpan es","Membayar listrik saja"],"Ukuran nilai."],["Emas batangan berfungsi sebagai…",["Penyimpan nilai","Alat barter","Pajak","Subsidi"],"Menyimpan kekayaan."],["Ernst Engel terkenal dengan…",["Hukum Engel","Hukum permintaan","Hukum adat","Hukum rimba"],"Hukum Engel."],["Keluarga berpenghasilan tinggi cenderung punya porsi belanja makanan…",["Lebih kecil","Lebih besar","Sama","Nol"],"Hukum Engel."],["Metode amplop berarti…",["Membagi uang sesuai pos kebutuhan","Menyimpan semua uang","Membeli amplop","Menukar uang"],"Alokasi anggaran."],["Isi pencatatan keuangan sederhana?",["Tanggal, uraian, pemasukan, pengeluaran, saldo","Hanya nama","Hanya tanggal","Hanya saldo"],"Lima unsur."],["Prioritas utama saat uang terbatas?",["Kebutuhan","Keinginan","Hadiah","Mainan"],"Kebutuhan dulu."],["Seorang siswa menerima Rp50.000, membelanjakan Rp15.000. Saldonya?",["Rp35.000","Rp15.000","Rp65.000","Rp50.000"],"Rp50.000 − Rp15.000."],["Literasi keuangan membantu kita…",["Mengelola uang secara bijak","Menambah uang tanpa kerja","Menghindari pajak","Menghabiskan tabungan"],"Pengelolaan bijak."]]},"B.1.4":{"k":8,"g":"Menjelaskan manfaat menabung, jenis lembaga keuangan bank dan nonbank, serta peluang dan risiko ekonomi digital.","core":"<p><b>Menabung</b> adalah menyisihkan sebagian pendapatan untuk keperluan masa depan. Manfaatnya: punya dana darurat, mencapai tujuan, dan terhindar dari utang.</p><p><b>Lembaga keuangan bank</b> menghimpun dana dari masyarakat (tabungan) dan menyalurkannya (kredit): bank umum, BPR, dengan Bank Indonesia sebagai bank sentral. Simpanan di bank dijamin oleh <b>LPS</b> (Lembaga Penjamin Simpanan). Bank memberi <b>bunga</b> sebagai imbalan.</p><p><b>Lembaga keuangan nonbank</b>, contohnya <b>pegadaian</b> (memberi pinjaman dengan jaminan barang/gadai), asuransi, dan koperasi simpan pinjam.</p><p><b>Ekonomi digital</b> memakai platform daring: belanja daring, transportasi daring, dan dompet digital. Peluang: mudah, cepat, jangkauan luas. Risiko: boros atau konsumtif karena promo, serta penipuan. Waspada <b>investasi bodong</b> dan <b>pinjaman daring ilegal</b>; pastikan layanan keuangan terdaftar dan diawasi <b>OJK</b>.</p>","ex":"<ul><li>Dina menyisihkan Rp5.000 tiap hari untuk membeli sepatu baru di akhir bulan.</li><li>Ibu menggadaikan perhiasan di pegadaian untuk modal usaha.</li><li>Ayah membayar listrik lewat dompet digital.</li></ul>","cmp":"<ul><li><b>Bank</b> menghimpun dan menyalurkan dana; <b>pegadaian</b> memberi pinjaman dengan gadai.</li><li><b>Investasi legal</b> terdaftar OJK; <b>investasi bodong</b> menjanjikan untung tidak wajar.</li></ul>","mis":"<ul><li>Mengira menabung hanya untuk orang kaya.</li><li>Tergiur untung besar tanpa cek legalitas.</li><li>Mengira belanja daring selalu hemat.</li></ul>","p":[["Menyisihkan sebagian pendapatan untuk masa depan?",["Menabung","Berbelanja","Meminjam","Menyewa"],"Menabung."],["Pegadaian termasuk lembaga keuangan…",["Nonbank","Bank sentral","Bank umum","BPR"],"Nonbank."],["Lembaga yang menjamin simpanan di bank?",["LPS","OJK saja","BPS","BMKG"],"LPS."],["Layanan keuangan yang aman biasanya…",["Terdaftar dan diawasi OJK","Menjanjikan untung besar tanpa risiko","Anonim","Tanpa izin"],"Terdaftar OJK."]],"e":[["Manfaat menabung?",["Punya dana darurat","Menambah utang","Menghilangkan bunga","Menaikkan pajak"],"Dana darurat."],["Bank menyalurkan dana dalam bentuk…",["Kredit","Pajak","Subsidi","Barter"],"Menyalurkan kredit."],["Imbalan dari bank atas tabungan?",["Bunga","Pajak","Denda","Subsidi"],"Bunga."],["Bank sentral Indonesia?",["Bank Indonesia","Pegadaian","BPR","Koperasi"],"Bank Indonesia."],["Pegadaian memberi pinjaman dengan…",["Jaminan barang","Tanpa jaminan","Jaminan pajak","Jaminan cuaca"],"Gadai."],["Risiko ekonomi digital?",["Konsumtif dan penipuan","Barang gratis","Harga nol","Tanpa risiko"],"Boros dan penipuan."],["Tawaran untung 50% seminggu tanpa risiko kemungkinan…",["Investasi bodong","Investasi aman","Tabungan","Asuransi"],"Tidak wajar."],["Pinjaman daring yang aman harus…",["Terdaftar OJK","Tidak dikenal","Menagih kasar","Menyimpan data bebas"],"Legalitas OJK."],["Dompet digital termasuk…",["Ekonomi digital","Barter","Perkebunan","Produksi tani"],"Platform daring."],["Kamu ingin membeli HP baru tapi uang kurang. Pilihan bijak?",["Menabung dulu","Berutang ke pinjol ilegal","Mencuri","Menunda bayar sekolah"],"Menabung."]]},"B.1.5":{"k":8,"g":"Menjelaskan pengertian komunitas, pemberdayaan masyarakat, contohnya (desa wisata dan bank sampah), serta langkah-langkahnya.","core":"<p><b>Komunitas</b> adalah sekelompok orang yang berinteraksi secara tetap karena kesamaan tempat tinggal, minat, atau tujuan (misalnya komunitas pecinta lingkungan, karang taruna, kelompok tani). <b>Pemberdayaan masyarakat</b> adalah upaya meningkatkan kemampuan dan kemandirian masyarakat agar dapat memperbaiki kehidupannya sendiri.</p><p><b>Contoh</b></p><ul><li><b>Desa wisata</b>: warga memanfaatkan potensi desa, misalnya pekarangan rumah untuk budidaya anggrek di Desa Wisata Anggrek Tulungrejo, Kota Batu, sehingga ekonomi desa tumbuh.</li><li><b>Bank sampah</b>: warga memilah sampah lalu menyetorkannya dan ditukar uang/tabungan, sehingga sampah berkurang dan warga mendapat penghasilan.</li></ul><p><b>Langkah pemberdayaan</b>: kenali potensi dan masalah, libatkan warga (partisipasi dan gotong royong), beri pelatihan, bantu pemasaran, lalu evaluasi agar berkelanjutan. Komunitas berperan di bidang ekonomi, lingkungan, sosial, dan budaya.</p>","ex":"<ul><li>Karang taruna menggerakkan kerja bakti dan lomba kampung.</li><li>Ibu-ibu menukar sampah plastik terpilah menjadi saldo tabungan di bank sampah.</li><li>Wisatawan datang melihat kebun anggrek warga: desa wisata.</li></ul>","cmp":"<ul><li><b>Komunitas</b> adalah kelompoknya, <b>pemberdayaan</b> adalah upayanya.</li><li><b>Bank sampah</b> menangani lingkungan dan ekonomi sekaligus; <b>desa wisata</b> memanfaatkan potensi alam dan budaya desa.</li></ul>","mis":"<ul><li>Mengira pemberdayaan berarti hanya memberi bantuan uang.</li><li>Mengira komunitas harus resmi dari pemerintah.</li><li>Mengira bank sampah hanya menumpuk sampah.</li></ul>","p":[["Kelompok orang yang berinteraksi karena kesamaan tempat atau minat?",["Komunitas","Individu","Perusahaan","Pasar"],"Komunitas."],["Upaya meningkatkan kemandirian warga?",["Pemberdayaan masyarakat","Konsumsi","Impor","Urbanisasi"],"Pemberdayaan."],["Warga menukar sampah terpilah menjadi uang?",["Bank sampah","Pegadaian","Bank sentral","Pasar saham"],"Bank sampah."],["Desa Wisata Anggrek Tulungrejo ada di…",["Kota Batu","Kota Bandung","Kota Medan","Kota Padang"],"Kota Batu."]],"e":[["Contoh komunitas?",["Karang taruna","Satu orang","Kapal tunggal","Pasar saham"],"Kelompok berminat sama."],["Ciri pemberdayaan yang baik?",["Melibatkan warga","Tanpa warga","Tanpa pelatihan","Tanpa evaluasi"],"Partisipasi."],["Manfaat bank sampah?",["Mengurangi sampah dan menambah penghasilan","Menambah sampah","Mencemari sungai","Menghilangkan warga"],"Dua manfaat."],["Desa wisata memanfaatkan…",["Potensi alam dan budaya desa","Bahan impor","Gedung tinggi","Pabrik besar"],"Potensi lokal."],["Langkah awal pemberdayaan?",["Mengenali potensi dan masalah","Menutup desa","Menjual lahan","Menunggu bantuan"],"Kenali potensi."],["Peran komunitas di bidang lingkungan?",["Menggerakkan penghijauan","Menebang hutan","Membakar sampah","Mengabaikan sungai"],"Menjaga alam."],["Mengapa gotong royong penting?",["Mempercepat dan meringankan pekerjaan bersama","Menambah biaya","Menghambat","Tidak berguna"],"Kerja sama."],["Pemberdayaan agar berkelanjutan memerlukan…",["Evaluasi dan pendampingan","Sekali bantuan","Larangan","Penutupan"],"Evaluasi."],["Pekarangan dipakai menanam anggrek yang dijual. Ini contoh…",["Pemberdayaan ekonomi desa","Pencemaran","Konflik","Urbanisasi"],"Pemanfaatan potensi."],["Kamu ingin membantu lingkungan RT. Langkah tepat?",["Bergabung dengan komunitas peduli lingkungan","Menunggu orang lain","Membuang sampah ke got","Menebang pohon"],"Berpartisipasi."]]},"B.1.6":{"k":8,"g":"Menjelaskan komunitas adat dan hukum adat menurut Van Vollenhoven serta peran pahlawan nasional.","core":"<p><b>Komunitas adat</b> (masyarakat hukum adat) adalah kelompok yang terikat oleh <b>hukum adat</b> dan wilayah tertentu, misalnya masyarakat Baduy. <b>Hukum adat</b> adalah aturan tidak tertulis yang hidup, dipatuhi turun-temurun, dan memiliki sanksi adat. Fungsinya menjaga keharmonisan dan kelestarian lingkungan (misalnya aturan menjaga hutan).</p><p><b>Cornelis van Vollenhoven</b> adalah ahli hukum Belanda yang meneliti hukum adat dan membagi wilayah Indonesia menjadi <b>19 lingkungan hukum adat</b>. Penelitiannya menunjukkan bahwa masyarakat Indonesia sudah memiliki hukum sendiri sebelum penjajahan.</p><p><b>Pahlawan nasional</b> adalah tokoh yang berjasa besar dan diberi gelar oleh negara. Banyak pahlawan berasal dari komunitas dan organisasi daerah. Meneladani mereka berarti mewarisi semangat berjuang, persatuan, dan pengorbanan dalam kehidupan sehari-hari, termasuk menjaga adat dan lingkungan.</p>","ex":"<ul><li>Masyarakat Baduy menaati aturan adat menjaga hutan dan tidak sembarang menebang.</li><li>Gelar Pahlawan Nasional diberikan kepada tokoh yang berjasa bagi bangsa (status yang diberikan, assigned status).</li></ul>","cmp":"<ul><li><b>Hukum adat</b> tidak tertulis dan berlaku di komunitas tertentu; <b>hukum negara</b> tertulis dan berlaku nasional.</li><li><b>Komunitas</b> adalah kelompoknya; <b>komunitas adat</b> terikat hukum adat.</li></ul>","mis":"<ul><li>Mengira hukum adat tidak punya sanksi.</li><li>Mengira hukum adat sama dengan hukum negara.</li><li>Mengira pahlawan hanya yang berperang.</li></ul>","p":[["Aturan tidak tertulis yang diwariskan turun-temurun?",["Hukum adat","Hukum pidana","Peraturan pemerintah","Undang-undang"],"Hukum adat."],["Van Vollenhoven membagi Indonesia menjadi berapa lingkungan hukum adat?",["19","7","50","5"],"19."],["Contoh komunitas adat?",["Masyarakat Baduy","Pasar modern","Perusahaan","Bank"],"Baduy."],["Gelar pahlawan nasional diberikan oleh…",["Negara","Teman","Sekolah","Pasar"],"Negara."]],"e":[["Cornelis van Vollenhoven adalah…",["Ahli hukum adat Belanda","Raja Jawa","Pahlawan Aceh","Gubernur Batavia"],"Peneliti hukum adat."],["Hukum adat berfungsi…",["Menjaga keharmonisan dan lingkungan","Menambah pajak","Mengganti hukum negara","Menutup sekolah"],"Menjaga keteraturan."],["Ciri hukum adat?",["Tidak tertulis dan ditaati turun-temurun","Selalu tertulis","Dibuat tiap hari","Hanya untuk kota"],"Tidak tertulis."],["Sanksi dalam hukum adat berupa…",["Sanksi adat","Tidak ada","Hanya penjara","Hanya denda uang"],"Ada sanksi adat."],["Penelitian Van Vollenhoven menunjukkan masyarakat Indonesia…",["Sudah punya hukum sendiri","Tidak punya aturan","Menolak aturan","Hanya mengikuti hukum asing"],"Hukum adat ada."],["Baduy menjaga hutan karena…",["Aturan adat melarang merusaknya","Tidak ada pohon","Takut hujan","Ada pajak"],"Hukum adat."],["Meneladani pahlawan berarti…",["Mewarisi semangat juang dan persatuan","Mengabaikan sejarah","Mencari keuntungan sendiri","Menghindari tanggung jawab"],"Mewarisi semangat."],["Pahlawan nasional contoh status…",["Assigned (diberikan)","Ascribed (lahir)","Achieved murni","Tak berstatus"],"Diberikan negara."],["Komunitas adat terikat oleh…",["Hukum adat dan wilayah","Seragam kerja","Kartu kredit","Harga pasar"],"Adat dan wilayah."],["Cara menghormati komunitas adat?",["Menaati aturan setempat saat berkunjung","Melanggar aturan","Merusak hutan adat","Mengabaikan penduduk"],"Menghargai adat."]]}};
