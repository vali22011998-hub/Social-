/ul>","cmp":"<ul><li><b>Mediasi</b> pihak ketiga hanya menyarankan; <b>arbitrasi</b> pihak ketiga memutuskan dan mengikat.</li></ul>","mis":"<ul><li>Mengira konflik selalu berupa kekerasan fisik.</li><li>Menyamakan mediasi dan arbitrasi.</li><li>Mengira konflik pasti tidak ada manfaat sama sekali.</li></ul>","p":[["Pihak ketiga netral yang memberi saran?",["Mediasi","Arbitrasi","Koersi","Stalemate"],"Mediasi."],["Pihak ketiga yang memutuskan dan mengikat?",["Arbitrasi","Mediasi","Kompromi","Toleransi"],"Arbitrasi."],["Konflik karena perbedaan budaya termasuk penyebab…",["Perbedaan budaya","Perbedaan cuaca","Perbedaan zona","Perbedaan harga"],"Budaya."],["Dampak negatif konflik?",["Korban dan kerusakan","Solidaritas saja","Perdamaian","Kemakmuran"],"Kerugian."]],"e":[["Kompromi berarti…",["Masing-masing pihak mengalah","Satu menang mutlak","Perang","Tidak bertemu"],"Mengalah."],["Perubahan sosial yang terlalu cepat dapat memicu…",["Konflik","Kerja sama otomatis","Pajak","Cuaca"],"Konflik."],["Dampak positif konflik?",["Solidaritas kelompok meningkat","Korban jiwa","Trauma","Kerusakan"],"Solidaritas."],["Konsiliasi berarti…",["Mempertemukan pihak berselisih","Memutuskan perkara","Menghukum","Mengusir"],"Mempertemukan."],["Ajudikasi dilakukan melalui…",["Pengadilan","Pasar","Sekolah","Rumah ibadah"],"Pengadilan."],["Penyebab konflik dari perbedaan kepentingan?",["Rebutan sumber daya atau kekuasaan","Hujan","Gempa","Cuaca"],"Kepentingan."],["Prasangka buruk memengaruhi konflik dengan cara…",["Memperburuk hubungan","Menyelesaikan","Menghapus","Tak berpengaruh"],"Memperburuk."],["Dua desa berebut batas lahan lalu dimediasi. Tujuannya…",["Menghentikan konflik secara damai","Memperbesar masalah","Menutup desa","Memindah penduduk"],"Damai."],["Perbedaan pendirian dan perasaan antarindividu adalah penyebab dari…",["Perbedaan individu","Perubahan cuaca","Letak geologis","Zona waktu"],"Individu."],["Cara terbaik menangani konflik di sekolah?",["Dialog dan mediasi guru","Saling balas","Diam saja","Mengeluarkan siswa tanpa dialog"],"Damai."]]},"D.0.7":{"k":8,"g":"Menjelaskan integrasi sosial, faktor pendorong dan penghambatnya, serta upaya mewujudkannya.","core":"<p><b>Integrasi sosial</b> adalah proses menyatukan unsur-unsur masyarakat yang berbeda menjadi satu kesatuan yang serasi. Bentuknya antara lain <b>asimilasi</b> dan <b>akulturasi</b>.</p><p><b>Faktor pendorong</b>: sikap <b>toleransi</b>, kesempatan yang seimbang dalam bidang ekonomi, kesamaan nilai dan budaya, saling menghargai, dan adanya musuh bersama. <b>Faktor penghambat</b>: kurang berbaur, prasangka, sikap <b>etnosentrisme</b> (menganggap budaya sendiri paling baik), dan ketimpangan ekonomi.</p><p><b>Perekat bangsa</b>: <b>empat pilar kebangsaan</b>, yaitu <b>Pancasila, UUD 1945, NKRI, dan Bhinneka Tunggal Ika</b>.</p><p><b>Upaya mewujudkan integrasi</b>: dialog antarkelompok, gotong royong, pendidikan yang menanamkan toleransi, pemerataan pembangunan, dan menjaga bahasa persatuan.</p>","ex":"<ul><li>Warga beragam agama bergotong royong membersihkan kampung: integrasi.</li><li>Seseorang menganggap adatnya paling benar dan menolak yang lain: etnosentrisme.</li></ul>","cmp":"<ul><li><b>Integrasi</b> menyatukan, <b>disintegrasi</b> memecah.</li></ul>","mis":"<ul><li>Mengira integrasi berarti menyeragamkan semua budaya.</li><li>Mengira cukup dilakukan pemerintah.</li><li>Menyebut tiga pilar saja.</li></ul>","p":[["Proses menyatukan unsur berbeda menjadi satu?",["Integrasi sosial","Disintegrasi","Konflik","Isolasi"],"Integrasi."],["Menganggap budaya sendiri paling baik?",["Etnosentrisme","Toleransi","Akulturasi","Asimilasi"],"Etnosentrisme."],["Salah satu pilar kebangsaan?",["Pancasila","APBN","Zona waktu","ASEAN"],"Empat pilar."],["Faktor pendorong integrasi?",["Toleransi","Prasangka","Diskriminasi","Ketimpangan"],"Toleransi."]],"e":[["Empat pilar kebangsaan?",["Pancasila, UUD 1945, NKRI, Bhinneka Tunggal Ika","Pancasila, ASEAN, PBB, APBN","UUD, BI, OJK, LPS","Merdeka, Bhinneka, PBB, WTO"],"Empat pilar."],["Faktor penghambat integrasi?",["Prasangka dan etnosentrisme","Toleransi","Gotong royong","Dialog"],"Penghambat."],["Upaya mewujudkan integrasi?",["Dialog dan gotong royong","Saling curiga","Memisahkan kelompok","Menutup diri"],"Upaya."],["Bentuk integrasi sosial?",["Asimilasi dan akulturasi","Konflik dan persaingan","Kontravensi","Boikot"],"Dua bentuk."],["Mengapa pemerataan pembangunan mendukung integrasi?",["Mengurangi kecemburuan antardaerah","Menambah kesenjangan","Memecah bangsa","Menaikkan prasangka"],"Keadilan."],["Musuh bersama dapat mendorong…",["Persatuan","Perpecahan","Isolasi","Konflik internal"],"Persatuan."],["Pendidikan toleransi berguna untuk…",["Menanamkan sikap saling menghargai","Membenci","Memisahkan","Memaksa"],"Toleransi."],["Integrasi tidak berarti…",["Menyeragamkan semua budaya","Bersatu dalam perbedaan","Gotong royong","Saling menghargai"],"Bhinneka."],["Warga berbeda agama bergotong royong. Ini contoh…",["Integrasi sosial","Disintegrasi","Konflik","Etnosentrisme"],"Persatuan."],["Bahasa persatuan Indonesia berperan sebagai…",["Perekat bangsa","Pemisah suku","Penghalang","Pembatas"],"Perekat."]]},"D.1.0":{"k":8,"g":"Menjelaskan kondisi ekonomi Indonesia pada awal kemerdekaan dan kebijakan pemerintah mengatasinya.","core":"<p>Setelah proklamasi, ekonomi Indonesia sangat sulit: <b>inflasi tinggi</b> karena beredar tiga jenis mata uang (uang Jepang, uang Belanda/NICA, dan uang De Javasche Bank), <b>blokade ekonomi Belanda</b> yang menutup jalur ekspor-impor, serta kas negara kosong dan infrastruktur rusak.</p><p><b>Kebijakan pemerintah</b></p><ul><li><b>Oeang Republik Indonesia (ORI)</b> diterbitkan 30 Oktober 1946 sebagai mata uang sah.</li><li><b>Gunting Syafruddin</b> (1950): uang digunting menjadi dua, bagian kiri berlaku sebagai alat bayar dan bagian kanan menjadi obligasi, untuk menekan inflasi.</li><li><b>Program Benteng</b> (1950, Sumitro Djojohadikusumo): membantu pengusaha pribumi agar kuat.</li><li><b>Nasionalisasi De Javasche Bank</b> (1951) menjadi Bank Indonesia.</li></ul><p>Pada masa Demokrasi Liberal ekonomi tidak stabil, pemerintah sering berganti, dan inflasi tinggi berlanjut hingga akhir Orde Lama.</p>","ex":"<ul><li>Pedagang bingung memakai uang karena ada tiga mata uang yang beredar.</li><li>Gunting Syafruddin memotong nilai uang untuk mengurangi uang beredar.</li></ul>","cmp":"<ul><li><b>ORI</b> membuat mata uang nasional, <b>Gunting Syafruddin</b> menekan inflasi, <b>Program Benteng</b> menguatkan pengusaha pribumi.</li></ul>","mis":"<ul><li>Mengira ekonomi stabil begitu merdeka.</li><li>Menukar Gunting Syafruddin dan Program Benteng.</li><li>Menyamakan ORI dengan uang Jepang.</li></ul>","p":[["ORI diterbitkan pada…",["30 Oktober 1946","17 Agustus 1945","1 Juni 1945","28 Oktober 1928"],"1946."],["Penyebab inflasi awal kemerdekaan?",["Beredar tiga mata uang","Harga murah","Panen berlebih","Terlalu banyak bank"],"Tiga mata uang."],["Kebijakan menguatkan pengusaha pribumi?",["Program Benteng","Gunting Syafruddin","Sanering","ORI"],"Benteng."],["Gunting Syafruddin dilakukan tahun…",["1950","1946","1965","1998"],"1950."]],"e":[["Tiga mata uang yang beredar awal merdeka?",["Jepang, NICA/Belanda, De Javasche Bank","Rupiah, dolar, yen","ORI, euro, rupiah","Poundsterling, franc, mark"],"Tiga jenis."],["Blokade ekonomi Belanda bertujuan…",["Melumpuhkan perdagangan Indonesia","Membantu ekspor","Menurunkan inflasi","Menambah devisa"],"Menutup jalur dagang."],["Gunting Syafruddin membagi uang menjadi…",["Alat bayar dan obligasi","Dua alat bayar","Dua obligasi","Dibuang"],"Dua bagian."],["Pencetus Program Benteng?",["Sumitro Djojohadikusumo","Syafruddin","Hatta","Soekarno"],"Sumitro."],["De Javasche Bank dinasionalisasi menjadi…",["Bank Indonesia","Bank Dunia","BRI","BNI"],"1951."],["Tujuan ORI?",["Mata uang sah nasional","Mata uang Belanda","Uang Jepang","Uang asing"],"Alat bayar sah."],["Mengapa inflasi parah di awal kemerdekaan?",["Uang beredar banyak dan barang sulit","Barang berlimpah","Upah tinggi","Pajak nol"],"Uang banyak, barang sedikit."],["Pada masa Demokrasi Liberal ekonomi…",["Tidak stabil","Sangat stabil","Selalu surplus","Bebas inflasi"],"Tidak stabil."],["Tujuan Program Benteng?",["Memperkuat pengusaha nasional","Menutup perusahaan","Menaikkan pajak","Membatasi impor saja"],"Pribumi."],["Pemerintah mengurangi uang beredar dengan memotong nilai uang. Itu…",["Gunting Syafruddin","Program Benteng","ORI","Oktroi"],"Pemotongan."]]},"D.1.1":{"k":8,"g":"Menjelaskan kebijakan ekonomi Orde Baru, Repelita, swasembada beras, serta kelebihan dan kelemahannya.","core":"<p><b>Orde Baru</b> (1966–1998) mengutamakan stabilitas politik dan pembangunan ekonomi dengan <b>Trilogi Pembangunan</b>: stabilitas nasional, pertumbuhan ekonomi, dan pemerataan pembangunan.</p><p>Awalnya pemerintah menekan inflasi (stabilisasi), lalu melaksanakan <b>Repelita</b> (Rencana Pembangunan Lima Tahun) sejak 1969: tiap lima tahun ada target pembangunan, terutama pertanian. Program pertanian: <b>Revolusi Hijau</b> (bibit unggul, pupuk, irigasi), <b>Bimas</b>, dan program <b>Keluarga Berencana</b>. Indonesia mencapai <b>swasembada beras pada 1984</b>. Penerimaan dari minyak bumi dan gas menopang pembangunan.</p><p><b>Kelebihan</b>: pertumbuhan ekonomi tinggi, inflasi terkendali, infrastruktur bertambah. <b>Kelemahan</b>: ketergantungan utang luar negeri, <b>korupsi, kolusi, nepotisme (KKN)</b>, kesenjangan, dan ekonomi yang rapuh sehingga runtuh saat krisis 1997–1998.</p>","ex":"<ul><li>Petani memakai bibit unggul dan pupuk lewat program Bimas sehingga panen padi naik.</li></ul>","cmp":"<ul><li><b>Orde Lama</b> inflasi tinggi dan tidak stabil; <b>Orde Baru</b> inflasi terkendali dan pertumbuhan tinggi, tetapi bergantung utang dan KKN.</li></ul>","mis":"<ul><li>Mengira Orde Baru tanpa kelemahan.</li><li>Mengira swasembada beras terjadi 1998.</li><li>Menukar Repelita dan Pelita VI.</li></ul>","p":[["Repelita adalah…",["Rencana Pembangunan Lima Tahun","Rencana harian","Sistem pajak","Program sekolah"],"Lima tahun."],["Swasembada beras tercapai tahun…",["1984","1945","1998","2010"],"1984."],["Masa pemerintahan Orde Baru?",["1966–1998","1945–1966","1998–sekarang","1900–1945"],"Orde Baru."],["Kelemahan ekonomi Orde Baru?",["Ketergantungan utang dan KKN","Harga stabil","Swasembada","Inflasi rendah"],"Kelemahan."]],"e":[["Trilogi Pembangunan terdiri dari…",["Stabilitas, pertumbuhan, pemerataan","Produksi, distribusi, konsumsi","Pajak, utang, subsidi","Politik, sosial, budaya"],"Tiga unsur."],["Revolusi Hijau memakai…",["Bibit unggul, pupuk, irigasi","Senjata","Mesin cetak","Satelit"],"Pertanian."],["Program pengendalian penduduk?",["Keluarga Berencana","Bimas","Repelita","Transmigrasi"],"KB."],["Penopang pembangunan selain pertanian?",["Minyak bumi dan gas","Batu es","Emas dunia","Gandum"],"Migas."],["KKN singkatan dari…",["Korupsi, kolusi, nepotisme","Kerja, kuliah, nikah","Kota, kabupaten, nasional","Kas, kredit, neraca"],"KKN."],["Mengapa ekonomi runtuh 1997–1998?",["Fondasi rapuh dan utang besar","Panen berlebih","Pajak nol","Subsidi tinggi"],"Rapuh."],["Bimas bertujuan…",["Membimbing petani meningkatkan panen","Menaikkan pajak","Mengurangi sekolah","Memusatkan industri"],"Pertanian."],["Repelita mulai dilaksanakan…",["1969","1945","1998","1957"],"1969."],["Keuntungan Orde Baru?",["Inflasi terkendali dan pertumbuhan tinggi","Tidak ada utang","Tanpa KKN","Semua merata"],"Kelebihan."],["Swasembada beras berarti…",["Kebutuhan beras tercukupi dari produksi sendiri","Mengimpor semua beras","Tidak makan nasi","Ekspor semua"],"Cukup sendiri."]]},"D.1.2":{"k":8,"g":"Menjelaskan krisis moneter 1997–1998, reformasi, dan perkembangan ekonomi masa Reformasi.","core":"<p>Pada 1997 <b>krisis moneter</b> dari Asia Tenggara melanda Indonesia: nilai rupiah anjlok, harga melonjak, bank dan perusahaan bangkrut, PHK massal, dan kemiskinan naik. Krisis berubah menjadi krisis politik, dan <b>Orde Baru berakhir pada Mei 1998</b>, dimulailah era <b>Reformasi</b>.</p><p><b>Langkah pemulihan</b>: bantuan dan program dari <b>IMF</b>, restrukturisasi dan penutupan bank bermasalah (BPPN), serta penguatan pengawasan keuangan.</p><p><b>Perubahan masa Reformasi</b>: <b>otonomi daerah</b> (daerah mengatur urusannya sendiri), <b>independensi Bank Indonesia</b> (1999), pembentukan <b>KPK</b> (2002) untuk memberantas korupsi, amendemen UUD 1945, dan kebebasan berusaha lebih luas. Ekonomi kembali tumbuh rata-rata sekitar 5% per tahun, tetapi masih ada tantangan: korupsi, ketimpangan, dan ketergantungan pada ekspor bahan mentah.</p>","ex":"<ul><li>Harga sembako naik tajam saat rupiah melemah tahun 1998.</li><li>Pemerintah daerah mengelola anggaran sendiri berkat otonomi daerah.</li></ul>","cmp":"<ul><li><b>Orde Baru</b> pemerintahan terpusat; <b>Reformasi</b> otonomi daerah dan lembaga antikorupsi.</li></ul>","mis":"<ul><li>Mengira krisis hanya soal politik.</li><li>Mengira reformasi langsung menyelesaikan semua masalah.</li><li>Menukar KPK dengan BPPN.</li></ul>","p":[["Krisis moneter melanda Indonesia tahun…",["1997–1998","1945","1965","2010"],"1997."],["Lembaga antikorupsi bentukan Reformasi?",["KPK","BPPN","OJK","LPS"],"KPK."],["Orde Baru berakhir…",["Mei 1998","Maret 1966","Agustus 1945","Oktober 1928"],"1998."],["Otonomi daerah artinya…",["Daerah mengatur urusannya sendiri","Pusat mengatur semua","Daerah merdeka","Tanpa pemerintah"],"Mengatur sendiri."]],"e":[["Ciri krisis moneter 1997?",["Rupiah anjlok dan harga melonjak","Rupiah menguat","Harga turun","Banyak lapangan kerja"],"Rupiah anjlok."],["Lembaga internasional yang membantu pemulihan?",["IMF","WHO","UNESCO","FIFA"],"IMF."],["BPPN bertugas…",["Merestrukturisasi bank bermasalah","Menumpas korupsi","Mengawasi OJK","Menerbitkan uang"],"Bank."],["Independensi Bank Indonesia terjadi tahun…",["1999","1945","1966","2020"],"1999."],["KPK dibentuk tahun…",["2002","1969","1984","1945"],"2002."],["Pertumbuhan ekonomi Reformasi rata-rata…",["Sekitar 5% per tahun","50%","0%","−10%"],"Sekitar 5%."],["Tantangan ekonomi Reformasi?",["Korupsi dan ketimpangan","Tak ada tantangan","Inflasi nol","Tanpa utang"],"Masih ada."],["Dampak krisis bagi pekerja?",["PHK massal","Kenaikan gaji","Libur panjang","Lapangan kerja bertambah"],"PHK."],["Mengapa otonomi daerah dibentuk?",["Mendekatkan pelayanan dan pembangunan","Memusatkan kekuasaan","Menghapus daerah","Menghentikan pajak"],"Pemerataan."],["Era setelah Orde Baru disebut…",["Reformasi","Demokrasi Terpimpin","Demokrasi Liberal","Kolonial"],"Reformasi."]]},"D.1.3":{"k":8,"g":"Menjelaskan ekspor dan impor, faktor penyebab, prosedur, komoditas, devisa, dan neraca perdagangan.","core":"<p><b>Ekspor</b> adalah menjual barang atau jasa ke luar negeri. <b>Impor</b> adalah membeli dari luar negeri. Perdagangan internasional terjadi karena <b>perbedaan sumber daya alam</b>, teknologi, selera, dan kebutuhan antarnegara.</p><p><b>Prosedur ekspor</b>: eksportir mencari pembeli, sepakat dalam kontrak dan cara pembayaran (misalnya <b>L/C</b>, surat kredit), mengurus dokumen dan <b>bea cukai</b>, mengirim barang, lalu menerima pembayaran. <b>Prosedur impor</b>: importir mengurus izin, membayar, mengurus dokumen impor, membayar <b>bea masuk</b>, lalu menerima barang.</p><p><b>Komoditas</b>: ekspor Indonesia antara lain minyak kelapa sawit, batu bara, karet, dan tekstil; impor antara lain mesin, bahan bakar, dan gandum.</p><p><b>Manfaat</b>: menambah <b>devisa</b> (mata uang asing), memperluas pasar, dan memenuhi kebutuhan yang tak diproduksi sendiri. <b>Neraca perdagangan</b> membandingkan nilai ekspor dan impor: surplus bila ekspor lebih besar, defisit bila impor lebih besar.</p>","ex":"<ul><li>Indonesia menjual minyak sawit ke luar negeri dan membeli gandum untuk membuat mi dan roti.</li></ul>","cmp":"<ul><li><b>Surplus</b>: ekspor lebih besar. <b>Defisit</b>: impor lebih besar.</li></ul>","mis":"<ul><li>Menukar ekspor dan impor.</li><li>Mengira impor selalu merugikan.</li><li>Mengira devisa berupa rupiah.</li></ul>","p":[["Menjual barang ke luar negeri?",["Ekspor","Impor","Barter","Subsidi"],"Ekspor."],["Devisa adalah…",["Mata uang asing","Rupiah","Pajak","Subsidi"],"Devisa."],["Neraca dengan ekspor lebih besar?",["Surplus","Defisit","Impas","Inflasi"],"Surplus."],["Contoh komoditas ekspor Indonesia?",["Minyak sawit","Gandum","Mesin canggih","Gadget impor"],"Sawit."]],"e":[["Penyebab perdagangan internasional?",["Perbedaan SDA, teknologi, dan kebutuhan","Kesamaan hasil","Larangan","Cuaca"],"Perbedaan."],["Pihak yang melakukan ekspor?",["Eksportir","Importir","Konsumen","Bank sentral"],"Eksportir."],["L/C berfungsi sebagai…",["Jaminan pembayaran antara penjual dan pembeli","Pajak","Peta","Hukum adat"],"Surat kredit."],["Pembayaran pajak barang masuk disebut…",["Bea masuk","Bea ekspor","PPh","PBB"],"Bea masuk."],["Impor pangan seperti gandum dilakukan karena…",["Tidak cukup diproduksi sendiri","Terlalu murah","Terlalu banyak","Dilarang"],"Kebutuhan."],["Defisit neraca perdagangan berarti…",["Impor lebih besar dari ekspor","Ekspor lebih besar","Sama","Tak ada impor"],"Defisit."],["Manfaat ekspor?",["Menambah devisa","Mengurangi pasar","Menghabiskan SDA","Menutup pabrik"],"Devisa."],["Dokumen ekspor diurus melalui…",["Bea cukai","Pegadaian","OJK","LPS"],"Bea cukai."],["Komoditas impor Indonesia?",["Mesin dan bahan bakar","Minyak sawit","Karet","Batu bara"],"Impor."],["Sebuah negara membeli barang yang tidak diproduksinya. Itu…",["Impor","Ekspor","Barter","Subsidi"],"Impor."]]},"D.1.4":{"k":8,"g":"Menjelaskan alasan, bentuk, dan manfaat kerja sama ekonomi antarnegara, termasuk ASEAN, AFTA, APEC, dan WTO.","core":"<p>Negara bekerja sama karena <b>tidak ada negara yang mampu memenuhi semua kebutuhannya</b> sendiri: SDA, teknologi, dan modal berbeda, serta ingin memperluas pasar.</p><p><b>Bentuk kerja sama</b>: <b>bilateral</b> (dua negara), <b>regional</b> (satu kawasan), dan <b>multilateral</b> (banyak negara).</p><ul><li><b>ASEAN</b> (1967, Bangkok): kerja sama negara Asia Tenggara.</li><li><b>AFTA</b> (1992): kawasan perdagangan bebas ASEAN, menurunkan tarif; Masyarakat Ekonomi ASEAN (MEA) berlaku akhir 2015.</li><li><b>APEC</b> (1989): kerja sama ekonomi kawasan Asia-Pasifik.</li><li><b>WTO</b> (1995): organisasi perdagangan dunia yang mengatur perdagangan antarnegara.</li><li><b>OPEC</b>: organisasi negara pengekspor minyak.</li></ul><p><b>Manfaat</b>: pasar lebih luas, alih teknologi, menurunnya hambatan dagang, dan tambahan lapangan kerja. <b>Tantangan</b>: persaingan ketat dan ketergantungan antarnegara, sehingga produk dalam negeri perlu berdaya saing.</p>","ex":"<ul><li>Barang dari negara ASEAN masuk dengan tarif rendah karena AFTA.</li></ul>","cmp":"<ul><li><b>Bilateral</b> dua negara, <b>regional</b> satu kawasan, <b>multilateral</b> banyak negara.</li></ul>","mis":"<ul><li>Menyebut ASEAN berdiri 1945.</li><li>Mengira kerja sama ekonomi tanpa risiko.</li><li>Menukar APEC dan ASEAN.</li></ul>","p":[["ASEAN berdiri tahun…",["1967","1945","1992","1995"],"1967."],["WTO mengatur…",["Perdagangan dunia","Olahraga dunia","Pendidikan dunia","Kesehatan dunia"],"Perdagangan."],["Kerja sama dua negara disebut…",["Bilateral","Regional","Multilateral","Global"],"Bilateral."],["AFTA bertujuan…",["Perdagangan bebas ASEAN","Menutup pasar","Menaikkan tarif","Membatasi impor"],"Perdagangan bebas."]],"e":[["Mengapa negara perlu bekerja sama?",["Tidak ada negara yang bisa memenuhi semua kebutuhannya","Semua sama","Tak ada kebutuhan","Dilarang"],"Saling melengkapi."],["APEC mencakup kawasan…",["Asia-Pasifik","Eropa","Afrika","Atlantik"],"Asia-Pasifik."],["MEA berlaku akhir tahun…",["2015","1967","1992","1998"],"2015."],["OPEC adalah organisasi negara…",["Pengekspor minyak","Pengimpor gandum","Penghasil karet","Penghasil kopi"],"Minyak."],["Manfaat kerja sama ekonomi?",["Pasar luas dan alih teknologi","Pasar sempit","Teknologi hilang","Hambatan naik"],"Manfaat."],["Tantangan MEA?",["Persaingan produk antarnegara","Tak ada tantangan","Tak ada pasar","Tarif naik"],"Persaingan."],["Kerja sama banyak negara disebut…",["Multilateral","Bilateral","Lokal","Nasional"],"Multilateral."],["AFTA dibentuk tahun…",["1992","1967","1995","2015"],"1992."],["WTO berdiri tahun…",["1995","1967","1989","1992"],"1995."],["Agar bersaing di MEA, produk lokal perlu…",["Berkualitas dan berdaya saing","Mahal","Langka","Sederhana saja"],"Berdaya saing."]]},"D.1.5":{"k":8,"g":"Menjelaskan pengaruh perkembangan iptek terhadap ekonomi, peluang, dan tantangannya.","core":"<p><b>Iptek</b> (ilmu pengetahuan dan teknologi) membuat produksi lebih <b>cepat, efisien, dan murah</b>. Contohnya mesin otomatis di pabrik, aplikasi belanja daring, dan pembayaran digital. Perkembangan industri dibagi menjadi <b>Revolusi Industri 1.0–4.0</b> (mesin uap, listrik dan produksi massal, komputer dan otomatisasi, lalu digitalisasi, internet, dan kecerdasan buatan).</p><p><b>Dampak positif</b>: produktivitas naik, lahir usaha baru (<b>e-commerce</b>, transportasi daring, fintech), pasar makin luas, dan pekerjaan baru yang menuntut keterampilan digital.</p><p><b>Tantangan</b>: sebagian pekerjaan <b>tergantikan mesin</b> sehingga pekerja perlu belajar keterampilan baru; kesenjangan digital antara yang punya dan tak punya akses; serta risiko penipuan daring. Negara dengan iptek maju umumnya ekonominya lebih kuat, sehingga pendidikan dan penelitian penting.</p>","ex":"<ul><li>Petani memasarkan hasil panen lewat media sosial sehingga pembelinya makin luas.</li><li>Pabrik memakai mesin otomatis sehingga produksi lebih cepat.</li></ul>","cmp":"<ul><li><b>Revolusi Industri 4.0</b> memakai digitalisasi dan kecerdasan buatan, <b>1.0</b> memakai mesin uap.</li></ul>","mis":"<ul><li>Mengira teknologi tidak berdampak buruk.</li><li>Mengira otomatisasi menambah semua pekerjaan.</li><li>Mengira hanya pabrik yang terkena dampak iptek.</li></ul>","p":[["Revolusi Industri 1.0 ditandai…",["Mesin uap","Internet","AI","Robot"],"Mesin uap."],["Contoh usaha baru akibat iptek?",["E-commerce","Barter","Berburu","Kerja bakti"],"E-commerce."],["Dampak positif iptek?",["Produksi lebih efisien","Produksi lambat","Biaya naik","Pasar sempit"],"Efisien."],["Tantangan iptek bagi pekerja?",["Pekerjaan tergantikan mesin","Libur panjang","Gaji otomatis naik","Tak ada"],"Digantikan."]],"e":[["Iptek singkatan dari…",["Ilmu pengetahuan dan teknologi","Industri, pajak, ekonomi","Ilmu, produksi, tenaga","Investasi, pasar, kredit"],"Iptek."],["Revolusi Industri 4.0 memakai…",["Digitalisasi dan kecerdasan buatan","Mesin uap","Hanya tenaga manusia","Hanya hewan"],"4.0."],["Kesenjangan digital berarti…",["Perbedaan akses teknologi","Perbedaan cuaca","Perbedaan zona","Perbedaan jarak"],"Akses."],["Fintech berkaitan dengan…",["Layanan keuangan digital","Pertanian","Peternakan","Perikanan"],"Keuangan digital."],["Agar tidak tergeser mesin, pekerja perlu…",["Belajar keterampilan baru","Berhenti bekerja","Menolak teknologi","Menutup usaha"],"Kompetensi."],["Mengapa negara maju iptek ekonominya kuat?",["Produktivitas dan inovasi tinggi","Penduduk sedikit","Tak ada industri","Tak ada pasar"],"Iptek."],["Petani menjual lewat media sosial. Dampaknya…",["Pasar lebih luas","Pasar sempit","Harga hilang","Tak ada"],"Jangkauan luas."],["Risiko belanja daring?",["Penipuan","Selalu gratis","Barang pasti tiba","Tanpa biaya"],"Waspada."],["Mesin otomatis di pabrik menyebabkan produksi…",["Lebih cepat","Lebih lambat","Berhenti","Tak berubah"],"Efisien."],["Mengapa pendidikan penting menghadapi era digital?",["Membekali keterampilan baru","Tak perlu","Menghambat","Membatasi"],"Kompetensi."]]},"D.1.6":{"k":8,"g":"Menjelaskan dampak dinamika penduduk bagi negara serta cara mengatasinya.","core":"<p><b>Dampak</b> pertumbuhan penduduk yang cepat dan tidak merata:</p><ul><li><b>Pengangguran</b> dan kemiskinan karena lapangan kerja tidak sebanding dengan angkatan kerja.</li><li><b>Kepadatan penduduk</b> dan permukiman kumuh di kota, terutama akibat <b>urbanisasi</b>.</li><li><b>Tekanan lingkungan</b>: kebutuhan pangan dan lahan naik, hutan dan air terkuras.</li><li><b>Beban pelayanan</b> pendidikan, kesehatan, dan transportasi bertambah.</li></ul><p><b>Peluang</b>: <b>bonus demografi</b> bila penduduk usia produktif berkualitas.</p><p><b>Cara mengatasi</b></p><ul><li><b>Program Keluarga Berencana (KB)</b> menekan angka kelahiran.</li><li><b>Pemerataan penduduk</b>: transmigrasi dan pembangunan desa agar penduduk tidak menumpuk di kota.</li><li><b>Meningkatkan kualitas SDM</b> lewat pendidikan dan pelatihan.</li><li><b>Menambah lapangan kerja</b> dan mendorong wirausaha.</li></ul>","ex":"<ul><li>Banyak pemuda desa pindah ke kota tanpa keterampilan, lalu menjadi pengangguran: dampak urbanisasi.</li><li>Pelatihan kerja dan pembangunan desa mengurangi arus urbanisasi.</li></ul>","cmp":"<ul><li><b>Bonus demografi</b> peluang bila SDM berkualitas, <b>beban demografi</b> bila banyak pengangguran.</li></ul>","mis":"<ul><li>Mengira penduduk banyak selalu masalah.</li><li>Mengira KB hanya urusan pemerintah.</li><li>Mengira transmigrasi memaksa.</li></ul>","p":[["Dampak pertumbuhan penduduk cepat?",["Pengangguran dan kemiskinan","Panen naik otomatis","Tanah bertambah","Hutan bertambah"],"Dampak negatif."],["Program menekan kelahiran?",["Keluarga Berencana","Transmigrasi","Bimas","Repelita"],"KB."],["Perpindahan penduduk dari desa ke kota?",["Urbanisasi","Transmigrasi","Emigrasi","Imigrasi"],"Urbanisasi."],["Peluang jika SDM berkualitas?",["Bonus demografi","Beban demografi","Krisis","Konflik"],"Bonus demografi."]],"e":[["Mengapa pengangguran muncul?",["Lapangan kerja tidak sebanding angkatan kerja","Terlalu banyak pabrik","Upah terlalu tinggi","Terlalu sedikit penduduk"],"Tak seimbang."],["Dampak urbanisasi di kota?",["Permukiman kumuh dan padat","Kota lengang","Banyak sawah","Udara bersih selalu"],"Padat."],["Transmigrasi bertujuan…",["Memeratakan penduduk","Memusatkan penduduk","Menghapus desa","Menambah pajak"],"Pemerataan."],["Dampak bagi lingkungan?",["Tekanan pada lahan dan air","Lahan bertambah","Air melimpah","Hutan meluas"],"Tekanan."],["KB bertujuan…",["Menekan angka kelahiran","Menambah kelahiran","Menghentikan sekolah","Mengurangi pangan"],"Mengendalikan."],["Upaya meningkatkan kualitas SDM?",["Pendidikan dan pelatihan","Menutup sekolah","Menaikkan pajak","Mengurangi gizi"],"Kualitas."],["Pembangunan desa mengurangi…",["Arus urbanisasi","Lapangan kerja","Pendidikan","Produksi"],"Desa lebih maju."],["Beban pelayanan publik bertambah karena…",["Penduduk bertambah cepat","Penduduk menurun","Sekolah banyak","Rumah sakit banyak"],"Kebutuhan naik."],["Bonus demografi bermanfaat jika…",["Penduduk produktif berkualitas","Banyak pengangguran","Tak sekolah","Tak bekerja"],"Kualitas."],["Pemuda desa pindah ke kota tanpa keterampilan. Risikonya…",["Menjadi pengangguran","Langsung kaya","Dapat gaji tinggi","Tak ada risiko"],"Tanpa keterampilan."]]},"A.0.0":{"k":8,"g":"Menentukan lokasi absolut dan relatif, memahami garis lintang dan bujur, serta menghitung perbedaan zona waktu.","core":"<p><b>Lokasi</b> adalah letak objek di permukaan bumi.</p><ul><li><b>Lokasi absolut</b>: letak tetap menurut koordinat garis lintang dan bujur. Indonesia: 6°LU–11°LS dan 95°BT–141°BT.</li><li><b>Lokasi relatif</b>: letak menurut keadaan sekitar, dapat berubah. Contoh: Kabupaten Tana Tidung dahulu di Kalimantan Timur, kini di Kalimantan Utara. Tanah dekat jalan raya harganya lebih mahal, tetapi kurang cocok untuk tempat tinggal karena polusi suara dan udara.</li></ul><p><b>Garis lintang</b> mengukur sudut dari khatulistiwa (0°) dan membagi iklim dunia (tropis, subtropis, sedang, dingin). <b>Garis bujur</b> bertitik nol di Greenwich dan membagi zona waktu. Sebelum 1884 tiap kota memakai waktu matahari setempat; kereta api antarkota membuat standar waktu diperlukan. <b>Konferensi Meridian 1884</b> di Washington DC menetapkan Greenwich (GMT). Tiap 15° ke timur waktu lebih cepat 1 jam, ke barat lebih lambat 1 jam. Indonesia memiliki WIB, WITA, dan WIT.</p><p><b>Peta digital</b> dipakai untuk transportasi daring, estimasi biaya dan waktu ekspedisi, menemukan alamat (undangan digital, pesan makanan), dan memilih alternatif jalan yang lebih efisien. Lokasi memengaruhi nilai tanah: di Penajam Paser Utara harga tanah naik 5–10 kali lipat sejak 2019 setelah rencana pemindahan ibu kota.</p>","ex":"<ul><li>12.00 WIB = 13.00 WITA = 14.00 WIT.</li><li>\"Rumah Rina seberang SMP\" adalah lokasi relatif; jika SMP pindah, petunjuk itu tak berlaku.</li></ul>","cmp":"<ul><li><b>Absolut</b> tetap (koordinat); <b>relatif</b> berubah mengikuti sekitar.</li><li><b>Lintang</b> utara–selatan dari khatulistiwa; <b>bujur</b> timur–barat dari Greenwich.</li></ul>","mis":"<ul><li>Menganggap lokasi relatif tidak pernah berubah.</li><li>Menukar lintang dan bujur.</li><li>Mengira zona waktu dibagi garis lintang.</li></ul>","p":[["Letak tetap berdasarkan koordinat disebut…",["Lokasi absolut","Lokasi relatif","Lokasi sementara","Lokasi sosial"],"Lokasi absolut."],["Garis lintang mengukur posisi…",["Utara–selatan dari khatulistiwa","Timur–barat dari Greenwich","Ketinggian","Jarak ke ibu kota"],"Utara–selatan."],["Titik nol garis bujur berada di…",["Greenwich","Jakarta","Khatulistiwa","Paris"],"Greenwich."],["\"Dekat pasar\" adalah lokasi…",["Relatif","Absolut","Astronomis","Koordinat"],"Relatif."]],"e":[["Letak absolut Indonesia menurut buku?",["6°LU–11°LS dan 95°BT–141°BT","0°–10°LU","11°LU–6°LS","141°BT–180°BT"],"Sesuai buku."],["Garis 0° lintang disebut…",["Khatulistiwa","Greenwich","Meridian","Kutub"],"Khatulistiwa."],["Mengapa lokasi relatif bisa berubah?",["Lingkungan sekitarnya berubah","Koordinatnya bergeser","Bumi berhenti","Bujur pindah"],"Bergantung sekitar."],["Garis yang membagi zona waktu?",["Garis bujur","Garis lintang","Garis pantai","Batas negara"],"Bujur."],["Selain zona waktu, garis lintang dipakai membagi…",["Iklim dunia","Batas negara","Jenis tanah","Penduduk"],"Tropis, subtropis, sedang, dingin."],["Konferensi Meridian 1884 diadakan di…",["Washington DC","London","Paris","Jakarta"],"Washington DC."],["Konferensi itu menetapkan…",["Greenwich sebagai standar waktu (GMT)","Jakarta pusat waktu","Kalender baru","Batas samudra"],"GMT."],["Bujur dipindah 15° ke barat, waktu menjadi…",["Lebih lambat 1 jam","Lebih cepat 1 jam","Sama","Lebih cepat 15 jam"],"Barat lebih lambat."],["12.00 WIB; di Jayapura (WIT)?",["14.00","13.00","12.00","11.00"],"WIT = WIB + 2."],["Tana Tidung pindah dari Kaltim ke Kaltara. Ini contoh…",["Lokasi relatif berubah","Lokasi absolut berubah","Lintang bergeser","Zona waktu berubah"],"Relatif berubah."],["Tanah dekat jalan raya mahal tetapi kurang cocok untuk tinggal karena…",["Polusi suara dan udara","Terlalu sepi","Tak ada listrik","Dekat laut"],"Kekurangan lokasi."],["Peta digital membantu ekspedisi untuk…",["Menghitung estimasi biaya dan waktu","Menghitung penduduk","Mengukur hujan","Menentukan jenis tanah"],"Estimasi ekspedisi."]]},"A.0.1":{"k":8,"g":"Menjelaskan faktor interaksi wilayah menurut Edward Ullman serta perbedaan desa dan kota.","core":"<p><b>Konektivitas antarruang</b> adalah keterhubungan dan interaksi antarwilayah. Wilayah berinteraksi karena potensinya berbeda (pesisir menghasilkan hasil laut, dataran tinggi sayuran), dan <b>jaringan jalan serta transportasi</b> menghubungkannya.</p><p><b>Tiga faktor interaksi (Edward Ullman)</b></p><ul><li><b>Wilayah saling melengkapi</b>: A kelebihan sesuatu yang dibutuhkan B, dan sebaliknya (Brebes bawang merah, Wonosobo kentang).</li><li><b>Kesempatan berintervensi</b>: wilayah C bisa memenuhi kebutuhan B lebih dekat atau murah, sehingga B tidak lagi bergantung pada A.</li><li><b>Kemudahan pemindahan dalam ruang</b>: dipengaruhi jarak, biaya, dan transportasi.</li></ul><p><b>Desa dan kota</b></p><ul><li><b>Basis ekonomi</b>: desa pertanian; kota industri, perdagangan, jasa.</li><li><b>Mata pencaharian</b>: desa agraris dan homogen; kota nonagraris dan heterogen (pedagang, pencuci sepatu, jasa desain grafis).</li><li><b>Musim/cuaca</b>: penting bagi desa (jagung musim kemarau, padi musim hujan); kurang penting bagi kota (pekerjaan dalam ruangan).</li><li><b>Rumah dan tempat kerja</b>: desa dekat; kota berjauhan.</li><li><b>Kepadatan</b>: desa tidak padat, kota padat.</li></ul>","ex":"<ul><li>Pedagang kota B beralih membeli sayur dari desa C yang lebih dekat: kesempatan berintervensi.</li><li>Jalan tol menurunkan jarak dan biaya: memudahkan pemindahan.</li></ul>","cmp":"<ul><li>Desa: agraris, homogen, tak padat. Kota: industri-dagang-jasa, heterogen, padat.</li></ul>","mis":"<ul><li>Mengira interaksi hanya karena jarak.</li><li>Menukar ciri desa dan kota.</li></ul>","p":[["Perumus tiga faktor interaksi wilayah?",["Edward Ullman","Greenwich","Adam Smith","Auguste Comte"],"Edward Ullman."],["Brebes dan Wonosobo saling mengirim hasil: wilayah yang…",["Saling melengkapi","Berintervensi","Terisolasi","Berkonflik"],"Saling melengkapi."],["Mata pencaharian desa umumnya…",["Agraris dan homogen","Industri","Jasa keuangan","Perbankan"],"Agraris."],["Jarak, biaya, transportasi termasuk faktor…",["Kemudahan pemindahan dalam ruang","Saling melengkapi","Berintervensi","Komunikasi"],"Pemindahan dalam ruang."]],"e":[["Wilayah berinteraksi karena…",["Potensi dan kebutuhannya berbeda","Potensinya sama","Jaraknya dekat saja","Agamanya berbeda"],"Perbedaan potensi."],["Yang menghubungkan pesisir dan dataran tinggi?",["Jaringan jalan dan transportasi","Warna rumah","Jumlah sekolah","Zona waktu"],"Transportasi."],["Basis ekonomi desa?",["Pertanian","Industri","Perdagangan modern","Jasa keuangan"],"Pertanian."],["Pekerjaan kota yang heterogen contohnya…",["Pencuci sepatu dan jasa desain grafis","Hanya petani","Hanya nelayan","Hanya penambang"],"Beragam."],["Cuaca kurang penting bagi…",["Pekerja kantor kota","Petani jagung","Petani padi","Nelayan"],"Dalam ruangan."],["Kota B beralih membeli sayur dari desa C yang lebih dekat. Ini…",["Kesempatan berintervensi","Saling melengkapi","Kemudahan pemindahan","Akomodasi"],"Intervening opportunity."],["Jalan tol memudahkan interaksi karena…",["Mengurangi jarak tempuh dan biaya","Menambah penduduk","Menghapus desa","Menaikkan harga"],"Jarak dan biaya."],["Rumah dan tempat kerja di desa umumnya…",["Dekat","Berjauhan","Selalu di kota","Berbeda negara"],"Dekat."],["Kepadatan penduduk kota umumnya…",["Tinggi","Rendah","Nol","Sama dengan desa"],"Kota padat."],["Desa memasok beras, kota memasok barang industri. Ini menunjukkan…",["Konektivitas dan saling ketergantungan","Persaingan","Konflik","Isolasi"],"Saling melengkapi."]]},"A.0.2":{"k":8,"g":"Membedakan cuaca dan iklim, menyebut unsur iklim, serta menjelaskan pengaruh dan dampak perubahan iklim.","core":"<p><b>Cuaca</b>: kondisi udara pada saat tertentu di wilayah sempit dan waktu singkat. <b>Iklim</b>: kondisi cuaca rata-rata tahunan (sekitar 30 tahun) di wilayah luas. Indonesia beriklim tropis dengan musim hujan (umumnya Oktober–Maret) dan kemarau (umumnya April–September). Arus angin lembap dari Samudra Pasifik lewat Laut Cina Selatan membawa hujan ke Indonesia bagian barat; makin ke timur hujan makin sedikit.</p><p><b>Unsur iklim</b>: <i>penyinaran matahari</i> (lamanya matahari bersinar), <i>suhu</i> (derajat panas/dingin), <i>kelembapan</i> (kemampuan udara mengandung uap air), <i>angin</i> (gerak udara sejajar permukaan bumi akibat perbedaan tekanan), <i>curah hujan</i> (intensitas butir air akibat kondensasi). Unsur ini memengaruhi tanaman, misalnya padi musim hujan, jagung musim kemarau.</p><p><b>Pengaruh pada bidang</b>: pertanian (waktu tanam), perhubungan (penerbangan dan pelayaran, siklon tropis), industri (kelembapan membuat mesin berkarat), kesehatan (pancaroba memicu radang tenggorokan dan influenza).</p><p><b>Perubahan iklim</b>: berubahnya kondisi fisik atmosfer, terutama suhu dan distribusi curah hujan. Dampaknya: siklus hujan berubah, kekeringan panjang, hujan ekstrem yang menyebabkan banjir (terutama di kota dan pesisir), gagal panen, kenaikan permukaan laut yang menyulitkan nelayan, dan harga pangan naik.</p>","ex":"<ul><li>Suhu Bantul pagi ini 24°C: cuaca. Curah hujan tertinggi Riau 2022 pada April (417 mm): iklim.</li></ul>","cmp":"<ul><li><b>Cuaca</b> singkat dan sempit; <b>iklim</b> rata-rata tahunan dan luas.</li></ul>","mis":"<ul><li>Menyamakan cuaca dan iklim.</li><li>Mengira gempa bumi unsur iklim.</li></ul>","p":[["Kondisi udara singkat di wilayah sempit?",["Cuaca","Iklim","Musim","Pancaroba"],"Cuaca."],["Musim hujan umumnya…",["Oktober–Maret","April–September","Juni–Agustus","Sepanjang tahun"],"Okt–Mar."],["Yang BUKAN unsur iklim?",["Gempa bumi","Suhu","Angin","Curah hujan"],"Gempa bukan unsur iklim."],["Gerak udara akibat perbedaan tekanan?",["Angin","Awan","Hujan","Kabut"],"Angin."]],"e":[["Iklim berbeda dari cuaca karena iklim…",["Rata-rata tahunan di wilayah luas","Berubah tiap jam","Hanya di kota","Hanya malam"],"Rata-rata luas."],["Lima unsur iklim?",["Penyinaran, suhu, kelembapan, angin, curah hujan","Gempa, tsunami, banjir, longsor, gunung","Lintang, bujur, zona, waktu, peta","Hutan, laut, tanah, air, udara"],"Lima unsur."],["Kemampuan udara mengandung uap air?",["Kelembapan","Suhu","Angin","Penyinaran"],"Kelembapan."],["Lamanya matahari bersinar disebut…",["Penyinaran matahari","Curah hujan","Angin","Kelembapan"],"Penyinaran."],["Hujan di Indonesia barat lebih banyak karena…",["Angin lembap dari Pasifik lewat barat","Dekat gurun","Tak ada gunung","Timur lebih dingin"],"Arus angin."],["Mesin industri mudah berkarat karena…",["Kelembapan dan hujan","Suhu rendah","Angin pelan","Tak ada hujan"],"Karat."],["Pancaroba memicu…",["Radang tenggorokan dan influenza","Patah tulang","Gigi berlubang","Rabun"],"Kesehatan."],["Penundaan pelayaran dapat karena…",["Siklon tropis","Gempa","Letusan","Pasang purnama"],"Siklon tropis."],["Perubahan iklim memengaruhi terutama…",["Suhu dan distribusi curah hujan","Letak lintang","Garis bujur","Lempeng bumi"],"Definisi."],["Hujan intensitas tinggi dapat menyebabkan…",["Banjir di kota dan pesisir","Kekeringan","Salju","Gempa"],"Banjir."],["Kenaikan permukaan laut berdampak pada…",["Nelayan sulit mencari ikan","Hutan bertambah","Panen naik","Hujan berhenti"],"Dampak sosial."],["Padi umumnya ditanam saat…",["Musim hujan","Musim kemarau","Pancaroba","Sepanjang tahun"],"Padi musim hujan."]]},"A.0.3":{"k":8,"g":"Menjelaskan kondisi geologis Indonesia, dampak positif, dan jenis bencana alamnya.","core":"<p>Indonesia dilalui dua jalur pegunungan dunia, <b>Sirkum Pasifik</b> dan <b>Sirkum Mediterania</b>, yang membentang dari ujung utara Sumatra, melalui Jawa, Nusa Tenggara, Banda, Sulawesi, hingga Halmahera. Ada 127 gunung api aktif. Indonesia berada di pertemuan tiga lempeng: <b>Eurasia</b> (utara), <b>Indo-Australia</b> (selatan), <b>Pasifik</b> (timur). Pertemuan lempeng menimbulkan patahan dan retakan sehingga magma mengalir ke permukaan dan terbentuk gunung api.</p><p><b>Dampak positif</b>: tanah vulkanik subur karena kaya unsur hara; pasir dan batuan bahan bangunan; keanekaragaman hayati (barat mirip Asia, tengah peralihan, timur mirip Australia) yang dimanfaatkan jamu, kerajinan, dan wisata; sumber daya mineral (talk, minyak bumi menjadi bensin, solar, avtur; gas alam menjadi LPG).</p><p><b>Bencana</b></p><ul><li><b>Gempa bumi</b>: getaran akibat tumbukan lempeng, patahan aktif, aktivitas gunung api, atau runtuhan batuan; tidak dapat diprediksi waktunya.</li><li><b>Tsunami</b>: rangkaian gelombang laut yang menjalar lebih dari 900 km/jam di tengah laut; dipicu gempa dasar laut, longsoran dasar laut, atau letusan gunung api.</li><li><b>Gunung meletus</b>: magma bersuhu lebih dari 1.000°C didorong gas bertekanan tinggi; abu dapat mencapai radius sekitar 18 km.</li></ul><p>Contoh: gempa Palu 2018, tsunami Aceh 2005, gempa Sumatra Barat 2009.</p>","ex":"<ul><li>Petani di lereng gunung api diuntungkan tanah subur, tetapi harus waspada letusan.</li></ul>","cmp":"<ul><li>Gempa: getaran. Tsunami: gelombang laut. Letusan: magma keluar.</li></ul>","mis":"<ul><li>Mengira letak geologis hanya merugikan.</li><li>Mengira gempa bisa diprediksi.</li></ul>","p":[["Tiga lempeng di Indonesia?",["Eurasia, Indo-Australia, Pasifik","Afrika, Atlantik, Arktik","Amerika, Asia, Eropa","Pasifik, Atlantik, Hindia"],"Tiga lempeng."],["Tanah dekat gunung api subur karena…",["Kaya unsur hara","Selalu tergenang","Tanpa hujan","Bebas mineral"],"Unsur hara."],["Tsunami sering dipicu…",["Gempa dasar laut","Hujan lebat","Angin darat","Bulan purnama"],"Gempa dasar laut."],["Gunung api aktif di Indonesia?",["127","27","227","12"],"127."]],"e":[["Dua jalur pegunungan yang melintasi Indonesia?",["Sirkum Pasifik dan Sirkum Mediterania","Himalaya dan Alpen","Andes dan Rocky","Ural dan Kaukasus"],"Dua sirkum."],["Jalur pegunungan itu membentang hingga…",["Halmahera","Papua Selatan","Bali saja","Kalimantan"],"Halmahera."],["Gunung api terbentuk karena…",["Magma mengalir lewat patahan dan retakan","Hujan deras","Angin","Pasang laut"],"Magma."],["Dampak positif letak geologis?",["Tanah vulkanik subur","Gempa","Tsunami","Letusan"],"Subur."],["Flora-fauna Indonesia timur mirip…",["Australia","Asia","Eropa","Afrika"],"Australia."],["Gas alam dimanfaatkan sebagai…",["LPG","Aspal","Bedak","Avtur"],"LPG."],["Penyebab gempa menurut buku?",["Tumbukan lempeng, patahan aktif, gunung api, runtuhan batuan","Badai","Hujan","Angin"],"Beberapa penyebab."],["Kecepatan tsunami di tengah laut?",["Lebih dari 900 km/jam","9 km/jam","90 m/jam","1 km/jam"],"900 km/jam."],["Suhu magma letusan?",["Lebih dari 1.000°C","100°C","10°C","500°C saja"],"Sangat panas."],["Gempa bumi bersifat…",["Tidak dapat diprediksi waktunya","Terjadwal","Hanya malam","Hanya gurun"],"Tidak dapat diprediksi."],["Gempa Palu 2018 dan tsunami Aceh 2005 adalah contoh…",["Bencana akibat kondisi geologis","Dampak positif","Dampak iklim","Dampak kota"],"Bencana."]]},"A.0.4":{"k":8,"g":"Menjelaskan produksi, distribusi, dan konsumsi beserta faktor produksi, bentuk distribusi, dan tujuannya.","core":"<p><b>Produksi</b>: menambah manfaat barang atau menciptakan barang dan jasa untuk memenuhi kebutuhan (menambang, menanam padi, menjahit baju, membuat batu bata). <b>Barang</b> berwujud (barang modal dan barang konsumsi); <b>jasa</b> menambah nilai guna tanpa mengubah bentuk (pengobatan, pariwisata). Tujuannya <b>kemakmuran</b>. <b>Faktor produksi</b>: alam, tenaga kerja, modal (bukan hanya uang), keahlian.</p><p><b>Distribusi</b>: menyalurkan barang dari produsen ke konsumen. Tujuannya: menjadi agen penyalur, hasil produksi dimanfaatkan maksimal, kebutuhan terpenuhi, produksi berlanjut. Bentuknya: <b>langsung</b> (tanpa perantara), <b>semilangsung</b> (perantara masih bagian produsen, misalnya toko resmi), <b>tidak langsung</b> (perantara di luar produsen: agen, minimarket, pasar, pedagang kecil).</p><p><b>Konsumsi</b>: menghabiskan atau mengurangi manfaat barang dan jasa. Tujuan: memenuhi kebutuhan jasmani, rohani, estetika, menjaga kesehatan, dan menjaga status sosial (kebutuhan tersier). Faktor <b>internal</b>: motivasi, sikap, selera; <b>eksternal</b>: pekerjaan, harga, budaya. Kenaikan harga BBM memengaruhi berbagai kegiatan ekonomi.</p>","ex":"<ul><li>Risa membuat kue (produksi), menitipkan ke warung (distribusi), Sani memakannya (konsumsi).</li></ul>","cmp":"<ul><li>Barang berwujud, jasa tidak. Internal dari dalam diri, eksternal dari luar.</li></ul>","mis":"<ul><li>Mengira modal hanya uang tunai.</li><li>Menukar semilangsung dan tidak langsung.</li></ul>","p":[["Menyalurkan barang dari produsen ke konsumen?",["Distribusi","Produksi","Konsumsi","Investasi"],"Distribusi."],["Mesin dan gedung termasuk faktor…",["Modal","Alam","Tenaga kerja","Keahlian"],"Modal."],["Dokter dan ojek menghasilkan…",["Jasa","Barang","Bahan baku","Modal"],"Jasa."],["Selera dan motivasi faktor konsumsi…",["Internal","Eksternal","Geografis","Politik"],"Internal."]],"e":[["Empat faktor produksi?",["Alam, tenaga kerja, modal, keahlian","Uang, buku, gedung, guru","Barang, jasa, harga, pajak","Produksi, distribusi, konsumsi, jasa"],"Empat faktor."],["Tujuan produksi?",["Kemakmuran","Kelangkaan","Inflasi","Kemiskinan"],"Kemakmuran."],["Barang untuk memproduksi barang lain?",["Barang modal","Barang konsumsi","Jasa","Limbah"],"Barang modal."],["Mengolah tanah liat jadi gerabah termasuk…",["Produksi","Distribusi","Konsumsi","Impor"],"Produksi."],["Toko resmi milik produsen ponsel: distribusi…",["Semilangsung","Langsung","Tidak langsung","Tidak ada"],"Perantara bagian produsen."],["Agen dan minimarket: distribusi…",["Tidak langsung","Langsung","Semilangsung","Tidak ada"],"Perantara di luar produsen."],["Petani menjual langsung ke pembeli: distribusi…",["Langsung","Semilangsung","Tidak langsung","Tidak ada"],"Tanpa perantara."],["Salah satu tujuan distribusi?",["Menjaga keberlangsungan produksi","Menurunkan produksi","Menahan barang","Menghentikan konsumen"],"Tujuan distribusi."],["Membeli produk tersier demi status sosial termasuk tujuan…",["Konsumsi","Produksi","Distribusi","Investasi"],"Tujuan konsumsi."],["Harga barang memengaruhi konsumsi sebagai faktor…",["Eksternal","Internal","Alamiah","Genetik"],"Eksternal."],["Jasa pengobatan termasuk…",["Jasa","Barang","Bahan baku","Modal"],"Jasa."],["Kenaikan harga BBM berdampak pada…",["Berbagai kegiatan ekonomi","Zona waktu","Curah hujan","Lintang"],"BBM."]]},"A.0.5":{"k":8,"g":"Menjelaskan syarat interaksi sosial serta bentuk asosiatif dan disosiatif.","core":"<p><b>Interaksi sosial</b>: hubungan sosial yang dinamis antarperorangan, antarkelompok, atau perorangan dengan kelompok; terjadi sejak lahir (keluarga adalah lingkungan belajar pertama).</p><p><b>Syarat</b>: <b>kontak sosial</b> (langsung atau tidak langsung, misalnya lewat telepon) dan <b>komunikasi</b> (penyampaian pesan): <b>verbal</b> lewat lisan dan tulisan, <b>nonverbal</b> lewat simbol, gestur, bahasa isyarat.</p><ul><li><b>Asosiatif</b> (menuju persatuan): <b>kerja sama</b> (kerukunan, gotong royong), <b>akomodasi</b> (meredakan pertentangan, misalnya ketua RT memediasi pro-kontra peternakan ayam), <b>akulturasi</b> (dua budaya berpadu, budaya asli tetap ada).</li><li><b>Disosiatif</b> (menuju perpecahan): <b>persaingan</b> (menunjukkan keunggulan, misalnya antartim sepak bola), <b>kontravensi</b> (ketidakpercayaan dan ketidaksukaan terhadap pihak lain), <b>pertentangan/konflik</b> (berusaha menyingkirkan lawan, misalnya tawuran suporter yang menimbulkan korban).</li></ul>","ex":"<ul><li>Gotong royong = kerja sama. Candi Borobudur = akulturasi. Video call = kontak tidak langsung.</li></ul>","cmp":"<ul><li>Persaingan tanpa kekerasan; konflik ingin menyingkirkan lawan.</li></ul>","mis":"<ul><li>Mengira kontak sosial harus bertatap muka.</li><li>Menyamakan persaingan dan konflik.</li></ul>","p":[["Dua syarat interaksi sosial?",["Kontak sosial dan komunikasi","Uang dan jabatan","Usia dan tempat","Kuasa dan kekayaan"],"Kontak dan komunikasi."],["Telepon dan media sosial: kontak…",["Tidak langsung","Langsung","Tidak sah","Asosiatif"],"Tidak langsung."],["Gotong royong termasuk…",["Kerja sama","Konflik","Kontravensi","Persaingan"],"Kerja sama."],["Bentuk disosiatif?",["Persaingan","Kerja sama","Akomodasi","Akulturasi"],"Persaingan."]],"e":[["Komunikasi verbal memakai…",["Lisan dan tulisan","Gestur saja","Simbol saja","Bahasa isyarat"],"Lisan dan tulisan."],["Bahasa isyarat termasuk komunikasi…",["Nonverbal","Verbal","Lisan","Tulisan"],"Nonverbal."],["Ketua RT memediasi warga berselisih: …",["Akomodasi","Persaingan","Kontravensi","Konflik"],"Akomodasi."],["Berpadunya dua budaya, budaya asli tetap ada?",["Akulturasi","Konflik","Persaingan","Kontravensi"],"Akulturasi."],["Ketidakpercayaan dan ketidaksukaan terhadap pihak lain?",["Kontravensi","Kerja sama","Akomodasi","Persaingan"],"Kontravensi."],["Usaha menyingkirkan lawan?",["Pertentangan (konflik)","Persaingan","Akomodasi","Kerja sama"],"Konflik."],["Antartim sepak bola berlomba: …",["Persaingan","Konflik","Kontravensi","Akomodasi"],"Persaingan."],["Tawuran suporter dengan korban: …",["Pertentangan","Persaingan","Kerja sama","Akomodasi"],"Konflik."],["Interaksi terjadi sejak…",["Lahir","Dewasa","Sekolah","Bekerja"],"Sejak lahir."],["Kerja sama menghasilkan…",["Kerukunan","Perpecahan","Konflik","Kecurigaan"],"Kerukunan."],["Borobudur memadukan budaya India dan lokal: …",["Akulturasi","Konflik","Kontravensi","Persaingan"],"Akulturasi."]]},"A.0.6":{"k":8,"g":"Menjelaskan pengertian, ciri, unsur, dan sumber sejarah serta cerita rakyat.","core":"<p><b>Sejarah</b> dari kata Arab <i>syajarah</i> (pohon kayu): peristiwa yang berkesinambungan. <b>Ciri</b>: <b>unik</b> (sekali terjadi), <b>abadi</b> (tidak berubah dan dikenang), <b>penting</b> (bermakna bagi banyak orang). <b>Unsur</b>: <b>ruang</b> (tempat), <b>waktu</b> (kronologi), <b>manusia</b> (pelaku).</p><ul><li><b>Sumber tertulis</b>: prasasti, piagam, babad, kronik, dokumen, biografi, memoar, surat kabar.</li><li><b>Sumber benda</b>: monumen (candi, masjid, makam), relief, peta, foto, rekaman suara.</li><li><b>Sumber lisan</b>: <b>oral history</b> (kesaksian pelaku/saksi) dan <b>tradisi lisan</b> (cerita turun-temurun, lebih sulit dianalisis karena perlu menangkap kenyataan di balik cerita dan didukung dokumen).</li></ul><p><b>Cerita rakyat</b>: <b>mitos</b> dianggap benar dan suci; <b>legenda</b> dianggap benar-benar terjadi; <b>dongeng</b> tidak dianggap benar terjadi (banyak khayalan). Cirinya: disebarkan lisan, tradisional, ada versi berbeda, penciptanya tidak diketahui, berpola, berguna, milik bersama. Memuat nilai luhur (kejujuran, kerja sama, keberanian, tolong-menolong) sehingga perlu dilestarikan. Contoh: Batu Mamberoki dan Tindawa dari Yapen, Papua.</p>","ex":"<ul><li>Proklamasi 1945: unik, abadi, penting. Wawancara veteran: oral history.</li></ul>","cmp":"<ul><li>Oral history: kesaksian pelaku. Tradisi lisan: cerita turun-temurun.</li></ul>","mis":"<ul><li>Mengira sejarah hanya hafalan tahun.</li><li>Menyamakan cerita rakyat dengan fakta.</li></ul>","p":[["Tiga unsur sejarah?",["Ruang, waktu, manusia","Uang, buku, guru","Peta, kompas, laut","Raja, rakyat, pajak"],"Ruang, waktu, manusia."],["Candi termasuk sumber…",["Benda","Tertulis","Lisan","Digital"],"Benda."],["\"Sejarah\" berasal dari bahasa…",["Arab","Latin","Sanskerta","Belanda"],"Syajarah."],["Peristiwa sekali terjadi: ciri…",["Unik","Abadi","Penting","Biasa"],"Unik."]],"e":[["Tiga ciri peristiwa sejarah?",["Unik, abadi, penting","Berulang, sementara, biasa","Rahasia, kecil, acak","Mudah, murah, cepat"],"Tiga ciri."],["Prasasti dan babad sumber…",["Tertulis","Lisan","Benda saja","Digital"],"Tertulis."],["Relief dan monumen sumber…",["Benda","Tertulis","Lisan","Digital"],"Benda."],["Kesaksian langsung pelaku?",["Oral history","Tradisi lisan","Mitos","Dongeng"],"Oral history."],["Mengapa tradisi lisan sulit dianalisis?",["Perlu menangkap kenyataan di balik cerita","Terlalu lengkap","Selalu tertulis","Tak punya versi"],"Perlu dukungan dokumen."],["Dianggap benar dan suci?",["Mitos","Legenda","Dongeng","Fabel"],"Mitos."],["Dianggap benar-benar terjadi?",["Legenda","Dongeng","Mitos","Fabel"],"Legenda."],["Tidak dianggap benar terjadi?",["Dongeng","Legenda","Mitos","Prasasti"],"Dongeng."],["Ciri cerita rakyat?",["Penciptanya tidak diketahui dan milik bersama","Pencipta terkenal","Tak ada versi","Hanya tertulis"],"Ciri."],["Nilai luhur cerita rakyat?",["Kejujuran dan tolong-menolong","Kekerasan","Kecurangan","Kemalasan"],"Budi pekerti."],["Unsur waktu menjelaskan…",["Kronologi peristiwa","Tempat","Pelaku","Alat"],"Kronologi."],["Batu Mamberoki dan Tindawa berasal dari…",["Yapen, Papua","Aceh","Bali","Jawa Barat"],"Contoh buku."]]},"A.1.0":{"k":8,"g":"Mengenal zaman geologi serta jenis, penyebab, dan dampak pencemaran udara, air, dan tanah.","core":"<p>Alam menunjang hidup (sandang, pangan, papan). Zaman geologi: <b>Arkaekum</b> (belum ada kehidupan), <b>Paleozoikum</b> (tanda kehidupan), <b>Mesozoikum</b> (zaman reptil raksasa), <b>Neozoikum</b> terdiri atas <b>Tersier</b> (mamalia berkembang) dan <b>Kuarter</b> (manusia muncul). Kini terjadi <b>pemanasan global</b> akibat efek rumah kaca dan polusi, sebagian besar dari perilaku manusia.</p><ul><li><b>Udara</b>: pembakaran melepas CO₂ dan gas lain (partikel COx, SOx, NOx); efek rumah kaca (panas matahari mudah masuk tetapi terperangkap, sehingga suhu bumi naik). Dampak: asma dan bronkitis, jarak pandang menurun, hasil pertanian turun, bangunan berkarat. Contoh: Agustus 2023 udara Jakarta sangat buruk; asap peleburan logam di Padalarang.</li><li><b>Air</b>: bahan peledak penangkap ikan, limbah industri dan rumah tangga (sumur tercemar septic tank dan minyak). Dampak: air tak layak minum, <b>eutrofikasi</b> (alga berkembang pesat, cahaya terhalang, oksigen turun), ikan beracun yang merusak saraf dan memicu kanker.</li><li><b>Tanah</b>: sampah sulit terurai dan pestisida; hanya ±20% pestisida mengenai hama, ±80% jatuh ke tanah. Dampak: tanah kehilangan unsur hara, mengganggu mikroorganisme dan rantai makanan, mengancam ketahanan pangan, bersifat karsinogenik.</li></ul>","ex":"<ul><li>Sungai tertutup alga dan ikan mati: eutrofikasi.</li></ul>","cmp":"<ul><li>Udara: efek rumah kaca. Air: eutrofikasi. Tanah: pestisida dan hilangnya unsur hara.</li></ul>","mis":"<ul><li>Mengira pencemaran hanya dari pabrik.</li></ul>","p":[["Zaman saat manusia mulai muncul?",["Kuarter","Arkaekum","Paleozoikum","Mesozoikum"],"Kuarter."],["Gas hasil pembakaran penyebab efek rumah kaca?",["CO₂","Oksigen","Nitrogen","Helium"],"CO₂."],["Ledakan alga akibat limbah?",["Eutrofikasi","Erosi","Abrasi","Sedimentasi"],"Eutrofikasi."],["Pestisida yang mengenai hama?",["Sekitar 20%","Sekitar 80%","100%","0%"],"±20%."]],"e":[["Zaman reptil raksasa?",["Mesozoikum","Arkaekum","Kuarter","Tersier"],"Mesozoikum."],["Zaman terpenting bagi aktivitas manusia?",["Kuarter","Tersier","Mesozoikum","Arkaekum"],"Kuarter."],["Efek rumah kaca membuat suhu naik karena…",["Panas terperangkap","Matahari mendekat","Bumi berhenti","Hujan berkurang"],"Panas terperangkap."],["Penyakit akibat udara tercemar?",["Asma dan bronkitis","Patah tulang","Diabetes","Rabun"],"Pernapasan."],["Penyebab pencemaran air?",["Bahan peledak dan limbah","Hujan","Angin","Gerhana"],"Limbah."],["Mengapa ikan mati saat eutrofikasi?",["Oksigen air turun","Air dingin","Terlalu banyak ikan","Air jernih"],"Oksigen turun."],["Sumur dapat tercemar oleh…",["Limbah pabrik, septic tank, minyak","Hujan","Angin","Embun"],"Rembesan."],["Persen pestisida yang jatuh ke tanah?",["±80%","±20%","0%","100%"],"±80%."],["Pestisida bersifat karsinogenik: …",["Dapat memicu kanker","Menyuburkan","Menghijaukan","Menghilangkan hama selamanya"],"Berbahaya."],["Pencemaran tanah mengganggu…",["Rantai makanan","Zona waktu","Lintang","Jam"],"Ekosistem."],["Ikan beracun yang dimakan dapat merusak…",["Saraf","Tulang","Mata","Gigi"],"Saraf."],["Polusi pekat dapat memicu kecelakaan karena…",["Jarak pandang menurun","Jalan sempit","Ban habis","Rambu hilang"],"Jarak pandang."]]},"A.1.1":{"k":8,"g":"Menjelaskan perubahan dan dinamika sosial, faktor, jenis, serta budaya dan culture shock.","core":"<p><b>Perubahan sosial</b>: perubahan cara berpikir, perilaku, dan alat hidup (Tugu Jogja 1930 sepeda ontel, 2015 kendaraan bermotor). <b>Dinamika sosial</b> (dinamis = selalu berubah): perubahan sosial dalam masyarakat, muncul lewat interaksi dan komunikasi; sering membuat keteraturan sosial tidak berjalan semestinya. Contoh: urbanisasi, ibu rumah tangga menjadi pegawai.</p><ul><li><b>Faktor internal</b>: penduduk bertambah/berkurang, konflik, revolusi.</li><li><b>Faktor eksternal</b>: bencana alam, peperangan, pengaruh budaya lain.</li></ul><p><b>Jenis</b>: <b>difusi</b> (penyebaran unsur budaya), <b>akulturasi</b> (budaya berpadu, asli tetap ada), <b>asimilasi</b> (budaya berbaur, ciri asli melebur), <b>sosialisasi</b> (mempelajari nilai dan norma), <b>internalisasi</b> (nilai menjadi bagian kepribadian).</p><p><b>Budaya</b>: hasil pemikiran dan akal budi yang menjadi kebiasaan; diperoleh lewat pembelajaran, bukan naluri. Cara hidup tiap budaya tampak “normal” bagi pemiliknya. <b>Culture shock</b>: kebingungan menghadapi budaya yang sangat berbeda (adat pernikahan Sumatra Barat dan Jawa; pola asuh pesisir Sulawesi dan pedalaman Papua). Perbedaan bukan berarti salah; perlu saling menghargai.</p>","ex":"<ul><li>K-pop digemari remaja Indonesia: difusi.</li></ul>","cmp":"<ul><li>Akulturasi budaya asli tetap; asimilasi melebur.</li></ul>","mis":"<ul><li>Menyamakan akulturasi dan asimilasi.</li><li>Menganggap budaya sendiri paling benar.</li></ul>","p":[["Dinamis berarti…",["Selalu berubah","Tetap","Berhenti","Kuno"],"Berubah."],["Konflik penyebab perubahan: faktor…",["Internal","Eksternal","Geologis","Astronomis"],"Internal."],["Penyebaran unsur budaya?",["Difusi","Asimilasi","Internalisasi","Revolusi"],"Difusi."],["Kebingungan menghadapi budaya asing?",["Culture shock","Akulturasi","Sosialisasi","Difusi"],"Culture shock."]],"e":[["Contoh dinamika sosial?",["Urbanisasi","Terbit bulan","Gerhana","Siang malam"],"Urbanisasi."],["Bencana alam sebagai penyebab: faktor…",["Eksternal","Internal","Genetik","Moral"],"Eksternal."],["Penduduk bertambah: faktor…",["Internal","Eksternal","Astronomis","Hukum"],"Internal."],["Dua budaya berpadu, asli tetap?",["Akulturasi","Asimilasi","Difusi","Culture shock"],"Akulturasi."],["Budaya berbaur, ciri asli melebur?",["Asimilasi","Akulturasi","Difusi","Sosialisasi"],"Asimilasi."],["Nilai menjadi bagian kepribadian?",["Internalisasi","Difusi","Akulturasi","Revolusi"],"Internalisasi."],["Mempelajari nilai dan norma?",["Sosialisasi","Difusi","Revolusi","Konflik"],"Sosialisasi."],["Budaya diperoleh lewat…",["Pembelajaran","Naluri","Keturunan","Cuaca"],"Dipelajari."],["Sikap terhadap adat berbeda?",["Saling menghargai","Menertawakan","Memaksa","Menjauhi"],"Menghargai."],["Perbedaan Tugu Jogja 1930 dan 2015 menunjukkan…",["Perubahan sosial","Tak ada perubahan","Bencana","Perang"],"Perubahan."],["Perubahan sosial dapat membuat…",["Keteraturan sosial tak berjalan semestinya","Masyarakat tak berubah","Semua sama","Tak ada interaksi"],"Sesuai buku."],["Ibu rumah tangga menjadi pegawai: …",["Dinamika sosial","Bencana","Eutrofikasi","Zaman geologi"],"Perubahan status."]]},"A.1.2":{"k":8,"g":"Menjelaskan upaya melestarikan sumber daya udara, air, dan tanah.","core":"<p><b>Pelestarian lingkungan</b>: upaya menjaga kondisi lingkungan dengan meningkatkan daya dukungnya agar SDA mendukung kehidupan secara berkesinambungan. Tugas semua orang.</p><ul><li><b>Udara</b>: efek gas karbon antara lain pencairan es kutub. Pemerintah mengupayakan kendaraan bukan bahan bakar fosil (gas, listrik), transportasi umum (bus DKI berbahan bakar gas), dan pengendalian emisi buang kendaraan pribadi. Pohon menghasilkan oksigen. Pelajar: tidak merokok, tidak membakar sampah, menanam pohon, memakai transportasi umum.</li><li><b>Air</b>: memelihara dan melindungi sumber air serta siklus hidrologi: sumur resapan, program kali bersih, pintu air, menindak pelanggar. Aksi: buang sampah pada tempatnya, jangan membuang pelarut, cat, dan pembersih beracun, pakai detergen ramah lingkungan.</li><li><b>Tanah</b>: melindungi, memperbaiki, dan meningkatkan produktivitas tanah. Pupuk kimia berlebihan (era swasembada beras) membuat tanah kurang produktif; sampah menggunung merembeskan cairan. Upaya: pupuk organik, <b>bioremediasi</b> (jamur atau bakteri menguraikan pencemar menjadi tidak beracun), mengurangi kemasan plastik, memakai barang berulang, berkebun organik.</li></ul>","ex":"<ul><li>Bersepeda ke sekolah (udara), membersihkan sungai (air), berkebun organik (tanah).</li></ul>","cmp":"<ul><li>Pupuk organik memperbaiki tanah; pupuk kimia berlebih merusaknya.</li></ul>","mis":"<ul><li>Mengira pelestarian hanya tugas pemerintah.</li><li>Menganggap membakar sampah solusi.</li></ul>","p":[["Contoh pelestarian udara?",["Menanam pohon","Membakar sampah","Membuang limbah ke sungai","Pestisida berlebih"],"Pohon."],["Sumur resapan melestarikan…",["Air","Garis lintang","Zona waktu","Astronomis"],"Air."],["Pembersihan tanah memakai jamur atau bakteri?",["Bioremediasi","Eutrofikasi","Urbanisasi","Akulturasi"],"Bioremediasi."],["Pupuk yang lebih aman bagi tanah?",["Organik","Kimia berlebih","Pestisida","Plastik"],"Organik."]],"e":[["Tujuan pelestarian lingkungan?",["Meningkatkan daya dukung agar SDA berkesinambungan","Menaikkan harga","Menghapus hujan","Mengubah zona"],"Daya dukung."],["Efek gas karbon bagi kutub?",["Pencairan es","Es makin tebal","Hujan salju","Tidak ada"],"Es mencair."],["Kendaraan yang menurunkan polusi?",["Berbahan bakar gas atau listrik","Berasap pekat","Pembakaran terbuka","Mesin tua"],"Non-fosil."],["Pohon berguna karena menghasilkan…",["Oksigen","Karbon","Asap","Limbah"],"Oksigen."],["Aksi pelajar untuk udara?",["Tidak merokok dan tidak membakar sampah","Membakar sampah","Merokok","Memakai kendaraan sendiri saja"],"Aksi pelajar."],["Program menjaga siklus hidrologi?",["Sumur resapan dan kali bersih","Membuang sampah ke kali","Menutup sungai","Menebang pohon"],"Siklus hidrologi."],["Yang tidak boleh dibuang sembarangan?",["Pelarut, cat, pembersih beracun","Daun","Air hujan","Kertas bekas"],"Beracun."],["Pupuk kimia berlebihan berdampak…",["Tanah kurang produktif","Tanah makin subur","Panen naik terus","Hama hilang"],"Tidak produktif."],["Bioremediasi menghasilkan zat…",["Tidak beracun","Lebih beracun","Gas","Es"],"Menguraikan pencemar."],["Pelestarian tanah mencakup…",["Melindungi, memperbaiki, meningkatkan produktivitas","Membakar lahan","Menambah plastik","Membuang limbah"],"Tiga langkah."],["Membawa tas belanja sendiri mengurangi…",["Sampah plastik","Gempa","Musim","Bujur"],"Plastik."],["Siapa yang melestarikan lingkungan?",["Semua orang","Pemerintah saja","Guru saja","Petugas kebersihan saja"],"Semua."]]},"A.1.3":{"k":8,"g":"Menjelaskan empat masa kehidupan manusia praaksara beserta ciri dan peninggalannya.","core":"<p>Dengan <b>akal</b> dan indra, manusia membuat teknologi dari batu, tulang, dan kayu. Masa praaksara (sebelum tulisan) dibagi empat.</p><ul><li><b>Berburu dan mengumpulkan makanan tingkat sederhana</b> (Paleolitikum, ±50.000–10.000 SM): berpindah-pindah, tinggal di gua dan cerukan dekat makanan, mengumpulkan umbi dan buah. Penemuan <b>api</b> (dari gejala alam, lalu dibuat dari benturan batu dan lumut kering) untuk memasak, mengusir binatang buas, menerangi. Alat batu kasar: kapak perimbas, kapak penetak, <b>kapak genggam</b>. Kebudayaan <b>Pacitan</b> (kapak genggam) dan <b>Ngandong</b> (alat tulang).</li><li><b>Tingkat lanjut</b> (Mesolitikum, ±10.000–5.000 SM): mulai menetap lebih lama di gua (<i>abris sous roche</i>) dan tepi pantai dekat air, mulai bertani dan beternak, tetapi berburu tetap dominan. Jejaknya <b>kjokkenmoddinger</b> (sampah dapur kulit kerang). Alat lebih halus.</li><li><b>Bercocok tanam</b> (Neolitikum, ±2000 SM): masa terpenting; membuka lahan dengan menebang dan membakar, hidup menetap di <b>perkampungan</b> dekat air, gotong royong, dipimpin orang tua berwibawa. Alat diasah: <b>beliung persegi</b>, kapak lonjong, mata tombak; ada gerabah; peninggalan megalitik: menhir, dolmen, sarkofagus.</li><li><b>Perundagian</b> (zaman Logam, ±500 SM, akhir praaksara): <i>undagi</i> (ahli keterampilan), pembagian kerja ketat, teknik <b>peleburan dan pengecoran logam</b> (emas, tembaga), perhiasan, perahu bercadik, perdagangan barter dengan <b>nekara perunggu</b>.</li></ul>","ex":"<ul><li>Tumpukan kulit kerang di pantai: kjokkenmoddinger (Mesolitikum).</li></ul>","cmp":"<ul><li>Paleolitikum berpindah; Mesolitikum mulai menetap; Neolitikum bertani menetap; Perundagian ahli logam.</li></ul>","mis":"<ul><li>Mengira bercocok tanam sudah ada sejak awal.</li><li>Menukar urutan masa.</li></ul>","p":[["Masa sebelum tulisan?",["Praaksara","Sejarah","Modern","Kolonial"],"Praaksara."],["Alat khas Paleolitikum?",["Kapak genggam","Beliung persegi","Nekara","Gerabah halus"],"Kapak genggam."],["Kjokkenmoddinger adalah…",["Sampah dapur kulit kerang","Alat berburu","Lukisan gua","Makam"],"Sampah kerang."],["Bercocok tanam dan menetap?",["Neolitikum","Paleolitikum","Mesolitikum","Arkaekum"],"Neolitikum."]],"e":[["Urutan masa praaksara?",["Paleolitikum, Mesolitikum, Neolitikum, Logam","Logam, Neolitikum, Mesolitikum, Paleolitikum","Neolitikum, Logam, Paleolitikum, Mesolitikum","Mesolitikum, Paleolitikum, Logam, Neolitikum"],"Tua ke muda."],["Cara hidup Paleolitikum?",["Berpindah dan berburu sederhana","Bertani menetap","Berdagang antarpulau","Membuat perhiasan emas"],"Nomaden."],["Manfaat api?",["Memasak, mengusir binatang, menerangi","Menanam padi","Berlayar","Menulis"],"Manfaat api."],["Dua kebudayaan Paleolitikum?",["Pacitan dan Ngandong","Bali dan Jawa","Dong Son dan Hoabinh","Kutai dan Tarumanegara"],"Pacitan dan Ngandong."],["Gua tempat tinggal Mesolitikum?",["Abris sous roche","Kjokkenmoddinger","Menhir","Dolmen"],"Abris sous roche."],["Tanda Mesolitikum di pantai?",["Kjokkenmoddinger","Beliung persegi","Nekara","Kapak lonjong"],"Sampah kerang."],["Masa terpenting dalam sejarah manusia?",["Bercocok tanam","Berburu","Perundagian","Mesolitikum"],"Bercocok tanam."],["Alat khas Neolitikum?",["Beliung persegi","Kapak genggam","Nekara","Kapak perimbas"],"Beliung persegi."],["Peninggalan megalitik?",["Menhir dan dolmen","Kapak genggam","Kjokkenmoddinger","Nekara"],"Megalitik."],["Undagi adalah…",["Golongan ahli keterampilan","Pemimpin perang","Petani","Pedagang asing"],"Ahli keterampilan."],["Barang dagangan masa Perundagian?",["Nekara perunggu dan perhiasan logam","Kapak genggam","Beras saja","Gerabah kasar"],"Nekara."],["Mengapa manusia membuat alat?",["Memanfaatkan akal untuk memenuhi kebutuhan","Hiburan","Tak ada alasan","Perintah raja"],"Akal."]]},"A.1.4":{"k":8,"g":"Menjelaskan pembangunan berkelanjutan, SDGs, dan tiga masalah pokok ekonomi.","core":"<p><b>Pembangunan berkelanjutan</b>: upaya memenuhi kebutuhan masa kini dengan meminimalkan dampak buruk bagi lingkungan, sehingga SDA tetap terjaga untuk generasi mendatang. Dunia memandangnya penting sejak deklarasi <b>SDGs</b> (<i>Sustainable Development Goals</i>) pada 2015.</p><p><b>Karakteristik</b>: memperkirakan dampak tindakan terhadap kesehatan dan lingkungan; mendorong pengelolaan SDA berkelanjutan; bertanggung jawab terhadap alam; berperan aktif menjaga alam dalam kegiatan sosial-ekonomi; meningkatkan kualitas manusia agar berdaya saing; kebijakan saling memperhatikan keterkaitan antartujuan.</p><p><b>SDGs</b>: <b>17 tujuan</b> dalam <b>4 pilar</b>: <b>sosial</b> (kesejahteraan masyarakat), <b>ekonomi</b> (ekonomi ramah lingkungan, kolaborasi, inovasi), <b>lingkungan hidup</b> (darat dan air), <b>tata kelola</b> (perdamaian, keadilan, kelembagaan tangguh). Antarpilar saling berkaitan.</p><p><b>Masalah pokok ekonomi</b>: <b>kelangkaan</b> terjadi karena kebutuhan manusia hampir tak terbatas, sedangkan alat pemuas terbatas. Tiga masalahnya: (1) <b>apa</b> yang diproduksi (jenis, jumlah, waktu; salah menentukan menimbulkan kerugian, misalnya memproduksi jaket dalam jumlah besar di daerah pantai), (2) <b>bagaimana</b> memproduksi (kombinasi faktor produksi, teknologi manual atau mesin, tenaga kerja kompeten), (3) <b>untuk siapa</b> (segmentasi pasar: menengah bawah, menengah, menengah atas).</p>","ex":"<ul><li>Produksi bata merah secara manual dengan tenaga manusia: pilihan cara produksi.</li></ul>","cmp":"<ul><li>Apa = jenis dan jumlah; bagaimana = cara dan sumber daya; untuk siapa = segmen konsumen.</li></ul>","mis":"<ul><li>Mengira SDGs hanya urusan lingkungan (ada empat pilar).</li></ul>","p":[["SDGs memiliki berapa tujuan?",["17","7","10","30"],"17."],["Jumlah pilar SDGs?",["4","2","3","5"],"Empat pilar."],["Kelangkaan terjadi karena…",["Kebutuhan tak terbatas, alat pemuas terbatas","Barang murah","Semua kaya","Produksi berlebih"],"Terbatas."],["Tiga masalah pokok ekonomi?",["Apa, bagaimana, untuk siapa","Kapan, di mana, siapa","Beli, jual, simpan","Pajak, bunga, laba"],"Tiga."]],"e":[["SDGs lahir pada…",["2015","1945","1992","2030"],"2015."],["Intinya pembangunan berkelanjutan?",["Memenuhi kebutuhan kini tanpa merusak SDA generasi mendatang","Menghabiskan SDA","Menutup industri","Menghentikan ekonomi"],"Berkelanjutan."],["Pilar yang fokus pada kesejahteraan masyarakat?",["Sosial","Ekonomi","Lingkungan","Tata kelola"],"Sosial."],["Pilar yang berkaitan dengan perdamaian dan keadilan?",["Tata kelola","Sosial","Ekonomi","Lingkungan"],"Tata kelola."],["Pilar lingkungan hidup mencakup…",["Darat dan air","Hanya darat","Hanya udara","Hanya kota"],"Darat dan air."],["Pilar ekonomi fokus pada…",["Ekonomi ramah lingkungan, kolaborasi, inovasi","Pajak","Subsidi","Utang"],"Ekonomi."],["Salah satu karakteristik pembangunan berkelanjutan?",["Memperkirakan dampak pada kesehatan dan lingkungan","Mengabaikan dampak","Menghabiskan SDA","Menolak teknologi"],"Karakteristik."],["Memproduksi jaket banyak di daerah pantai berisiko…",["Rugi karena tidak sesuai kebutuhan","Untung besar","Laku keras","Tak berisiko"],"Salah menentukan barang."],["Memilih tenaga manual atau mesin termasuk pertanyaan…",["Bagaimana memproduksi","Apa diproduksi","Untuk siapa","Kapan"],"Bagaimana."],["Segmentasi pasar termasuk pertanyaan…",["Untuk siapa diproduksi","Apa diproduksi","Bagaimana","Kapan"],"Untuk siapa."],["Menentukan jenis, jumlah, dan waktu produksi termasuk…",["Apa yang diproduksi","Bagaimana","Untuk siapa","Di mana"],"Apa."],["Antarpilar SDGs bersifat…",["Saling berkaitan","Terpisah","Bertentangan","Tidak berhubungan"],"Berkaitan."]]},"B.0.0":{"k":8,"g":"Menjelaskan SDA terbarukan dan tidak, kawasan hutan, serta golongan dan tahapan pertambangan.","core":"<p><b>Sumber daya alam</b>: segala sesuatu di permukaan bumi yang dapat dimanfaatkan untuk memenuhi kebutuhan. Menurut kelestariannya: <b>dapat diperbarui</b> (air, tanah, hutan) dan <b>tidak dapat diperbarui</b> (minyak bumi, batu bara). Potensi Indonesia: hutan, tambang, kemaritiman.</p><p><b>Hutan</b>: lahan lebih dari 6,25 ha dengan pohon lebih dari 5 m dan tutupan kanopi lebih dari 30%. Indonesia mengalokasikan 63% daratannya (120,6 juta ha) sebagai kawasan hutan. Menurut fungsi:</p><ul><li><b>Hutan produksi</b>: menghasilkan bahan baku (kayu, rotan); pemanfaatan perlu izin pemerintah.</li><li><b>Hutan lindung</b>: melindungi daya dukung lingkungan: mengatur suplai air, mengendalikan erosi, mencegah banjir dan intrusi air laut, menjaga kesuburan tanah.</li><li><b>Hutan konservasi</b>: <b>kawasan suaka alam</b> (<i>cagar alam</i>: kekhasan tumbuhan, satwa, ekosistem berlangsung alami, contoh Telaga Renjeng; <i>suaka margasatwa</i>: keunikan satwa, contoh Baluran) dan <b>kawasan pelestarian alam</b> (taman nasional, taman wisata alam, taman hutan raya).</li></ul><p><b>Tambang</b>: pengambilan endapan bahan galian berharga dari dalam bumi. Golongan (UU No. 11 Tahun 1967): <b>A</b> strategis, untuk pertahanan dan keamanan (minyak dan gas bumi); <b>B</b> vital, untuk hajat hidup orang banyak (emas, perak, tembaga); <b>C</b> industri (pasir, batu kapur). Batu bara terbentuk dari endapan tumbuhan, minyak dan gas dari endapan tumbuhan dan hewan, selama jutaan tahun. <b>Tahapan</b>: <b>prospeksi</b> (mencari endapan), <b>eksplorasi</b> (mengetahui ukuran, bentuk, posisi, kadar, cadangan), <b>eksploitasi</b> (penambangan dan pengangkutan), <b>pengolahan</b> (memurnikan dan meninggikan kadar).</p>","ex":"<ul><li>Hutan jati ditebang untuk kayu: hutan produksi. Bukit Putri Pencit (Tuban): hutan lindung.</li></ul>","cmp":"<ul><li>Cagar alam melindungi kekhasan tumbuhan, satwa, ekosistem; suaka margasatwa melindungi satwa.</li></ul>","mis":"<ul><li>Mengira semua SDA dapat diperbarui.</li><li>Menukar prospeksi dan eksplorasi.</li></ul>","p":[["Contoh SDA tidak dapat diperbarui?",["Minyak bumi","Hutan","Air","Tanah"],"Minyak bumi."],["Hutan yang menghasilkan kayu dan rotan?",["Hutan produksi","Hutan lindung","Cagar alam","Suaka margasatwa"],"Produksi."],["Hutan yang mengatur suplai air dan mencegah banjir?",["Hutan lindung","Hutan produksi","Tambang","Kebun"],"Lindung."],["Minyak dan gas bumi termasuk golongan…",["A (strategis)","B (vital)","C (industri)","D"],"Golongan A."]],"e":[["Persen daratan Indonesia sebagai kawasan hutan?",["63%","13%","30%","90%"],"63%."],["Tiga macam kawasan hutan?",["Produksi, lindung, konservasi","Jati, pinus, bakau","Kota, desa, pantai","Hutan A, B, C"],"Tiga fungsi."],["Taman nasional termasuk…",["Kawasan pelestarian alam","Kawasan suaka alam","Hutan produksi","Tambang"],"Pelestarian alam."],["Cagar alam dan suaka margasatwa termasuk…",["Kawasan suaka alam","Hutan produksi","Hutan lindung","Taman nasional"],"Suaka alam."],["Emas, perak, tembaga termasuk golongan…",["B (vital)","A (strategis)","C (industri)","D"],"Golongan B."],["Pasir dan batu kapur termasuk golongan…",["C (industri)","A","B","D"],"Golongan C."],["Tahap mencari endapan bahan galian?",["Prospeksi","Eksplorasi","Eksploitasi","Pengolahan"],"Prospeksi."],["Tahap mengetahui ukuran dan cadangan?",["Eksplorasi","Prospeksi","Pengolahan","Eksploitasi"],"Eksplorasi."],["Tahap memurnikan hasil tambang?",["Pengolahan","Prospeksi","Eksplorasi","Eksploitasi"],"Pengolahan."],["Batu bara terbentuk dari…",["Endapan tumbuhan selama jutaan tahun","Pasir pantai","Air hujan","Abu vulkanik"],"Endapan tumbuhan."],["Contoh suaka margasatwa dari buku?",["Baluran","Bukit Putri Pencit","Telaga Renjeng","Pelamis"],"Baluran."],["Hutan lindung mencegah intrusi…",["Air laut","Minyak","Pasir","Asap"],"Intrusi air laut."]]},"B.0.1":{"k":8,"g":"Menjelaskan SDA kemaritiman, penyebab perubahan potensi SDA, pengaruh SDA terhadap penduduk, dan perdagangan internasional.","core":"<p><b>Kemaritiman</b>: laut Indonesia menyimpan 37% spesies sumber daya hayati dunia, 17,95% terumbu karang dunia, 30% hutan bakau dan padang lamun.</p><ul><li><b>Perikanan</b>: usaha penangkapan, pengolahan, sampai pemasaran ikan. <b>Tradisional</b>: perahu layar, jala, pancing. <b>Modern</b>: kapal motor dengan peti pendingin sehingga ikan tidak cepat busuk dan bisa berlayar beberapa hari.</li><li><b>Energi kelautan</b> (terbarukan): energi gelombang, pasang surut, arus laut, panas laut. Kelebihan: pulih alami, ramah lingkungan, tanpa gas rumah kaca. Kekurangan: biaya investasi besar.</li><li><b>Wisata bahari</b>: pesisir, laut, pulau kecil (berenang, menyelam, snorkeling). Tantangan: infrastruktur, aksesibilitas, fasilitas, promosi, sanitasi, SDM terlatih.</li></ul><p><b>Penyebab perubahan potensi SDA</b>: populasi bertambah, konsumsi naik, eksploitasi berlebih, pencemaran dan kerusakan lingkungan, potensi SDA menurun. Pemanfaatan harus memperhatikan kelestarian.</p><p><b>Pengaruh SDA terhadap penduduk</b>: sumber makanan, minum, tempat tinggal, energi; bila dilestarikan menyejahterakan, bila berlebihan merugikan (hewan kehilangan habitat dan masuk permukiman).</p><p><b>Perdagangan internasional</b>: tiap negara punya SDA berbeda akibat letak geografis. <b>Ekspor</b> menjual ke luar negeri (tuna ke Jepang); <b>impor</b> membeli dari luar negeri (beras dari Thailand). Bentuknya: antarindividu (e-commerce), individu dengan pemerintah (investor), antarpemerintah (perjanjian dagang).</p>","ex":"<ul><li>Nelayan Banyuwangi: tradisional. Pelabuhan Balohan, Aceh: modern.</li></ul>","cmp":"<ul><li>Ekspor menjual keluar; impor membeli dari luar.</li></ul>","mis":"<ul><li>Mengira energi kelautan tanpa kekurangan.</li></ul>","p":[["Penangkapan ikan dengan kapal motor dan peti pendingin?",["Modern","Tradisional","Tradisi lisan","Subsisten"],"Modern."],["Contoh energi kelautan?",["Gelombang","Batu bara","Minyak","Gas"],"Gelombang."],["Menjual produk ke luar negeri?",["Ekspor","Impor","Barter","Subsidi"],"Ekspor."],["Membeli beras dari Thailand?",["Impor","Ekspor","Subsidi","Barter"],"Impor."]],"e":[["Spesies hayati dunia di laut Indonesia?",["37%","3,7%","73%","10%"],"37%."],["Alat nelayan tradisional?",["Jala dan pancing","Kapal motor dan peti pendingin","Radar canggih","Kapal besar"],"Sederhana."],["Keunggulan peti pendingin?",["Ikan tidak cepat busuk","Ikan makin banyak","Perahu lebih ringan","Angin kencang"],"Awet."],["Empat jenis energi kelautan?",["Gelombang, pasang surut, arus, panas laut","Batu bara, minyak, gas, kayu","Surya, angin, nuklir, air","Angin, hujan, badai, es"],"Empat jenis."],["Kekurangan energi terbarukan?",["Biaya investasi besar","Menghasilkan gas rumah kaca","Tidak terbarukan","Mencemari"],"Biaya besar."],["Tantangan wisata bahari?",["Infrastruktur dan aksesibilitas terbatas","Terlalu mudah dijangkau","Tak punya pantai","Tak ada laut"],"Infrastruktur."],["Penyebab perubahan potensi SDA?",["Populasi naik dan eksploitasi berlebih","Hujan","Angin","Pasang laut"],"Populasi dan eksploitasi."],["Hewan masuk permukiman karena…",["Kehilangan habitat","Mencari wisata","Suka kota","Dipanggil warga"],"Habitat hilang."],["Mengapa negara berdagang?",["SDA berbeda akibat letak geografis","Semua sama","Dilarang","Tak butuh"],"Berbeda."],["Pembelian lewat e-commerce luar negeri?",["Antarindividu","Antarpemerintah","Individu-pemerintah","Tidak ada"],"Antarindividu."],["Investor asing membiayai infrastruktur?",["Individu dengan pemerintah","Antarindividu","Antarpemerintah","Tidak ada"],"Individu-pemerintah."],["Perjanjian dagang dua negara?",["Antarpemerintah","Antarindividu","Individu-pemerintah","Lokal"],"Antarpemerintah."]]},"B.0.2":{"k":8,"g":"Menjelaskan potensi SDA dan bonus demografi Indonesia menuju negara maju.","core":"<p>OECD memperkirakan pada <b>2045</b> ekonomi Indonesia menjadi terbesar keempat dunia. Potensinya: SDA dan bonus demografi.</p><p><b>Potensi SDA</b> (dikelola berkelanjutan dengan memperhatikan dampak lingkungan dan sosial):</p><ul><li><b>Keanekaragaman hayati</b>: industri biofarmasi, obat-obatan, kehutanan.</li><li><b>Pertanian dan perkebunan</b>: sawit, karet, kopi, kakao; meningkatkan ekspor.</li><li><b>Tambang dan energi</b>: batu bara, minyak, gas, timah, nikel, tembaga.</li><li><b>Energi terbarukan</b>: panas bumi, air, surya.</li><li><b>Perikanan dan kelautan</b>, <b>kehutanan dan industri kayu</b> (jati).</li><li><b>Industri pangan dan bioteknologi</b>: makanan fungsional (ikan, beras kencur, tempe) dan nutrasetikal (ginseng, teh hijau, minyak ikan).</li><li><b>Bahan baku industri</b> (nikel, timah, bauksit) dan <b>sawit-bioenergi</b> (minyak nabati, biodiesel).</li></ul><p><b>Bonus demografi</b>: sebagian besar penduduk berusia produktif. Manfaat: <b>produktivitas ekonomi naik</b>, <b>konsumsi naik</b> (pasar domestik besar), <b>inovasi dan teknologi</b>, <b>peluang investasi</b>. Syaratnya SDM berkualitas.</p><p><b>Langkah strategis</b>: meningkatkan nasionalisme, kualitas SDM, pembangunan infrastruktur (misalnya kereta api cepat), dan transformasi ekonomi, dengan sinergi pemerintah, dunia usaha, lembaga pendidikan, dan masyarakat.</p>","ex":"<ul><li>Sawit diolah menjadi biodiesel: bioenergi.</li></ul>","cmp":"<ul><li>Makanan fungsional memberi manfaat bagi tubuh; nutrasetikal dikonsumsi khusus untuk kesehatan.</li></ul>","mis":"<ul><li>Mengira bonus demografi otomatis menguntungkan.</li></ul>","p":[["OECD memperkirakan ekonomi Indonesia terbesar keempat pada…",["2045","2025","2030","2100"],"2045."],["Contoh energi terbarukan?",["Panas bumi, air, surya","Batu bara","Minyak","Gas"],"Terbarukan."],["Bonus demografi artinya penduduk…",["Mayoritas usia produktif","Mayoritas lansia","Mayoritas anak","Menurun"],"Produktif."],["Contoh makanan fungsional?",["Tempe","Ginseng","Minyak ikan","Teh hijau"],"Tempe."]],"e":[["Contoh nutrasetikal?",["Ginseng, teh hijau, minyak ikan","Tempe, beras kencur, ikan","Nasi, sayur, buah","Roti, mi, gula"],"Nutrasetikal."],["Industri yang memanfaatkan keanekaragaman hayati?",["Biofarmasi dan obat-obatan","Garmen","Otomotif","Baja"],"Biofarmasi."],["Komoditas perkebunan?",["Sawit, karet, kopi, kakao","Nikel, timah","Panas bumi","Ikan tuna"],"Perkebunan."],["Bahan baku logam dan elektronik?",["Nikel, tim
